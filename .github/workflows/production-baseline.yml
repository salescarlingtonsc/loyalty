name: Production Baseline

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  static-production-baseline:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SUPABASE_PROJECT_REF: gadpooereceldfpfxsod
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the NEGATIVE CONTROL tests prove a fix by reading the pre-fix source
          # from origin/main or a base commit (`git show <base>:app/app.js`), and several
          # executed fixtures read the chain's history. A depth-1 clone has neither, and those
          # tests failed only in CI for exactly that reason (2026-09-09).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # `icons:check` (part of validate) renders every icon through Python/Pillow into a staging
      # directory and compares — a stale icon is a failing check, not a hope. The runner has
      # python3 but not Pillow; without this step validate dies at its second command with
      # "No module named 'PIL'", which is exactly how its first CI run failed (2026-09-09).
      - name: Install icon toolchain (Pillow)
        run: python3 -m pip install --quiet --user pillow

      # Three phase0 tests (tests/phase0-foundation/ci-proof-pack.test.mjs: frozen, reconciliation,
      # isolation) spin a throwaway Postgres cluster through scripts/db-tests/lib.mjs, which needs
      # initdb/pg_ctl/psql/createdb/pg_dump on PATH. Only the executed-sql job installed them, so
      # `npm test` inside validate failed those three in CI and nowhere else (2026-09-09). Same
      # install, same reasons (initdb needs the server binaries; production is Postgres 17).
      - name: Install PostgreSQL 17
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-17 postgresql-client-17
          # The harness needs initdb/pg_ctl/pg_dump, which live outside the default PATH.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # -----------------------------------------------------------------------
      # `npm run validate`, not the three steps it replaced. Added 2026-09-09 (owner: "add npm
      # run validate to CI so this doesn't recur").
      #
      # WHY: this job used to run quality -> npm test -> build. Those pass while the repo is
      # inconsistent in ways only the check-only scripts catch: an app.js pushed without
      # `bundle-stamp` (stale ?v= cache keys, so a returning browser keeps yesterday's file), a
      # stylesheet pair behind index.html (`app-css:check`), icons or runtime config out of date,
      # and — twice in one day — migration manifests certifying files that no longer existed
      # (`migration-manifest:check`, `canonical-migrations:check`). Each of those was green in
      # `npm test` and red in `npm run validate`, and each landed on main. `validate` is exactly
      # the old three steps plus those six checks, so nothing runs twice.
      # -----------------------------------------------------------------------
      - name: Validate (quality, generated-file freshness, migration governance, tests, build)
        run: npm run validate

  # ---------------------------------------------------------------------------
  # Executed SQL. Added 2026-08-22.
  #
  # WHY: `npm test` executes no SQL. The 334 files under db/tests/ were read by regex and never
  # run, and a mutation test proved the consequence — two real Rewards defects passed a
  # 3297-test suite. This job runs the loyalty engine for real: real triggers, real RPCs, real
  # constraints, on real Postgres.
  #
  # NO PRODUCTION CREDENTIALS. The baseline is tests/fixtures/db-schema-snapshot.sql, which is
  # built from the committed migration chain (scripts/db-tests/snapshot-schema.mjs). This job
  # never talks to Supabase.
  #
  # WHY BINARIES AND NOT A `services:` CONTAINER: the harness runs `initdb` itself and clones a
  # template database per test file, so it needs the SERVER binaries on PATH, not a pre-started
  # server on a port. A service container cannot provide initdb.
  #
  # WHY POSTGRES 17 SPECIFICALLY: production is Postgres 17 and the snapshot is a 17 pg_dump.
  # ubuntu-latest ships 16, which cannot reliably restore it.
  # ---------------------------------------------------------------------------
  executed-sql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the NEGATIVE CONTROL tests prove a fix by reading the pre-fix source
          # from origin/main or a base commit (`git show <base>:app/app.js`), and several
          # executed fixtures read the chain's history. A depth-1 clone has neither, and those
          # tests failed only in CI for exactly that reason (2026-09-09).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PostgreSQL 17
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-17 postgresql-client-17
          # The harness needs initdb/pg_ctl/pg_dump, which live outside the default PATH.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # The committed baseline must still be what the committed chain produces. Pinned at the
      # snapshot watermark, so migrations landing above it never make this step fail; only an
      # edit to a migration already baked into the baseline does, which is exactly when the
      # snapshot needs refreshing.
      - name: Schema snapshot is a faithful replay of the committed chain
        run: npm run test:db:snapshot -- --check

      - name: Executed SQL suite
        run: npm run test:db

  # ---------------------------------------------------------------------------
  # Real-browser walkthrough. Added 2026-08-22.
  #
  # tests/browser/verify-reward-overview-owner.mjs renders the Rewards owner page in Chromium and
  # asserts on measured layout, console errors and RPC usage. It was in no npm script and no
  # workflow, so it had not run in months and three of its expectations had frozen behind the
  # page. Locally it SKIPS when no driver is installed (loudly); here the driver is installed, so
  # it runs for real.
  # ---------------------------------------------------------------------------
  browser-walkthrough:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the NEGATIVE CONTROL tests prove a fix by reading the pre-fix source
          # from origin/main or a base commit (`git show <base>:app/app.js`), and several
          # executed fixtures read the chain's history. A depth-1 clone has neither, and those
          # tests failed only in CI for exactly that reason (2026-09-09).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install browser driver
        run: |
          set -euo pipefail
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Browser checks
        run: npm run test:browser
