<!DOCTYPE html>

<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://cdn.sheetjs.com https://challenges.cloudflare.com https://static.cloudflareinsights.com; worker-src 'self'; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com https://cloudflareinsights.com https://static.cloudflareinsights.com; upgrade-insecure-requests">

<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">

<!-- The Supabase client below is a RENDER-BLOCKING third-party script; warming the connection
     here removes its DNS + TCP + TLS cost from the critical path on a cold mobile network. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- Fraunces was dropped from this request: the wordmark is now a PNG (brandWordmark) and no rule
     in this document sets it, so it was a render-blocking download of an unused variable font.
     app/join.html still requests it separately and still uses it for its headings. -->
<link rel="stylesheet" href="/pwa.css">
<!-- V200: revenue-truth.css, growth-offers.css and sector-economics.css used to load here on every
     first paint, for every visitor. They style workspace and customer-offer surfaces that only
     exist once a surface chunk has been fetched, so they now arrive with that chunk
     (loadSurfaceAssetsV200 in app/app.js). Nothing above this line is optional: pwa.css is the
     app frame itself. -->
<script src="/native-bridge.js" defer></script>
<script src="/pwa.js?v=v321-no-self-refresh" defer></script>
<script src="/customer-push.js" defer></script>
<link rel="stylesheet" href="/app.css?b=fd45cbb86f47">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<!-- Static boot skeleton: paints as soon as the styles arrive, long before the
     application script finishes compiling. The router replaces #root's content
     on first route(). Tokens keep it correct in light and dark. -->
<div id="root"><div class="wallet-shell customer-surface" data-boot-skeleton><div class="wallet-inner" style="padding-top:26px;max-width:560px">
  <div class="card" aria-busy="true" style="padding:22px"><p class="sr-only" role="status">Loading Peekaa…</p>
    <div class="pf-skeleton" style="width:46%;height:30px"></div>
    <div class="pf-skeleton"></div>
    <div class="pf-skeleton" style="width:72%"></div>
    <div class="pf-skeleton" style="width:58%;height:44px"></div>
  </div></div></div></div>
<div id="toast" class="toast" aria-hidden="true"></div>
<div id="appStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="appAlert" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>

<script src="/brand-config.js"></script>
<script src="/runtime-config.js?v=2"></script>
<script src="/runtime-config-loader.js?v=2"></script>
<script src="/customer-ui.js?v=20260813-v298-caption-once"></script>
<!-- v184: the platform console is ~210KB of JS+CSS that only a Peekaa admin can ever use, and it
     was being downloaded by every customer opening a booking page. app.js fetches these on
     demand when a #/platform route is requested (loadPlatformConsoleAssetsV184). This element is
     still the ONE place to bump the console's cache-busting version. V200 added crm: the CRM
     helper module has exactly one consumer, platform-console.js, so it belongs on the same
     on-demand path rather than in every first paint. -->
<script type="application/json" id="platformConsoleAssets">
{"js":"/platform-console.js?v=20260814-v312-explorer","css":"/platform-console.css?v=20260814-v312-explorer","crm":"/platform-crm-utils.js?v=20260814-v312-explorer"}
</script>
<!-- V200: grow-recommender.js, v95-media-sync.js, revenue-truth.js, growth-offers.js and
     sector-economics.js were deferred script tags here, so every visitor downloaded, parsed and
     executed all five before a booking page could paint — yet every consumer of their globals sits
     inside a function in a surface chunk (verified: no load-time reference anywhere). They now load
     with the surface that uses them, via the #appSurfaceAssets manifest below. Nothing left in the
     initial load is optional: the native bridge, PWA, push and brand/runtime config all run at
     load time, and customer-ui.js is read while the core boots. -->
<script type="application/json" id="appSurfaceAssets">
{"auth":{"js":[],"css":[]},"customer":{"js":["/growth-offers.js?v=20260807-v200"],"css":["/growth-offers.css?v=20260819-w1tokens"]},"business":{"js":["/grow-recommender.js?v=20260807-v200","/v95-media-sync.js?v=20260728-atomic-media","/revenue-truth.js?v=20260826-v526","/growth-offers.js?v=20260807-v200","/sector-economics.js?v=20260807-v200"],"css":["/revenue-truth.css?v=20260826-v522","/growth-offers.css?v=20260819-w1tokens","/sector-economics.css?v=20260819-w1tokens"]}}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.7/dist/umd/supabase.min.js" integrity="sha384-BmlQlKlDvXvKoxkn5OQuUo/aJQCTXeB+Kls6EccBmG4Kf8AXvp89RtO9MtPxP/r5" crossorigin="anonymous"></script>
<!-- v185: app/app.js is split by surface at build time. The core loads here; the auth, customer or
     workspace chunk is fetched by the router once it knows which one this route needs, and the
     translation tables only for a non-English locale. Every url is fingerprinted by the build
     (npm run bundle-stamp) — never edit these by hand. -->
<script type="application/json" id="appSurfaceChunks">
{"auth":"/app-auth.js?b=cb3e46395579","customer":"/app-customer.js?b=9e3fdc155f42","business":"/app-business.js?b=61aa2deb57da","i18n":"/app-i18n.js?b=79f8a5608f2b"}
</script>
<script>
/* Start the surface download in parallel with the core rather than after it. This only PRELOADS —
   the router still decides and injects — so a wrong guess costs a wasted fetch, never a wrong
   render or an out-of-order execution. Mirrors appSurfaceForRouteV185 in app/app.js.

   V200: this script cannot see the session, and the merchant branch now depends on it — signed out
   is the ~17KB auth chunk, signed in is the 1.2MB workspace. Guessing "business" would hand a
   signed-out visitor exactly the download the auth chunk exists to avoid, so the merchant side
   preloads auth: it is needed either way (the workspace chunk declares it as a prerequisite), and
   at 17KB a signed-in visitor loses nothing by fetching it. The customer branch is unchanged. */
(function(){try{
  var hash=location.hash.split('?')[0];
  if(hash.indexOf('#/platform')===0)return;
  var manifest=JSON.parse(document.getElementById('appSurfaceChunks').textContent);
  var customer=['#/b/','#/customer/','#/wallet','#/claim','#/join','#/offer/','#/local/customer-preview'].some(function(prefix){
    return hash===prefix.replace(/\/$/,'')||hash.indexOf(prefix)===0;
  })||hash===''||hash==='#/';
  var link=document.createElement('link');
  link.rel='preload';link.as='script';link.href=manifest[customer?'customer':'auth'];
  document.head.appendChild(link);
}catch(error){}})();
</script>
<script src="/app-core.js?b=d72f193c865b" defer></script>
</body>
</html>
