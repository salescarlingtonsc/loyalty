<script>
/* V460: the Peekaa mark pops and settles in the browser tab the instant the app loads — drawn
   as a few canvas frames from the existing static icon (no extra image assets), then handed
   back to the static file. Decorative only: skipped under prefers-reduced-motion, and any
   failure (canvas unavailable, image load error) just leaves the static icon that loaded. */
(function animateFaviconOnLoadV460(){
  try{
    if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var link=document.getElementById('favicon');
    if(!link) return;
    var staticHref=link.getAttribute('href');
    var img=new Image();
    img.onload=function(){
      var size=64,canvas=document.createElement('canvas');
      canvas.width=size;canvas.height=size;
      var ctx=canvas.getContext('2d');
      if(!ctx) return;
      var frames=[0.15,0.45,0.8,1.05,1.18,1.06,0.98,1.0];
      var i=0;
      function drawFrame(){
        ctx.clearRect(0,0,size,size);
        ctx.save();
        ctx.translate(size/2,size/2);
        ctx.scale(frames[i],frames[i]);
        ctx.drawImage(img,-size/2,-size/2,size,size);
        ctx.restore();
        link.setAttribute('href',canvas.toDataURL());
        i+=1;
        if(i<frames.length){window.setTimeout(drawFrame,55);}
        else{window.setTimeout(function(){link.setAttribute('href',staticHref);},260);}
      }
      drawFrame();
    };
    img.src=staticHref;
  }catch(error){/* animated favicon is decorative only */}
})();
</script>

       are classic parser-blocking script tags in the body, so each one's bytes were not even
       requested until the previous one had finished downloading AND executing — a staircase:
         runtime-config 490->557, loader 558->622, customer-ui 623->793, supabase 798->1057,
       and app-core.js, which every surface needs, therefore did not start until 1,065 ms.
       These preloads change WHEN THE BYTES ARE FETCHED and nothing else. Execution order is still
       decided by the parser, in the same sequence, with the same blocking semantics — which is why
       this is safe on a boot chain where order genuinely matters, and why `defer` was NOT used
       instead: defer would move execution to DOMContentLoaded and change when window.BRAND,
       runtime config and CustomerUI exist.
       The URLs must match the script tags byte for byte, query string included, or the browser
       fetches each file twice. tests/quality/v528-* asserts exactly that.
       The jsdelivr supabase tag is deliberately NOT preloaded: it carries an SRI integrity hash
       without a crossorigin attribute, and adding a preload whose CORS mode does not match would
       fetch 53 KB twice. It already benefits, because the staircase above it collapses. -->
