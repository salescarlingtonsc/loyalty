<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F2EE">
<meta name="application-name" content="Peekaa">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Peekaa">
<title>Offline | Peekaa</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/peekaa-32.png">
<link rel="stylesheet" href="/pwa.css">
<style>
:root{--bg:#F4F2EE;--card:#fff;--ink:#17161A;--muted:#68636F;--line:#E5E0D8;--coral:#C24135}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
main{min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.offline-card{width:min(460px,100%);padding:28px;border:1px solid var(--line);border-radius:22px;background:var(--card);box-shadow:0 18px 48px rgba(23,22,26,.09)}
.mark{display:block;width:76px;height:auto}
h1{margin:20px 0 7px;font-size:1.8rem;line-height:1.15}
p{margin:0;color:var(--muted)}
button{width:100%;min-height:48px;margin-top:22px;padding:12px 18px;border:0;border-radius:999px;background:var(--coral);color:#fff;font:700 16px/1 inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
</style>
<script src="/pwa.js?v=v321-no-self-refresh" defer></script>
</head>
<body>
<main>
  <section class="offline-card" aria-labelledby="offlineTitle">
    <img class="mark" src="/brand/peekaa-mark.png" alt="">
    <h1 id="offlineTitle">You’re offline</h1>
    <p>Peekaa cannot load live customer, booking or payment data without a connection. Reconnect, then try again.</p>
    <button type="button" id="offlineRetry">Try again</button>
  </section>
</main>
<script>
document.getElementById('offlineRetry').addEventListener('click',()=>location.reload());
</script>
</body>
</html>
