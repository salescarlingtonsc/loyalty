<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!-- nestly_v755. This CSP is deliberately scoped to THIS page and is wider than app/index.html's
     only by the three Razorpay Checkout origins. app/index.html's CSP must not be widened: the
     whole reason payment lives on its own page is so the app shell never has to allow a
     third-party script origin. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://api.razorpay.com; img-src 'self' data: https://cdn.razorpay.com; style-src 'self' 'unsafe-inline'; script-src 'self' https://checkout.razorpay.com https://cdn.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; connect-src https://lumberjack.razorpay.com https://api.razorpay.com">
<title>Peekaa — secure payment</title>
<style>
  :root{color-scheme:light;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#0f766e;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding:24px;background:#f8fafc;color:var(--ink);
    font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);
    border-radius:16px;padding:28px;text-align:center;box-shadow:0 8px 30px rgba(15,23,42,.06)}
  h1{font-size:20px;margin:0 0 8px}
  p{margin:0 0 20px;color:var(--muted);font-size:14px}
  button{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--brand);
    color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.55;cursor:progress}
  .err{display:none;margin-top:16px;font-size:13px;color:#b91c1c}
  .err[data-shown="1"]{display:block}
</style>
</head>
<body>
<main class="card">
  <h1>Secure payment</h1>
  <p id="desc">Opening Razorpay…</p>
  <!-- The automatic open is blocked by some mobile browsers unless it follows a tap, so the
       button is not a decoration: it is the guaranteed path. -->
  <button id="pay" type="button">Pay securely with Razorpay</button>
  <p class="err" id="err"></p>
</main>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="/razorpay-checkout.js"></script>
</body>
</html>
