[functions.public-join]
verify_jwt = false

[functions.public-booking]
verify_jwt = false

[functions.manage-booking]
verify_jwt = false

[functions.public-business-application]
verify_jwt = false

[functions.stripe-billing-webhook]
verify_jwt = false

[functions.stripe-billing-command]
verify_jwt = true

[functions.stripe-billing-reconcile]
verify_jwt = false

[functions.subscription-document-dispatch]
verify_jwt = false

[functions.stripe-connect-command]
verify_jwt = true

[functions.stripe-connect-webhook]
verify_jwt = false

[functions.customer-push-dispatch]
verify_jwt = false

# v504 Meta WhatsApp Cloud API webhook. Meta cannot present a Supabase JWT;
# the endpoint authenticates GET by verify token and POST by X-Hub-Signature-256.
[functions.whatsapp-webhook]
verify_jwt = false

# v536 outbound dispatcher. Woken by pg_net from app.v536_run_support_dispatch
# with a shared secret; it presents no Supabase JWT.
[functions.whatsapp-send-dispatch]
verify_jwt = false

[functions.sme-document-signer]
verify_jwt = true

# WARNING: production auth protections (CAPTCHA/Turnstile secret, leaked-password protection)
# live ONLY in the hosted dashboard and are NOT represented here. Never `supabase config push`
# this file against gadpooereceldfpfxsod — it would silently strip them.
[auth]
enabled = true
site_url = "https://www.peekaa.asia"
additional_redirect_urls = [
  "https://www.peekaa.asia",
  "https://www.peekaa.asia/**",
  "https://peekaa.asia",
  "https://peekaa.asia/**",
  "https://www.nestly.asia",
  "https://www.nestly.asia/**",
  "https://nestly.asia",
  "https://nestly.asia/**",
  "https://frenly-app.vercel.app",
  "https://frenly-app.vercel.app/**",
  "https://loyalty-pi-seven.vercel.app",
  "https://loyalty-pi-seven.vercel.app/**"
]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "Peekaa"
rp_id = "peekaa.asia"
rp_origins = [
  "https://peekaa.asia",
  "https://www.peekaa.asia"
]

[functions.join-funnel]
verify_jwt = false
