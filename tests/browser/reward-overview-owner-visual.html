.build-identity{font-variant-numeric:tabular-nums;white-space:nowrap}
.challenge{margin-top:18px;min-height:82px}.challenge-status{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4}
.challenge-retry[hidden]{display:none}.challenge.challenge-passed{min-height:0;margin-top:0}.challenge-retry{display:inline-flex;align-items:center;min-height:44px;background:none;color:var(--coral);font-size:13px;font-weight:600;padding:6px 0;text-decoration:underline}
.logo{display:inline-flex;align-items:center;min-height:44px}
.brand-logo{display:block;width:auto;height:50px;max-width:126px;object-fit:contain}
.wallet-head>a.logo{display:inline-flex;align-items:center;min-height:44px}
.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px}
.ind{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:14px;text-align:center;cursor:pointer;
  background:#fff;transition:border-color .18s var(--ease),transform .22s var(--spring),box-shadow .2s}
.ind:hover{border-color:#E3C9A8;transform:translateY(-2px);box-shadow:var(--shadow)}

.ind.sel{border-color:var(--coral);background:var(--tint);box-shadow:0 0 0 3.5px rgba(255,107,94,.13)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.chip.on{background:var(--tint);color:#D0562E}
/* ---------- shell: light rail (mockup) + frosted top bar, profile TOP-RIGHT ---------- */
.shell{display:grid;grid-template-columns:246px 1fr;min-height:100dvh}
.side{background:#FCFBF9;border-right:1px solid var(--line);color:var(--ink2);
  padding:max(22px,env(safe-area-inset-top)) 14px max(22px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;min-width:0;
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable}
.side .logo{color:var(--ink);padding:0 10px 22px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:14px;min-height:44px;

.nav,.navgroup,.navbody{min-width:0;max-width:100%}
.nav a:hover{background:#F2EFEA;color:var(--ink)}
.nav a.act{background:var(--tint);color:var(--coral);font-weight:600}
/* Icons get their own fixed-width box so every label starts on the same optical
   column, and so flex `gap` actually applies — an emoji sitting in the same text
   node as its label is one flex item, so gap silently does nothing and the icon
   ends up jammed against the word. This is the difference between "looks bought"
   and "looks generated". */
.nav .ic{width:18px;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;
  flex-shrink:0;line-height:1}
.navhead{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:9px 12px;border-radius:10px;font-size:11px;
  font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);cursor:pointer;text-align:left;background:transparent;
  margin-top:12px;transition:color .14s,background .14s}
.navhead:hover{color:var(--ink2)}
.navhead.act{color:var(--ink2)}
.navhead .chev{margin-left:auto;font-size:10.5px;opacity:.9;transition:transform .22s var(--spring)}
.navbody a{padding-left:22px}
.side .foot{margin-top:auto;padding:10px;font-size:12.5px;color:var(--muted)}
/* the right-hand column: sticky frosted app bar above the scrolling page */
.col{display:flex;flex-direction:column;min-width:0}
.appbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:flex-end;
  gap:10px;padding:max(12px,env(safe-area-inset-top)) max(34px,env(safe-area-inset-right))
    12px max(34px,env(safe-area-inset-left));border-bottom:1px solid var(--hair);
  background:rgba(232,227,218,.94);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.profile{position:relative}
.profile .who{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px 6px 6px;border-radius:100px;
  cursor:pointer;background:#fff;border:1px solid var(--hair);box-shadow:var(--shadow);
  transition:transform .2s var(--spring),box-shadow .2s var(--ease)}
.profile .who:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}

.profile .who .chev{font-size:9px;color:var(--muted);margin-left:2px}
.profile .avatar{width:30px;height:30px;border-radius:100px;background:var(--grad);color:#fff;

  box-shadow:0 2px 6px rgba(255,107,94,.3)}
/* menu now drops DOWN from the top-right chip (was: up from the bottom-left rail) */
.profile .menu{position:absolute;top:calc(100% + 8px);right:0;min-width:212px;
  background:rgba(255,255,255,.86);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border:1px solid var(--hair);border-radius:var(--r-sm);padding:6px;box-shadow:var(--shadow-lg);

.profile .menu a:hover{background:#F2EFEA;color:var(--ink)}
.profile-menu-section{padding:8px 12px;border-top:1px solid var(--hair);margin-top:4px}
.profile-menu-section:first-child{border-top:0;margin-top:0}

.business-workspace-switch,.customer-workspace-switch{position:relative}

.business-workspace-switch>summary::-webkit-details-marker,.customer-workspace-switch>summary::-webkit-details-marker{display:none}
.business-workspace-switch .menu,.customer-workspace-switch .menu{position:absolute;top:calc(100% + 8px);right:0;z-index:42;
  min-width:224px;background:rgba(255,255,255,.94);border:1px solid var(--hair);border-radius:var(--r-sm);
  padding:6px;box-shadow:var(--shadow-lg);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}

/* global top-bar action cluster — search + everyday actions, sits left of the bell so the

.mobile-page-title,.mobile-search-trigger,.mobile-search-sheet{display:none}
.mobile-page-title{min-width:0;align-items:center;gap:9px;font-weight:750;color:var(--ink)}

/* Grow overview: one journey first, engine-specific editors only on demand. */
.grow-overview{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:920px;margin:0 auto}
/* V319 (owner sketch: "two side view", the two categories drawn as neighbouring columns).
   The reading column widens ONLY on the Overview view, because that is the one view now carrying
   two tables abreast; every other view keeps the 920px measure it was designed at. The pair
   stacks well before either table would need to scroll sideways — a five-column table squeezed
   into half of 920px is not a glance, which is what this view is for. */
.grow-overview[data-programme-view="overview"]{max-width:1280px}
/* Unequal on purpose: the rewards table carries five columns and the offers table four, so the
   even split is what broke "Referrals" across two lines mid-word at 1440px. Below 1200px neither
   has the room to sit beside the other without that returning, so they stack. */
.grow-overview-split-v319{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,0.85fr);gap:18px;margin-top:14px;align-items:start}
@media(max-width:1200px){.grow-overview-split-v319{grid-template-columns:minmax(0,1fr)}}
.grow-overview-column-v319{min-width:0;display:grid;gap:8px}
.grow-overview-column-title-v319{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--coral);font-weight:850}
.grow-overview-column-note-v319{margin:0}
.grow-overview-column-v319 .cui-table-wrap{border:1px solid var(--line)}
/* V324 (owner markup 2026-08-14): a line drawn between the two columns with "separate them", a
   ringed "+" beside each heading, and the reward row ringed as belonging to the programme above.
   The divider is a border on the second column and only exists at the width where the two are
   actually side by side — below 1200px the split stacks, and a left border on a stacked column
   is a stray vertical line, not a separator. */
.grow-overview-column-head-v324{display:flex;align-items:center;gap:10px}
.grow-overview-column-head-v324 .grow-overview-column-title-v319{margin:0}
.grow-overview-add-v324{margin-left:auto;min-width:30px;padding:2px 9px;font-size:1.05rem;line-height:1.35;font-weight:800;border-radius:999px}
@media(min-width:1201px){.grow-overview-split-v319{gap:28px}
  .grow-overview-column-v319[data-grow-overview-category-v319="offers"]{border-left:1px solid var(--hair);padding-left:28px}}
/* A date is one token to a reader and must never break across lines — dd/mm/yyyy in a narrow
   column wraps after the "20" and prints the year as "20 26", which is worse than the long form
   it replaced. Only above the 767px stack point: below it the responsive table gives each cell
   the full row width, and nowrap there could push a long value out of the card instead. */
@media(min-width:768px){.grow-overview-column-v319 .cui-table td[data-label="Started"],
  .grow-overview-column-v319 .cui-table td[data-label="Ends"],
  .grow-overview-column-v319 .cui-table td[data-label="Ran from"],
  .grow-overview-column-v319 .cui-table td[data-label="Ran until"]{white-space:nowrap}}
.grow-overview-child-v324{display:block;position:relative;padding-left:17px}

.grow-guide-step .btn{width:100%;min-height:44px;margin-top:10px}
.grow-draft-note{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-sm);background:#E7F6EE;color:#1f6c46;font-size:13px}

.grow-advanced-actions{display:flex;flex-wrap:wrap;gap:10px;padding:0 0 16px}.grow-advanced-actions .btn{min-height:44px}

  border:1px solid var(--line);border-radius:var(--r-sm);background:#fff}
.grow-optional-card p{margin:4px 0 0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.grow-optional-card .btn{min-height:44px;flex:0 0 auto}
.grow-panel-shell{position:relative;min-height:0}.grow-panel-shell:empty{display:none}
.grow-overview.grow-editor-active>:not(.grow-panel-shell){display:none}
.grow-overview.grow-editor-active .grow-panel-shell{display:block}
.grow-editor-single{grid-template-columns:minmax(0,760px);justify-content:start}

.grow-inline-feedback{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);

.grow-inline-feedback.ok{border-color:#9ED7BA;background:#E7F6EE;color:#1f6c46}
.grow-section-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}

  .grow-flow-foot .btn,.grow-advanced-actions .btn,.grow-optional-card .btn{flex:1 1 100%}

/* Program Studio (PS-1A authoring surface) — theme-aware via existing tokens only */
.studio-row{padding:12px 0;border-bottom:1px solid var(--line)}
.studio-row:last-child{border-bottom:none}
.studio-row-main{min-width:0}
.studio-authoring-note{font-style:italic;color:var(--muted)}
.studio-tech{margin-top:8px}

.studio-editor{border:1px solid var(--coral)}
.studio-step{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin:12px 0}

.edCondValCell input,.edCondValCell select,.edEffValCell input,.edEffValCell select{min-width:96px;min-height:44px}
.edEffLbl{font-size:12px;color:var(--muted)}
.edDowLbl{display:inline-flex;align-items:center;gap:5px;font-size:13px;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:100px}
.studio-advanced{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.studio-advanced summary{cursor:pointer;font-weight:600;color:var(--coral);min-height:44px;display:flex;align-items:center}

/* PS-1C.2 execution-truth surfaces: per-effect state breakdown, rule controls, publish preview */
.studio-effect-states{margin-top:8px;border-top:1px solid var(--hair);padding-top:6px}
.studio-effect-state{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:4px 0;flex-wrap:wrap}

.studio-rule-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.studio-emg-banner{margin-top:8px;border:1px solid var(--red);background:var(--tint);border-radius:var(--r-sm);padding:8px 10px;font-size:13px}
.studio-impact-rule{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin-top:10px}
.sv-discrep-list,.sv-pause-list{margin-top:4px}
.sv-discrep{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin-top:10px}

.studio-impact-eff{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:5px 0;flex-wrap:wrap;border-top:1px solid var(--hair)}

.service-media-cell{display:flex;align-items:center;gap:10px;min-width:0}

.service-photo-uploader-v158 input{position:absolute;inset:0;opacity:0;cursor:pointer}
.till-cart-lines{list-style:none;padding:0;margin:12px 0 0}

.till-cart-line .till-cart-line-sub{display:block;font-weight:400;color:var(--muted);font-size:12px}
.till-cart-qty{display:flex;align-items:center;gap:8px}

.till-cart-qty output{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.till-cart-line-amount{min-width:76px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.till-cart-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:1.5rem;font-weight:800;letter-spacing:-.03em}
.till-cart-total .till-cart-total-num{font-variant-numeric:tabular-nums}
.till-cart-status{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:14px}
.till-cart-status.ok{color:var(--green)}
.till-cart-status.no{color:var(--red,#c0392b)}
.till-receipt-lines{list-style:none;padding:0;margin:10px 0}
.till-receipt-lines li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}

.package-customer-tools-v157{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:10px 0 12px}
.package-customer-tools-v157>div{flex:1 1 220px}
/* PS-1C.1 unified checkout panel — server-priced breakdown (all figures authoritative from evaluate_checkout) */
.ck-panel{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:#FBFAF8}
.ck-panel[data-checking]{opacity:.55}
.ck-checking{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;padding:6px 0}
.ck-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px;font-variant-numeric:tabular-nums}
.ck-row.ck-gst{color:var(--muted);font-size:12.5px}
.ck-effect{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13.5px;color:var(--green);font-variant-numeric:tabular-nums}
.ck-effect .ck-effect-label{display:inline-flex;align-items:center;gap:6px}
.ck-effect.ck-effect-off{color:var(--muted)}
.ck-effect.ck-effect-off .ck-effect-why{font-style:italic}
.ck-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:1.5rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ck-total.ck-stale{color:var(--muted)}
.ck-extras{list-style:none;padding:0;margin:12px 0 0}
.ck-extras li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;font-variant-numeric:tabular-nums}
.ck-extras .ck-extra-note{color:var(--muted);font-size:12px;display:block;font-weight:400}
.ck-notice{margin-top:12px;padding:10px 14px;border-radius:var(--r-sm);font-size:13.5px}
.ck-notice.warn{background:#FBF3E7;color:var(--amber)}
.ck-notice.info{background:#EFF4F1;color:var(--green)}
.dashboard-page{display:grid;gap:16px}
.dashboard-intro{display:flex;align-items:flex-start;gap:13px;padding:18px 20px;border:1px solid #DED7CC;border-radius:var(--r);background:#EDE7DE}
.dashboard-intro>.cui-icon{color:var(--coral);margin-top:3px}.dashboard-intro h1{font-size:1.85rem}.dashboard-intro p{margin-top:4px;line-height:1.5}
.performance-panel{padding:0;overflow:hidden;background:#fff}
.performance-heading{display:flex;align-items:center;gap:12px;padding:17px 20px;background:#F7EEE8;border-bottom:1px solid #EADFD8;flex-wrap:wrap}
.performance-heading>.cui-icon{color:var(--coral)}.performance-heading h2{font-size:1.08rem}.performance-heading p{margin-top:3px}
/* V319 (owner: "filter time move here"): the period strip now lives in this heading. It takes the
   free space between the title block and Minimise on a wide card, and drops to its own full-width
   row — ahead of nothing, so the tap targets keep their size — once the header has to wrap. */
.performance-heading>.dashboard-range-v319{margin-left:auto;justify-content:flex-end}
@media(max-width:900px){.performance-heading>.dashboard-range-v319{order:3;flex-basis:100%;margin-left:0;justify-content:flex-start}}
.performance-body{padding:20px}
.dashboard-kpis{margin-top:16px}
.dashboard-metric{display:block;width:100%;min-height:112px;padding:17px 18px;text-align:left;color:inherit;background:#fff;border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .2s var(--spring),box-shadow .2s var(--ease),border-color .2s}
/* V180 (owner instruction): the four dashboard counters were four identical white cards, so
   nothing told money apart from people at a glance. Each now carries a tinted wash and a
   coloured rail keyed to WHAT THE NUMBER MEANS, not to its position — permissions can hide
   any one of these (see metrics[].filter(Boolean)), and a position-based palette would
   recolour the survivors. Inactive deliberately uses slate, not red: zero inactive customers
   is a good result and must not render as an alarm. */
/* V180: one readable line per teammate. Wraps rather than truncating, because an owner
   scanning for a phone number must never be shown a clipped one. */
.staff-row-line{display:flex;flex-direction:column;align-items:stretch;gap:6px}
/* V226 (owner drew these columns by hand and captioned them "I want clear segmentation").
   The row was a flex wrap, so a field landed at a different x-position on every line and could
   not be read down a column. One shared template drives the header and every row, so the two
   cannot drift apart. Below 900px it stacks and each cell labels itself from data-staff-col. */
:root{--staff-cols-v226:minmax(130px,1.3fr) minmax(105px,.9fr) minmax(170px,1.6fr) minmax(105px,.9fr) minmax(120px,1fr)}
.staff-row-open{display:grid;grid-template-columns:var(--staff-cols-v226);align-items:center;gap:6px 14px;width:100%;min-width:0;text-align:left;background:transparent;border:0;padding:8px 6px;margin:-8px -6px -2px;border-radius:var(--r-sm);color:inherit;min-height:44px}
.staff-col-head-v226{display:grid;grid-template-columns:var(--staff-cols-v226);gap:6px 14px;padding:0 6px 6px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.staff-col-v226{min-width:0;overflow-wrap:anywhere}
/* V260 (owner: Owner & managers vs Roster only tables had different column widths, and the
   App-access/module pills collided with POSITION/COMMISSION text). Root cause: .staff-row-open
   used to flex-grow to fill whatever space its sibling pills+buttons left over, and that
   leftover varied per row (an owner row has one status line; a roster row has two pills plus
   three buttons) — so the SAME grid template rendered at a different pixel width per row,
   drifting the columns and squeezing the last cells into the pills next to them. Giving the
   name/phone/email/position/commission grid its own full-width row, with the pills and action
   buttons on a second row underneath, makes .staff-row-open always render at the row's full
   width — identical to the header's — regardless of how many badges or buttons a given
   teammate has, and removes the possibility of the two ever touching. */
.staff-row-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 6px}
/* V229 (owner: "square boxes for each topics then press in"). The Programmes overview is a
   grid of topic tiles; each drills into its own detail list. */
.grow-topic-tiles-v229{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:14px}
/* V244: ongoing vs pending groups. Same tile, grouped so outstanding setup is obvious. */
.grow-topic-group-v244{margin-top:20px}
.grow-topic-group-head-v244 h3{font-size:1.02rem;font-weight:750}
.grow-topic-group-head-v244 p{margin-top:3px}
.grow-topic-group-empty-v244{margin-top:12px;padding:14px;border:1px dashed var(--line);border-radius:12px}
.grow-topic-tile-pending-v244{border-style:dashed}
.grow-topic-tile-v229{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;min-height:158px;cursor:pointer;color:inherit}
.grow-topic-tile-v229:hover{background:var(--tint);border-color:var(--coral)}
.grow-topic-tile-v229>b{font-size:1.02rem;letter-spacing:-.01em}
.grow-topic-tile-icon-v229{width:36px;height:36px;border-radius:12px;background:var(--tint);color:var(--coral);display:grid;place-items:center}
.grow-topic-tile-open-v229{margin-top:auto;color:var(--coral);font-weight:600;font-size:.85rem}
/* The one choice for what points are FOR — two selectable cards, then a compact chosen state. */
.points-mode-chooser-v229{width:100%}
.points-mode-lead-v229{margin:0 0 10px}
.points-mode-cards-v229{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;width:100%}
.points-mode-card-v229{display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:14px;cursor:pointer;color:inherit}
.points-mode-card-v229:hover{border-color:var(--coral);background:var(--tint)}
.points-mode-card-v229:disabled{opacity:.6;cursor:default}
.points-mode-chosen-v229{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%}
.points-mode-row-v229{cursor:default;flex-wrap:wrap}
/* V250 (owner drew reward boxes with a "+" over the numbered reward rows). Cards reuse the
   existing pill and surface tokens — no new colours — and the grid is minmax(150px,1fr) so two
   still sit side by side at 390px. The add card is the same box in a dashed outline. */
.reward-card-grid-v250{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px}
.reward-card-v250{appearance:none;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-width:0;min-height:118px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font:inherit}
button.reward-card-v250{cursor:pointer;transition:background .16s ease,border-color .16s ease}
button.reward-card-v250:hover{background:var(--tint);border-color:var(--coral)}
button.reward-card-v250:focus-visible{outline:3px solid rgba(201,67,51,.25);outline-offset:2px}

/* V300 (owner approval 2026-08-13, the landing-page promise): "IN THIS GROUP / CAME BACK" on the
   retention surface itself. Two server answers, one card:
     * away now  — retention_lapsed_candidates_v244 (the exact list the playbook audience uses);
     * came back — staff_list_returned_customers_v300, the SAME valid-visit predicate, so the two
       numbers can never disagree about what a visit is.
   Purely descriptive: it states who returned after crossing the threshold, never WHY — causal
   claims stay with the playbooks and their held-back arms. Missing backend (PGRST202/42883) or a
   denied scope removes the card rather than guessing. */
async function renderComebackCardV300({isCurrent=()=>true}={}){
  const host=$('comebackHost');
  if(!host)return;
  const paint=async awayDays=>{
    if(!isCurrent()||!host.isConnected)return;
    host.innerHTML=`<div class="card"><p class="muted small">Checking who has come back…</p></div>`;
    const [lapsedResult,returnedResult]=await Promise.all([
      sb.rpc('retention_lapsed_candidates_v244',{p_business:S.biz.id,p_lapsed_days:awayDays,p_min_visits:1}),
      sb.rpc('staff_list_returned_customers_v300',{p_business:S.biz.id,p_away_days:awayDays,p_window_days:30})
    ]);
    if(!isCurrent()||!host.isConnected)return;
    const unavailable=result=>['42883','PGRST202'].includes(String(result?.error?.code||''))||String(result?.error?.code||'')==='42501';
    if(unavailable(lapsedResult)||unavailable(returnedResult)){host.remove();return}
    if(lapsedResult.error||returnedResult.error){
      host.innerHTML=`<div class="card"><p class="muted small">The come-back answer could not be loaded.</p><button class="btn ghost sm" id="comebackRetry" style="margin-top:10px">Try again</button></div>`;
      const retry=$('comebackRetry');if(retry)retry.onclick=()=>paint(awayDays);
      return;
    }
    const away=Number(lapsedResult.data?.total??lapsedResult.data?.count??0)||0;
    const returned=returnedResult.data||{};
    const rows=Array.isArray(returned.rows)?returned.rows:[];
    host.innerHTML=`<div class="card">
      <div class="row" style="align-items:flex-start;gap:12px;flex-wrap:wrap"><div>
        <h2>Gone quiet, and who came back</h2>
        <p class="muted small" style="margin-top:4px">Members with no valid visit for the chosen stretch, and those who ended a stretch that long within the last 30 days. Observed visits only — this card claims no cause.</p>
      </div><span class="spacer"></span>
      <div class="v150-segment" role="group" aria-label="Away threshold">${[30,60,90].map(days=>`<button type="button" data-comeback-days="${days}" aria-pressed="${days===awayDays}">${days}+ days</button>`).join('')}</div></div>
      <div class="kpis" style="margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
        <div class="card kpi"><div class="l">Away ${awayDays}+ days now</div><div class="v">${away}</div></div>
        <div class="card kpi"><div class="l">Came back in the last 30 days</div><div class="v" style="color:var(--green)">${Number(returned.total_returned||0)}</div></div>
      </div>
      ${rows.length?`<div style="margin-top:14px"><b class="small">Returned recently</b>
        ${rows.slice(0,8).map(row=>`<div class="wallet-line"><div><b>${esc(row.full_name||'Customer')}</b><p class="muted small" style="margin-top:3px">Away ${Number(row.away_days||0)} days · back ${esc(sgt(row.returned_at)||'')}</p></div><span class="spacer"></span><a class="btn ghost sm" href="#/client/${esc(row.id||'')}">Open</a></div>`).join('')}
        ${returned.truncated||rows.length>8?`<p class="muted small" style="margin-top:8px">Showing the ${Math.min(8,rows.length)} most recent returns of ${Number(returned.total_returned||0)}.</p>`:''}</div>`
      :`<p class="muted small" style="margin-top:12px">Nobody has ended a ${awayDays}+ day break in the last 30 days.</p>`}
    </div>`;
    host.querySelectorAll('[data-comeback-days]').forEach(button=>button.onclick=()=>paint(Number(button.dataset.comebackDays)||60));
  };
  paint(60);
}

    snapshotHash:snapshot?.draft?.snapshot_hash||null,
    basedOn:snapshot?.currentVersion||null,
    earn:Number(base?.earn_points_per_dollar)>0?Number(base.earn_points_per_dollar):1,
    stampSpend:Number(base?.stamp_per_cents)>0?Number(base.stamp_per_cents)/100:5,

    classicRedeem:Number(base?.redeem_points)>0?Math.round(Number(base.redeem_points)):800,
    classicCredit:Number(base?.reward_credit_cents)>0?Number(base.reward_credit_cents)/100:20,

       expiry had no wizard screen at all before this wave: programRowV305 carried whatever was

       (none | fixed | inactivity, expiryModeRequiresDays), and yearly is fixed + 365 rather than a

    expiryMode:['none','fixed','inactivity'].includes(String(base?.expiry_mode||''))

    referralReward:Number(snapshot?.referral?.reward_points)>0

       referral_programs.enabled is what the engine reads, so that column — carried on the snapshot

       workspace with the referrals module off. Updated after each successful save so a second
       publish in the same session does not re-write a live table for nothing. */
    referralEnabledW6I2:typeof snapshot?.referral?.enabled==='boolean'
      ?snapshot.referral.enabled===true

    /* V304: the archived rows are dropped HERE, after the merge, so a draft's active:false wins

    /* V324: filtered from mergedRewardsV324 (computed just above `state`), not a second

    rewards:mergedRewardsV324.filter(reward=>reward.active!==false),
    rewardsAllV324:mergedRewardsV324,

    tiersDirty:new Set(),tierForm:null,

       changes. The saved default is the live/draft one — the owner is never silently re-basised.

    tierBasis:tierBasisFromDbV306(base?.tier_basis),

       asked for ("it needs to reflect as i change it, so will not have confusion") and nothing
       else — the row's own name and number are patched straight into the DOM as they are typed. */
    editingV304:null,

       is the whole decision. null = not read yet or unreadable. */
    impact:null,

    tierAck:false,
    busy:false,error:'',published:false,publishedSummary:null,

    modeError:''
  };
  /* W6 increment 2 — THE RAIL. Three fixed step lists (one per exclusive model) become ONE list
     COMPOSED from whichever programmes are switched on: screen 0, then each switched-on
     programme's mini-rail in customer-facing order, then Go-live. Sixteen subsets, one list
     builder, and every step number in this closure is still read from it rather than written down
     — so a programme toggled on or off mid-setup simply changes what the list returns and the
     numbering follows, which is what makes "turn one off mid-rail and its screens vanish" true
     without a single number moving in this file.
     `startStep:'review'` still means "the last step", whichever that now is. */
  const railW6I2=()=>{
    const steps=[{kind:'choose',label:'Programmes',programme:null}];
    GROW_SETUP_RAIL_W6I2.forEach(([programme,screens])=>{
      if(state.switches[programme]!==true)return;
      screens.forEach(([kind,label])=>steps.push({kind,label,programme}));
    });
    steps.push({kind:'live',label:'Go live',programme:null});
    return steps;
  };
  const railCountW6I2=()=>railW6I2().length;
  const railStepW6I2=()=>railW6I2()[state.step-1]||{kind:'live',label:'Go live',programme:null};
  const stepKindW6I2=()=>railStepW6I2().kind;
  /* `null` when the rail has no such screen, so a caller can tell "this firm has no Gifts screen"
     apart from "the Gifts screen is the last one". Returning the count for both is how a reward
     hand-off would land the owner on the publish gate. */
  const stepNumberOrNullW6I2=kind=>{
    const index=railW6I2().findIndex(step=>step.kind===kind);
    return index<0?null:index+1;
  };
  const stepNumberForW6I2=kind=>stepNumberOrNullW6I2(kind)??railCountW6I2();
  const anySwitchOnW6I2=()=>PROGRAMME_KINDS_W6I2.some(kind=>state.switches[kind]===true);
  /* The single running % across the whole sequence (plan §5). Screens COMPLETED over screens to
     do, so screen 0 reads 0% and the publish gate reads the last stride rather than 100% before
     anything is published. */
  const railPercentW6I2=()=>{
    const total=Math.max(1,railCountW6I2()-1);
    return Math.max(0,Math.min(100,Math.round(((state.step-1)/total)*100)));
  };
  /* Which ENGINE the screen the owner is standing on belongs to. This replaces state.family, which
     was a property of the whole wizard and therefore could not survive points and stamps running
     together: with both on, the rail carries a stamps screen and a points screen and each has to
     read and write its own engine's fields. Screens with no programme (screen 0, Go-live) answer
     'points', which is what every non-stamps branch already assumed. */
  const familyW6I2=()=>railStepW6I2().programme==='stamps'?'stamps':'points';
  const tierModelW6I2=()=>state.switches.tiers===true;
  /* V294's editor entry context, decided by the CARD the owner pressed where there was one, and by
     the switched-on programmes otherwise. Which programme they came about is the question that
     block answers, and it is not the same question as which engine they are configuring. */
  const editorContextV303=()=>handoffV303?.from
    ?(handoffV303.from==='tiers'?'ctx-tiers':'ctx-points')
    :(tierModelW6I2()&&state.switches.points!==true?'ctx-tiers':'ctx-points');
  state.step=String(startStep)==='review'?railCountW6I2()
    :Math.min(railCountW6I2(),Math.max(1,Number(startStep)||1));
  const writesCostDefault=()=>familyW6I2()==='points'&&state.model!=='classic'&&(fresh||!pairSet);
  const costPerPointCents=()=>writesCostDefault()?1
    :(pairSet?Number(base.reward_credit_cents)/Number(base.redeem_points):1);
  const unitWord=(value,plural)=>`${value} ${Number(value)===1?(plural==='stamps'?'stamp':'point'):(plural==='stamps'?'stamps':'points')}`;
  const rewardUnit=()=>familyW6I2()==='stamps'?'stamps':'points';
  /* V303: an Add reward / Edit reward control on the Programmes drill hands over "open on the
     Reward step with this form armed" (owner: "pressing add rewards - still brings me to this
     page"). Consumed once, here, so a later plain visit to #/grow/setup opens on step 1. It sits
     below costPerPointCents deliberately: a template hand-off carries a company cost, and the
     points price is derived from it by the SAME one programme-wide rate the form's own maths uses,
     rather than being left blank for the owner to work out. */
  /* W6 increment 2: and only when the RAIL has a Gifts screen — i.e. only when the points switch
     is on. A firm running stamps and tiers alone has no points catalogue, and sending the owner to
     "the last step" instead would have opened the publish gate with a gift form they never asked
     for. */
  const rewardHandoffV303=pendingGrowSetupRewardV303;
  pendingGrowSetupRewardV303=null;
  /* V326: the Points System / Stamp card page's "edit" link lands here on the earning-rate step
     specifically — it needs the earn RATE, not the gift list (that's the page's own job now).
     The step KIND differs by family (GROW_SETUP_RAIL_W6I2 above): 'earn' for points, 'stampEarn'
     for stamps — the hand-off carries which one it came from (V326 stamps-unification) rather than
     always checking 'earn', which would silently miss on a stamps-only rail and leave the wizard
     on step 1. Guarded on that step existing on the rail rather than 'reward'/'stampGift', since
     this hand-off never touches the gift/milestone screen. */
  if(rewardHandoffV303?.mode==='earning'){
    const earnStepKindV326=rewardHandoffV303.kind==='stamps'?'stampEarn':'earn';
    if(stepNumberOrNullW6I2(earnStepKindV326)!==null)state.step=stepNumberForW6I2(earnStepKindV326);
  }else if(rewardHandoffV303?.mode==='climbing'){
    /* V331: the Tiers page's own "edit" link -- lands on the tier-basis step (visits/spend/points),
       the one tier setting that page does not expose. Rung management is that page's own job. */
    if(stepNumberOrNullW6I2('climb')!==null)state.step=stepNumberForW6I2('climb');
  }else if(rewardHandoffV303&&stepNumberOrNullW6I2('reward')!==null){
    state.step=stepNumberForW6I2('reward');
    const wanted=rewardHandoffV303.mode==='edit'
      ?state.rewards.find(reward=>reward.id===String(rewardHandoffV303.id||''))
      :null;
    if(wanted)state.form={id:wanted.id,name:wanted.name,
      budget:(wanted.budgetCents/100).toFixed(2),points:String(wanted.points)};
    /* V324: was `mode!=='edit'`, which also caught the new mode:'view' and would have armed a
       blank add-form instead of just moving the step. Narrowed to the one mode this branch is
       actually for. */
    else if(rewardHandoffV303.mode==='add'){
      const budgetCents=Math.max(0,Number(rewardHandoffV303.budgetCents)||0);
      state.form={id:null,name:String(rewardHandoffV303.name||''),
        budget:budgetCents>0?(budgetCents/100).toFixed(2):'',
        points:budgetCents>0&&familyW6I2()!=='stamps'
          ?String(Math.max(1,Math.ceil(budgetCents/Math.max(1,costPerPointCents())))):''};

  }
  for(let number=1;number<=state.step;number++)state.visited.add(number);
  /* Points keeps the points-family model the firm already runs (classic stays classic, so its

     is the catalogue engine every named reward on this page is claimed through. */
  /* W6 increment 2: loyalty_programs.loyalty_model is a SETTINGS discriminator after the v314
     inversion, not a switch — the earn loop reads the spine and then the version row's own
     stamp_per_cents / earn_points_per_dollar, never loyalty_model (v311:519-535 as spliced by
     v314 consumers 1 and 2). So one version row can legitimately carry both engines' settings,
     and the model column only has to name the engine whose CATALOGUE the firm redeems against.
     Rule: stamps ALONE is a stamps firm; the moment points or tiers is also on, the catalogue is
     the points one and the model says so. 'classic' survives untouched for the firms on the fixed
     redeem pair — orphaning that pair is how their one reward would stop working. */
  const modelForSwitchesW6I2=()=>{
    if(state.switches.stamps===true&&state.switches.points!==true&&state.switches.tiers!==true)
      return 'stamps';
    return baseModel&&baseModel!=='stamps'?baseModel:'points_tiers';
  };
  const earnLine=()=>familyW6I2()==='stamps'
    ?`${currency} ${Number(state.stampSpend||0).toFixed(2)} spent → 1 stamp`
    :`${currency} 1 spent → ${unitWord(state.earn,'points')}`;
  const rewardLine=()=>state.model==='classic'
    ?`${unitWord(state.classicRedeem,'points')} → ${currency} ${Number(state.classicCredit||0).toFixed(2)} credit`
    /* V304: the summary names what customers can actually claim, so a reward removed on the step
       above drops out of it here rather than being restated on the Go-live step. */
    :activeRewardsV304().length
      ?activeRewardsV304().map(reward=>`${reward.name} — ${unitWord(reward.points,rewardUnit())}`).join(' · ')
      :'No reward yet';
  function exampleText(){
    if(familyW6I2()==='stamps'){
      const spend=Number(state.stampSpend)>0?Number(state.stampSpend):5;
      return `Spend ${currency} 10 → ${unitWord(Math.floor(10/spend),'stamps')}`;
    }

    return `Spend ${currency} 10 → ${unitWord(Math.round(rate*10*100)/100,'points')}`;
  }
  function rewardHintText(){
    if(familyW6I2()==='stamps')return 'Type what the reward costs you, then how many stamps a customer needs for it.';

  }
  /* Every save goes through here. The draft is created on the FIRST save, never on page load,

     carried and refreshed from each response; and a failure comes back as a message the caller
     prints beside the step it belongs to, without touching a single typed value. */
  /* V302: draft creation is its own step because the reward path needs the draft to EXIST before
     it writes anything — ensure_published_reward_in_draft_v138 takes a config version. Still
     created on the first write only, never on page load, so browsing the wizard and leaving
     still deposits no orphan draft. */
  const ensureDraftV302=async()=>{
    if(state.versionId)return {ok:true};
    const {data,error}=await sb.rpc('create_loyalty_config_draft',{

    if(error)return {ok:false,error};
    if(!data?.version_id)return {ok:false,error:new Error('The editable draft was not returned.')};
    state.versionId=data.version_id;

  };

    const created=await ensureDraftV302();
    if(!created.ok)return created;
    const {data,error}=await sb.rpc('save_loyalty_config_draft',{
      p_version:state.versionId,p_config:config,p_expected_snapshot_hash:state.snapshotHash||null});
    if(error)return {ok:false,error};
    state.snapshotHash=data?.snapshot_hash||null;
    return {ok:true};
  };
  /* After a reward write the draft is re-read so this step lists what was actually stored,
     including the id the server minted for a new reward. Fail-soft: an unreadable re-read keeps
     the list as it was rather than blanking a reward the owner just created. */
  const refreshRewards=async()=>{
    if(!state.versionId)return;
    const {data,error}=await sb.rpc('get_loyalty_reward_draft',{p_config_version:state.versionId});
    if(error||!data)return;
    if(data.snapshot_hash)state.snapshotHash=data.snapshot_hash;

       tiers into a new draft but NOT the reward versions — that is what
       ensure_published_reward_in_draft_v138 exists to do, on demand, one reward at a time. So a
       firm with a published catalogue and a fresh draft has a draft that legitimately holds only
       the rewards it has touched, and replacing the list with it would make four published
       rewards disappear from this step the moment the owner saved their first one. Publishing
       cannot lose them either way — publish_loyalty_config UPDATEs loyalty_rewards from the
       draft's versions and leaves rows the draft does not carry untouched — so what is at stake
       here is the owner's picture of their own catalogue, and it must stay complete. */
    state.rewards=mergeRewardsV302(state.rewards,rewardListFrom(data.rewards));
  };
  /* ---------------- V304: the Reward and Tiers steps save themselves ----------------
     Owner, re-testing the shipped V303 build:
       "i typed the points or cost needed for points redemption - but not reflected in the system
        and not auto saved (it needs to reflect as i change it, so will not have confusion)"
       "i need to be able to add extra tier / delete tier"
       "for rewards subtab - i need to be able to add or delete. because now i need to press
        'next' then press 'back' to view changes"
     Root cause: both steps wrote ONLY inside advance(). So the list above the form could not
     change until the owner left the step and came back, a second reward or tier could not be added
     without advancing, and nothing could be removed at all. The WRITE was never wrong — so it is
     lifted out here, once, and the in-form button, the debounced auto-save, Remove/Undo and Next
     all call the same helper. Four intents, one writer: they cannot drift apart. */
  const activeRewardsV304=()=>state.rewards.filter(reward=>reward.active!==false);
  const activeTiersV304=()=>state.tiers.filter(tier=>tier.active!==false);
  /* Every save goes through ONE promise chain. save_loyalty_config_draft and

     it on every write — so two saves in flight at once means the second carries a hash that is

  let saveChainV304=Promise.resolve();

    const next=saveChainV304.then(work,work);

    const first=await write();

       silently. A second failure is the owner's to see. */
    await refreshRewards();
    return write();
  };
  /* The row marker is patched into the DOM rather than re-rendered, because the owner is usually
     still standing in the field when it appears and a re-render would take their caret with it. */
  const rowMarkV304=(kind,id,text)=>{
    const node=host.querySelector(`[data-grow-setup-rowmark-v304="${kind}:${id}"]`);
    if(node)node.textContent=text;
  };
  const flashSavedV304=(kind,id)=>{
    if(!id)return;
    rowMarkV304(kind,id,' · Saved ✓');
    setTimeout(()=>{if(isCurrent())rowMarkV304(kind,id,'')},2400);
  };
  const rewardFormProblemV304=form=>{
    if(String(form?.name||'').trim().length<2)return 'Give this reward a name customers will recognise.';
    if(!(parseInt(form?.points||'0',10)>0))return `Enter how many ${rewardUnit()} this reward costs.`;

  const saveRewardFormV304=async(form,{active=null}={})=>{
    const problem=rewardFormProblemV304(form);
    if(problem)return {ok:false,soft:true,message:problem};
    const name=String(form.name).trim();
    const cost=parseInt(form.points||'0',10);
    const budgetCents=Math.round((parseFloat(form.budget||'0')||0)*100);
    const before=new Set(state.rewards.map(reward=>reward.id));
    const result=await retryOnConflictV304(async()=>{
      const created=await ensureDraftV302();

        if(ensureError||ensured?.reward_id!==form.id)

        ?{id:form.id,business_id:S.biz.id,name,customer_name:name,

        :{id:null,business_id:S.biz.id,name,customer_name:name,
          description:null,cost_points:cost,credit_cents:0,estimated_cost_cents:budgetCents,
          entitlement_expiry_days:null,usage_limit:null,claim_available_from:null,
          claim_available_until:null,image_ref:null,fulfillment_kind:'manual_item',active:true};

    const existing=state.rewards.find(reward=>reward.id===form.id);

  };
  /* The tier write, one row at a time, through the SAME save_loyalty_tier_draft_v143 the deep

     handed straight back from the merged row — a wizard edit must never blank a multiplier or a

  const writeTierRowV304=async tier=>{
    const result=await retryOnConflictV304(async()=>{
