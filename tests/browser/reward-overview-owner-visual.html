/* V194 (owner: "alignment issue" on the From / To / Appointment status row). Each cell holds a
   label above a control, and 'Appointment status' wraps to two lines at this column width while

   that pushes its control to the bottom, and the labels reserve one consistent line, so every
   input and the Apply/Clear pair share one baseline. */

   is a select; the two render at different intrinsic heights in every engine, and min-height
   alone does not settle it — so with align-items:end their bottoms matched while their tops and
   labels did not. An explicit equal height on every control in this bar removes the variable. */

.challenge-retry[hidden]{display:none}.challenge.challenge-passed{min-height:0;margin-top:0}.challenge-retry{display:inline-flex;align-items:center;min-height:44px;background:none;color:var(--coral);font-size:13px;font-weight:600;padding:6px 0;text-decoration:underline}
.logo{display:inline-flex;align-items:center;min-height:44px}

.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px}
.ind{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:14px;text-align:center;cursor:pointer;

/* ---------- shell: light rail (mockup) + frosted top bar, profile TOP-RIGHT ---------- */
.shell{display:grid;grid-template-columns:246px 1fr;min-height:100dvh}
.side{background:#FCFBF9;border-right:1px solid var(--line);color:var(--ink2);
  padding:max(22px,env(safe-area-inset-top)) 14px max(22px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;min-width:0;
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable}
.side .logo{color:var(--ink);padding:0 10px 22px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:14px;min-height:44px;
  min-width:0;max-width:100%;overflow-wrap:anywhere;
  font-weight:500;margin-bottom:1px;color:var(--ink2);transition:background .14s var(--ease),color .14s}
.nav,.navgroup,.navbody{min-width:0;max-width:100%}
.nav a:hover{background:#F2EFEA;color:var(--ink)}
.nav a.act{background:var(--tint);color:var(--coral);font-weight:600}
/* Icons get their own fixed-width box so every label starts on the same optical
   column, and so flex `gap` actually applies — an emoji sitting in the same text
   node as its label is one flex item, so gap silently does nothing and the icon
   ends up jammed against the word. This is the difference between "looks bought"
   and "looks generated". */
.nav .ic{width:18px;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;
  flex-shrink:0;line-height:1}
.navhead{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:9px 12px;border-radius:10px;font-size:11px;
  font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);cursor:pointer;text-align:left;background:transparent;
  margin-top:12px;transition:color .14s,background .14s}
.navhead:hover{color:var(--ink2)}
.navhead.act{color:var(--ink2)}
.navhead .chev{margin-left:auto;font-size:10.5px;opacity:.9;transition:transform .22s var(--spring)}
.navbody a{padding-left:22px}
.side .foot{margin-top:auto;padding:10px;font-size:12.5px;color:var(--muted)}
/* the right-hand column: sticky frosted app bar above the scrolling page */
.col{display:flex;flex-direction:column;min-width:0}
.appbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:flex-end;
  gap:10px;padding:max(12px,env(safe-area-inset-top)) max(34px,env(safe-area-inset-right))
    12px max(34px,env(safe-area-inset-left));border-bottom:1px solid var(--hair);
  background:rgba(232,227,218,.94);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.profile{position:relative}
.profile .who{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px 6px 6px;border-radius:100px;
  cursor:pointer;background:#fff;border:1px solid var(--hair);box-shadow:var(--shadow);
  transition:transform .2s var(--spring),box-shadow .2s var(--ease)}
.profile .who:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.profile .who:active{transform:scale(.975)}
.profile .who .chev{font-size:9px;color:var(--muted);margin-left:2px}
.profile .avatar{width:30px;height:30px;border-radius:100px;background:var(--grad);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;
  box-shadow:0 2px 6px rgba(255,107,94,.3)}
/* menu now drops DOWN from the top-right chip (was: up from the bottom-left rail) */
.profile .menu{position:absolute;top:calc(100% + 8px);right:0;min-width:212px;
  background:rgba(255,255,255,.86);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border:1px solid var(--hair);border-radius:var(--r-sm);padding:6px;box-shadow:var(--shadow-lg);
  transform-origin:top right;animation:pop .2s var(--spring)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(-6px)}to{opacity:1;transform:scale(1) translateY(0)}}
.profile .menu a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
  color:var(--ink2);font-size:13.5px;font-weight:500;white-space:nowrap}
.profile .menu a:hover{background:#F2EFEA;color:var(--ink)}
.profile-menu-section{padding:8px 12px;border-top:1px solid var(--hair);margin-top:4px}
.profile-menu-section:first-child{border-top:0;margin-top:0}
.profile-menu-section label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:0 0 6px;display:block}
.profile-menu-section input,.profile-menu-section select{min-height:40px;font-size:14px;border-radius:12px}
.profile-menu-section .row{gap:6px;align-items:center}
.profile-menu-saved{font-size:12px;color:var(--ok);min-height:16px;margin-top:4px}
.business-workspace-switch,.customer-workspace-switch{position:relative}
.business-workspace-switch>summary,.customer-workspace-switch>summary{list-style:none}
.business-workspace-switch>summary::-webkit-details-marker,.customer-workspace-switch>summary::-webkit-details-marker{display:none}
.business-workspace-switch .menu,.customer-workspace-switch .menu{position:absolute;top:calc(100% + 8px);right:0;z-index:42;
  min-width:224px;background:rgba(255,255,255,.94);border:1px solid var(--hair);border-radius:var(--r-sm);
  padding:6px;box-shadow:var(--shadow-lg);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}

/* notification bell — sits left of the profile chip, same frosted-popover language */
.bellwrap{position:relative}
.bellbtn{position:relative;width:44px;height:44px;border-radius:100px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;background:#fff;border:1px solid var(--hair);box-shadow:var(--shadow);

  padding:0 3px;box-shadow:0 0 0 2px #fff}
.notif-menu{position:absolute;top:calc(100% + 8px);right:0;width:320px;max-width:calc(100vw - 40px);
  background:rgba(255,255,255,.86);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border:1px solid var(--hair);border-radius:var(--r-sm);padding:8px;box-shadow:var(--shadow-lg);
  transform-origin:top right;animation:pop .2s var(--spring);max-height:420px;overflow-y:auto;z-index:41}
.notif-item{display:block;width:100%;padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;background:transparent;color:inherit;transition:background .14s var(--ease)}
.notif-item:hover{background:#F2EFEA}
.notif-item.unread{background:var(--tint)}
.notif-item .t{font-size:13px;font-weight:600;color:var(--ink)}
.notif-item .b{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.notif-item .ago{font-size:10.5px;color:var(--muted);margin-top:4px}
.notif-empty{text-align:center;padding:24px 12px;color:var(--muted);font-size:13px}
/* global top-bar action cluster — search + everyday actions, sits left of the bell so the
   jobs used all day (find a customer, quick earn, new appointment) are one reach from any route */
.global-actions{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0;margin-right:auto}
.global-search{display:flex;align-items:center;gap:6px;flex:0 1 340px;min-width:0;height:44px;padding-left:13px;
  background:#fff;border:1px solid var(--hair);border-radius:100px;box-shadow:var(--shadow);
  transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
.global-search:focus-within{border-color:var(--coral);box-shadow:0 0 0 3px rgba(255,107,94,.18)}
.global-search-ic{display:inline-flex;align-items:center;color:var(--muted);flex-shrink:0}
.global-search input{flex:1 1 auto;min-width:0;width:auto;min-height:0;height:42px;border:0;background:transparent;

.global-search input:focus{outline:none;border:0;box-shadow:none}
.global-search-go{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex-shrink:0;
  border-radius:100px;background:var(--grad);color:#fff;box-shadow:0 1px 2px rgba(194,65,53,.2)}
.global-search-go:active{transform:scale(.92)}
.global-quick{display:flex;align-items:center;gap:8px;flex-shrink:0}
.global-act{white-space:nowrap}.global-act svg{flex-shrink:0}
.dashboard-appbar-branch{display:block;flex:0 1 196px;min-width:150px}
.dashboard-appbar-branch select{width:100%;min-width:0;margin:0;background:#fff;box-shadow:var(--shadow);font-size:13px}
.dashboard-mobile-branch{display:none}
.mobile-page-title,.mobile-search-trigger,.mobile-search-sheet{display:none}
.mobile-page-title{min-width:0;align-items:center;gap:9px;font-weight:750;color:var(--ink)}
.mobile-page-title .mobile-page-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--tint);color:var(--coral)}
.mobile-page-title span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mobile-search-trigger{width:44px;height:44px;border-radius:999px;background:#fff;border:1px solid var(--hair);box-shadow:var(--shadow);color:var(--ink2);align-items:center;justify-content:center}
.mobile-search-sheet[open]{display:block;position:fixed;inset:0;z-index:190;background:rgba(23,22,26,.22);padding:max(16px,env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom))}
.mobile-search-panel{margin:0 auto;background:#fff;border:1px solid var(--hair);border-radius:20px;padding:14px;box-shadow:var(--shadow-lg);max-width:520px}
.mobile-search-panel .row{gap:8px}.mobile-search-panel input{font-size:16px}
.mobile-action-sheet{display:grid;gap:10px;padding:8px 6px 12px;border-bottom:1px solid var(--hair);margin-bottom:8px}
.mobile-action-sheet .workspace-language-picker{width:100%;min-width:0;border-radius:12px;font-size:16px}
.mobile-action-sheet .btn{width:100%;justify-content:center}
.mobile-language-label{font-size:11.5px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.mobile-workspace-summary{padding:10px 11px;border:1px solid var(--hair);border-radius:13px;background:#FBFAF8}
.mobile-workspace-summary b,.mobile-workspace-summary span{display:block;overflow-wrap:anywhere}
.mobile-workspace-summary .muted{font-size:12px;line-height:1.35}
/* Phone-first staff navigation. The high-frequency jobs stay thumb-reachable while the
   complete, permission-filtered workspace navigation remains available behind More. */
.staff-mobile-dock{display:none}
.staff-mobile-more{position:relative;min-width:0}
.staff-mobile-more>summary{list-style:none}
.staff-mobile-more>summary::-webkit-details-marker{display:none}
.staff-mobile-drawer{position:absolute;right:0;bottom:calc(100% + 10px);width:min(330px,calc(100vw - 24px));
  max-height:min(68dvh,560px);overflow:auto;padding:10px;background:rgba(255,255,255,.97);
  border:1px solid var(--hair);border-radius:18px;box-shadow:var(--shadow-lg);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
.staff-mobile-drawer .nav{display:block}
.staff-mobile-drawer .navhead{margin-top:6px}
.staff-mobile-drawer .navbody a{padding-left:22px}
.staff-mobile-action{min-width:0;min-height:52px;padding:5px 2px;border-radius:12px;color:var(--muted);

.staff-mobile-action svg{width:20px;height:20px}
.staff-mobile-action.act{color:var(--coral);background:var(--tint)}
.staff-mobile-action:active{transform:scale(.96)}
.team-member-card,.staff-invite-card{padding:11px 0;border-bottom:1px solid var(--line)}
.team-member-card .row,.staff-invite-card .row{gap:8px}
.team-member-main,.staff-invite-main{min-width:0}
.team-member-main b,.staff-invite-main b{overflow-wrap:anywhere}
.staff-invite-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.09em;font-weight:800;color:var(--ink)}
.staff-invite-meta{display:grid;gap:4px;margin-top:7px;color:var(--muted);font-size:12.5px}
.staff-invite-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.staff-invite-actions .btn{min-height:40px}
/* settings — tabbed sections so each save has a clear, small scope instead of one long page */
.settings-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.settings-tab{min-height:44px;padding:10px 15px;border:0;border-bottom:2px solid transparent;background:transparent;
  color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;border-radius:10px 10px 0 0;white-space:nowrap;
  transition:color .14s,background .14s,border-color .14s}
.settings-tab:hover{color:var(--ink2);background:#F2EFEA}
.settings-tab[aria-selected="true"]{color:var(--coral);border-bottom-color:var(--coral)}
.settings-panel[hidden]{display:none}
.settings-save-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.settings-save-row .btn{flex:0 0 auto}
.workspace-logo-editor{display:grid;grid-template-columns:92px minmax(0,1fr);gap:16px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.workspace-logo-preview{width:92px;height:92px;border-radius:24px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;overflow:hidden;font-size:30px;font-weight:800;color:var(--red)}
.workspace-logo-preview img{width:100%;height:100%;object-fit:cover;display:block}
.workspace-logo-fields{min-width:0}
.settings-scope{color:var(--muted);font-size:12px;line-height:1.4;flex:1 1 160px;min-width:0}
.switchrow{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 4px;font-size:12.5px;color:var(--ink2)}
.tglsw{position:relative;width:44px;height:44px;border-radius:100px;background:transparent;cursor:pointer}
.tglsw::before{content:'';position:absolute;left:4px;top:11px;width:36px;height:21px;border-radius:100px;background:var(--line);
  transition:background .18s var(--ease);flex-shrink:0}
.tglsw.on::before{background:var(--green)}
.tglsw::after{content:'';position:absolute;top:13px;left:6px;width:17px;height:17px;border-radius:100px;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s var(--spring)}
.tglsw.on::after{transform:translateX(15px)}
/* universal importer modal */
.modal{position:fixed;inset:0;z-index:210;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(23,22,26,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .18s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:640px;max-width:100%;
  max-height:88vh;overflow-y:auto;padding:26px;animation:pop .22s var(--spring);transform-origin:center}
.seg{display:inline-flex;gap:4px;background:#F1EEE9;border-radius:100px;padding:3px}
.seg button{background:transparent;border-radius:100px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.act{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.imp-prev{border:1px solid var(--hair);border-radius:var(--r-sm);overflow:hidden;margin-top:14px}
.imp-prev table{font-size:12px}.imp-prev th,.imp-prev td{padding:7px 10px}
.imp-note{background:var(--tint);color:#8a4a2e;border-radius:var(--r-sm);padding:9px 12px;font-size:12px;margin-top:12px}
.reward-list{display:grid;gap:10px;margin-top:12px}
.reward-item{border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 14px;background:#fff}
.reward-item .meta{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.reward-editor{margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}
.reward-editor .field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.reward-editor .field-grid .full{grid-column:1/-1}
.reward-editor details{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.reward-editor summary{cursor:pointer;font-weight:650;color:var(--ink2);list-style:none}
.reward-editor summary::-webkit-details-marker{display:none}
.reward-editor summary::after{content:'+';float:right;color:var(--muted);font-size:18px;line-height:1}
.reward-editor details[open] summary::after{content:'−'}
.eligibility-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px}
.eligibility-group{background:#FBFAF8;border:1px solid var(--hair);border-radius:var(--r-sm);padding:10px}
.eligibility-group label{display:flex;align-items:center;gap:7px;margin:7px 0 0;color:var(--ink2);font-size:13px;font-weight:500;cursor:pointer}
.eligibility-group input[type=checkbox]{width:auto;margin:0}
.reward-editor .help{margin-top:5px;line-height:1.45}
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.reward-context{width:auto;min-width:110px;max-width:160px;margin:0;padding:7px 28px 7px 9px;font-size:12px}
@media(max-width:700px){.field-grid,.reward-editor .field-grid,.eligibility-grid{grid-template-columns:1fr}}
/* --- Grow recommender: give-back meter + suggestion panels (see app/grow-recommender.js) --- */
.gb-meter{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;background:#FBFAF8}
.gb-meter-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.gb-meter-figure{font-size:1.45rem;font-weight:700;letter-spacing:-.02em;line-height:1}
.gb-meter-bar{margin-top:10px;height:9px;border-radius:100px;background:#EFEAE3;overflow:hidden}
.gb-meter-fill{display:block;height:100%;border-radius:100px;transition:width .22s var(--ease),background-color .22s var(--ease)}
.gb-meter.is-good .gb-meter-figure{color:var(--green)} .gb-meter.is-good .gb-meter-fill{background:var(--green)}
.gb-meter.is-watch .gb-meter-figure{color:var(--amber)} .gb-meter.is-watch .gb-meter-fill{background:var(--amber)}
.gb-meter.is-high .gb-meter-figure{color:var(--red)} .gb-meter.is-high .gb-meter-fill{background:var(--red)}

    function ownerRewardJourneyV122({rewards=[],birthday=null,loyalty=null,loyaltyModel=null,asOf=null}={}){
  const model=loyalty?.loyalty_model||loyaltyModel||'points';
  const unit=model==='stamps'?'stamps':'points';
  const programmeActive=loyalty?.active===true;
  const asOfMs=Number.isFinite(Date.parse(asOf||''))?Date.parse(asOf):Date.now();
  const compactNumber=value=>Number.isInteger(Number(value))?String(Number(value)):String(Number(value)).replace(/\.0+$/,'');
  const pointsRate=Math.max(0,Number(loyalty?.earn_points_per_dollar||0));
  const stampSpendCents=Math.max(0,Number(loyalty?.stamp_per_cents||0));
  const earning=!loyalty?null:model==='stamps'
    ?{model,unit,rate:stampSpendCents,availableToCustomers:programmeActive,label:`Earn 1 stamp per SGD ${(stampSpendCents/100).toFixed(2)} spent`}
    :{model,unit,rate:pointsRate,availableToCustomers:programmeActive,label:`Earn ${compactNumber(pointsRate)} points per SGD 1 spent`};
  const allRewards=Array.isArray(rewards)?rewards:[];
  const ordered=allRewards
    .filter(reward=>reward?.active!==false)
    .sort((a,b)=>Number(a.cost_points||0)-Number(b.cost_points||0)||Number(a.sort||0)-Number(b.sort||0));
  const milestones=ordered
    .map((reward,index)=>{
      const startsAt=reward.claim_available_from?Date.parse(reward.claim_available_from):null;
      const endsAt=reward.claim_available_until?Date.parse(reward.claim_available_until):null;
      const availability=!loyalty?'programme_unconfigured':!programmeActive?'programme_paused':model==='classic'?'not_current_model'
        :Number.isFinite(startsAt)&&startsAt>asOfMs?'not_started'
        :Number.isFinite(endsAt)&&endsAt<=asOfMs?'ended':'available';
      return {
        id:reward.id||String(index),name:reward.customer_name||reward.name||'Reward',
        threshold:Math.max(0,Number(reward.cost_points||0)),unit,
        additional:index?Math.max(0,Number(reward.cost_points||0)-Number(ordered[index-1]?.cost_points||0)):Math.max(0,Number(reward.cost_points||0)),
        estimatedCostCents:Math.max(0,Number(reward.estimated_cost_cents||0)),
        availability,availableToCustomers:availability==='available'
      };
    });
  const archivedRewards=allRewards.filter(reward=>reward?.active===false)
    .sort((a,b)=>Number(a.sort||0)-Number(b.sort||0)||Number(a.cost_points||0)-Number(b.cost_points||0))
    .map((reward,index)=>({
      id:reward.id||reward.reward_id||`archived-${index}`,
      name:reward.customer_name||reward.name||'Reward',threshold:Math.max(0,Number(reward.cost_points||0)),unit,
      estimatedCostCents:Math.max(0,Number(reward.estimated_cost_cents||0)),active:false
    }));
  const redeemPoints=Math.max(0,Number(loyalty?.redeem_points||0));
  const rewardCreditCents=Math.max(0,Number(loyalty?.reward_credit_cents||0));
  const classicReward=model==='classic'&&redeemPoints>0&&rewardCreditCents>0?{
    id:`classic:${loyalty?.id||'programme'}`,name:'Points redemption',threshold:redeemPoints,unit:'points',
    value:`SGD ${(rewardCreditCents/100).toFixed(2)} store credit`,availableToCustomers:programmeActive
  }:null;
  const birthdayReward=!birthday?null:{
    id:birthday.id||birthday.program_id||'birthday',
    active:birthday.active!==false,
    name:birthday.customer_label||'Birthday reward',
    description:birthday.customer_description||'Available in the configured birthday window.',
    value:birthday.fulfillment_kind==='discount_pct'
      ?`${Number(birthday.discount_percent||0)}% off`
      :birthday.manual_item||'Configured birthday benefit'
  };
  return {model,unit,earning,milestones,archivedRewards,classicReward,birthday:birthdayReward};
}
