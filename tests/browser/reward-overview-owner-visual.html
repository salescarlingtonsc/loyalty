    =await Promise.all([businessRequest,loyaltyRequest,rewardsRequest,productsRequest,

    function ownerRewardJourneyV122({rewards=[],birthday=null,loyalty=null,loyaltyModel=null,asOf=null}={}){
  const model=loyalty?.loyalty_model||loyaltyModel||'points';
  const unit=model==='stamps'?'stamps':'points';
  const programmeActive=loyalty?.active===true;
  const asOfMs=Number.isFinite(Date.parse(asOf||''))?Date.parse(asOf):Date.now();
  const compactNumber=value=>Number.isInteger(Number(value))?String(Number(value)):String(Number(value)).replace(/\.0+$/,'');
  const pointsRate=Math.max(0,Number(loyalty?.earn_points_per_dollar||0));
  const stampSpendCents=Math.max(0,Number(loyalty?.stamp_per_cents||0));
  const earning=!loyalty?null:model==='stamps'
    ?{model,unit,rate:stampSpendCents,availableToCustomers:programmeActive,label:`Earn 1 stamp per SGD ${(stampSpendCents/100).toFixed(2)} spent`}
    :{model,unit,rate:pointsRate,availableToCustomers:programmeActive,label:`Earn ${compactNumber(pointsRate)} points per SGD 1 spent`};
  const allRewards=Array.isArray(rewards)?rewards:[];
  const ordered=allRewards
    .filter(reward=>reward?.active!==false)
    .sort((a,b)=>Number(a.cost_points||0)-Number(b.cost_points||0)||Number(a.sort||0)-Number(b.sort||0));
  const milestones=ordered
    .map((reward,index)=>{
      const startsAt=reward.claim_available_from?Date.parse(reward.claim_available_from):null;
      const endsAt=reward.claim_available_until?Date.parse(reward.claim_available_until):null;
      const availability=!loyalty?'programme_unconfigured':!programmeActive?'programme_paused':model==='classic'?'not_current_model'
        :Number.isFinite(startsAt)&&startsAt>asOfMs?'not_started'
        :Number.isFinite(endsAt)&&endsAt<=asOfMs?'ended':'available';
      return {
        id:reward.id||String(index),name:reward.customer_name||reward.name||'Reward',
        threshold:Math.max(0,Number(reward.cost_points||0)),unit,
        additional:index?Math.max(0,Number(reward.cost_points||0)-Number(ordered[index-1]?.cost_points||0)):Math.max(0,Number(reward.cost_points||0)),
        estimatedCostCents:Math.max(0,Number(reward.estimated_cost_cents||0)),
        availability,availableToCustomers:availability==='available'
      };
    });
  const archivedRewards=allRewards.filter(reward=>reward?.active===false)
    .sort((a,b)=>Number(a.sort||0)-Number(b.sort||0)||Number(a.cost_points||0)-Number(b.cost_points||0))
    .map((reward,index)=>({
      id:reward.id||reward.reward_id||`archived-${index}`,
      name:reward.customer_name||reward.name||'Reward',threshold:Math.max(0,Number(reward.cost_points||0)),unit,
      estimatedCostCents:Math.max(0,Number(reward.estimated_cost_cents||0)),active:false
    }));
  const redeemPoints=Math.max(0,Number(loyalty?.redeem_points||0));
  const rewardCreditCents=Math.max(0,Number(loyalty?.reward_credit_cents||0));
  const classicReward=model==='classic'&&redeemPoints>0&&rewardCreditCents>0?{
    id:`classic:${loyalty?.id||'programme'}`,name:'Points redemption',threshold:redeemPoints,unit:'points',
    value:`SGD ${(rewardCreditCents/100).toFixed(2)} store credit`,availableToCustomers:programmeActive
  }:null;
  const birthdayReward=!birthday?null:{
    id:birthday.id||birthday.program_id||'birthday',
    active:birthday.active!==false,
    name:birthday.customer_label||'Birthday reward',
    description:birthday.customer_description||'Available in the configured birthday window.',
    value:birthday.fulfillment_kind==='discount_pct'
      ?`${Number(birthday.discount_percent||0)}% off`
      :birthday.manual_item||'Configured birthday benefit'
  };
  return {model,unit,earning,milestones,archivedRewards,classicReward,birthday:birthdayReward};
}

      if(kind==='birthday')response=await sb.rpc('ensure_published_birthday_in_draft_v138',{
        p_config_version:draft,p_program:id,p_expected_snapshot_hash:draftSnapshotHash
      });
      else if(kind==='retention')response=await sb.rpc('ensure_published_retention_in_draft_v138',{
        p_config_version:draft,p_program:id,p_expected_snapshot_hash:draftSnapshotHash
      });
      else return true;
      const {data,error}=response;
      if(!isGrowCurrent())return false;
      if(error||data?.program_id!==id){
        panelHost.innerHTML=`<section class="notice warn" role="alert"><b>This ${kind==='birthday'?'birthday benefit':'Bring-back rule'} could not be prepared for editing.</b><p class="small" style="margin-top:5px">Nothing was published. Return to the overview, refresh, and try again.</p><a class="btn ghost sm" href="#/grow" style="margin-top:10px">Back to Grow overview</a></section>`;
        return false;
      }
      draftSnapshotHash=data.snapshot_hash||draftSnapshotHash;
      return true;
    };
    const openExactReward=async({allowMaterialize=true}={})=>{
      if(surface!=='rewards'||!rewardId)return false;
      const editButton=panelHost.querySelector(`.rwEdit[data-reward-id="${CSS.escape(rewardId)}"]`);
      if(!editButton){
        if(!allowMaterialize||!draft||!canSetupGrow){
          const unavailable=document.createElement('div');unavailable.className='notice warn small';unavailable.setAttribute('role','alert');
          unavailable.textContent='This reward could not be prepared for editing. Return to the overview and try again.';
          panelHost.querySelector('#main')?.prepend(unavailable);unavailable.focus?.({preventScroll:true});return false;
        }
        const notice=document.createElement('p');notice.className='notice small';notice.setAttribute('role','status');
        notice.textContent='Preparing this published reward in your editable draft…';
        panelHost.querySelector('#main')?.prepend(notice);
        const {data,error}=await sb.rpc('ensure_published_reward_in_draft_v138',{
          p_config_version:draft,p_reward:rewardId,p_expected_snapshot_hash:draftSnapshotHash
        });
        if(!isGrowCurrent())return false;
        if(error||data?.reward_id!==rewardId){
          notice.className='notice warn small';notice.setAttribute('role','alert');
          notice.innerHTML='The editable copy could not be confirmed. Nothing was published. <button type="button" class="btn ghost sm" id="retryExactReward">Try again</button>';
          $('retryExactReward').onclick=()=>{notice.remove();openExactReward()};
          return false;
        }
        draftSnapshotHash=data.snapshot_hash||draftSnapshotHash;
        await loyaltyPage(undefined,draft,null,false,editorIntent);
        if(!isGrowCurrent())return false;
        return openExactReward({allowMaterialize:false});
      }
      editButton.click();
      const editor=$('rwEditor');
      editor?.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
      $('rwCustomerName')?.focus({preventScroll:true});
      return true;
    };
    const applyPendingRewardEstimate=()=>{
      if(surface!=='rewards'||pendingRewardEstimateCents===null)return false;
      const estimate=$('rwEstimate');
      if(!estimate)return false;
      estimate.value=(pendingRewardEstimateCents/100).toFixed(2);
      estimate.dispatchEvent(new Event('input',{bubbles:true}));
      pendingRewardEstimateCents=null;
      toast('Proposed fulfilment cost added to the editable reward');
      return true;
    };
    if(activeSurface===surface){
      preserveExactRoute();
      if(surface==='winback'&&focusTarget==='rn'){
        if(!await materializeExactProgramme('retention',editProgramId))return;
        await retentionPage(draft,editProgramId,true);
      }
      if(surface==='rewards'){
        if(focusTarget==='birthdayLabel'&&birthdayId
           &&!await materializeExactProgramme('birthday',birthdayId))return;
        await loyaltyPage(undefined,draft,null,false,editorIntent);
      }
      if(!await openExactReward()&&focusTarget)focusGrowTarget(focusTarget,{activate:activateTarget});
      applyPendingRewardEstimate();
      return;
    }
    if((surface==='rewards'&&!canRewards)||(surface==='winback'&&!canWinback))return;
    if(['studio','storedvalue'].includes(surface)&&!isOwner)return;
    activeSurface=surface;
    preserveExactRoute();
    const oldPanel=panelHost.firstElementChild;
    if(oldPanel)oldPanel.remove();
    const panel=document.createElement('section');
    panel.setAttribute('aria-label',definition.label);panel.tabIndex=-1;
    panelHost.append(panel);
    if(outerMain.id==='main')outerMain.removeAttribute('id');
    panel.id='main';
    CUI.announce(definition.label);
    if(surface==='rewards'){
      if(focusTarget==='birthdayLabel'&&birthdayId
         &&!await materializeExactProgramme('birthday',birthdayId))return;
      await loyaltyPage(undefined,draft,null,false,editorIntent);
    }
    else if(surface==='winback'){
      if(editProgramId&&!await materializeExactProgramme('retention',editProgramId))return;
      await retentionPage(draft,editProgramId);
    }
    else if(surface==='storedvalue')await storedValuePage(hashParam||null);
    else await studioPage(draft||hashParam||null);
    const exactRewardOpened=await openExactReward();
    if(!exactRewardOpened&&focusTarget)focusGrowTarget(focusTarget,{activate:activateTarget});
    else if(!exactRewardOpened&&focus&&panel.isConnected)panel.focus({preventScroll:true});
    applyPendingRewardEstimate();
  }
  function openRewardsAutoSetup(action={surface:'rewards',focusTarget:'lm',activateTarget:false}){
    if(!canSetupGrow)return;
    pendingGuideAction=action;
    $('rewardAutoSetupModal')?.remove();
    document.body.insertAdjacentHTML('beforeend',`<div class="modal reward-auto-modal" id="rewardAutoSetupModal" role="dialog" aria-modal="true" aria-labelledby="rewardAutoTitle" tabindex="-1">
      <section class="modal-card reward-auto-dialog"><div class="reward-auto-head"><div><p class="customer-quest-kicker">Simple rewards setup</p><h2 id="rewardAutoTitle">Review the recommended starting point</h2><p class="muted small" style="margin-top:5px">One review, then Peekaa prepares an editable draft.</p></div>
        <button type="button" class="btn ghost sm" id="rewardAutoClose" aria-label="Close automatic rewards setup">Close</button></div>
        <div class="reward-auto-content"><div id="rewardAutoBody"></div><p class="reward-auto-status muted small" id="rewardAutoStatus" role="status" aria-live="polite"></p></div>
        <div class="reward-auto-actions" id="rewardAutoActions"></div></section></div>`);
    const modal=$('rewardAutoSetupModal');
    let busy=false,deactivateDialog=null;
    const close=(restoreFocus=true)=>{
      if(deactivateDialog){const cleanup=deactivateDialog;deactivateDialog=null;cleanup({restoreFocus})}
      else modal.remove();
    };
    const render=()=>{
      const body=$('rewardAutoBody'),actions=$('rewardAutoActions');
      body.innerHTML=`<section class="reward-auto-step reward-auto-review" aria-labelledby="rewardAutoStepTitle"><h3 id="rewardAutoStepTitle">Recommended for more repeat visits</h3><dl class="reward-auto-summary"><div><dt>Business type</dt><dd>${esc(S.biz.industry||'Your business')}</dd></div><div><dt>Draft includes</dt><dd>Earning rule + one return reward</dd></div><div><dt>Price input</dt><dd>Active service and product prices</dd></div></dl><div class="reward-auto-guardrails"><p class="muted small"><b>Real fulfilment cost is not included.</b> Check product cost and profitability before publishing.</p><p class="muted small" style="margin-top:8px">Birthday, Referrals, Memberships and Gift cards are not changed.</p><p class="reward-auto-safety" style="margin-top:12px"><b>Nothing goes live until you review and publish.</b><br>Staff and customers keep using the published programme.</p></div></section>`;
      actions.innerHTML='<button type="button" class="btn ghost" id="rewardAutoCancel">Cancel</button><button type="button" class="btn" id="rewardAutoConfirm">Create draft</button>';
      $('rewardAutoCancel').onclick=()=>close();
      $('rewardAutoConfirm').onclick=confirmDraft;
    };
    const renderReady=data=>{
      const modelLabel=data?.model==='stamps'?'Stamp card':data?.model==='points_tiers'?'Points with milestones':'Simple points';
      const referencePrice=Number.isFinite(Number(data?.reference_price_cents))?money(Number(data.reference_price_cents)):'Calculated from active prices';
      const rawThreshold=data?.suggested_reward_cost;
      const hasThreshold=rawThreshold!==null&&rawThreshold!==undefined&&rawThreshold!=='';
      const thresholdValue=hasThreshold?Number(rawThreshold):Number.NaN,thresholdUnit=data?.model==='stamps'?'stamp':'point';
      const suggestedThreshold=Number.isFinite(thresholdValue)&&thresholdValue>0
        ?`${Math.round(thresholdValue).toLocaleString('en-SG')} ${thresholdUnit}${Math.round(thresholdValue)===1?'':'s'}`
        :'Set in the draft';
      $('rewardAutoTitle').textContent='Recommended draft ready';
      $('rewardAutoBody').innerHTML=`<section class="reward-auto-step" id="rewardAutoReady" aria-labelledby="rewardAutoReadyTitle"><h3 id="rewardAutoReadyTitle">Review these editable settings</h3><dl class="reward-auto-summary"><div><dt>Starting model</dt><dd>${esc(modelLabel)}</dd></div><div><dt>Reference price</dt><dd>${esc(referencePrice)}</dd></div><div><dt>Reward threshold</dt><dd>${esc(suggestedThreshold)}</dd></div></dl><p class="reward-auto-safety" style="margin-top:12px"><b>Nothing was published.</b><br>Review every number before making the programme live.</p></section>`;
      $('rewardAutoStatus').innerHTML=workspaceTemplateHtmlV97('growDraftReady',{});
      $('rewardAutoActions').innerHTML='<button type="button" class="btn ghost" id="rewardAutoDone">Back to overview</button><button type="button" class="btn" id="rewardAutoReviewDraft">Review draft</button>';
      $('rewardAutoDone').onclick=()=>close();
      $('rewardAutoReviewDraft').onclick=async()=>{
        const nextAction=pendingGuideAction||action;pendingGuideAction=null;close(false);
        await mountGrowSurface(nextAction.surface,{draftOverride:growDraftVersionId,...nextAction});
      };
      const setupButton=$('growAutoSetup');if(setupButton)setupButton.textContent='Continue rewards setup';
      $('rewardAutoReviewDraft').focus({preventScroll:true});
    };
    async function confirmDraft(){
      if(busy)return;
      const rewardAutoConfirm=$('rewardAutoConfirm'),status=$('rewardAutoStatus');
      busy=true;rewardAutoConfirm.disabled=true;rewardAutoConfirm.textContent='Creating draft…';
      status.textContent='Preparing one editable draft. Nothing is being published.';
      rewardAutoSetupRequestKey??=crypto.randomUUID();
      recordProductInteractionV100('merchant.grow_draft_started',S.biz.id,{
        context:{action_key:'automatic_rewards_setup',entry_point:'grow_overview',locale:workspaceLocale,surface_version:'v128'}
      });
      try{
        const {data,error}=await sb.rpc('generate_retention_recommendation',{
          p_business:S.biz.id,p_idempotency_key:rewardAutoSetupRequestKey
        });
        if(!modal.isConnected||!isGrowCurrent())return;
        if(error)throw error;
        growDraftVersionId=data?.draft_config_version_id||data?.version_id;
        if(!growDraftVersionId)throw new Error('Editable reward draft was not returned.');
        rewardAutoSetupRequestKey=null;busy=false;renderReady(data);
      }catch(error){
        if(!modal.isConnected)return;
        busy=false;rewardAutoConfirm.disabled=false;rewardAutoConfirm.textContent='Try creating draft again';
        status.textContent='Draft could not be created. Nothing was published. Try again.';
      }
    }
    render();
    deactivateDialog=CUI.activateDialog(modal,{onClose:()=>close(),initialFocus:'#rewardAutoConfirm'});
    $('rewardAutoClose').onclick=()=>close();
  }
  document.querySelectorAll('[data-grow-open]').forEach(button=>button.onclick=()=>mountGrowSurface(button.dataset.growOpen,{
    focusTarget:button.dataset.growFocus||null}));
  const autoSetupButton=$('growAutoSetup');
  if(autoSetupButton)autoSetupButton.onclick=()=>{
    if(growDraftVersionId)return mountGrowSurface('rewards',{draftOverride:growDraftVersionId,focusTarget:'lm'});
    openRewardsAutoSetup();
  };
  document.querySelectorAll('[data-rewards-overview-edit]').forEach(button=>button.onclick=()=>{
    const kind=button.dataset.rewardsOverviewEdit;
    const action=kind==='bringback'
      ?{surface:'winback',focusTarget:'rn',editProgramId:button.dataset.programId||null}
      :{surface:'rewards',focusTarget:kind==='earning'?'lm':kind==='classic'?'lr':kind==='birthday'?'birthdayLabel':kind==='add'?'rwAdd':null,
        activateTarget:kind==='add',rewardId:kind==='catalogue'?button.dataset.rewardId||null:null,
        birthdayId:kind==='birthday'?button.dataset.birthdayId||null:null};
    if(!growDraftVersionId){
      if(action.surface==='winback'&&canSetupWinback){
        (async()=>{
          const {data,error}=await sb.rpc('create_grow_config_draft_v138',{
            p_business:S.biz.id,p_based_on:snapshot.currentVersion,p_source:'grow_retention_edit'
          });
          if(!isGrowCurrent())return;
          if(error||!data?.version_id)return fail(error||new Error('Editable Bring-back draft was not returned.'));
          growDraftVersionId=data.version_id;
          draftSnapshotHash=data.snapshot_hash||draftSnapshotHash;
          await mountGrowSurface(action.surface,{draftOverride:growDraftVersionId,...action});
        })();
        return;
      }
      openRewardsAutoSetup(action);return
    }
    mountGrowSurface(action.surface,{draftOverride:growDraftVersionId,...action});
  });
  const growRewardsRetry=$('growRewardsRetry');
  if(growRewardsRetry)growRewardsRetry.onclick=()=>growPage(routedSurface,hashParam,routedFocus);
  document.querySelectorAll('[data-reward-cost]').forEach(input=>input.addEventListener('input',()=>{
    const productId=input.dataset.rewardCost;
    const card=input.closest('[data-product-profitability]');
    const status=card?.querySelector(`[data-profit-after-reward="${CSS.escape(productId)}"]`);
    const raw=String(input.value||'').trim();
    if(!status)return;
    if(!/^\d+(?:\.\d{1,2})?$/.test(raw)){
      status.textContent='Enter a reward cost, for example 9.00.';return;
    }
    const calculation=productProfitabilityV122({
      priceCents:Number(card.dataset.priceCents),
      costCents:Number(card.dataset.costCents),
      rewardCostCents:Math.round(Number(raw)*100)
    });
    status.textContent=[
      'Reward cost ',money(calculation.rewardCostCents),' leaves ',
      money(calculation.profitAfterRewardCents),' profit after reward.'
    ].join('');
    status.style.color=calculation.profitableAfterReward?'':'var(--red)';
  }));
  document.querySelectorAll('[data-reward-cost-use]').forEach(button=>button.onclick=()=>{
    const productId=button.dataset.rewardCostUse;
    const input=document.querySelector(`[data-reward-cost="${CSS.escape(productId)}"]`);
    const raw=String(input?.value||'').trim();
    if(!/^\d+(?:\.\d{1,2})?$/.test(raw))return toast('Enter a valid proposed reward cost first');
    pendingRewardEstimateCents=Math.round(Number(raw)*100);
    const action={surface:'rewards',focusTarget:'rwAdd',activateTarget:true};
    if(!growDraftVersionId){
      openRewardsAutoSetup(action);
      return;
    }
    mountGrowSurface(action.surface,{draftOverride:growDraftVersionId,...action});
  });
  /* A deep link is a deliberate request to open an engine. The normal #/loyalty and
     #/retention destinations stop at this overview, so ordinary Grow use stays coherent. */
  if((routedAction&&isOwner)||(hashParam&&isOwner)||['studio','storedvalue'].includes(routedSurface)){
    const initialAction=routedAction||{surface:routedSurface};
    await mountGrowSurface(initialAction.surface,{focus:false,draftOverride:hashParam||growDraftVersionId,...initialAction});
  }
}

      title:$('rewardJourneyTitle')?.textContent||'',cards:[...document.querySelectorAll('.grow-programme-row')].map(card=>({tag:card.tagName,programmeKind:card.dataset.programmeKind||null,kind:card.dataset.rewardsOverviewEdit||null,rewardId:card.dataset.rewardId||null,programId:card.dataset.programId||null,href:card.getAttribute('href'),height:card.getBoundingClientRect().height,width:card.getBoundingClientRect().width,text:card.textContent.trim()})),
      editButtons:document.querySelectorAll('[data-rewards-overview-edit]').length,openedRewardId:window.__openedRewardId||null,
