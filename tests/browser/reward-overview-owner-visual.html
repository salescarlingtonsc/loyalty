    ?sb.from('loyalty_programs').select('id,active,loyalty_model,current_config_version_id,earn_points_per_dollar,redeem_points,reward_credit_cents,stamp_per_cents,expiry_mode,expiry_days').eq('business_id',S.biz.id).limit(1)
    :Promise.resolve(none);
  const rewardsRequest=canRewards
    ?sb.from('loyalty_rewards').select('id,active,customer_name,name,cost_points,estimated_cost_cents,sort,claim_available_from,claim_available_until').eq('business_id',S.biz.id).order('sort')
    :Promise.resolve(none);
  const productsRequest=S.myRole==='owner'
    ?sb.rpc('owner_list_reward_profitability_products_v122',{p_business:S.biz.id})
    :Promise.resolve(none);
  const [{data:business,error:businessError},{data:loyalty,error:loyaltyError},
    {data:rewards,error:rewardsError},{data:products,error:productsError}]
    =await Promise.all([businessRequest,loyaltyRequest,rewardsRequest,productsRequest]);
  if(!isCurrent())return null;
  if(businessError)throw businessError;
  const currentVersion=business?.active_config_version_id||null;
  const retentionRequest=canWinback&&currentVersion
    ?sb.from('retention_programs').select('id,active').eq('business_id',S.biz.id)
      .eq('current_config_version_id',currentVersion)
    :Promise.resolve(none);
  const birthdayRequest=canRewards&&currentVersion
    ?sb.rpc('get_active_birthday_program',{p_business_id:S.biz.id})
    :Promise.resolve(none);
  let draftRequest=Promise.resolve(none);
  if(canSetupGrow){
    let query=sb.from('firm_config_versions').select('id,version_no,based_on_version_id,status')
      .eq('business_id',S.biz.id).eq('status','draft');
    query=currentVersion?query.eq('based_on_version_id',currentVersion):query.is('based_on_version_id',null);
    draftRequest=query.order('version_no',{ascending:false}).limit(1);
  }
  const [{data:retention,error:retentionError},{data:drafts,error:draftError},
    {data:birthday,error:birthdayError}]
    =await Promise.all([retentionRequest,draftRequest,birthdayRequest]);
  if(!isCurrent())return null;
  /* Overview reads are intentionally fail-soft. A missing optional engine must not hide the
     rest of Grow; its node reports Needs setup while its dedicated surface keeps the full error. */
  return {
    currentVersion,
    asOf:birthdayError?null:birthday?.as_of||null,
    loyalty:loyaltyError?null:(loyalty||[])[0]||null,
    rewards:rewardsError?[]:rewards||[],
    products:productsError?[]:(Array.isArray(products?.items)?products.items:[]),
    birthday:birthdayError?null:(Array.isArray(birthday?.programs)?birthday.programs[0]:null)||null,
    retention:retentionError?[]:retention||[],
    draft:draftError?null:(drafts||[])[0]||null,
    overviewErrors:{loyalty:Boolean(loyaltyError),rewards:Boolean(rewardsError),birthday:Boolean(birthdayError)}
  };
}
    function ownerRewardJourneyV122({rewards=[],birthday=null,loyalty=null,loyaltyModel=null,asOf=null}={}){
  const model=loyalty?.loyalty_model||loyaltyModel||'points';
  const unit=model==='stamps'?'stamps':'points';
  const programmeActive=loyalty?.active===true;
  const asOfMs=Number.isFinite(Date.parse(asOf||''))?Date.parse(asOf):Date.now();
  const compactNumber=value=>Number.isInteger(Number(value))?String(Number(value)):String(Number(value)).replace(/\.0+$/,'');
  const pointsRate=Math.max(0,Number(loyalty?.earn_points_per_dollar||0));
  const stampSpendCents=Math.max(0,Number(loyalty?.stamp_per_cents||0));
  const earning=!loyalty?null:model==='stamps'
    ?{model,unit,rate:stampSpendCents,availableToCustomers:programmeActive,label:`Earn 1 stamp per SGD ${(stampSpendCents/100).toFixed(2)} spent`}
    :{model,unit,rate:pointsRate,availableToCustomers:programmeActive,label:`Earn ${compactNumber(pointsRate)} points per SGD 1 spent`};
  const allRewards=Array.isArray(rewards)?rewards:[];
  const ordered=allRewards
    .filter(reward=>reward?.active!==false)
    .sort((a,b)=>Number(a.cost_points||0)-Number(b.cost_points||0)||Number(a.sort||0)-Number(b.sort||0));
  const milestones=ordered
    .map((reward,index)=>{
      const startsAt=reward.claim_available_from?Date.parse(reward.claim_available_from):null;
      const endsAt=reward.claim_available_until?Date.parse(reward.claim_available_until):null;
      const availability=!loyalty?'programme_unconfigured':!programmeActive?'programme_paused':model==='classic'?'not_current_model'
        :Number.isFinite(startsAt)&&startsAt>asOfMs?'not_started'
        :Number.isFinite(endsAt)&&endsAt<=asOfMs?'ended':'available';
      return {
        id:reward.id||String(index),name:reward.customer_name||reward.name||'Reward',
        threshold:Math.max(0,Number(reward.cost_points||0)),unit,
        additional:index?Math.max(0,Number(reward.cost_points||0)-Number(ordered[index-1]?.cost_points||0)):Math.max(0,Number(reward.cost_points||0)),
        estimatedCostCents:Math.max(0,Number(reward.estimated_cost_cents||0)),
        availability,availableToCustomers:availability==='available'
      };
    });
  const archivedRewards=allRewards.filter(reward=>reward?.active===false)
    .sort((a,b)=>Number(a.sort||0)-Number(b.sort||0)||Number(a.cost_points||0)-Number(b.cost_points||0))
    .map((reward,index)=>({
      id:reward.id||reward.reward_id||`archived-${index}`,
      name:reward.customer_name||reward.name||'Reward',threshold:Math.max(0,Number(reward.cost_points||0)),unit,
      estimatedCostCents:Math.max(0,Number(reward.estimated_cost_cents||0)),active:false
    }));
  const redeemPoints=Math.max(0,Number(loyalty?.redeem_points||0));
  const rewardCreditCents=Math.max(0,Number(loyalty?.reward_credit_cents||0));
  const classicReward=model==='classic'&&redeemPoints>0&&rewardCreditCents>0?{
    id:`classic:${loyalty?.id||'programme'}`,name:'Points redemption',threshold:redeemPoints,unit:'points',
    value:`SGD ${(rewardCreditCents/100).toFixed(2)} store credit`,availableToCustomers:programmeActive
  }:null;
  const birthdayReward=!birthday?null:{
    id:birthday.id||birthday.program_id||'birthday',
    active:birthday.active!==false,
    name:birthday.customer_label||'Birthday reward',
    description:birthday.customer_description||'Available in the configured birthday window.',
    value:birthday.fulfillment_kind==='discount_pct'
      ?`${Number(birthday.discount_percent||0)}% off`
      :birthday.manual_item||'Configured birthday benefit'
  };
  return {model,unit,earning,milestones,archivedRewards,classicReward,birthday:birthdayReward};
}

          <button type="button" class="btn ghost sm" data-grow-guide="rewards" data-grow-focus="loyaltyAudienceSettings">Edit who and when</button></div>
        <div class="grow-guide-step"><b>3. Reward</b><p>Set the customer promise and the fulfilment your team will deliver.</p>
          <button type="button" class="btn ghost sm" data-grow-guide="rewards" data-grow-focus="rwAdd">Edit reward</button></div>
        <div class="grow-guide-step"><b>4. Review and save draft</b><p>Check the full customer journey. Publishing remains a separate protected action.</p>
          <button type="button" class="btn ghost sm" data-grow-guide="studio" data-grow-focus="studioPublish" data-grow-activate="true">Review draft</button></div>
        <p class="grow-draft-note" id="growDraftNote" role="status" aria-live="polite">${growDraftVersionId?
          workspaceTemplateHtmlV97('growDraftReady',{version:snapshot.draft?.version_no||''}):
          'Start once, then edit the shared draft in any order.'}</p>
      </div></details>`:''}
    ${optionalTools.length?`<section aria-labelledby="growOptionalTitle"><div class="grow-section-heading">
      <div><h2 id="growOptionalTitle">Optional growth tools</h2><p class="muted small">Add another growth loop only when it supports your programme.</p></div></div>
      <div class="grow-optional">${optionalTools.map(tool=>`<article class="grow-optional-card"><div>
        <b>${CUI.icon(tool.icon,{size:17})} ${esc(tool.title)}</b><p>${esc(tool.copy)}</p></div>
        <a class="btn ghost sm" href="#/${tool.key}">Open</a></article>`).join('')}</div></section>`:''}
    ${isOwner?`<details class="grow-advanced" id="growAdvanced" ${['studio','storedvalue'].includes(routedSurface)?'open':''}>
      <summary>Advanced tools</summary>
      <p class="muted small">Technical programme authoring, taxonomy, versions and rollback, and stored-value controls stay separate from everyday Grow setup.</p>
      <div class="grow-advanced-actions">
        <button type="button" class="btn ghost" data-grow-open="studio">Program Studio</button>
        <button type="button" class="btn ghost" data-grow-open="storedvalue">Stored value</button>
        ${canRewards?'<button type="button" class="btn ghost" data-grow-open="rewards">Rewards and versions</button>':''}
        ${canWinback?'<button type="button" class="btn ghost" data-grow-open="winback">Bring-back rules and taxonomy</button>':''}
      </div></details>`:''}
    <section class="grow-panel-shell" id="growpanelhost" aria-live="polite"></section>
  </div>`;
  localizeWorkspaceSubtreeV97(outerMain);
  document.querySelectorAll('[data-product-cost-save]').forEach(button=>button.onclick=async()=>{
    const productId=button.dataset.productCostSave;
    const input=document.querySelector(`[data-product-cost="${CSS.escape(productId)}"]`);
    const raw=String(input?.value||'').trim();
    if(!/^\d+(?:\.\d{1,2})?$/.test(raw))return toast('Enter a product cost, for example 24.00');
    const costCents=Math.round(Number(raw)*100);
    if(costCents<0||costCents>2147483647)return toast('Product cost is outside the supported range');
    button.disabled=true;
    const expectedRaw=button.dataset.expectedCost;
    const {data,error}=await sb.rpc('owner_set_product_cost_v122',{
      p_business:S.biz.id,p_product:productId,p_cost_cents:costCents,
      p_expected_cost_cents:expectedRaw===''?null:Number(expectedRaw)
    });
    if(!isGrowCurrent())return;
    if(error||data?.id!==productId){
      button.disabled=false;
      return fail(error||new Error('Product cost was not confirmed. Nothing was changed.'));
    }
    toast('Product cost saved');
    await growPage(routedSurface,hashParam);
  });
  const panelHost=$('growpanelhost');
  let activeSurface=null,preparingDraft=false,pendingGuideAction=null,pendingRewardEstimateCents=null;
  const surfaceDefinition={
    rewards:{hash:'#/loyalty',label:'Rewards and earning'},
    winback:{hash:'#/retention',label:'Bring-back rules'},
    studio:{hash:'#/studio',label:'Program Studio'},
    storedvalue:{hash:'#/storedvalue',label:'Stored value'}
  };
  const focusGrowTarget=(target,{activate=false}={})=>{
    const element=target?$(target):null;
    if(!element)return false;
    if(activate){element.click();return true}
    if(element.tagName==='DETAILS')element.open=true;
    element.focus?.({preventScroll:true});
    element.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
    return true;
  };
  async function mountGrowSurface(surface,{focus=true,draftOverride=null,focusTarget=null,activateTarget=false,rewardId=null}={}){
    const openExactReward=()=>{
      if(surface!=='rewards'||!rewardId)return false;
      const editButton=panelHost.querySelector(`.rwEdit[data-reward-id="${CSS.escape(rewardId)}"]`);
      if(!editButton){
        const notice=document.createElement('p');notice.className='notice warn small';notice.setAttribute('role','status');
        notice.textContent='This published reward is not present in the current draft. Review the draft before changing another reward.';
        panelHost.querySelector('#main')?.prepend(notice);notice.focus?.({preventScroll:true});return false;
      }
      editButton.click();
      const editor=$('rwEditor');
      editor?.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
      $('rwCustomerName')?.focus({preventScroll:true});
      return true;
    };
    const applyPendingRewardEstimate=()=>{
      if(surface!=='rewards'||pendingRewardEstimateCents===null)return false;
      const estimate=$('rwEstimate');
      if(!estimate)return false;
      estimate.value=(pendingRewardEstimateCents/100).toFixed(2);
      estimate.dispatchEvent(new Event('input',{bubbles:true}));
      pendingRewardEstimateCents=null;
      toast('Proposed fulfilment cost added to the editable reward');
      return true;
    };
    if(activeSurface===surface){
      if(!openExactReward()&&focusTarget)focusGrowTarget(focusTarget,{activate:activateTarget});
      applyPendingRewardEstimate();
      return;
    }
    if((surface==='rewards'&&!canRewards)||(surface==='winback'&&!canWinback))return;
    if(['studio','storedvalue'].includes(surface)&&!isOwner)return;
    activeSurface=surface;
    const definition=surfaceDefinition[surface],draft=draftOverride||growDraftVersionId;
    const suffix=draft&&['rewards','winback','studio'].includes(surface)?`/${draft}`:'';
    history.replaceState(null,'',`${location.pathname}${location.search}${definition.hash}${suffix}`);
    const oldPanel=panelHost.firstElementChild;
    if(oldPanel)oldPanel.remove();
    const panel=document.createElement('section');
    panel.setAttribute('aria-label',definition.label);panel.tabIndex=-1;
    panelHost.append(panel);
    if(outerMain.id==='main')outerMain.removeAttribute('id');
    panel.id='main';
    CUI.announce(definition.label);
    if(surface==='rewards')await loyaltyPage(undefined,draft);
    else if(surface==='winback')await retentionPage(draft);
    else if(surface==='storedvalue')await storedValuePage(hashParam||null);
    else await studioPage(draft||hashParam||null);
    const exactRewardOpened=openExactReward();
    if(!exactRewardOpened&&focusTarget)focusGrowTarget(focusTarget,{activate:activateTarget});
    else if(!exactRewardOpened&&focus&&panel.isConnected)panel.focus({preventScroll:true});
    applyPendingRewardEstimate();
  }
  document.querySelectorAll('[data-grow-open]').forEach(button=>button.onclick=()=>mountGrowSurface(button.dataset.growOpen,{
    focusTarget:button.dataset.growFocus||null}));
  document.querySelectorAll('[data-grow-guide]').forEach(button=>button.onclick=()=>{
    const action={surface:button.dataset.growGuide,focusTarget:button.dataset.growFocus||null,
      activateTarget:button.dataset.growActivate==='true'};
    if(!growDraftVersionId){pendingGuideAction=action;setupButton?.click();return}
    mountGrowSurface(action.surface,{draftOverride:growDraftVersionId,...action});
  });
  const setupButton=$('growSetupPrimary');
  document.querySelectorAll('[data-rewards-overview-edit]').forEach(button=>button.onclick=()=>{
    const kind=button.dataset.rewardsOverviewEdit;
    const action={surface:'rewards',focusTarget:kind==='earning'?'lm':kind==='classic'?'lr':kind==='birthday'?'birthdayLabel':kind==='add'?'rwAdd':null,
      activateTarget:kind==='add',rewardId:kind==='catalogue'?button.dataset.rewardId||null:null};
    if(!growDraftVersionId){pendingGuideAction=action;setupButton?.click();return}
    mountGrowSurface(action.surface,{draftOverride:growDraftVersionId,...action});
  });
  const growRewardsRetry=$('growRewardsRetry');
  if(growRewardsRetry)growRewardsRetry.onclick=()=>growPage(routedSurface,hashParam);
  if(setupButton)setupButton.onclick=async()=>{
    if(preparingDraft)return;
    recordProductInteractionV100('merchant.grow_draft_started',S.biz.id,{
      context:{action_key:growDraftVersionId?'continue_existing_draft':'prepare_new_draft',
        entry_point:'grow_overview',locale:workspaceLocale,surface_version:'v100'}
    });
    preparingDraft=true;setupButton.disabled=true;
    const priorLabel=setupButton.textContent;
    setupButton.textContent=growDraftVersionId?'Opening draft…':'Preparing editable draft…';
    const note=$('growDraftNote');if(note)note.textContent='Preparing one editable draft. Nothing is being published.';
    try{
      if(!growDraftVersionId){
        const prepareRewardsDraft=pendingGuideAction?.surface==='rewards'||!canWinback;
        const recommendation=snapshot.currentVersion&&!prepareRewardsDraft
          ?await sb.rpc('generate_retention_recommendation',{p_business:S.biz.id,p_idempotency_key:crypto.randomUUID()})
          :await sb.rpc('create_loyalty_config_draft',{
            p_business:S.biz.id,p_based_on:snapshot.currentVersion||null,
            p_source:prepareRewardsDraft?'owner_rewards_overview':'grow_overview'});
        const {data,error}=recommendation;
        if(!isGrowCurrent())return;
        if(error)throw error;
        growDraftVersionId=data?.draft_config_version_id||data?.version_id;
        if(!growDraftVersionId)throw new Error('Grow draft was not returned. Nothing was changed.');
      }
      setupButton.textContent='Continue Grow setup';
      const guide=$('growSetupGuide');if(guide)guide.open=true;
      if(note)note.textContent='Draft prepared. Review the full journey before publishing.';
      const action=pendingGuideAction||{surface:'rewards',focusTarget:'lm',activateTarget:false};
      pendingGuideAction=null;
      await mountGrowSurface(action.surface,{draftOverride:growDraftVersionId,...action});
      if(setupButton.isConnected)setupButton.disabled=false;
    }catch(error){
      setupButton.disabled=false;setupButton.textContent=priorLabel;
      if(note)note.textContent='Grow setup could not be prepared. Nothing was changed.';
      fail(error);
    }finally{preparingDraft=false}
  };
  document.querySelectorAll('[data-reward-cost]').forEach(input=>input.addEventListener('input',()=>{
    const productId=input.dataset.rewardCost;
    const card=input.closest('[data-product-profitability]');
    const status=card?.querySelector(`[data-profit-after-reward="${CSS.escape(productId)}"]`);
    const raw=String(input.value||'').trim();
    if(!status)return;
    if(!/^\d+(?:\.\d{1,2})?$/.test(raw)){
      status.textContent='Enter a reward cost, for example 9.00.';return;
    }
    const calculation=productProfitabilityV122({
      priceCents:Number(card.dataset.priceCents),
      costCents:Number(card.dataset.costCents),
      rewardCostCents:Math.round(Number(raw)*100)
    });
    status.textContent=[
      'Reward cost ',money(calculation.rewardCostCents),' leaves ',
      money(calculation.profitAfterRewardCents),' profit after reward.'
    ].join('');
    status.style.color=calculation.profitableAfterReward?'':'var(--red)';
  }));
  document.querySelectorAll('[data-reward-cost-use]').forEach(button=>button.onclick=()=>{
    const productId=button.dataset.rewardCostUse;
    const input=document.querySelector(`[data-reward-cost="${CSS.escape(productId)}"]`);
    const raw=String(input?.value||'').trim();
    if(!/^\d+(?:\.\d{1,2})?$/.test(raw))return toast('Enter a valid proposed reward cost first');
    pendingRewardEstimateCents=Math.round(Number(raw)*100);
    const action={surface:'rewards',focusTarget:'rwAdd',activateTarget:true};
    if(!growDraftVersionId){
      pendingGuideAction=action;
      setupButton?.click();
      return;
    }
    mountGrowSurface(action.surface,{draftOverride:growDraftVersionId,...action});
  });
  /* A deep link is a deliberate request to open an engine. The normal #/loyalty and
     #/retention destinations stop at this overview, so ordinary Grow use stays coherent. */
  if((hashParam&&isOwner)||['studio','storedvalue'].includes(routedSurface)){
    await mountGrowSurface(routedSurface,{focus:false,draftOverride:hashParam||growDraftVersionId});
  }
}
    window.rewardOverviewMetrics=()=>({sourceHash:'0182cb17b13417c9a89de0165374554857fbf001c22cb3a1903aa32ad4b2a33e',role:S.myRole,
      viewport:{clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth},
      title:$('rewardJourneyTitle')?.textContent||'',cards:[...document.querySelectorAll('.rewards-overview-card')].map(card=>({tag:card.tagName,kind:card.dataset.rewardsOverviewEdit||null,rewardId:card.dataset.rewardId||null,height:card.getBoundingClientRect().height,width:card.getBoundingClientRect().width,text:card.textContent.trim()})),
      editButtons:document.querySelectorAll('[data-rewards-overview-edit]').length,openedRewardId:window.__openedRewardId||null,
      birthdayRpcCalls:window.__rpcCalls.filter(name=>name==='get_active_birthday_program').length,
      birthdayTableReads:window.__tableReads.filter(name=>name==='birthday_program_versions').length,
      activeElement:document.activeElement?.id||'',consoleErrors:window.__consoleErrors||[]});
    window.__consoleErrors=[];window.addEventListener('error',event=>window.__consoleErrors.push(event.message));
    growPage('overview',null).catch(error=>{window.__consoleErrors.push(String(error?.stack||error));document.body.dataset.renderError='true'});
    </script></body></html>
