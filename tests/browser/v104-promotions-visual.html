/* ============================================================================
   Frenly design system v2 — "mockup layout, iOS polish" (owner ruling 2026-07-18)
   Principles: 8pt grid · SF-grade type with tight optical tracking · hairline
   borders instead of heavy strokes · layered low-opacity shadows (never one big
   blur) · frosted glass on floating surfaces · springy motion on interaction.

   generic web dashboard.

:root{

  --shadow-lg:0 2px 6px rgba(23,22,26,.05),0 18px 44px rgba(23,22,26,.10);
  --spring:cubic-bezier(.34,1.4,.64,1);

}

<div class="wallet-shell customer-shell"><div class="wallet-inner">

<script>
const PRODUCTION_SOURCE_SHA256="deb6d6b0a02203c7a48e09ebce2e3078e9e4fea46db6ee84ea697c32bf2eebd2";
const FIXTURE_LONG_TOKEN="NESTLY-NDP-2026-SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30-HTTPS-EXAMPLE-COM-PROMOTIONS-SPA-RITUAL-60";
const FIXTURE_OFFERS=[{"id":"11111111-1111-4111-8111-111111111111","name":"National Day: 30% off Spa Ritual 60","description":"Celebrate National Day with 30% off Spa Ritual 60 at Glow Atelier. Book now to enjoy this offer.","terms":"One redemption per customer. Advance booking required.","image_url":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%201200%20800%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20stop-color%3D%22%23ed6154%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23ffb56d%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%221200%22%20height%3D%22800%22%20fill%3D%22url(%23g)%22%2F%3E%3Ccircle%20cx%3D%22950%22%20cy%3D%22160%22%20r%3D%22210%22%20fill%3D%22white%22%20fill-opacity%3D%22.13%22%2F%3E%3Ccircle%20cx%3D%22210%22%20cy%3D%22650%22%20r%3D%22260%22%20fill%3D%22white%22%20fill-opacity%3D%22.09%22%2F%3E%3C%2Fsvg%3E","image_alt":"National Day spa treatment promotion","starts_at":"2026-08-01T00:00:00+08:00","ends_at":"2026-08-30T23:59:59+08:00","metadata":{"offer_facts":"30% off Spa Ritual 60","cta":{"kind":"book","label":"Book now"}}},{"id":"22222222-2222-4222-8222-222222222222","name":"Weekday facial upgrade","description":"Use coupon NESTLY-NDP-2026-SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30-HTTPS-EXAMPLE-COM-PROMOTIONS-SPA-RITUAL-60","terms":"Show this exact code at the counter: NESTLY-NDP-2026-SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30-HTTPS-EXAMPLE-COM-PROMOTIONS-SPA-RITUAL-60","image_url":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%201200%20800%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20stop-color%3D%22%2330234f%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%238b74cc%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%221200%22%20height%3D%22800%22%20fill%3D%22url(%23g)%22%2F%3E%3Ccircle%20cx%3D%22950%22%20cy%3D%22160%22%20r%3D%22210%22%20fill%3D%22white%22%20fill-opacity%3D%22.13%22%2F%3E%3Ccircle%20cx%3D%22210%22%20cy%3D%22650%22%20r%3D%22260%22%20fill%3D%22white%22%20fill-opacity%3D%22.09%22%2F%3E%3C%2Fsvg%3E","image_alt":"Weekday facial promotion","starts_at":"2026-08-15T00:00:00+08:00","ends_at":"2026-09-15T23:59:59+08:00","metadata":{"offer_facts":"Coupon NESTLY-NDP-2026-SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30SAVE30-HTTPS-EXAMPLE-COM-PROMOTIONS-SPA-RITUAL-60","cta":{"kind":"programme","label":"View details"}}}];
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const customerMediaUrlV95=value=>String(value||'');
const CUI={activateDialog(modal,{onClose,initialFocus}={}){
  const keydown=event=>{if(event.key==='Escape'){event.preventDefault();onClose?.()}};
  document.addEventListener('keydown',keydown);
  requestAnimationFrame(()=>modal.querySelector(initialFocus)?.focus());
  return ()=>{document.removeEventListener('keydown',keydown);modal.remove()};
}};
function promotionDateTextV104(value){
  if(!value)return '';
  const instant=/^\d{4}-\d{2}-\d{2}$/.test(String(value))
    ?new Date(`${value}T12:00:00+08:00`):new Date(value);
  return new Intl.DateTimeFormat('en-SG',{timeZone:'Asia/Singapore',day:'numeric',month:'long',year:'numeric'}).format(instant);
}
function customerPromotionCtaV104(item,business,bookingEnabled){
  const metadata=item?.metadata||{},cta=metadata.cta||{},
    requestedKind=String(cta.kind||metadata.cta_kind||'programme'),
    kind=requestedKind==='book'&&!bookingEnabled?'programme':requestedKind;
  const configured=String(cta.label||metadata.cta_label||'').trim();
  if(kind==='book'&&bookingEnabled){
    return `<a class="btn sm" href="#/b/${encodeURIComponent(business.slug||'')}">${esc(configured||'Book now')}</a>`;
  }
  if(kind==='counter'){
    return `<button class="btn sm" type="button" data-promotion-counter>${esc(configured||'Show at counter')}</button>`;
  }
  const label=requestedKind==='book'&&!bookingEnabled?'View details':configured||'View details';
  return `<button class="btn sm" type="button" data-promotion-details>${esc(label)}</button>`;
}
function customerPromotionValidityV104(item={}){
  const starts=promotionDateTextV104(item.starts_at),ends=promotionDateTextV104(item.ends_at);
  if(starts&&ends)return `Valid ${starts} – ${ends}`;
  if(ends)return `Valid until ${ends}`;
  return starts?`Valid from ${starts}`:'';
}
function customerPromotionCardV104(item,business,bookingEnabled){
  const image=customerMediaUrlV95(item?.image_url),
    validity=customerPromotionValidityV104(item),
    facts=String(item?.metadata?.offer_facts||'').trim(),
    terms=String(item?.terms||'').trim();
  return `<article class="customer-promotion-card" data-promotion-id="${esc(item?.id||'')}">
    ${image?`<div class="customer-promotion-card-media"><img src="${esc(image)}" alt="${esc(item?.image_alt||item?.imageAlt||item?.name||'Promotion')}" loading="eager"></div>`:''}
    <div class="customer-promotion-card-copy">
      <p class="customer-quest-kicker">Limited-time offer</p>
      <h3>${esc(item?.name||'Latest offer')}</h3>
      ${item?.tagline||item?.description?`<p>${esc(item.tagline||item.description)}</p>`:''}
      ${validity?`<p class="customer-promotion-validity">${esc(validity)}</p>`:''}
      <div class="customer-promotion-card-actions">
        ${customerPromotionCtaV104(item,business,bookingEnabled)}
        ${terms?`<details><summary class="small">Terms</summary><p class="small" style="margin-top:6px">${esc(terms)}</p></details>`:''}
      </div>
      <p class="small" data-promotion-status role="status" aria-live="polite" style="margin-top:8px"></p>
      <template data-promotion-details-template>
        <p>${esc(item?.description||item?.tagline||facts||item?.name||'Latest offer')}</p>
        <dl class="customer-promotion-detail-list">
          ${facts?`<div><dt>Offer</dt><dd>${esc(facts)}</dd></div>`:''}
          ${validity?`<div><dt>Validity</dt><dd>${esc(validity)}</dd></div>`:''}
          ${terms?`<div><dt>Terms</dt><dd>${esc(terms)}</dd></div>`:''}
        </dl>
        <p class="muted small">Show these details to the team when you visit.</p>
      </template>
    </div>
  </article>`;
}
function openCustomerPromotionDetailsV104(card){
  const template=card?.querySelector('template[data-promotion-details-template]');
  if(!template)return;
  $('customerPromotionDetailsModal')?.remove();
  const title=card.querySelector('h3')?.textContent?.trim()||'Offer details';
  document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="customerPromotionDetailsModal" role="dialog" aria-modal="true" aria-labelledby="customerPromotionDetailsTitle" tabindex="-1"><div class="modal-card" style="max-width:520px">
    <div class="row"><h2 id="customerPromotionDetailsTitle">${esc(title)}</h2><span class="spacer"></span><button type="button" class="btn ghost sm" id="customerPromotionDetailsClose">Close</button></div>
    <div style="margin-top:16px">${template.innerHTML}</div>
    <button type="button" class="btn" id="customerPromotionDetailsDone" style="margin-top:18px">Done</button>
  </div></div>`);
  let deactivate;
  const close=()=>{if(deactivate)deactivate();else $('customerPromotionDetailsModal')?.remove()};
  deactivate=CUI.activateDialog($('customerPromotionDetailsModal'),{
    onClose:close,initialFocus:'#customerPromotionDetailsClose'
  });
  $('customerPromotionDetailsClose').onclick=$('customerPromotionDetailsDone').onclick=close;
}
function showCustomerPromotionPopupV122({business,businessSlug,items=[],prompt=null}={}){
  if(!prompt?.event_id||!prompt?.promotion_id||!businessSlug||!Array.isArray(items))return false;
  const promotionId=String(prompt.promotion_id);
  const item=items.find(candidate=>String(candidate?.id||'')===promotionId);
  if(!item||$('customerPromotionPopupV122'))return false;
  const endingSoon=prompt.source_kind==='v122_promotion_expiry';
  document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="customerPromotionPopupV122" role="dialog" aria-modal="true" aria-labelledby="customerPromotionPopupTitle" tabindex="-1"><div class="modal-card customer-promotion-popup-card">
    <p class="customer-quest-kicker">${endingSoon?'Ending soon':'New promotion'} · ${esc(business?.name||'Your programme')}</p>
    <h2 id="customerPromotionPopupTitle" style="margin-top:7px">${esc(item.name||'Latest offer')}</h2>
    <p class="muted" style="margin-top:8px">${esc(item.description||item.tagline||item?.metadata?.offer_facts||'Open the programme to see this promotion.')}</p>
    <p class="small" style="margin-top:10px">${esc(customerPromotionValidityV104(item))}</p>
    <div class="row" style="margin-top:18px"><button type="button" class="btn" data-promotion-popup-view>View offer</button><button type="button" class="btn ghost" data-promotion-popup-dismiss>Not now</button></div>
    <p class="muted small" data-promotion-popup-status role="status" aria-live="polite" style="margin-top:9px"></p>
  </div></div>`);
  const dialog=$('customerPromotionPopupV122');
  let deactivate,closing=false;
  const operationKeys={read:crypto.randomUUID(),dismiss:crypto.randomUUID()};
  const close=async(operation='dismiss',afterClose=null)=>{
    if(closing)return;
    closing=true;
    dialog.querySelectorAll('button').forEach(button=>button.disabled=true);
    const {error}=await sb.rpc('customer_set_in_app_inbox_state',{
      p_business_slug:businessSlug,p_event_id:prompt.event_id,
      p_operation:operation,p_idempotency_key:operationKeys[operation]
    });
    if(error){
      closing=false;
      dialog.querySelectorAll('button').forEach(button=>button.disabled=false);
      const status=dialog.querySelector('[data-promotion-popup-status]');
      if(status)status.textContent='This promotion could not be dismissed. Check your connection and try again.';
      return;
    }
    if(deactivate)deactivate();else dialog?.remove();
    afterClose?.();
  };
  deactivate=CUI.activateDialog(dialog,{onClose:()=>close('dismiss'),initialFocus:'[data-promotion-popup-view]'});
  dialog.querySelector('[data-promotion-popup-dismiss]').onclick=()=>close('dismiss');
  dialog.querySelector('[data-promotion-popup-view]').onclick=()=>close('read',()=>{
    const card=document.querySelector(`[data-promotion-id="${CSS.escape(promotionId)}"]`);
    card?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});
    card?.querySelector('button,a')?.focus();
  });
  return true;
}
const business={name:'Glow Atelier',slug:'glow-atelier'};
$('promotionCards').innerHTML=FIXTURE_OFFERS.map(offer=>customerPromotionCardV104(offer,business,true)).join('');
document.querySelectorAll('[data-promotion-details]').forEach(button=>button.addEventListener('click',()=>{

window.v104OpenTerms=(index=0)=>{

window.v104AcceptanceMetrics=()=>({
  sourceHash:PRODUCTION_SOURCE_SHA256,
  viewport:{clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth},
  cards:[...document.querySelectorAll('.customer-promotion-card')].map(card=>({

        width:rect.width,
        height:rect.height,

    textOverflow:[...card.querySelectorAll('h3,p,summary,dd')].map(node=>({

      clientHeight:node.clientHeight,scrollHeight:node.scrollHeight
    }))
  })),
  longTokenVisible:document.body.textContent.includes(FIXTURE_LONG_TOKEN),
  modal:document.querySelector('#customerPromotionDetailsModal')?{
    role:document.querySelector('#customerPromotionDetailsModal').getAttribute('role'),
    ariaModal:document.querySelector('#customerPromotionDetailsModal').getAttribute('aria-modal'),
    labelledBy:document.querySelector('#customerPromotionDetailsModal').getAttribute('aria-labelledby'),

  }:null
});
const evidenceParams=new URLSearchParams(location.search);
if(evidenceParams.has('openTerms'))window.v104OpenTerms(Number(evidenceParams.get('openTerms')||0));
if(evidenceParams.get('openModal')==='1'){
  document.querySelector('[data-promotion-details]')?.click();
}
if(evidenceParams.get('evidence')==='1'){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const report=document.createElement('pre');
    report.id='v104AcceptanceReport';
    report.hidden=true;
    report.textContent=JSON.stringify(window.v104AcceptanceMetrics());
    document.body.append(report);
  }));
}
</script>
