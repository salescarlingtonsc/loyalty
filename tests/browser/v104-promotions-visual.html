/* ============================================================================
   Frenly design system v2 — "mockup layout, iOS polish" (owner ruling 2026-07-18)
   Principles: 8pt grid · SF-grade type with tight optical tracking · hairline
   borders instead of heavy strokes · layered low-opacity shadows (never one big
   blur) · frosted glass on floating surfaces · springy motion on interaction.
   The wordmark is an image asset, not type — headings run on the system
   (SF on Apple) stack, which is what makes it read as a native app rather than a
   generic web dashboard.
   ============================================================================ */
:root{
  --bg:#F4F2EE; --card:#FFFFFF; --ink:#17161A; --ink2:#3D3B44; --muted:#6B6673;
  --line:#EAE6DF; --control-border:#817B88; --hair:rgba(23,22,26,.06);
  /* ===== BRAND RED — SINGLE SOURCE OF TRUTH (owner ruling 2026-08-18) =====================
     Peekaa red is #C24135. It was previously two colours: the business app used #C24135 and
     the customer app used #F06A4F, with 79 customer rules on one and 45 on the other, so the
     two apps did not read as the same product. Every red below now derives from --brand-red.
     TO CHANGE THE BRAND RED: edit --brand-red and the four --brand-red-* steps ONLY. Nothing
     else in this file hardcodes a brand red. --coral and --peekaa-red are kept as aliases so
     no rule had to be rewritten; both now resolve to the same colour. */
  --brand-red:#C24135;           /* the brand red */
  --brand-red-dark:#9D352C;      /* pressed / hover / gradient end */
  --brand-red-soft:#F7DCD7;      /* selected chip + active nav background */
  /* Text/icons ON --brand-red-soft. The brand red itself measures 3.94:1 there — under AA — and
     wave 1 propagated that pair to every active nav label, selected tab, filter chip and status
     pill at once. This step is --brand-red-dark, i.e. a red the palette already contains, and it
     is 5.43:1 on the same pink. Nothing else about the chip changes. */
  --brand-red-on-soft:var(--brand-red-dark);
  --brand-red-faint:#FDEEEB;     /* large tinted surfaces */
  /* Dark surfaces need a lighter accent to stay legible; these are the SAME hue lifted, not a
     second brand. Change these two together with --brand-red above. */
  --brand-red-on-dark:#E4776B;   /* accent text/icons on a dark ground */
  --brand-red-on-dark-2:#F0A199; /* hover step on a dark ground */
  /* The two tinted steps also need a dark counterpart: #F7DCD7 and #FDEEEB are pale pinks that
     become near-white plates on a #191C22 card. These are the same two roles (selected chip /
     progress track ground, and large tinted surface) inverted for a dark ground. Change all four
     on-dark steps together with --brand-red above. */
  --brand-red-soft-on-dark:#3A211F;
  --brand-red-faint-on-dark:#2A1917;
  /* ===== LAYOUT BREAKPOINTS (owner ruling 2026-08-18) ==================================
     The workspace shell is governed by TWO thresholds, and only these two:
       <= 768px   compact layout — mobile page padding, stacked page headers, responsive
                  tables, single-column dashboard. iPad portrait (768) sits INSIDE this.
       <= 960px   no room for a persistent sidebar — rail hidden, mobile dock shown.
                  iPad portrait and 11in Pro portrait (834) get the dock; iPad landscape
                  (1024) keeps the rail.
     Before this, four thresholds (760 / 767 / 768 / 960) governed the same decision, which
     left 761-767px and exactly 768px in hybrid states nobody designed: mobile padding with
     a desktop-centred header. Component-local breakpoints (small-phone tweaks, short
     viewports, individual carousels) are deliberately left alone — they are per-component
     decisions, not shell layout. Do not introduce a third shell threshold. */
  --coral:var(--brand-red); --coral-hover:var(--brand-red-dark); --red:var(--brand-red-dark);
  /* ===== ONE-PEEKAA SEMANTIC TOKENS (wave 1, owner-approved 2026-08-19) ==================
     One neutral system and one colour pair per meaning, both apps. The --peekaa-* names
     below became ALIASES of these so no selector had to be rewritten; new code uses the
     canonical names. The retired strays (var(--brand-red) var(--danger) var(--success) var(--success) var(--tint), the warm
     cream cluster, the three customer shadow inks) all resolve to these now. */
  --success:#1F6B48; --success-bg:#E7F6EE;
  --danger:#9D352C;  --danger-bg:#FBEAE7;
  --warn:#7D6217;    --warn-bg:#FFF3D6;
  --neutral-bg:#F1EEE9;
  --gold:#D8B15A;    --gold-bg:var(--warn-bg);
  --bg-cust:#F8F4F1;
  --shell:#FCFBF9;   --appbar-bg:rgba(232,227,218,.94);
  --head-tint:#FBF5F0;
  --amber:var(--warn); --green:var(--success);
  --grad:linear-gradient(135deg,var(--brand-red),var(--brand-red-dark));
  --peekaa-red:var(--brand-red);--peekaa-red-dark:var(--brand-red-dark);--peekaa-red-soft:var(--brand-red-soft);--peekaa-red-faint:var(--brand-red-faint);
  --peekaa-red-on-soft:var(--brand-red-on-soft);
  --peekaa-bg:var(--bg-cust);--peekaa-card:var(--card);--peekaa-white:var(--card);
  --peekaa-text:var(--ink);--peekaa-text-secondary:var(--muted);--peekaa-text-muted:var(--muted);
  --peekaa-border:var(--line);--peekaa-divider:var(--line);
  --peekaa-success:var(--success);--peekaa-success-bg:var(--success-bg);
  --peekaa-gold:var(--gold);--peekaa-gold-bg:var(--gold-bg);
  /* V299: the one categorical palette for DOM proportion bars (reports, playbooks). */
  --chart-1:#C24135; --chart-2:#1F6B48; --chart-3:#1F5199; --chart-4:#8A5A12; --chart-5:#7A2E9D; --chart-6:#6B6673;
  --tint:#FFF0EC;            /* coral wash for selected/active surfaces */
  /* iOS uses generous, continuous corner radii */
  --r:18px; --r-sm:12px; --r-lg:24px;
  /* Depth = several cheap shadows stacked, not one expensive one */
  --shadow:0 1px 2px rgba(23,22,26,.04),0 4px 12px rgba(23,22,26,.045);
  --shadow-lg:0 2px 6px rgba(23,22,26,.05),0 18px 44px rgba(23,22,26,.10);
  --shadow-warm:0 2px 8px rgba(54,44,35,.05),0 8px 28px rgba(54,44,35,.07);
  --shadow-warm-lg:0 6px 16px rgba(54,44,35,.06),0 18px 42px rgba(54,44,35,.11);
  --glow-brand:0 8px 22px rgba(194,65,53,.28);
  --spring:cubic-bezier(.34,1.4,.64,1);
  --ease:cubic-bezier(.2,.8,.2,1);
  --motion-fast:160ms;
  --motion-ui:220ms;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px;
  --control-h:44px;
  /* B1 (owner ruling): --muted #6B6673 on --brand-red-soft is 4.29. #625E6A is the smallest
     darkening that clears 4.5 with margin (4.86) and still reads as secondary — the ruling was
     to preserve the hierarchy, not to maximise the ratio. Dark maps it back to --muted, whose
     grounds differ, so dark renders exactly as before. */
  --muted-on-soft:#625E6A;
  --sf:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Inter',system-ui,'Segoe UI',sans-serif;
  /* ===== DIALOG WIDTH LADDER (W5-2, owner spec 2026-08-19) ================================
     Every modal-card width in the app collapses onto these four steps. Each existing width was
     measured and mapped to the nearest step that is EQUAL OR WIDER, never narrower, so no dialog
     shrinks and nothing can newly overflow. Mobile viewport caps (calc(100vw - Npx) etc.) are
     untouched — this ladder only governs the desktop/tablet ceiling. */
  --dialog-w-sm:420px; --dialog-w-md:520px; --dialog-w-lg:640px; --dialog-w-xl:760px;
}

/* Compact widths: the segmented control scrolls instead of clipping (Reports @390 hid two of its

/* V372: the container itself must stop being a ROW. V369 made this list "vertical, one benefit

/* V399: V372 set align-items:stretch here at (0,1,0), but .permission-banner sets
   align-items:flex-start at the same specificity and appears LATER in this sheet, so flex-start
   won and every row shrank to its own text width — the rows stacked (V372's flex-direction did
   apply) but stayed a third of the card wide, which is the cramped column in the owner's photo.
   Qualifying with .permission-banner takes it to (0,2,0) so the rows fill the banner. Measured
   in Chromium: row width goes from shrink-to-fit to the full content box. */

/* V399 (owner, photo 6: a line drawn round the whole KPI row out to the card's right edge,
   "fill until here too empty"). The row was repeat(auto-fit,minmax(170px,1fr)). auto-fit only
   collapses tracks that NOTHING occupies, and the delta legend under the tiles is a
   grid-column:1/-1 item — it spans every track, so none of them could ever collapse. On a

/* Toast: frosted, springs up from the bottom like a native banner */
.toast{position:fixed;bottom:26px;left:50%;background:rgba(23,22,26,.9);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  color:#fff;padding:12px 22px;border-radius:999px;font-size:13.5px;font-weight:500;
  box-shadow:0 12px 40px rgba(0,0,0,.3);z-index:99;opacity:0;pointer-events:none;
  transform:translateX(-50%) translateY(12px) scale(.96);
  transition:opacity .26s var(--ease),transform .32s var(--spring)}

.err{background:var(--danger-bg);color:var(--danger);padding:10px 14px;border-radius:var(--r-sm);font-size:13px;margin-top:12px}
/* P0-5 (audit): .err is a page-level alert block, and inside a table cell it was still INLINE —
   so a sentence too long for the column shattered into one background fragment per line (8 of
   them in the Expenses AMOUNT column at 1024px), each starting at the line box while the 14px
   padding landed only on the first and last. Every wrapped line therefore began 14px left of the
   first line's text, the cell grew to 162px, and margin-top was silently dead on an inline box.
   In a cell it is ONE chip: a single box that starts at the cell's content edge and wraps its
   text INSIDE itself. */
td>.err{display:inline-block;max-width:100%;margin:0;padding:6px 10px;line-height:1.4;text-align:left}
/* One box also means one wrap width, so a column squeezed to 55px would set the sentence 3 words
   tall. In real table mode the chip asks for a readable minimum, which auto table layout hands to
   the column; .cui-table-wrap already scrolls. Below 769px the row is stacked and there is no
   column to widen, so the minimum is not asked for. */
@media(min-width:769px){td>.err{min-width:16ch}}

   customer-scan-modal already carries its own unconditional bottom-anchored pill treatment
   (declared later in this file), which — being equal specificity and later in source — continues
   to win for it at every width; it is listed here for the categorisation, not to override that
   design. customer-confirmation-modal and customer-redemption-modal are deliberately NOT sheets —
   a one-line decision and a celebration moment both read better centred. */

  .customer-offer-detail-modal .modal-card,.customer-business-detail-modal .modal-card,.customer-share-modal .modal-card{

/* V350 (owner mockup, photo 3): welcome offer modal — icon hero, an icon+label toggle row instead
   of a bare checkbox, card-style radio options with a selected highlight, and a tinted info box.
   V362 (owner, photo 4: "compact, premium SaaS form, not large accessibility-style controls").
   Every control here was oversized: a 22px checkbox rendering as a giant blue square, option cards
   with huge padding, tall inputs, and section gaps ~30% larger than the rest of the admin UI. The
   sizes below are the owner's own numbers. The selected state deliberately changes only colour —
   never size — so a row cannot change height when it is picked. */
.welcome-offer-modal-v350 .modal-card{position:relative;padding:22px}
.welcome-offer-modal-v350 .welcome-offer-close-v350{position:absolute;top:18px;right:18px}
.welcome-offer-modal-v350 h2#welcomeOfferTitleV215{font-size:22px!important}
.welcome-offer-modal-v350 label{font-size:14px}
.welcome-offer-modal-v350 input:not([type="checkbox"]):not([type="radio"]),
.welcome-offer-modal-v350 select{min-height:48px;border-radius:12px;padding:10px 12px;font-size:15px}
.welcome-offer-modal-v350 .welcome-offer-hero-v350{width:46px;height:46px;min-width:46px;flex:none;border-radius:14px;background:var(--tint);color:var(--coral);display:flex;align-items:center;justify-content:center;margin-top:2px}
/* Problem 5 — a compact setting row, not a bordered selection box. */
.welcome-offer-modal-v350 .welcome-offer-togglerow-v350{display:flex;align-items:center;gap:10px;min-height:58px;padding:10px 14px;border:1px solid var(--control-border);border-radius:12px;background:var(--shell);cursor:pointer}
.welcome-offer-modal-v350 .welcome-offer-togglerow-v350>b{flex:1;min-width:0;font-size:15px}
.welcome-offer-modal-v350 .welcome-offer-togglerow-icon-v350{width:28px;height:28px;min-width:28px;border-radius:9px;background:var(--tint);color:var(--coral);display:flex;align-items:center;justify-content:center}
/* Problem 1 — a normal compact checkbox. accent-color keeps the native tick inside the box. */
.welcome-offer-modal-v350 .welcome-offer-togglerow-v350 input[type="checkbox"]{margin-left:auto;flex:none;
  width:20px;height:20px;min-width:20px;max-width:20px;min-height:20px;max-height:20px;
  appearance:auto;-webkit-appearance:checkbox;accent-color:var(--coral);cursor:pointer}
/* Problem 2 — compact selectable rows; colour-only selected state. */
.welcome-offer-modal-v350 .welcome-offer-optioncard-v350{display:flex;align-items:center;gap:12px;
  min-height:76px;padding:16px 18px;border:1px solid var(--control-border);border-radius:12px;margin-top:8px;cursor:pointer}
.welcome-offer-modal-v350 .welcome-offer-optioncard-v350>span{flex:1;min-width:0}
.welcome-offer-modal-v350 .welcome-offer-optioncard-v350 b{font-size:15px;font-weight:650}
.welcome-offer-modal-v350 .welcome-offer-optioncard-v350 p{font-size:13.5px;overflow-wrap:anywhere}
.welcome-offer-modal-v350 .welcome-offer-optioncard-v350 input[type="radio"]{flex:none;margin:0;
  width:20px;height:20px;min-width:20px;max-width:20px;min-height:20px;max-height:20px;
  appearance:auto;-webkit-appearance:radio;accent-color:var(--coral);cursor:pointer}
.welcome-offer-modal-v350 .welcome-offer-optioncard-v350.selected{border-color:var(--coral);background:#FFF6F4}
/* Problem 4 — consistent, tighter section rhythm. */
.welcome-offer-modal-v350 fieldset{margin-top:18px!important}
.welcome-offer-modal-v350 legend.small{margin-bottom:2px}
.welcome-offer-modal-v350 .welcome-offer-infobox-v350{display:flex;align-items:flex-start;gap:8px;margin-top:16px;padding:10px 12px;border-radius:12px;background:#FBF3E7;color:var(--ink);font-size:13px}
.welcome-offer-modal-v350 .welcome-offer-infobox-v350>span:first-child{color:var(--amber);flex-shrink:0;margin-top:1px}
/* V366 — the Birthday gift modal (owner markup, photo 1: oversized checkbox, a double-outlined
   dropdown, oversized radios, and timing options spread too far apart). Every one of those is the
   same root cause: the modal reused the welcome-offer MARKUP but not its class, so its controls
   fell through to the global `input,select,textarea{width:100%;min-height:var(--control-h)}` rule
   and a checkbox became a 44px square. This is the welcome-offer treatment, scoped to its own
   class and tightened to the sizes the owner asked for. */
.birthday-gift-modal-v366 .welcome-offer-togglerow-v350{display:flex;align-items:center;gap:10px;min-height:52px;padding:9px 14px;border:1px solid var(--control-border);border-radius:12px;background:var(--shell);cursor:pointer}
.birthday-gift-modal-v366 .welcome-offer-togglerow-v350>b{flex:1;min-width:0;font-size:15px}
.birthday-gift-modal-v366 .welcome-offer-togglerow-icon-v350{width:28px;height:28px;min-width:28px;border-radius:9px;background:var(--tint);color:var(--coral);display:flex;align-items:center;justify-content:center}
/* Issue 1 — a standard compact checkbox, fixed box so the row cannot grow when it is ticked. */
.birthday-gift-modal-v366 .welcome-offer-togglerow-v350 input[type="checkbox"]{margin-left:auto;flex:none;
  width:22px;height:22px;min-width:22px;max-width:22px;min-height:22px;max-height:22px;
  appearance:auto;-webkit-appearance:checkbox;accent-color:var(--coral);cursor:pointer}
/* Issue 2 — one border, not two. The global focus ring is 3.5px and read as a second outline
   around the select; inside this modal focus is a thin coral border with a soft 2px halo. */
.birthday-gift-modal-v366 select,.birthday-gift-modal-v366 input[type="text"],
.birthday-gift-modal-v366 input:not([type]),.birthday-gift-modal-v366 textarea{box-shadow:none}
/* Issues 3 and 4 — compact selectable rows (~30% tighter) with a normal-sized radio. */
.birthday-gift-modal-v366 .welcome-offer-optioncard-v350{display:flex;align-items:center;gap:10px;
  min-height:auto;padding:11px 14px;border:1px solid var(--control-border);border-radius:12px;margin-top:6px;cursor:pointer}
.birthday-gift-modal-v366 .welcome-offer-optioncard-v350>span{flex:1;min-width:0}
.birthday-gift-modal-v366 .welcome-offer-optioncard-v350 b{font-size:15px;font-weight:650;display:block}
.birthday-gift-modal-v366 .welcome-offer-optioncard-v350 p{font-size:13.5px;margin-top:1px!important;overflow-wrap:anywhere}
.birthday-gift-modal-v366 .welcome-offer-optioncard-v350 input[type="radio"]{flex:none;margin:0;
  width:19px;height:19px;min-width:19px;max-width:19px;min-height:19px;max-height:19px;
  appearance:auto;-webkit-appearance:radio;accent-color:var(--coral);cursor:pointer}
.birthday-gift-modal-v366 .welcome-offer-optioncard-v350.selected{border-color:var(--coral);background:#FFF6F4}
.birthday-gift-modal-v366 fieldset{margin-top:16px!important}

/* V382 (owner: "when i select birthday month why am i still able to edit the days?"). The days

/* Grow overview: one journey first, engine-specific editors only on demand. */
.grow-overview{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:920px;margin:0 auto}
.grow-overview[data-programme-view="list"],
.grow-overview[data-programme-view="points"],
.grow-overview[data-programme-view="tiers"]{max-width:1320px}
.grow-overview[data-programme-view="list"]>.reward-journey-v122,
.grow-overview[data-programme-view="points"]>.reward-journey-v122,
.grow-overview[data-programme-view="tiers"]>.reward-journey-v122{background:transparent;border:0;box-shadow:none;padding:0}
.grow-overview[data-programme-view="list"] .v150-titlebar,
.grow-overview[data-programme-view="points"] .v150-titlebar,
.grow-overview[data-programme-view="tiers"] .v150-titlebar{align-items:flex-start}
/* V319 (owner sketch: "two side view", the two categories drawn as neighbouring columns).
   The reading column widens ONLY on the Overview view, because that is the one view now carrying
   two tables abreast; every other view keeps the 920px measure it was designed at. The pair
   stacks well before either table would need to scroll sideways — a five-column table squeezed
   into half of 920px is not a glance, which is what this view is for. */
.grow-overview[data-programme-view="overview"]{max-width:1280px}
/* Unequal on purpose: the rewards table carries five columns and the offers table four, so the
   even split is what broke "Referrals" across two lines mid-word at 1440px. Below 1200px neither
   has the room to sit beside the other without that returning, so they stack. */
.grow-overview-split-v319{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,0.85fr);gap:18px;margin-top:14px;align-items:start}
@media(max-width:1200px){.grow-overview-split-v319{grid-template-columns:minmax(0,1fr)}}
.grow-overview-column-v319{min-width:0;display:grid;gap:8px}
.grow-overview-column-title-v319{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--coral);font-weight:850}
.grow-overview-column-note-v319{margin:0}
.grow-overview-column-v319 .cui-table-wrap{border:1px solid var(--line)}
/* V324 (owner markup 2026-08-14): a line drawn between the two columns with "separate them", a
   ringed "+" beside each heading, and the reward row ringed as belonging to the programme above.
   The divider is a border on the second column and only exists at the width where the two are
   actually side by side — below 1200px the split stacks, and a left border on a stacked column
   is a stray vertical line, not a separator. */
.grow-overview-column-head-v324{display:flex;align-items:center;gap:10px}
.grow-overview-column-head-v324 .grow-overview-column-title-v319{margin:0}
.grow-overview-add-v324{margin-left:auto;min-width:30px;padding:2px 9px;font-size:16px;line-height:1.35;font-weight:800;border-radius:999px}
@media(min-width:1201px){.grow-overview-split-v319{gap:28px}
  .grow-overview-column-v319[data-grow-overview-category-v319="offers"]{border-left:1px solid var(--hair);padding-left:28px}}
/* ============ v401 — REWARDS OVERVIEW VISUAL PASS ==========================================
   The page carried zero icons and four nested .card levels all painted #FFFFFF, while the list
   view one click away carried seven marks and the Dashboard already led its section headings with
   a coral glyph. Nothing here invents a new language; it applies the one that already exists at
   its three established sizes (56px thumb / 40px tile / 18-24px inline glyph).
   Colour stays inside coral, blush, neutral and the two semantics already in use. */

/* The module mark on the page's own H1 — the slot every other top-level page already fills. */
.grow-title-mark-v401{display:inline-flex;align-items:center;color:var(--coral);flex:0 0 auto}

/* Both column heads become one tinted bar, with the ringed "+" pulled inside it so the control
   sits with the thing it adds to rather than floating at the far end of a bare flex row. */
.grow-overview-column-head-v324{gap:9px;padding:9px 12px;border-radius:12px;background:var(--tint)}
.grow-overview-column-mark-v401{display:inline-flex;align-items:center;color:var(--coral);flex:0 0 auto}
.grow-overview-add-v324{background:transparent;border-color:transparent}
.grow-overview-add-v324:hover{background:#fff;border-color:var(--hair)}

/* The type mark on a parent programme row. Muted so a column of them reads as texture rather
   than as eight competing accents; child rows never get one (see growOverviewNameColumnV324). */
.grow-overview-name-v401{display:inline-flex;align-items:baseline;gap:7px;min-width:0;text-align:left}
.grow-overview-row-mark-v401{color:var(--coral);opacity:.72;flex:0 0 auto;align-self:center}

/* The analytic half of the page. The heading takes the same icon+copy composition the Dashboard's
   .performance-heading uses, and the illustration sits opposite it. */
/* align-items:center, not flex-start, and the illustration stays IN FLOW. Both were arrived at by
   measurement. Top-aligned and in flow, a 96px image beside 43px of copy made the row 96px tall and
   left a 67px hole above the comeback card. Pulled out of flow with position:absolute the hole
   closed, but the image then hung 29px down over that card's top-right corner. A 96px ornament next
   to a 43px heading can only add height or overlap something, so it becomes a deliberate header
   band instead: the copy centres against the image, and the band reads as the divider between the
   configuration half of the page and the measurement half. */
.grow-analytics-head-v401{display:flex;align-items:center;gap:20px}
.grow-analytics-head-copy-v401{min-width:0;flex:1 1 auto}
.grow-analytics-head-v401 h2{display:flex;align-items:center;gap:9px}
.grow-analytics-head-v401 h2>.cui-icon{color:var(--coral);flex:0 0 auto}

/* Nesting level 3 steps back to the page ground so the KPI tiles at level 4 — which stay white —
   become the brightest surface on the page. This is the inversion that keeps the two comeback
   numbers dominant, and it is why no illustration goes inside this card. */
.grow-comeback-card-v401{background:var(--bg);box-shadow:none;border:1px solid var(--hair)}
.grow-comeback-kpi-v401{background:#fff}
.grow-comeback-kpi-v401 .l{display:flex;align-items:center;gap:6px}
.grow-comeback-kpi-v401 .l>.cui-icon{color:var(--coral);flex:0 0 auto}
.grow-comeback-kpi-v401.is-returned-v401 .l>.cui-icon{color:var(--green)}
.grow-comeback-kpi-v401 .v{font-size:2.125rem}

/* --- the two illustrations ---------------------------------------------------------------
   Both are decoration: aria-hidden, and each is gated so it can only appear where it has room.
   Hidden by default, shown by the media queries below — so a viewport that matches neither rule
   renders no illustration at all rather than an unsized one. */
.grow-illus-v401{display:none;flex:0 0 auto;height:auto;max-width:100%;user-select:none;pointer-events:none}

/* Retention: 96px, right-aligned in the heading's margin, ornamental and subordinate by design.
   Below 1024 the heading's free width falls to 62px, which will not take it, so it goes. */
/* Below 1024 the heading's free width falls to 62px, which will not take it, so it goes entirely —
   and because it is display:none the browser never fetches the file at all. */
@media(min-width:1024px){.grow-illus-retention-v401{display:block;width:96px;opacity:.92}}

/* Limited Offer: 132px, centred, the focal object of an otherwise empty panel. Gated on the SAME
   1201px breakpoint the two-column split uses — the void it fills is created by that split, so
   when the columns stack the illustration has no reason to exist. That gate also means it never
   reaches tablet or phone. The size gap (132 vs 96) plus centred-vs-margin placement is what keeps
   the two from reading as competing objects when both are on screen. */
.grow-overview-column-v319 .empty .grow-illus-offer-v401{margin:0 auto 14px}
@media(min-width:1201px){.grow-illus-offer-v401{display:block;width:132px}}

@media(prefers-reduced-motion:no-preference){.grow-illus-v401{transition:opacity .2s ease}}

@media(max-width:640px){
  .grow-overview-column-head-v324{padding:8px 10px}
  .grow-analytics-head-v401{gap:0}
  .grow-comeback-kpi-v401 .v{font-size:1.9rem}
}
/* A date is one token to a reader and must never break across lines — dd/mm/yyyy in a narrow
   column wraps after the "20" and prints the year as "20 26", which is worse than the long form
   it replaced. Only above the 767px stack point: below it the responsive table gives each cell
   the full row width, and nowrap there could push a long value out of the card instead. */
@media(min-width:768px){.grow-overview-column-v319 .cui-table td[data-label="Started"],
  .grow-overview-column-v319 .cui-table td[data-label="Ends"],
  .grow-overview-column-v319 .cui-table td[data-label="Ran from"],
  .grow-overview-column-v319 .cui-table td[data-label="Ran until"]{white-space:nowrap}}
/* V385: the child indent is a real glyph now, not a ::before connector a narrow-screen rule
   deleted — on a tablet the gift rows lost their indent AND ran into the parent note. */
.grow-overview-child-v324{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:6px;align-items:start}
.grow-overview-arrow-v385{color:var(--muted);font-size:13px;line-height:1.45}

/* ---- nestly_v413: the usage table's gift groups collapse -----------------------------------
   Owner, photo 1: a brace down the ten gifts under Point system ("if under point system, then
   minimise under Point System") and a second on the lone Birthday benefit gift ("minimise").
   The disclosure IS the category name, so it must not look like a button dropped into a table
   cell: no border, no background, no padding that would shift the name off the column edge the
   other parent rows align to. It reads as the same bold name it was, with a caret in front and
   the gift count behind. Only the caret and the hover underline say it is pressable. */
.grow-usage-disclosure-v413{display:inline-flex;align-items:baseline;gap:6px;flex-wrap:wrap;
  background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.grow-usage-disclosure-v413 b{font:inherit;font-weight:700}
.grow-usage-disclosure-v413:hover b{text-decoration:underline}
.grow-usage-disclosure-v413:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.grow-usage-caret-v413{color:var(--muted);font-size:11px;line-height:1.6}
.grow-usage-count-v413{font-weight:400}

/* ---- v401b: parent/child hierarchy in the Rewards & Loyalty table ------------------------
   Measured before this block: the parent name sat at x=189 and the child name at x=183, so a
   child reward was OUTDENTED by 6px — the arrow took the slot the parent's kind mark occupies and
   the name then started earlier than its parent's. With both names at weight 750 and zero row gap,
   three rows read as three peers, which is what the owner saw.
   Every rule below is scoped to the rewards column so History and the usage table are untouched.
   The row-shape selectors use :has(), already used elsewhere in this stylesheet, because
   growTableV271 is shared by several tables and emits a bare <tr> with no per-row hook. */
.grow-overview-column-v319[data-grow-overview-category-v319="rewards"] .grow-overview-child-v324{
  padding-left:28px}
/* Readable, not shouted: one weight step down and the secondary ink, never a smaller size — these
   are reward names an owner has to be able to read at a glance. */
.grow-overview-column-v319[data-grow-overview-category-v319="rewards"] .grow-overview-child-v324 b,
.grow-overview-column-v319[data-grow-overview-category-v319="rewards"] .grow-overview-child-v324 .grow-overview-open-v388{
  font-weight:600;color:var(--ink2)}
.grow-overview-column-v319[data-grow-overview-category-v319="rewards"] .grow-overview-arrow-v385{
  color:var(--coral);opacity:.55}

/* nestly_v410 (owner photo 2: a hand-drawn arrow against each gift row in "Customers who used each
   programme", with "put arrow under point system if it's under point system"). V401b gave the
   Rewards & Loyalty table this hierarchy and scoped every rule to that column, saying so in its own
   comment — so this table stayed flat and four gifts read as peers of the engine they hang off.
   Same class names, same indent step, same one-weight-down treatment, scoped to this table. */
[data-grow-usage-table-v410] .grow-overview-child-v324{display:inline-flex;align-items:baseline;gap:6px;padding-left:20px}
[data-grow-usage-table-v410] .grow-overview-child-v324 b{font-weight:600;color:var(--ink2)}
[data-grow-usage-table-v410] .grow-overview-arrow-v385{color:var(--coral);opacity:.55}
/* Below the stack point a row is three stacked cells, so the indent would sit under a label rather
   than under the parent's name. The arrow alone carries the relationship there. */
@media(max-width:768px){[data-grow-usage-table-v410] .grow-overview-child-v324{padding-left:0}}

/* Vertical grouping. A child gets a little more room than a plain row; the FIRST child gets a
   touch more still, and a parent that follows a child group gets the largest step, so the eye
   reads "new programme starts here" without a rule or a background.
   Scoped to >=768px because below the stack point a row is FOUR stacked cells, not one line —
   padding on every cell multiplied by four, which grew each child row from 155px to 231px. */
@media(min-width:768px){
  .grow-overview-column-v319[data-grow-overview-category-v319="rewards"] tbody tr:has(.grow-overview-child-v324)>td{
    padding-top:16px;padding-bottom:16px}
  .grow-overview-column-v319[data-grow-overview-category-v319="rewards"] tbody tr:not(:has(.grow-overview-child-v324))+tr:has(.grow-overview-child-v324)>td{
    padding-top:19px}
  .grow-overview-column-v319[data-grow-overview-category-v319="rewards"] tbody tr:has(.grow-overview-child-v324)+tr:not(:has(.grow-overview-child-v324))>td{
    padding-top:22px}
}
/* Two consecutive children belong together, so the hairline between THEM is softened while the
   hairline that closes the group is left alone. Softened, not removed — the row boundary still
   has to exist for a reader scanning the Setting column. */
.grow-overview-column-v319[data-grow-overview-category-v319="rewards"] tbody tr:has(.grow-overview-child-v324):has(+tr:has(.grow-overview-child-v324))>td{
  border-bottom-color:var(--hair)}

/* Below the stack point each row becomes four labelled blocks. The indent still works — the value
   sits in a grid column that starts at a fixed left edge, not against the right rail — so it is
   kept, slightly tighter for the narrower measure. The group break is put on the Programme cell
   ALONE, which is where the eye enters the block, instead of on all four. */
@media(max-width:767px){
  .grow-overview-column-v319[data-grow-overview-category-v319="rewards"] .grow-overview-child-v324{
    padding-left:26px}
  .grow-overview-column-v319[data-grow-overview-category-v319="rewards"] tbody tr:not(:has(.grow-overview-child-v324))+tr:has(.grow-overview-child-v324)>td:first-child,
  .grow-overview-column-v319[data-grow-overview-category-v319="rewards"] tbody tr:has(.grow-overview-child-v324)+tr:not(:has(.grow-overview-child-v324))>td:first-child{
    padding-top:14px}
}
/* V386: the usage window filter and the comparison chart under the usage table. The chart is
   plain DOM — the app's CSP forbids loading a charting library, and these bars are drawn from
   the numbers already in the table above them. */
/* V387: the previous period's own figure, under the value it is compared with. */
.metric-was-v387{display:block;margin-top:2px;font-size:12px;font-weight:600;color:var(--muted)}
.grow-usage-filter-v386{display:flex;flex-wrap:wrap;gap:12px;align-items:end;padding:0;border:0;background:none;box-shadow:none}
.grow-usage-filter-v386 label{margin-top:0}
.grow-usage-chart-v386{margin:16px 0 0}
.grow-usage-chart-legend-v386{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--muted)}
.grow-usage-chart-legend-v386 li{display:flex;align-items:center;gap:6px}
.grow-usage-chart-key-v386{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.grow-usage-chart-rows-v386{display:grid;gap:10px;margin-top:12px}
.grow-usage-chart-row-v386{display:grid;grid-template-columns:minmax(90px,26%) minmax(0,1fr) auto;gap:10px;align-items:center}
.grow-usage-chart-label-v386{font-size:12.5px;font-weight:650;min-width:0;overflow-wrap:anywhere}
.grow-usage-chart-track-v386{display:grid;gap:3px;min-width:0}
.grow-usage-chart-bar-v386{display:block;height:11px;border-radius:999px;min-width:2px}
.grow-usage-chart-bar-v386.is-now-v386,.grow-usage-chart-key-v386.is-now-v386{background:var(--chart-1)}
.grow-usage-chart-bar-v386.is-was-v386,.grow-usage-chart-key-v386.is-was-v386{background:var(--chart-6);opacity:.5}
.grow-usage-chart-value-v386{text-align:right;font-weight:750;font-size:13px;white-space:nowrap}
.grow-usage-chart-value-v386 small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
@media(max-width:600px){.grow-usage-chart-row-v386{grid-template-columns:minmax(0,1fr) auto}.grow-usage-chart-track-v386{grid-column:1/-1;order:3}}
.grow-overview-child-v324>b{min-width:0}
.grow-overview-parent-v375{display:block;grid-column:2}

.grow-hero-copy{max-width:620px}.grow-hero-copy h1{font-size:clamp(1.8rem,4vw,2.35rem);margin:0}

.grow-secondary-body{display:grid;gap:18px;padding:0 0 18px}.grow-secondary-intro{padding:2px 2px 0}
.reward-auto-dialog{display:grid;grid-template-rows:auto minmax(0,1fr) auto;width:min(560px,100%);max-width:560px;max-height:min(92dvh,720px);overflow:hidden}
.reward-auto-head{display:flex;align-items:flex-start;gap:14px}.reward-auto-head>div{min-width:0;flex:1}

.reward-auto-choice input{flex:0 0 auto;width:22px;min-height:22px;margin-top:2px}.reward-auto-choice label{margin:0;color:var(--ink);font-size:14px}.reward-auto-choice p{margin-top:4px}

/* Program Studio (PS-1A authoring surface) — theme-aware via existing tokens only */
.studio-row{padding:12px 0;border-bottom:1px solid var(--line)}

.edCondValCell input,.edCondValCell select,.edEffValCell input,.edEffValCell select{min-width:96px;min-height:44px}
.edEffLbl{font-size:12px;color:var(--muted)}

.studio-advanced{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}

.spacer{flex:1}
.frontline-card{max-width:460px;margin:0 auto}
/* V399 (owner, photo 1: the typed number ringed with "number increase size, too small").
   The keypad digit below it is 22px on a 60px key; the number those keys PRODUCE was barely
   half a step larger, so the one value the cashier has to read back to a customer was the
   smallest confident thing on the card.
   The size was not the whole story. `.frontline-phone` is (0,1,0) and the base control rule
   `input:not([type="checkbox"]):not([type="radio"])` above is (0,2,1), so the base rule won and
   the number had been rendering at the ordinary 15px control size all along — the declared 34px
   never reached the screen once. Measured in Chromium before and after, not read off the
   stylesheet. Hence the selector carries the card too: (0,2,1), and later in the sheet, so it
   actually applies. Raised to 46px with a matching height bump — the card keeps its 460px
   max-width, so nothing around it moves. */
.frontline-card input.frontline-phone{font-size:46px;font-weight:700;text-align:center;height:76px;
  letter-spacing:.06em;font-variant-numeric:tabular-nums}
.frontline-keypad{grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.frontline-keypad .btn{height:60px;font-size:22px;font-weight:700}
.frontline-tenders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.frontline-tenders .btn{min-height:52px;font-size:15px}
.frontline-tenders .btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.till-cart-card{max-width:560px}
.till-cart-catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-top:6px}
.till-cart-catalog .btn,.till-cart-catalog .choice-button{min-height:64px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;padding:10px 12px;font-size:14px;font-weight:600;line-height:1.25}
.till-cart-catalog .btn .till-cart-price,.till-cart-catalog .choice-button .till-cart-price{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.till-cart-catalog .choice-button{position:relative}
.till-cart-catalog .choice-button.has-image{display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:10px;padding-right:40px}
	.till-choice-image,.catalogue-thumb{width:42px;height:42px;border-radius:12px;object-fit:cover;background:var(--wash);border:1px solid var(--line);box-shadow:0 4px 12px rgba(32,24,18,.08)}
	.catalogue-thumb:not(img){display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.till-choice-text{min-width:0;display:flex;flex-direction:column;gap:2px}
.till-cart-catalog .choice-button.is-selected{border-color:var(--coral);background:#FFF3EE;box-shadow:0 0 0 1px rgba(196,61,50,.12)}
.till-choice-qty{position:absolute;top:8px;right:8px;min-width:24px;height:24px;border-radius:999px;background:var(--coral);color:white;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.till-sale-package-options{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--shell);padding:0 12px}
.till-sale-package-options>summary{min-height:46px;display:flex;align-items:center;cursor:pointer;font-weight:750}

/* V294 (owner sketch 2026-08-12): compact summary card at the upper right of the Customer 360

   V295 (owner markup 2026-08-13: "there's an empty box and UI UX not aligned"): the flex band
   that held it is gone. .c360-top-main-v294 was flex:1 1 240px, which the mobile column direction
   read as a 240px basis HEIGHT — a literal empty box under the chips — and on desktop the band's
   height was set by this card, leaving a tall void in the left column. The card is a cell of the
   content grid now, so it keeps the upper right and no column starts empty. */
.c360-content-split-v295{align-items:start}
.c360-summary-card-v294{align-self:start;padding:12px 16px}
.c360-summary-row-v294{display:flex;gap:12px;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--hair)}
.c360-summary-row-v294:last-of-type{border-bottom:0}
.c360-summary-label-v294{color:var(--muted);font-size:12.5px;font-weight:650}
.c360-summary-value-v294{font-variant-numeric:tabular-nums;font-size:14px;text-align:right}
.c360-summary-card-v294 .c360-points-expiry{margin-top:2px}
.c360-summary-card-v294 .customer360-points-paused-v259{margin-top:2px}
/* V295: 960px is where .split collapses to one column. The summary card is ordered first there,
   so the figures stack ABOVE the programme list rather than floating between two cards. */
@media(max-width:960px){.c360-summary-card-v294{order:-1;width:100%}}
/* V294: Available Customer Programmes — one compact row per programme, honest Live/Paused pill. */
.c360-programmes-v294{display:flex;flex-direction:column;margin-bottom:6px}
.c360-programme-row-v294{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--hair)}
.c360-programme-row-v294:last-child{border-bottom:0}
.c360-programme-row-v294 b{font-size:13.5px}
.c360-programme-row-v294 p{margin-top:2px}
/* V295 (owner: "i do not know what changed - just be straight forward"). The publish gate's
   change list is one flat list of concrete before/after lines, and the sentences about HOW the
   comparison is made collapse into a Technical detail disclosure below it. */
.studio-change-list-v295{list-style:disc;margin:0;padding-left:20px}
.studio-change-list-v295 li{padding:4px 0;font-size:13.5px;line-height:1.45;overflow-wrap:anywhere}
.studio-change-list-v295 li s{color:var(--muted)}
.studio-technical-v295{margin-top:14px;border-top:1px solid var(--hair);padding-top:10px}
.studio-technical-v295>summary{cursor:pointer;font-weight:700;font-size:13px;min-height:34px;display:flex;align-items:center;color:var(--muted)}
/* V294: retired/ended rewards live in a collapsed Reward history disclosure. */
.reward-history-v294>summary{cursor:pointer;font-weight:700;font-size:13px;min-height:34px;display:flex;align-items:center}
/* V294: Business Insights report tabs (the four cards became a tab bar). */
.report-tabbar-v294{margin-bottom:16px}
.report-tabbar-v294 button{display:inline-flex;align-items:center;gap:7px}
.report-panel-v294[hidden]{display:none}
/* V297 (owner markup on Business Insights, 2026-08-12: "please make business insights more
   interesting & easier to understand" / "i want to know if my business is improving?"). Two
   additions: the verdict band that opens every report tab, and a CSS-only proportional bar under
   Revenue by type. No charting library and no remote asset — the app's CSP forbids both, and the
   mix only needs to be readable, not plotted. */
.report-verdict-host-v297{margin-bottom:16px}
.report-verdict-host-v297:empty{display:none;margin-bottom:0}
.reports-grid>.report-verdict-v297{grid-column:1/-1}
.report-verdict-v297{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--muted);
  border-radius:var(--r);box-shadow:var(--shadow);padding:16px 20px;min-width:0;max-width:100%}
.report-verdict-label-v297{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:750}
.report-verdict-value-v297{font-size:1.85rem;font-weight:750;line-height:1.15;margin-top:6px;letter-spacing:-.02em;overflow-wrap:anywhere}
.report-verdict-change-v297{display:flex;align-items:baseline;gap:7px;margin-top:6px;font-size:14px;font-weight:650;line-height:1.45;color:var(--ink2)}
.report-verdict-arrow-v297{font-size:15px;line-height:1;flex:0 0 auto}
.report-verdict-note-v297{margin-top:8px;line-height:1.45}
.report-verdict-up-v297{border-left-color:var(--green)}
.report-verdict-up-v297 .report-verdict-change-v297{color:var(--green)}
.report-verdict-down-v297{border-left-color:var(--red)}
.report-verdict-down-v297 .report-verdict-change-v297{color:var(--red)}
.report-verdict-flat-v297{border-left-color:var(--amber)}
.report-share-v297{margin-top:12px}
.report-share-bar-v297{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line)}
.report-share-bar-v297>span{display:block;height:100%}
/* V299: Business Insights depended on two classes that had no rules at all — every tab's
   headline number rendered at body size one card under the 1.85rem verdict value. */
.metric{font-size:1.6rem;font-weight:750;line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
@media(max-width:720px){.metric{font-size:22px}}
.report-scope-card{padding:16px 18px}
.report-scope-card .range{align-items:center;row-gap:10px}
.report-scope-card .range label{display:inline-flex;align-items:center;gap:8px;margin:0;font-size:12.5px;font-weight:650;color:var(--muted)}
.report-scope-card .range input[type=date]{width:auto;min-width:150px}
.report-scope-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.report-share-legend-v297{list-style:none;margin:9px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.report-share-legend-v297 li{display:flex;align-items:center;gap:6px}
.report-share-dot-v297{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
@media(max-width:720px){.report-verdict-value-v297{font-size:1.55rem}}
.customer360-points-panel-v249{margin-top:12px;padding-top:10px;border-top:1px solid var(--hair);display:grid;gap:8px}
.customer360-points-panel-v249 summary{font-size:12.5px;font-weight:650;cursor:pointer;min-height:28px;display:flex;align-items:center}
.customer360-points-panel-v249 .row{flex-wrap:wrap;gap:8px}
.customer360-points-panel-v249 input{max-width:100%}
@media(max-width:560px){.customer360-kpis-v249{grid-template-columns:minmax(0,1fr)}}

.c360-timeline{display:grid;gap:0;margin-top:8px;list-style:none;padding:0}
.c360-tl-item{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:13px;align-items:start;padding:13px 2px;border-bottom:1px solid var(--hair)}
.c360-tl-item:last-child{border-bottom:0}
.c360-tl-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--neutral-bg);color:var(--ink2)}
.c360-tl-ic.sale{background:var(--success-bg);color:var(--green)}
.c360-tl-ic.reversal{background:var(--danger-bg);color:var(--red)}
.c360-tl-ic.appt{background:#EAF1FB;color:#1F5199}

.c360-tl-main{min-width:0}
.c360-tl-main .t{font-weight:650;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.c360-tl-main .d{color:var(--muted);font-size:12px;margin-top:3px;line-height:1.45;overflow-wrap:anywhere}
.c360-tl-main .d .btn{margin-top:7px}
.c360-tl-side{text-align:right;white-space:nowrap}
.c360-tl-amt{font-weight:680;font-variant-numeric:tabular-nums;font-size:13.5px}

/* V252: Activity history is a table. The pictogram tile and the timestamp style are reused from
   the list it replaces so the row still reads at a glance; notes stack under the ITEM cell. */
.c360-activity-table-v252 td{vertical-align:top}

/* V375: the one-off amount field, on the first Record sale screen. */
.till-manual-amount-v375{margin-top:14px;padding:12px 14px;border:1px dashed var(--line);border-radius:14px;background:#fff}

/* V378: a booking request that became an appointment is a door to it. */
/* V378: the on-demand booking QR under the portal link. */
/* V382 (owner, photo 4): a module a teammate holds reads green, one they do not reads red. The
   colour follows the select's own value, never a second source of truth. */
.module-perm-select-v382[data-perm-state-v382="on"]{border-color:var(--success);color:var(--success);font-weight:700;background:var(--success-bg)}

/* V385: the "?" help affordance next to a panel heading. */
.help-dot-v385{position:relative;display:inline-grid;place-items:center;width:20px;height:20px;margin-left:6px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:12px;font-weight:800;line-height:1;cursor:help;vertical-align:middle}
.help-dot-v385:hover,.help-dot-v385:focus-visible{border-color:var(--coral);color:var(--coral)}
/* V388: the enlarged rewards code, and the quick date ranges on the usage filter. */
.wallet-qr-host-v388{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px;margin-top:14px;padding:14px;border:1px solid var(--hair);border-radius:var(--r-sm);background:#fff}

.grow-usage-quick-v388{margin-top:8px}
.grow-usage-compare-label-v392{align-self:center;padding:0 8px 0 4px}

/* V392: the redeem block, indented under the accruing programme row it belongs to. */
.c360-rewards-under-v392{padding:2px 0 12px 14px;margin:-4px 0 6px;border-left:2px solid var(--hair)}
.c360-rewards-under-v392>:first-child{margin-top:6px!important}
.till-item-search-v392{margin:8px 0 10px}

.settings-module-grid-v389{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:7px;margin-top:10px}
.settings-module-v389{display:flex;flex-direction:column;gap:1px;min-width:0;padding:7px 9px;
  border:1px solid var(--hair);border-radius:var(--r-sm);background:var(--bg)}
.settings-module-name-v389{display:flex;align-items:center;gap:6px;min-width:0;font-size:12px;color:var(--ink)}
.settings-module-name-v389 b{font-weight:650;overflow-wrap:anywhere}

.settings-module-uses-v389{font-size:10.5px;line-height:1.3;color:var(--muted);overflow-wrap:anywhere}
.grow-overview-open-v388{padding:0;border:0;background:none;font:inherit;font-weight:750;color:var(--ink);text-align:left;cursor:pointer;overflow-wrap:anywhere}
.grow-overview-open-v388:hover{color:var(--coral);text-decoration:underline}
.grow-overview-open-v388:focus-visible{outline:3px solid var(--coral);outline-offset:2px;border-radius:4px}
/* V388: the hint is a bubble on hover/focus, not a dialog (owner, photo 3). */
.help-dot-bubble-v385{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);z-index:30;
  width:max-content;max-width:min(260px,70vw);padding:8px 10px;border-radius:10px;
  background:var(--ink);color:#fff;font-size:12px;font-weight:500;line-height:1.4;text-align:left;
  letter-spacing:0;box-shadow:var(--shadow-lg);opacity:0;visibility:hidden;transition:opacity .12s var(--ease)}
.help-dot-bubble-v385::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--ink)}
.help-dot-v385:hover .help-dot-bubble-v385,.help-dot-v385:focus-visible .help-dot-bubble-v385{opacity:1;visibility:visible}
/* On touch there is no hover and no native title to fall back on, so the tap that focuses the

.c360-act-amt-v252{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:650}

/* === COMPACT LAYOUT SHELL (<=768px) — the workspace shell block. Anchor comment: tests slice
   on it, and it marks where the compact page-head / topbar / table rules live. === */
@media(max-width:768px){
  .cui-page-head,.topbar{align-items:flex-start}.cui-page-actions,.topbar>.row{width:100%}.cui-page-actions>.btn,.topbar>.row>.btn{flex:1 1 auto}
  .topbar>.row{min-width:0;max-width:100%;flex-wrap:wrap}

  .topbar>.row>#branchWrap{flex:1 1 190px}.topbar>.row>#branchWrap>select{width:100%;max-width:100%}
  .cui-table[data-responsive="true"] thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  .cui-table[data-responsive="true"],.cui-table[data-responsive="true"] tbody,.cui-table[data-responsive="true"] tr,.cui-table[data-responsive="true"] td{display:block;width:100%}
  .cui-table[data-responsive="true"] tr{padding:10px 0;border-bottom:1px solid var(--line)}
  .cui-table[data-responsive="true"] td{display:grid;grid-template-columns:minmax(108px,42%) 1fr;gap:12px;padding:8px 4px;border:0;text-align:right;overflow-wrap:anywhere}
  .cui-table[data-responsive="true"] td::before{content:attr(data-label);color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:left}
  .cui-table[data-responsive="true"] td:empty{display:none}
  /* V291 (audit A2 #20): the Day view's pixel timeline gets the same treatment the Week grid
     already had — hidden below this breakpoint in favour of the linear agenda beneath it. */
  .calendar-week-scroll,.day-timeline-scroll{display:none}.calendar-agenda{display:block}.appointment-toolbar select{width:100%}
  /* The green-slot instruction belongs to the timeline that is now hidden; New appointment in the
     page header is the booking route on a phone. */
  .day-timeline-slot-hint-v291{display:none}
  /* appointment-detail-modal's bottom-sheet treatment now lives in the shared W5-2 rule (.modal-card
     base rule, ~line 902) at <=600px, alongside the other five sheet dialogs — it previously only
     became a sheet at <=768px; the grid/action tweaks below still apply at this wider breakpoint. */

  .settings-page .row>.spacer{display:none}
  .settings-page .row>input,.settings-page .row>select{flex:1 1 100%;width:100%;max-width:100%!important}
  .settings-page .row>.btn{flex:1 1 auto;max-width:100%}
  .settings-page .row>span,.settings-page .row>b{max-width:100%;overflow-wrap:anywhere}
  .workspace-logo-editor{grid-template-columns:72px minmax(0,1fr)}
  .workspace-logo-preview{width:72px;height:72px;border-radius:20px}
  .checkout-catalogue-item{grid-template-columns:minmax(0,1fr)}
  .checkout-catalogue-item .btn{width:100%}
  .checkout-catalogue-filter{grid-template-columns:minmax(0,1fr)}
  .reports-grid{grid-template-columns:minmax(0,1fr);width:100%;min-width:0;max-width:100%}
  .portal-link-row,.portal-link{width:100%;max-width:100%;min-width:0}

   803px, and section.customer-programme-card-v310 measured 803px wide inside it. The card is a
   GRID ITEM of .customer-programme-stack, and a grid item's default min-width is `auto`, so it
   refuses to shrink below its content's minimum — and its content is the rewards carousel, whose
   four 280px cards want 1150px. The column grew to fit them, the card grew with it, and the whole
   PAGE became horizontally scrollable. That is exactly what the owner photographed: the app bar
   is fixed and stays put while everything under it slides left, so the heading loses its first
   letter, the lede loses its last words, and the cards run off both edges.
   min-width:0 lets the column be the width of the viewport again; the carousel then scrolls

/* v339 (owner mockup "photo 1") — collapsed profile header, the reward/offers swipe region, the

.customer-programme-compact-head-v339 .customer-programme-head-icons-v337{position:absolute;top:0;right:0;display:flex;gap:10px;color:var(--muted)}
.customer-programme-compact-head-v339 .customer-programme-tier-jump-v327{flex:0 0 100%;justify-content:center;margin:0 auto}
/* v340 (gap 2): the back chevron moved out of the app-shell bar and into this header, inline
   with the business name. Absolutely positioned at the left edge so the centred name and logo
   keep the exact placement v339 gave them, with a 44px target for the tap. */
.customer-programme-back-v340{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border-radius:12px;color:var(--ink);text-decoration:none}

.customer-programme-back-v340:hover,.customer-programme-back-v340:focus-visible{background:var(--tint)}
.customer-reward-offer-swipe-v339{margin:0 0 10px}
.customer-reward-offer-track-v339{display:flex;align-items:flex-start;gap:10px;overflow-x:auto;overscroll-behavior-inline:contain;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:6px}
/* nestly_v395 (owner photo 1: "scrollable to see next reward"). The hero is a scroll-snap track —
   the same mechanism the offers region above uses, so there is one swipe idiom on this surface,
   not two. One page and it behaves exactly like the plain card it replaced: no dots, and with
   overflow-x:auto on a single full-width child there is nothing to scroll. */
.customer-business-hero-swipe-v395{min-width:0}
.customer-business-hero-track-v395{display:flex;align-items:stretch;gap:10px;overflow-x:auto;overscroll-behavior-inline:contain;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.customer-business-hero-track-v395::-webkit-scrollbar{display:none}
.customer-business-hero-page-v395{flex:0 0 100%;min-width:0;scroll-snap-align:start;display:flex}
.customer-business-hero-page-v395>*{flex:1;min-width:0;margin-bottom:0}
.customer-business-hero-dots-v395{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px 0 2px}
.customer-business-hero-dot-v395{width:6px;height:6px;border-radius:50%;background:var(--peekaa-border,#E4DED7);transition:background .18s ease,width .18s ease}
.customer-business-hero-dot-v395.is-active{width:18px;border-radius:999px;background:var(--peekaa-red,#C24135)}
/* nestly_v397 (owner photo B, "put here" with the pill redrawn at the card's top-left). The New
   flag sits on the artwork now instead of taking a line of the copy. It is the same .customer-offer-new
   pill — same tint, radius and type — only its position changed; the card is already
   position:relative, and overflow:hidden keeps it inside the rounded corner. */
.customer-offer-new-corner-v397{position:absolute;z-index:3;top:10px;left:10px;margin:0;pointer-events:none}
/* A reward NAME is prose, not a figure. It deliberately does NOT reuse .customer-business-balance-v347:
   that face is 56px/white-space:nowrap and every one of its declarations is !important, so
   "Complimentary 60-minute aromatherapy massage with hot stones" ran 1791px wide in a 298px box and
   was clipped straight out of the card (measured). Same Georgia display family and weight as the
   hero figure it sits in place of, sized to fit and stopped at two lines. */
.customer-business-reward-name-v395{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%;margin:2px 0 0;font-family:Georgia,'Times New Roman',serif;font-weight:760;font-size:clamp(1.35rem,6.4vw,2rem);line-height:1.08;letter-spacing:-.02em;overflow-wrap:anywhere}

/* v342 (owner: "the promotions are elongated - shrink to horizontal like Grab/Fave"): the
   promo pages after the reward-ready page reused customerPromotionCardV104's full vertical
   layout (up to 220px of artwork + copy) unchanged, which also forced the whole swipe TRACK's
   height to that tall card even while it sat scrolled off-screen — the real cause of the empty
   space under the short reward banner, since a flex row's height always matches its tallest
   child regardless of align-items. This override only applies inside the swipe carousel; the
   full-size card (all-offers grid, admin preview) is untouched. */
/* v392 (owner: "for the photo i need it to be fitting to the screen as much as possible").
   The swipe card was a row with an 84px thumbnail — on offers whose artwork IS the offer (the
   National Day posters carry their own wording), that thumbnail was too small to read, so the
   picture did no work. The card is a column again with the artwork on top at the largest size
   that fits.
   It is still never cropped (V173/V371, reaffirmed by the owner 2026-08-19 when asked directly):
   the image keeps its own proportions and is centred, so a tall poster is bounded by the height
   cap and a wide one by the card width. The space either side of a portrait poster is the card's
   own dark background, which reads as a frame rather than as letterbox bars. */

/* v392: the sheet's poster is the thing the customer opened the sheet to read, so it takes as
   much of the screen as it can. The frame is TRANSPARENT and the picture is centred inside it,
   rather than the picture sitting on a tinted panel — that is what removes the bars, without
   cropping a single pixel. (A width:fit-content frame was tried first and collapsed: the image's
   max-width:100% and the frame's fit-content width resolve against each other.) Capped at 72vh so the title, validity and Book now stay reachable
   by scrolling rather than being pushed off a phone screen. */
.customer-offer-detail-media{position:relative;width:100%;margin:12px 0;text-align:center;background:transparent}

.customer-home-offers{margin:0 0 12px}.customer-home-offers-track{gap:12px;margin:0 -16px;padding:0 16px 12px;scroll-padding-inline:16px}.customer-home-offer{flex:0 0 min(72vw,288px)!important;min-height:266px!important;height:266px;border-radius:20px;overflow:hidden}/* nestly_v395 (owner photo 2: "picture too small", drawn across the whole top strip of the card). The artwork had 82px of a 214px card — and because V371 correctly letterboxes it rather than cropping, a landscape photo shrank to a thin band with empty gutters either side. The media block takes 130px now and the card grows to match, so the picture is the thing the customer sees first. object-fit:contain is untouched: the merchant's image is still never cropped. */.customer-home-offer-media{aspect-ratio:auto;height:130px}.customer-home-offer-copy{position:relative;min-height:auto;height:136px;padding:24px 10px 12px}.customer-home-offer-copy::before{top:-22px;height:50px;background:var(--peekaa-card)}.customer-home-offer-logo{position:static;top:auto;left:auto;flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:5px solid var(--peekaa-card);box-shadow:var(--shadow-warm)}.customer-offer-new{top:9px;left:10px;min-height:24px;padding:0 10px;font-size:12px}.customer-home-offer-copy h3{font-size:15px!important;line-height:1.02!important;font-weight:760;letter-spacing:0;color:var(--peekaa-text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}/* v386 (owner photo 1, "put company name"): this rule was written to drop the validity line, which is a direct child <p class="muted small">, but .muted also matches the business-name <span> NESTED inside .customer-home-offer-business — so the card painted a merchant avatar with no merchant beside it. Scoped to direct children, which is the set it was always meant to hide. */.customer-home-offer-copy>.muted{display:none}/* v386 fix-2 (owner: "i still dont see the company name"). Un-hiding the name was not enough: it sat in flow BELOW the title, in the 38px strip the absolutely-positioned "Ends in N days" pill occupies, so the pill painted straight over it (elementFromPoint at the name's centre returned the countdown). The name is now the FIRST line of the copy block, indented clear of the 46px avatar so it reads beside it — which is exactly where the owner drew it — and the copy block became a flex column so `order` can hoist it without moving it in the markup (the desktop/tablet layouts keep the original order). */.customer-home-offer-copy{display:flex;flex-direction:column}/* nestly_v395 (owner photo 2: the avatar and the name ringed together, "move here" with an arrow pointing to the right of the avatar). v386 hoisted the name to the first line of the copy with order:-2 and meant it to sit BESIDE the 46px avatar, but the avatar is position:absolute at top:-30px while the name stayed in flow — so the name began exactly where the avatar ended and read as a caption UNDER it. The row is pinned to the avatar's own box now (same top/left origin, same 46px height) and indented past it, so the two read as one line: coin, then name. Out of flow, so the copy column below is unaffected and nothing can reflow into it. */.customer-home-offer-business{position:absolute!important;top:-30px;left:10px;right:10px;z-index:2;margin:0;min-height:46px;height:46px;display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.05em;color:var(--peekaa-text-secondary);font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.customer-home-offer-meta{order:-1}.customer-home-offer-copy h3{order:0;flex:0 0 auto}/* The countdown is a line of the copy now (see customerHomeOfferMarkupV167), so it sorts after the title rather than floating over the artwork. */.customer-home-offer-copy>.customer-home-offer-countdown{order:1;align-self:flex-start;margin-top:8px}

/* v190 (owner: "change the background to same as business background (beige) instead of
   black; light/dark can be adjusted in the profile module"). The customer surface used to flip
   to dark purely because the DEVICE was in dark mode, so one person saw a beige workspace and a
   black wallet on the same phone. Beige is the default for everyone now; these tokens apply
   only when the customer has chosen dark — or chosen to follow their device — in
   Profile → Appearance, which is what sets data-customer-theme on <html>. */
html[data-customer-theme="dark"][data-customer-surface="true"] body{background:#0F1115}
  /* The offer-detail sheet is appended to body, outside .customer-surface,
     so it must join the dark token scope explicitly. */
html[data-customer-theme="dark"] .customer-surface,
html[data-customer-theme="dark"] .customer-offer-detail-modal .modal-card,
html[data-customer-theme="dark"] .customer-business-detail-modal .modal-card{

    --bg:#0F1115;--card:#191C22;--ink:#F7F4EF;--ink2:#D8D2CA;--muted:#AAA3AD;--muted-on-soft:var(--muted);
    --line:#343841;--control-border:#737A86;--hair:rgba(255,255,255,.11);
    --coral:var(--brand-red-on-dark);--coral-hover:var(--brand-red-on-dark-2);--amber:#F2C078;--green:#78D5A7;--red:#FF9E95;
    /* A FILLED brand surface keeps the deeper gradient. --brand-red-on-dark exists to carry brand
       red as TEXT or an icon on a dark ground; white on #E4776B measures 2.9:1, so a button painted
       with it fails the label it carries. #C24135 under white is 5.8:1 and still reads as Peekaa. */
    --grad:linear-gradient(135deg,var(--brand-red),var(--brand-red-dark));--tint:#3A211F;
    --brand-red-soft:var(--brand-red-soft-on-dark);--brand-red-faint:var(--brand-red-faint-on-dark);
    --brand-red-on-soft:var(--brand-red-on-dark);
    /* ===== the semantic pairs get dark GROUNDS, not light ones ===============================
       Wave 1 introduced one colour pair per meaning; this block was written before it, so a
       "Ends soon" chip painted #FFF3D6 and an "Appointment" pill painted #E7F6EE straight onto a
       #191C22 card. Dark inverts the pair — a deep desaturated ground carrying light type — rather
       than dimming the light one, which would have kept dark text on a pale plate. */
    --success:#78D5A7;--success-bg:#183A2D;
    --danger:#FF9E95; --danger-bg:#432321;
    --warn:#F2C078;   --warn-bg:#4A3816;
    --neutral-bg:#292C33;
    --gold:#E3C173;   --gold-bg:#3D3218;
    --bg-cust:#0F1115;--head-tint:#20242C;
    --shadow:0 1px 2px rgba(0,0,0,.2),0 5px 16px rgba(0,0,0,.24);
    --shadow-lg:0 3px 8px rgba(0,0,0,.28),0 20px 52px rgba(0,0,0,.4);
    /* Warm shadows are cast in a brown ink at 5-11% alpha — literally invisible over #0F1115.
       Dark separates surfaces with a deeper, blacker shadow; the brand glow keeps its hue but needs
       roughly double the alpha to register at all. */
    --shadow-warm:0 1px 2px rgba(0,0,0,.34),0 8px 24px rgba(0,0,0,.36);
    --shadow-warm-lg:0 4px 10px rgba(0,0,0,.42),0 18px 44px rgba(0,0,0,.48);
    --glow-brand:0 8px 26px rgba(194,65,53,.5);
    /* ===== the --peekaa-* aliases are NOT self-following — measured, not assumed ==============
       At :root they read `--peekaa-card:var(--card)`, and a custom property containing var() is
       substituted at computed-value time ON THE ELEMENT THAT DECLARES IT. :root is light, so every
       alias froze to its light value there and inherited down as a literal; redefining --card on
       this descendant could never move them. Before this block, dark measured --peekaa-card
       #FFFFFF, --peekaa-text #17161A and --peekaa-bg #F8F4F1 — and the V343/V345 customer shell
       paints its page, its cards and its type from exactly those three, so the customer app was
       still light beige under a dark <body>, with dark ink on dark cards where the base tokens did
       reach. They are re-declared HERE, on the element the dark values live on, which is the only
       place the substitution can pick them up. Keep them in step with the base tokens above. */
    --peekaa-bg:#0F1115;--peekaa-card:#191C22;--peekaa-white:#191C22;
    --peekaa-text:#F7F4EF;--peekaa-text-secondary:#AAA3AD;--peekaa-text-muted:#AAA3AD;
    --peekaa-border:#343841;--peekaa-divider:#343841;
    --peekaa-success:#78D5A7;--peekaa-success-bg:#183A2D;
    --peekaa-gold:#E3C173;--peekaa-gold-bg:#3D3218;
    --peekaa-red:var(--brand-red-on-dark);--peekaa-red-dark:var(--brand-red-dark);
    --peekaa-red-soft:var(--brand-red-soft-on-dark);--peekaa-red-faint:var(--brand-red-faint-on-dark);

function stampQuestNormaliseV323(card){
  if(!card||typeof card!=='object'||card.enabled!==true||card.contract!=='v323')return null;
  const whole=value=>Math.max(0,Math.floor(Number(value)||0));
  const slots=whole(card.slots),filled=whole(card.filled);
  const milestones=(Array.isArray(card.milestones)?card.milestones:[])
    .map(rung=>({slot:whole(rung?.slot),name:String(rung?.name||'').trim(),
      claimed:rung?.claimed_this_cycle===true,availability:String(rung?.availability||''),
      isFinal:rung?.is_final===true,toGo:whole(rung?.stamps_to_go)}))
    .filter(rung=>rung.slot>0)
    .sort((a,b)=>a.slot-b.slot);
  return {slots,filled,
    /* The card shows the CURRENT cycle. Anything past its end is CARRIED and said out loud, never
       absorbed into an invisible completed card the customer was never shown. */
    shown:slots>0?Math.min(filled,slots):filled,
    carried:slots>0?Math.max(filled-slots,0):0,
    cycle:whole(card.cycle_index),
    running:card.running!==false,
    ready:card.ready===true,
    potMigrated:card.pot_migrated===true,
    milestones,
    next:milestones.find(rung=>!rung.claimed)||null};
}

    Array.from({length:total},(unused,index)=>{
      const slot=index+1,rung=marks.get(slot),collected=index<quest.shown;
      return `<span class="customer-programme-stamp-ring${collected?' is-filled':''}${rung?' is-goal':''}" data-stamp-quest-slot-v323="${slot}"${rung?` data-stamp-quest-claimed-v323="${rung.claimed?'yes':'no'}"`:''} aria-hidden="true">${
        collected?'<svg viewBox="0 0 16 16" width="12" height="12" focusable="false"><path d="M3.2 8.6l3.1 3.1L12.8 5" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</span>`;

function openCustomerBusinessShortcutPageV348({action='',title='Details',target=null}={}){
  const page=$('customerBusinessShortcutPageV348'),main=$('customerBusinessMainV348'),content=$('customerBusinessShortcutContentV348'),heading=$('customerBusinessShortcutTitleV348');
  if(!page||!main||!content||!target)return;

     ONE section, so both screens painted the whole programme stack and the owner saw the tier
     ladder inside Points & gifts ("dont show 'Tier' in 'Points & gift'") and the stamp card
     inside Tier benefits ("dont show this in Tier"). The stack is still rendered once — two
     copies would give the rewards list two mount points with one id — and the cards that do not
     belong to the tile the customer actually tapped are hidden for as long as this page is open,
     then restored on close. Hiding rather than detaching keeps loadRewards/loadTier writing into
     live nodes, so a section that arrives while the page is open still lands. */
  const hiddenByShortcutV386=[];

       guidance, so they follow the points half rather than standing alone over a tier ladder —
       the page already carries "Tier benefits" as its title. */

      if(node.hidden)return;

    hiddenByShortcutV386.forEach(node=>{node.hidden=false});

    placeholder.remove();
