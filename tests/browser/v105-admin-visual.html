  gap:10px;padding:max(12px,env(safe-area-inset-top)) max(34px,env(safe-area-inset-right))
    12px max(34px,env(safe-area-inset-left));border-bottom:1px solid var(--hair);
  background:rgba(232,227,218,.94);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.profile{position:relative}
.profile .who{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px 6px 6px;border-radius:100px;
  cursor:pointer;background:#fff;border:1px solid var(--hair);box-shadow:var(--shadow);
  transition:transform .2s var(--spring),box-shadow .2s var(--ease)}
.profile .who:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.profile .who:active{transform:scale(.975)}
.profile .who .chev{font-size:9px;color:var(--muted);margin-left:2px}
.profile .avatar{width:30px;height:30px;border-radius:100px;background:var(--grad);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;
  box-shadow:0 2px 6px rgba(255,107,94,.3)}
/* menu now drops DOWN from the top-right chip (was: up from the bottom-left rail) */
.profile .menu{position:absolute;top:calc(100% + 8px);right:0;min-width:212px;
  background:rgba(255,255,255,.86);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border:1px solid var(--hair);border-radius:var(--r-sm);padding:6px;box-shadow:var(--shadow-lg);
  transform-origin:top right;animation:pop .2s var(--spring)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(-6px)}to{opacity:1;transform:scale(1) translateY(0)}}
.profile .menu a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
  color:var(--ink2);font-size:13.5px;font-weight:500;white-space:nowrap}
.profile .menu a:hover{background:#F2EFEA;color:var(--ink)}
.profile-menu-section{padding:8px 12px;border-top:1px solid var(--hair);margin-top:4px}
.profile-menu-section:first-child{border-top:0;margin-top:0}
.profile-menu-section label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:0 0 6px;display:block}
.profile-menu-section input,.profile-menu-section select{min-height:40px;font-size:14px;border-radius:12px}
.profile-menu-section .row{gap:6px;align-items:center}
.profile-menu-saved{font-size:12px;color:var(--ok);min-height:16px;margin-top:4px}
.business-workspace-switch,.customer-workspace-switch{position:relative}
.business-workspace-switch>summary,.customer-workspace-switch>summary{list-style:none}
.business-workspace-switch>summary::-webkit-details-marker,.customer-workspace-switch>summary::-webkit-details-marker{display:none}
.business-workspace-switch .menu,.customer-workspace-switch .menu{position:absolute;top:calc(100% + 8px);right:0;z-index:42;
  min-width:224px;background:rgba(255,255,255,.94);border:1px solid var(--hair);border-radius:var(--r-sm);
  padding:6px;box-shadow:var(--shadow-lg);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
.business-workspace-switch .menu a,.customer-workspace-switch .menu a{display:flex;align-items:center;min-height:44px;
  padding:9px 12px;border-radius:8px;color:var(--ink2);font-size:13.5px;font-weight:600;white-space:nowrap}
.business-workspace-switch .menu a:hover,.customer-workspace-switch .menu a:hover{background:#F2EFEA;color:var(--ink)}
/* notification bell — sits left of the profile chip, same frosted-popover language */
.bellwrap{position:relative}
.bellbtn{position:relative;width:44px;height:44px;border-radius:100px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;background:#fff;border:1px solid var(--hair);box-shadow:var(--shadow);
  font-size:16px;transition:transform .2s var(--spring),box-shadow .2s var(--ease)}
.bellbtn:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.bellbtn:active{transform:scale(.94)}
.bellbtn .dot{position:absolute;top:-3px;right:-3px;background:var(--coral);color:#fff;border-radius:100px;
  min-width:16px;height:16px;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  padding:0 3px;box-shadow:0 0 0 2px #fff}
.notif-menu{position:absolute;top:calc(100% + 8px);right:0;width:320px;max-width:calc(100vw - 40px);
  background:rgba(255,255,255,.86);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border:1px solid var(--hair);border-radius:var(--r-sm);padding:8px;box-shadow:var(--shadow-lg);
  transform-origin:top right;animation:pop .2s var(--spring);max-height:420px;overflow-y:auto;z-index:41}
.notif-item{display:block;width:100%;padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;background:transparent;color:inherit;transition:background .14s var(--ease)}
.notif-item:hover{background:#F2EFEA}
.notif-item.unread{background:var(--tint)}
.notif-item .t{font-size:13px;font-weight:600;color:var(--ink)}
.notif-item .b{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.notif-item .ago{font-size:10.5px;color:var(--muted);margin-top:4px}
.notif-empty{text-align:center;padding:24px 12px;color:var(--muted);font-size:13px}
/* global top-bar action cluster — search + everyday actions, sits left of the bell so the
   jobs used all day (find a customer, quick earn, new appointment) are one reach from any route */
.global-actions{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0;margin-right:auto}
.global-search{display:flex;align-items:center;gap:6px;flex:0 1 340px;min-width:0;height:44px;padding-left:13px;
  background:#fff;border:1px solid var(--hair);border-radius:100px;box-shadow:var(--shadow);
  transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
.global-search:focus-within{border-color:var(--coral);box-shadow:0 0 0 3px rgba(255,107,94,.18)}
.global-search-ic{display:inline-flex;align-items:center;color:var(--muted);flex-shrink:0}
.global-search input{flex:1 1 auto;min-width:0;width:auto;min-height:0;height:42px;border:0;background:transparent;
  box-shadow:none;padding:0 4px;font-size:13.5px;color:var(--ink)}
.global-search input:focus{outline:none;border:0;box-shadow:none}
.global-search-go{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex-shrink:0;
  border-radius:100px;background:var(--grad);color:#fff;box-shadow:0 1px 2px rgba(194,65,53,.2)}
.global-search-go:active{transform:scale(.92)}
.global-quick{display:flex;align-items:center;gap:8px;flex-shrink:0}
.global-act{white-space:nowrap}.global-act svg{flex-shrink:0}
.dashboard-appbar-branch{display:block;flex:0 1 196px;min-width:150px}
.dashboard-appbar-branch select{width:100%;min-width:0;margin:0;background:#fff;box-shadow:var(--shadow);font-size:13px}
.dashboard-mobile-branch{display:none}
.mobile-page-title,.mobile-search-trigger,.mobile-search-sheet{display:none}
.mobile-page-title{min-width:0;align-items:center;gap:9px;font-weight:750;color:var(--ink)}
.mobile-page-title .mobile-page-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--tint);color:var(--coral)}
.mobile-page-title span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mobile-search-trigger{width:44px;height:44px;border-radius:999px;background:#fff;border:1px solid var(--hair);box-shadow:var(--shadow);color:var(--ink2);align-items:center;justify-content:center}
.mobile-search-sheet[open]{display:block;position:fixed;inset:0;z-index:190;background:rgba(23,22,26,.22);padding:max(16px,env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom))}
.mobile-search-panel{margin:0 auto;background:#fff;border:1px solid var(--hair);border-radius:20px;padding:14px;box-shadow:var(--shadow-lg);max-width:520px}
.mobile-search-panel .row{gap:8px}.mobile-search-panel input{font-size:16px}
.mobile-action-sheet{display:grid;gap:10px;padding:8px 6px 12px;border-bottom:1px solid var(--hair);margin-bottom:8px}
.mobile-action-sheet .workspace-language-picker{width:100%;min-width:0;border-radius:12px;font-size:16px}
.mobile-action-sheet .btn{width:100%;justify-content:center}
.mobile-language-label{font-size:11.5px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.mobile-workspace-summary{padding:10px 11px;border:1px solid var(--hair);border-radius:13px;background:#FBFAF8}
.mobile-workspace-summary b,.mobile-workspace-summary span{display:block;overflow-wrap:anywhere}
.mobile-workspace-summary .muted{font-size:12px;line-height:1.35}
/* Phone-first staff navigation. The high-frequency jobs stay thumb-reachable while the
   complete, permission-filtered workspace navigation remains available behind More. */
.staff-mobile-dock{display:none}
.staff-mobile-more{position:relative;min-width:0}
.staff-mobile-more>summary{list-style:none}
.staff-mobile-more>summary::-webkit-details-marker{display:none}
.staff-mobile-drawer{position:absolute;right:0;bottom:calc(100% + 10px);width:min(330px,calc(100vw - 24px));
  max-height:min(68dvh,560px);overflow:auto;padding:10px;background:rgba(255,255,255,.97);
  border:1px solid var(--hair);border-radius:18px;box-shadow:var(--shadow-lg);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
.staff-mobile-drawer .nav{display:block}
.staff-mobile-drawer .navhead{margin-top:6px}
.staff-mobile-drawer .navbody a{padding-left:22px}
.staff-mobile-action{min-width:0;min-height:52px;padding:5px 2px;border-radius:12px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:650}
.staff-mobile-action svg{width:20px;height:20px}
.staff-mobile-action.act{color:var(--coral);background:var(--tint)}
.staff-mobile-action:active{transform:scale(.96)}
.team-member-card,.staff-invite-card{padding:11px 0;border-bottom:1px solid var(--line)}
.team-member-card .row,.staff-invite-card .row{gap:8px}
.team-member-main,.staff-invite-main{min-width:0}
.team-member-main b,.staff-invite-main b{overflow-wrap:anywhere}
.staff-invite-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.09em;font-weight:800;color:var(--ink)}
.staff-invite-meta{display:grid;gap:4px;margin-top:7px;color:var(--muted);font-size:12.5px}
.staff-invite-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.staff-invite-actions .btn{min-height:40px}
/* settings — tabbed sections so each save has a clear, small scope instead of one long page */
.settings-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.settings-tab{min-height:44px;padding:10px 15px;border:0;border-bottom:2px solid transparent;background:transparent;
  color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;border-radius:10px 10px 0 0;white-space:nowrap;
  transition:color .14s,background .14s,border-color .14s}
.settings-tab:hover{color:var(--ink2);background:#F2EFEA}
.settings-tab[aria-selected="true"]{color:var(--coral);border-bottom-color:var(--coral)}
.settings-panel[hidden]{display:none}
.settings-save-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.settings-save-row .btn{flex:0 0 auto}
.workspace-logo-editor{display:grid;grid-template-columns:92px minmax(0,1fr);gap:16px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.workspace-logo-preview{width:92px;height:92px;border-radius:24px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;overflow:hidden;font-size:30px;font-weight:800;color:var(--red)}
.workspace-logo-preview img{width:100%;height:100%;object-fit:cover;display:block}
.workspace-logo-fields{min-width:0}
.settings-scope{color:var(--muted);font-size:12px;line-height:1.4;flex:1 1 160px;min-width:0}
.switchrow{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 4px;font-size:12.5px;color:var(--ink2)}
.tglsw{position:relative;width:44px;height:44px;border-radius:100px;background:transparent;cursor:pointer}
.tglsw::before{content:'';position:absolute;left:4px;top:11px;width:36px;height:21px;border-radius:100px;background:var(--line);
  transition:background .18s var(--ease);flex-shrink:0}
.tglsw.on::before{background:var(--green)}
.tglsw::after{content:'';position:absolute;top:13px;left:6px;width:17px;height:17px;border-radius:100px;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s var(--spring)}
.tglsw.on::after{transform:translateX(15px)}
/* universal importer modal */
.modal{position:fixed;inset:0;z-index:210;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(23,22,26,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .18s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:640px;max-width:100%;
  max-height:88vh;overflow-y:auto;padding:26px;animation:pop .22s var(--spring);transform-origin:center}
.seg{display:inline-flex;gap:4px;background:#F1EEE9;border-radius:100px;padding:3px}
.seg button{background:transparent;border-radius:100px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.act{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.imp-prev{border:1px solid var(--hair);border-radius:var(--r-sm);overflow:hidden;margin-top:14px}
.imp-prev table{font-size:12px}.imp-prev th,.imp-prev td{padding:7px 10px}
.imp-note{background:var(--tint);color:#8a4a2e;border-radius:var(--r-sm);padding:9px 12px;font-size:12px;margin-top:12px}
.reward-list{display:grid;gap:10px;margin-top:12px}
.reward-item{border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 14px;background:#fff}
.reward-item .meta{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.reward-editor{margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}
.reward-editor .field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.reward-editor .field-grid .full{grid-column:1/-1}
.reward-editor details{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.reward-editor summary{cursor:pointer;font-weight:650;color:var(--ink2);list-style:none}
.reward-editor summary::-webkit-details-marker{display:none}
.reward-editor summary::after{content:'+';float:right;color:var(--muted);font-size:18px;line-height:1}
.reward-editor details[open] summary::after{content:'−'}
.eligibility-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px}
.eligibility-group{background:#FBFAF8;border:1px solid var(--hair);border-radius:var(--r-sm);padding:10px}
.eligibility-group label{display:flex;align-items:center;gap:7px;margin:7px 0 0;color:var(--ink2);font-size:13px;font-weight:500;cursor:pointer}
.eligibility-group input[type=checkbox]{width:auto;margin:0}
.reward-editor .help{margin-top:5px;line-height:1.45}
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.reward-context{width:auto;min-width:110px;max-width:160px;margin:0;padding:7px 28px 7px 9px;font-size:12px}
@media(max-width:700px){.field-grid,.reward-editor .field-grid,.eligibility-grid{grid-template-columns:1fr}}
/* --- Grow recommender: give-back meter + suggestion panels (see app/grow-recommender.js) --- */
.gb-meter{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;background:#FBFAF8}
.gb-meter-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.gb-meter-figure{font-size:1.45rem;font-weight:700;letter-spacing:-.02em;line-height:1}
.gb-meter-bar{margin-top:10px;height:9px;border-radius:100px;background:#EFEAE3;overflow:hidden}
.gb-meter-fill{display:block;height:100%;border-radius:100px;transition:width .22s var(--ease),background-color .22s var(--ease)}
.gb-meter.is-good .gb-meter-figure{color:var(--green)} .gb-meter.is-good .gb-meter-fill{background:var(--green)}
.gb-meter.is-watch .gb-meter-figure{color:var(--amber)} .gb-meter.is-watch .gb-meter-fill{background:var(--amber)}
.gb-meter.is-high .gb-meter-figure{color:var(--red)} .gb-meter.is-high .gb-meter-fill{background:var(--red)}
.gb-meter.is-blank .gb-meter-figure{color:var(--muted)} .gb-meter.is-blank .gb-meter-fill{background:var(--muted)}
.gb-meter p{margin-top:8px;line-height:1.5}
.gb-scale{display:flex;justify-content:space-between;margin-top:6px;font-size:11.5px;color:var(--muted)}
.rec-panel{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.rec-figures{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.rec-figure{border:1px solid var(--hair);border-radius:var(--r-sm);background:#FBFAF8;padding:11px 12px}
.rec-figure b{display:block;font-size:1.2rem;letter-spacing:-.02em}
.rec-figure span{display:block;margin-top:3px;font-size:11.5px;color:var(--muted)}
.rec-why{margin-top:12px;padding-left:18px;line-height:1.6;font-size:12.5px;color:var(--ink2)}
.rec-why li{margin-top:5px}
input[type=range]{min-height:auto;padding:0;border:none;background:none;accent-color:var(--coral);width:100%}
input[type=range]:focus{box-shadow:none}
@media(max-width:700px){.rec-figures{grid-template-columns:1fr}}
.main{padding:26px max(34px,env(safe-area-inset-right))
  calc(46px + env(safe-area-inset-bottom)) max(34px,env(safe-area-inset-left));
  max-width:1240px;width:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:1.85rem;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:14px}
/* V180: the four waitlist counters are one funnel — waiting → added → booked → removed — but
   rendered as four unrelated cards nobody read as a sequence. Chevrons sit in the grid gaps to
   make the steps explicit. The column count is pinned rather than auto-fit so the arrow can
   never point at a wrapped line break, and it flips to point downward once the cards stack. */
.wl-flow{grid-template-columns:1fr}
.wl-flow>*{position:relative}
.wl-flow>*:not(:last-child)::after{content:'\203A';position:absolute;z-index:1;color:var(--coral);font-size:28px;font-weight:700;line-height:1;pointer-events:none;top:auto;bottom:-14px;right:50%;transform:translate(50%,50%) rotate(90deg)}
@media(min-width:900px){
  .wl-flow{grid-template-columns:repeat(4,minmax(0,1fr))}
  .wl-flow>*:not(:last-child)::after{top:50%;bottom:auto;right:-14px;transform:translate(50%,-50%) rotate(0)}
}
.kpi{transition:transform .24s var(--spring),box-shadow .24s var(--ease)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
/* Tabular figures stop KPI numbers from jittering as they update */
.kpi .v{font-family:var(--sf);font-size:1.75rem;font-weight:680;margin-top:3px;
  letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
/* Waitlist conversion queue — big pictogram rows, one primary action each */
.wl-add-grid{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:4px}
.wl-add-grid .wl-fld{display:flex;flex-direction:column;gap:4px;flex:1 1 150px;min-width:0}
.wl-add-grid .wl-fld label{font-size:12px;color:var(--muted);font-weight:600}
.wl-add-grid input,.wl-add-grid select{margin:0}
.wl-list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.wl-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff}
.wl-row.contacted{background:#FBFAF8}
.wl-rank{flex:0 0 auto;width:38px;height:38px;border-radius:100px;display:flex;align-items:center;justify-content:center;background:var(--tint);color:var(--coral);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.wl-main{flex:1 1 auto;min-width:0}
.wl-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:1.02rem}
.wl-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px}
.wl-meta .sep{opacity:.45}
.wl-wait{font-weight:600}
.wl-wait.urgent{color:var(--red)}
.wl-notes{margin-top:3px}
.wl-actions{flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.wl-x{padding:8px 12px}
@media(max-width:640px){.wl-row{flex-wrap:wrap}.wl-actions{width:100%;justify-content:flex-start}.wl-actions>.btn{flex:1 1 auto}}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.charts .card{min-height:280px}
.chart-frame{position:relative;block-size:240px;min-block-size:0;margin-top:12px;overflow:hidden}
.chart-frame canvas{position:absolute;inset:0;display:block;width:100% !important;height:100% !important;max-height:100%}
.expiry-days-field[hidden]{display:none}
.range{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.range input{width:auto}
/* segmented control, iOS-style */
.qbtn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;background:#fff;border:1px solid var(--control-border);border-radius:100px;padding:9px 14px;font-size:12.5px;
  font-weight:600;color:var(--muted);box-shadow:var(--shadow);
  transition:transform .18s var(--spring),color .14s,background .14s}
.qbtn:hover{color:var(--ink)}
.qbtn:active{transform:scale(.94)}
.qbtn.act{background:var(--ink);color:#fff;border-color:var(--ink)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-width:0;max-width:100%}
.split>*{min-width:0;max-width:100%}
#slist{min-width:0;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:10px;align-items:center}
.settings-page,.settings-page .split,.settings-page .card{min-width:0;max-width:100%}
.settings-page .row>*{min-width:0}
.settings-page input[type="file"]{max-width:100%}
.reports-grid{grid-template-columns:repeat(2,minmax(0,1fr));width:100%;min-width:0;max-width:100%}
.reports-grid>.card{min-width:0;max-width:100%}.reports-grid table{table-layout:fixed}.reports-grid td{overflow-wrap:anywhere}
.portal-link-row{margin-top:4px;min-width:0;max-width:100%}
.portal-link{display:flex;align-items:center;width:100%;min-width:0;max-width:100%;min-height:44px;padding:8px 0;
  color:#A64020;font-weight:700;line-height:1.4;text-decoration:underline;text-underline-offset:3px;
  overflow-wrap:anywhere;word-break:break-word;white-space:normal}
.settings-choice{display:flex;align-items:flex-start;gap:10px;min-height:44px;padding:6px 0;margin:6px 0;cursor:pointer;font-size:14px;color:var(--ink);font-weight:500}
.settings-choice>input{flex:0 0 auto;width:24px;min-height:24px;margin-top:4px}
.checkout-catalogue-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.checkout-catalogue-list{display:grid;gap:8px;margin-top:14px}
.checkout-catalogue-item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;
  min-height:64px;padding:10px 12px;border:1px solid var(--hair);border-radius:var(--r-sm);background:#fff}
.checkout-catalogue-item p{margin:3px 0 0}.checkout-catalogue-item .btn{min-height:44px;min-width:92px}
.checkout-catalogue-filter{display:grid;grid-template-columns:minmax(0,280px);margin-top:14px}
.retention-taxonomy-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;min-width:0;padding:8px 0;border-bottom:1px solid var(--line)}
.retention-taxonomy-copy{display:flex;align-items:center;flex:1 1 180px;flex-wrap:wrap;gap:8px;min-width:0}.retention-taxonomy-copy>span:first-child{min-width:0;overflow-wrap:anywhere}
.retention-taxonomy-actions{display:flex;align-items:center;flex:0 1 auto;flex-wrap:wrap;gap:8px;min-width:0}
/* Grow overview: one journey first, engine-specific editors only on demand. */
.grow-overview{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:920px;margin:0 auto}
.grow-hero{display:grid;grid-template-columns:minmax(0,1fr);justify-items:start;gap:14px;padding:20px;
  border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(135deg,#fff 0%,var(--tint) 100%);box-shadow:var(--shadow)}
.grow-hero-copy{max-width:620px}.grow-hero-copy h1{font-size:clamp(1.8rem,4vw,2.35rem);margin:0}
.grow-hero-copy p{max-width:58ch;margin-top:6px;line-height:1.5}
.grow-primary{min-height:48px;white-space:normal}
.grow-secondary{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:0 18px;box-shadow:var(--shadow)}
.grow-secondary>summary{display:flex;align-items:center;min-height:56px;cursor:pointer;font-weight:700;color:var(--ink)}
.grow-secondary-body{display:grid;gap:18px;padding:0 0 18px}.grow-secondary-intro{padding:2px 2px 0}
.reward-auto-dialog{display:grid;grid-template-rows:auto minmax(0,1fr) auto;width:min(560px,100%);max-width:560px;max-height:min(92dvh,720px);overflow:hidden}
.reward-auto-head{display:flex;align-items:flex-start;gap:14px}.reward-auto-head>div{min-width:0;flex:1}
.reward-auto-content{min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 2px}
.reward-auto-step{margin-top:18px}.reward-auto-step h3{font-size:18px;margin-top:4px}
.reward-auto-choice{display:flex;align-items:flex-start;gap:12px;min-height:64px;padding:13px;margin-top:14px;border:1px solid var(--coral);border-radius:14px;background:var(--tint)}
.reward-auto-choice input{flex:0 0 auto;width:22px;min-height:22px;margin-top:2px}.reward-auto-choice label{margin:0;color:var(--ink);font-size:14px}.reward-auto-choice p{margin-top:4px}
.reward-auto-summary{display:grid;gap:9px;margin-top:14px}.reward-auto-summary>div{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--hair)}
.reward-auto-summary dt{color:var(--muted)}.reward-auto-summary dd{font-weight:700;text-align:right;overflow-wrap:anywhere}
.reward-auto-actions{position:sticky;bottom:0;z-index:1;display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--hair);background:#fff}.reward-auto-actions .btn{min-height:44px}
.reward-auto-status{min-height:22px;margin-top:12px}.reward-auto-safety{padding:12px;border-radius:12px;background:#E7F6EE;color:#1f6c46;line-height:1.5}
.grow-flow{display:grid;grid-template-columns:1fr;gap:8px;list-style:none;padding:0;margin:0}
.grow-flow-step{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;column-gap:12px;min-width:0;min-height:76px;padding:12px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;box-shadow:var(--shadow)}
.grow-flow-step:not(:last-child)::after{display:none}
.grow-flow-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:var(--tint);color:var(--coral)}
.grow-flow-step h2{font-size:16px;margin:0 0 3px}.grow-flow-step p{font-size:12.5px;line-height:1.45;color:var(--muted);margin:0}
.grow-flow-step h2,.grow-flow-step>p{grid-column:2}.grow-flow-icon{grid-row:1/3}.grow-flow-foot{grid-column:3;grid-row:1/3;display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}.grow-flow-foot .btn{min-height:44px}
.reward-milestone-track{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;list-style:none;margin:14px 0 0;padding:0}
.grow-programme-list{display:grid;grid-template-columns:1fr;gap:0;margin-top:14px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.grow-programme-row{appearance:none;display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-width:0;min-height:72px;padding:12px 14px;border:0;border-bottom:1px solid var(--hair);background:#fff;color:var(--ink);font:inherit;text-align:left;text-decoration:none}
.grow-programme-row:last-child{border-bottom:0}.grow-programme-row>div{min-width:0}.grow-programme-row b,.grow-programme-row p{overflow-wrap:anywhere}.grow-programme-row p{margin:3px 0 0;line-height:1.4}
.grow-programme-row .rewards-overview-edit-label{min-height:24px;margin-top:3px}
button.grow-programme-row,a.grow-programme-row{cursor:pointer;transition:background .16s ease,box-shadow .16s ease}
/* V173: the Running / To-set-up tab filters set the hidden attribute, but an authored display
   value defeats [hidden]'s UA display:none — these two rules are what make the tabs real. */
.grow-programme-row[hidden]{display:none!important}
.programme-category[hidden]{display:none!important}
.programme-suggest{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px 12px 66px;background:#FFFDF9;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.programme-suggest b{color:var(--ink);font-weight:600}
.programme-suggest[hidden]{display:none!important}
button.grow-programme-row:hover,a.grow-programme-row:hover{background:var(--tint)}
button.grow-programme-row:focus-visible,a.grow-programme-row:focus-visible{position:relative;z-index:1;outline:3px solid rgba(201,67,51,.25);outline-offset:-3px}
.grow-programme-icon{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--coral);font-weight:750}
.grow-programme-meta{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}.grow-programme-action{min-height:44px;display:inline-flex;align-items:center;color:var(--coral);font-size:12px;font-weight:750;white-space:nowrap}
.grow-programme-access{font-size:11px;color:var(--muted);white-space:nowrap}
.rewards-overview-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
.rewards-overview-card{appearance:none;width:100%;min-height:92px;display:flex;gap:11px;align-items:flex-start;padding:14px;
  border:1px solid var(--line);border-radius:14px;background:#FBFAF8;color:var(--ink);font:inherit;text-align:left;min-width:0}
button.rewards-overview-card{cursor:pointer;transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease}
button.rewards-overview-card:hover{border-color:var(--coral);box-shadow:0 7px 18px rgba(201,67,51,.1);transform:translateY(-1px)}
button.rewards-overview-card:focus-visible{outline:3px solid rgba(201,67,51,.25);outline-offset:2px;border-color:var(--coral)}
.rewards-overview-card>div{min-width:0;flex:1}.rewards-overview-card b,.rewards-overview-card p{overflow-wrap:anywhere}
.rewards-overview-edit-label{display:inline-flex;align-items:center;min-height:44px;margin-top:7px;color:var(--coral);font-size:12px;font-weight:700}
.reward-milestone-track li,.birthday-reward-overview{display:flex;gap:11px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:14px;background:#FBFAF8}
.reward-milestone-number{display:grid;place-items:center;flex:0 0 32px;height:32px;border-radius:50%;background:var(--tint);color:var(--coral);font-weight:700}
.birthday-reward-overview{margin-top:10px}.profitability-product-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px}
.profitability-product-grid article{padding:14px;border:1px solid var(--line);border-radius:14px}.profitability-product-grid dl{display:grid;gap:6px;margin:10px 0}
.profitability-product-grid dl div{display:flex;justify-content:space-between;gap:12px}.profitability-product-grid dt{color:var(--muted);font-size:12px}.profitability-product-grid dd{font-weight:650;text-align:right}
.grow-guide{border:1px solid var(--coral);border-radius:var(--r-sm);background:#fff;padding:0 16px}
.grow-guide>summary,.grow-advanced>summary{display:flex;align-items:center;gap:10px;min-height:52px;cursor:pointer;font-weight:700}
.grow-guide-body{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:0 0 16px}
.grow-guide-step{padding:13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--tint)}
.grow-guide-step b{display:block;margin-bottom:4px}.grow-guide-step p{font-size:12.5px;color:var(--muted);line-height:1.45}
.grow-guide-step .btn{width:100%;min-height:44px;margin-top:10px}
.grow-draft-note{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-sm);background:#E7F6EE;color:#1f6c46;font-size:13px}
.grow-advanced{border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;padding:0 16px}
.grow-advanced-actions{display:flex;flex-wrap:wrap;gap:10px;padding:0 0 16px}.grow-advanced-actions .btn{min-height:44px}
.grow-optional{display:grid;grid-template-columns:1fr;gap:10px}
.grow-optional-card{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;min-width:0;padding:14px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:#fff}
.grow-optional-card p{margin:4px 0 0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.grow-optional-card .btn{min-height:44px;flex:0 0 auto}
.grow-panel-shell{position:relative;min-height:0}.grow-panel-shell:empty{display:none}
.grow-overview.grow-editor-active>:not(.grow-panel-shell){display:none}
.grow-overview.grow-editor-active .grow-panel-shell{display:block}
.grow-editor-single{grid-template-columns:minmax(0,760px);justify-content:start}
.grow-panel-shell.grow-panel-updating{opacity:.72;pointer-events:none;transition:opacity .18s ease}
.grow-inline-feedback{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:#fff;color:var(--muted);font-size:13px}
.grow-inline-feedback.ok{border-color:#9ED7BA;background:#E7F6EE;color:#1f6c46}
.grow-section-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grow-section-heading .btn{min-height:44px}
@media(max-width:900px){.grow-guide-body{grid-template-columns:1fr}}
@media(max-width:640px){.grow-hero{padding:18px}.grow-primary{width:100%}
  .reward-auto-dialog{width:100%;max-height:92dvh;border-radius:20px 20px 0 0;padding:20px 18px calc(16px + env(safe-area-inset-bottom))}
  .reward-auto-modal{align-items:flex-end;padding:0}.reward-auto-actions{display:grid;grid-template-columns:1fr}.reward-auto-actions .btn{width:100%}
  .grow-flow-step{grid-template-columns:40px minmax(0,1fr)}.grow-flow-foot{grid-column:1/-1;grid-row:auto;justify-content:flex-start;margin-top:8px}
  .grow-programme-row{grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:8px;padding:10px 11px}.grow-programme-icon,.grow-programme-row .reward-milestone-number{width:36px;height:36px}.grow-programme-meta{grid-column:auto;justify-content:flex-end;align-items:flex-end;flex-direction:column;gap:2px}.grow-programme-action{min-height:24px}
  .grow-flow-foot .btn,.grow-advanced-actions .btn,.grow-optional-card .btn{flex:1 1 100%}
  .grow-optional-card{flex-direction:column;overflow-wrap:anywhere}}
@media(max-height:700px){.reward-auto-dialog{max-height:96dvh;padding-top:14px}.reward-auto-head .muted.small{display:none}.reward-auto-step{margin-top:10px}.reward-auto-summary{gap:5px;margin-top:8px}.reward-auto-summary>div{padding:7px 0}.reward-auto-actions{margin-top:8px;padding-top:8px}}
@media(max-height:700px) and (min-width:641px){.reward-auto-review{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:18px}.reward-auto-review>h3{grid-column:1/-1}.reward-auto-review .reward-auto-summary{grid-column:1}.reward-auto-guardrails{grid-column:2;align-self:start;padding-top:8px}.reward-auto-guardrails .reward-auto-safety{padding:9px}}
@media(max-width:600px){.rewards-overview-grid{grid-template-columns:1fr}.rewards-overview-card{min-height:88px}}
@media(prefers-reduced-motion:reduce){.grow-panel-shell.grow-panel-updating{transition:none}}
/* Program Studio (PS-1A authoring surface) — theme-aware via existing tokens only */
.studio-row{padding:12px 0;border-bottom:1px solid var(--line)}
.studio-row:last-child{border-bottom:none}
.studio-row-main{min-width:0}
.studio-authoring-note{font-style:italic;color:var(--muted)}
.studio-tech{margin-top:8px}
.studio-tech summary{cursor:pointer;color:var(--coral);font-size:12px;font-weight:600;min-height:32px;display:flex;align-items:center}
.studio-tech code{overflow-wrap:anywhere}
.studio-editor{border:1px solid var(--coral)}
.studio-step{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin:12px 0}
.studio-step legend{font-size:12px;font-weight:700;color:var(--muted);padding:0 6px;text-transform:uppercase;letter-spacing:.05em}
.stCond,.stEff{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--hair)}
.stCond:last-child,.stEff:last-child{border-bottom:none}
.stCond>select,.stEff>select{flex:0 1 auto;min-width:130px;min-height:44px}
.edCondValCell,.edEffValCell{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1 1 170px;min-width:0}
.edCondValCell input,.edCondValCell select,.edEffValCell input,.edEffValCell select{min-width:96px;min-height:44px}
.edEffLbl{font-size:12px;color:var(--muted)}
.edDowLbl{display:inline-flex;align-items:center;gap:5px;font-size:13px;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:100px}
.studio-advanced{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.studio-advanced summary{cursor:pointer;font-weight:600;color:var(--coral);min-height:44px;display:flex;align-items:center}
.studio-canon{margin-top:10px}
.studio-pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--tint);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;font-size:11.5px;max-height:220px;overflow:auto;margin-top:6px}
.studio-preview{margin-top:12px}
.studio-preview-card{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:var(--tint)}
.studio-econ{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.studio-econ-line{padding:6px 0;border-bottom:1px solid var(--hair)}
.studio-econ-line:last-child{border-bottom:none}
.studio-ok{color:var(--green);font-weight:600}
/* PS-1C.2 execution-truth surfaces: per-effect state breakdown, rule controls, publish preview */
.studio-effect-states{margin-top:8px;border-top:1px solid var(--hair);padding-top:6px}
.studio-effect-state{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:4px 0;flex-wrap:wrap}
.studio-effect-state>span{font-size:13px}
.studio-rule-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.studio-emg-banner{margin-top:8px;border:1px solid var(--red);background:var(--tint);border-radius:var(--r-sm);padding:8px 10px;font-size:13px}
.studio-impact-rule{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin-top:10px}
.sv-discrep-list,.sv-pause-list{margin-top:4px}
.sv-discrep{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin-top:10px}
.sv-discrep code{overflow-wrap:anywhere}
.studio-impact-eff{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:5px 0;flex-wrap:wrap;border-top:1px solid var(--hair)}
.studio-impact-eff:first-of-type{border-top:none}
.studio-impact-flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.studio-tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:100px;border:1px solid var(--line);color:var(--muted)}
.studio-tag.fin{border-color:var(--red);color:var(--red)}
.studio-tag.cust{border-color:var(--coral);color:var(--coral)}
@media(max-width:520px){.stCond>select,.stEff>select,.edCondValCell,.edEffValCell{flex:1 1 100%}
  .edCondValCell input,.edEffValCell input,.edCondValCell select,.edEffValCell select{flex:1 1 auto;width:100%}}
.spacer{flex:1}
.frontline-card{max-width:460px;margin:0 auto}
.frontline-phone{font-size:34px;text-align:center;height:64px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.frontline-keypad{grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.frontline-keypad .btn{height:60px;font-size:22px;font-weight:700}
.frontline-tenders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.frontline-tenders .btn{min-height:52px;font-size:15px}
.frontline-tenders .btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.till-cart-card{max-width:560px}
.till-cart-catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-top:6px}
.till-cart-catalog .btn,.till-cart-catalog .choice-button{min-height:64px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;padding:10px 12px;font-size:14px;font-weight:600;line-height:1.25}
.till-cart-catalog .btn .till-cart-price,.till-cart-catalog .choice-button .till-cart-price{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.till-cart-catalog .choice-button{position:relative}
.till-cart-catalog .choice-button.has-image{display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:10px;padding-right:40px}
	.till-choice-image,.catalogue-thumb{width:42px;height:42px;border-radius:12px;object-fit:cover;background:var(--wash);border:1px solid var(--line);box-shadow:0 4px 12px rgba(32,24,18,.08)}
	.catalogue-thumb:not(img){display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.till-choice-text{min-width:0;display:flex;flex-direction:column;gap:2px}

/* V167 Phase 4: customer-only system dark mode. Merchant/admin surfaces retain their
   established light palette. The redemption QR intentionally stays on a light scan surface. */
.customer-surface{min-height:100dvh;background:var(--bg);color:var(--ink)}
/* v176: customer modals opt into the dark token scope but must keep the scrim, not the page background. */
.modal.customer-surface{min-height:auto;background:rgba(23,22,26,.4)}
html[data-customer-surface="true"] body{background:var(--bg)}
/* v190 (owner: "change the background to same as business background (beige) instead of
   black; light/dark can be adjusted in the profile module"). The customer surface used to flip
   to dark purely because the DEVICE was in dark mode, so one person saw a beige workspace and a
   black wallet on the same phone. Beige is the default for everyone now; these tokens apply
   only when the customer has chosen dark — or chosen to follow their device — in
   Profile → Appearance, which is what sets data-customer-theme on <html>. */
html[data-customer-theme="dark"][data-customer-surface="true"] body{background:#0F1115}
  /* The offer-detail sheet is appended to body, outside .customer-surface,
     so it must join the dark token scope explicitly. */
html[data-customer-theme="dark"] .customer-surface,
html[data-customer-theme="dark"] .customer-offer-detail-modal .modal-card,
html[data-customer-theme="dark"] .customer-business-detail-modal .modal-card{
    color-scheme:dark;
    --bg:#0F1115;--card:#191C22;--ink:#F7F4EF;--ink2:#D8D2CA;--muted:#AAA3AD;
    --line:#343841;--control-border:#737A86;--hair:rgba(255,255,255,.11);
    --coral:#FF8A7E;--coral-hover:#FFAA9F;--amber:#F2C078;--green:#78D5A7;--red:#FF9E95;
    --grad:linear-gradient(135deg,#D95045,#A93631);--tint:#3A211F;
    --shadow:0 1px 2px rgba(0,0,0,.2),0 5px 16px rgba(0,0,0,.24);
    --shadow-lg:0 3px 8px rgba(0,0,0,.28),0 20px 52px rgba(0,0,0,.4)
  }
html[data-customer-theme="dark"] .customer-surface.portal{--coral:#FF8A7E!important;--grad:linear-gradient(135deg,#D95045,#A93631)!important}
  /* v176: doubled class (.customer-surface.customer-surface) + :is() so these dark remaps
     outrank base rules that carry a descendant combinator or a state pseudo-class. */
html[data-customer-theme="dark"] .customer-surface.customer-surface :is(input,select,textarea,.btn.ghost,.customer-primary-nav,.customer-home-quick a,
    .customer-home-offer,.customer-perk-card,.customer-offer-card,.customer-reward-card,
    .customer-programme-compact-head,.customer-programme-guide,.wallet-firm,.wallet-reward,
    .customer-inbox-bell,.customer-programme-card,.customer-booking-business,.customer-booking-tabs,.checkrow,.fb-chip,
    .customer-avatar,.customer-programme-switcher a,.customer-workspace-switch .menu){
    background:var(--card);color:var(--ink);border-color:var(--line)
  }
  /* State styling must survive the raised-specificity remap above. */
html[data-customer-theme="dark"] .customer-surface.customer-surface :is(input,select,textarea):focus{border-color:var(--coral)}
html[data-customer-theme="dark"] .customer-surface.customer-surface :is(input,select,textarea)[aria-invalid="true"]{border-color:var(--red)}
html[data-customer-theme="dark"] .customer-surface.customer-surface .wallet-firm:hover{border-color:var(--coral)}

html[data-customer-theme="dark"] .customer-surface.customer-surface .fb-chip[aria-pressed="true"]{background:var(--tint);border-color:var(--coral);color:var(--coral)}

html[data-customer-theme="dark"] .customer-surface.customer-surface .customer-merchant-hero .customer-programme-logo{background:rgba(255,255,255,.94)}
html[data-customer-theme="dark"] .customer-surface .btn.ghost,
html[data-customer-theme="dark"] .customer-surface .svc{background:var(--card);color:var(--ink);border-color:var(--line)}
html[data-customer-theme="dark"] .customer-surface .svc.sel{background:var(--tint);border-color:var(--coral)}
html[data-customer-theme="dark"] .customer-surface.customer-surface :is(.customer-primary-nav a:hover,.customer-primary-nav button:hover,
    .customer-workspace-switch .menu a:hover,

.fb-prov{margin-top:8px;font-size:12px;color:var(--muted)}
@media print{
  .side,.no-print{display:none !important}
  .shell{display:block}
  .main{padding:0;max-width:100%}
  body{background:#fff}
  body.pos-receipt-print .appbar,body.pos-receipt-print .main>*:not(.pos-receipt){display:none !important}
  body.pos-receipt-print .pos-receipt{display:block !important;border:0;box-shadow:none;max-width:80mm;margin:0 auto;padding:8mm}
}

.platform-console{
  min-height:100dvh;background:var(--bg);color:var(--ink);
  display:grid;grid-template-columns:264px minmax(0,1fr)
}
.platform-rail{
  position:sticky;top:0;height:100dvh;overflow-y:auto;
  padding:max(22px,env(safe-area-inset-top)) 16px max(22px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;background:#FCFBF9;border-right:1px solid var(--line)
}
.platform-brand{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:44px;padding:0 10px 18px
}
.platform-brand .logo{display:flex;align-items:center;min-width:0}.platform-logo-img{
  display:block;width:auto;max-width:126px;height:40px;object-fit:contain;object-position:left center
}.platform-tag{
  display:inline-flex;align-items:center;min-height:28px;padding:4px 9px;border-radius:999px;
  background:var(--tint);color:var(--coral);font-size:11px;font-weight:750;
  letter-spacing:.06em;text-transform:uppercase
}
.platform-nav{display:grid;gap:3px}
.platform-nav a{
  display:flex;align-items:center;gap:10px;min-height:44px;padding:9px 12px;
  border-radius:10px;color:var(--ink2);font-weight:550
}
.platform-nav a:hover{background:#F2EFEA;color:var(--ink)}
.platform-nav a[aria-current="page"]{background:var(--tint);color:var(--coral);font-weight:700}
.platform-nav .cui-icon{width:19px;height:19px}
.platform-nav-group{display:grid}
.platform-nav-group-row{display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:center}
.platform-nav-group-home{min-width:0}
.platform-nav-group-toggle{
  display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:9px;background:transparent;
  color:var(--muted);cursor:pointer
}
.platform-nav-group-toggle:hover,.platform-nav-group-toggle:focus-visible{background:#F2EFEA;color:var(--ink)}
.platform-nav-group-toggle span{font-size:20px;line-height:1;rotate:90deg;transition:rotate .16s ease}
.platform-nav-group-toggle[aria-expanded="true"] span{rotate:270deg}
.platform-nav-group[data-active="true"]>.platform-nav-group-row>.platform-nav-group-home{color:var(--coral);font-weight:700}
.platform-nav-group-items{display:grid;gap:2px;margin:2px 0 5px 21px;padding-left:10px;border-left:1px solid var(--line)}
.platform-nav-group-items[hidden]{display:none}
.platform-nav-group-items a{min-height:44px;padding-block:7px;font-size:12.5px}
.platform-nav-group-items .cui-icon{width:17px;height:17px}
.platform-nav-secondary{display:grid;gap:2px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.platform-rail-foot{margin-top:auto;padding:18px 10px 0}
.platform-back{
  display:inline-flex;align-items:center;gap:8px;min-height:44px;color:var(--muted);
  font-size:13px;font-weight:650
}
.platform-column{min-width:0}
.platform-topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  gap:16px;min-height:68px;padding:max(12px,env(safe-area-inset-top))
    max(32px,env(safe-area-inset-right)) 12px max(32px,env(safe-area-inset-left));
  border-bottom:1px solid var(--hair);
  background:rgba(244,242,238,.82);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)
}
.platform-topbar-title{min-width:0;font-weight:750;letter-spacing:-.015em}
.platform-topbar-actions{display:flex;min-width:0;align-items:center;gap:8px}
.platform-locale-switcher{
  display:flex;align-items:center;gap:3px;padding:3px;border:1px solid var(--hair);
  border-radius:12px;background:#fff
}
.platform-locale-switcher button{
  min-height:44px;padding:8px 11px;border:0;border-radius:9px;background:transparent;
  color:var(--muted);font:inherit;font-size:12px;font-weight:750;cursor:pointer
}
.platform-locale-switcher button[aria-pressed="true"]{background:var(--tint);color:var(--coral)}
.platform-locale-switcher button:focus-visible{outline:3px solid rgba(194,65,53,.25);outline-offset:1px}
.platform-locale-switcher button:disabled{opacity:.55;cursor:wait}
.platform-main{width:100%;max-width:1500px;margin:0 auto;
  padding:30px max(32px,env(safe-area-inset-right))
    calc(56px + env(safe-area-inset-bottom)) max(32px,env(safe-area-inset-left))}
.platform-kpis{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px
}
.platform-kpi{min-width:0}
.platform-kpi-link{display:block;color:inherit;text-decoration:none}
.platform-kpi-link:hover{border-color:rgba(194,65,53,.35);box-shadow:var(--shadow-sm)}
.platform-kpi-link:focus-visible{outline:3px solid rgba(194,65,53,.25);outline-offset:2px}
.platform-kpi-label{
  display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:700
}
.platform-kpi-value{
  margin-top:9px;font-size:clamp(1.55rem,3vw,2.2rem);font-weight:750;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere
}
.platform-section-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,.7fr);gap:16px}
.platform-context-list{display:grid;gap:0}
.platform-context-list div{
  display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--hair)
}
.platform-context-list div:last-child{border-bottom:0}
.platform-context-list dt{color:var(--muted);font-size:12.5px}
.platform-context-list dd{text-align:right;font-weight:650}
.platform-context-list a{display:inline-flex;align-items:center;min-height:44px}
.platform-route-note{
  display:flex;align-items:flex-start;gap:12px;padding:15px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:#FBFAF8;color:var(--ink2)
}
.platform-route-note p{margin-top:3px;line-height:1.55}
.platform-firms-table td,.platform-firms-table th{white-space:nowrap}
.platform-table-scroll{max-width:100%;overflow-x:auto;overscroll-behavior-inline:contain}
.platform-table-scroll table{min-width:1120px}
.platform-break{overflow-wrap:anywhere;word-break:break-word}
.platform-firms-table td:first-child,.platform-firms-table th:first-child{white-space:normal;min-width:180px}
.platform-state-card{min-height:300px;display:grid;align-content:center}
.platform-state-card .cui-empty{padding:34px 18px}
.platform-state-card .cui-empty p{max-width:62ch}
.platform-mobile-nav{display:none}
@media(min-width:761px){.platform-topbar-workspace{display:none}}
.platform-toolbar{
  display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin-bottom:16px
}
.platform-toolbar .cui-field{flex:1 1 170px}.platform-toolbar .cui-field label{margin-top:0}
.platform-toolbar .btn{flex:0 0 auto}
.platform-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.platform-status-note{margin-bottom:16px}
.platform-kanban{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:12px;align-items:start;padding:2px 2px 18px
}
.platform-kanban-column{
  min-width:0;padding:10px;border:1px solid var(--line);border-radius:15px;background:#EFEBE5
}
.platform-kanban-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  min-height:64px;padding:9px 5px;background:#EFEBE5
}
.platform-kanban-head h2{font-size:13px;letter-spacing:-.01em}
.platform-kanban-head p{max-width:23ch;margin-top:3px;color:var(--muted);font-size:10.5px;line-height:1.35}
.platform-count{
  display:inline-grid;place-items:center;min-width:25px;height:25px;padding:0 7px;border-radius:999px;
  background:#fff;color:var(--muted);font-size:11px;font-weight:750
}
.platform-card-list{display:grid;gap:8px}
.platform-prospect-card{
  width:100%;padding:14px;border:1px solid var(--hair);border-radius:12px;background:#fff;
  box-shadow:var(--shadow);text-align:left;color:var(--ink)
}
.platform-prospect-card:hover{border-color:rgba(194,65,53,.32);box-shadow:var(--shadow-lg)}
.platform-prospect-card[aria-grabbed="true"]{opacity:.56}
.platform-prospect-card-compact{padding:10px 11px}
.platform-prospect-card-compact[draggable="true"]{cursor:grab}
.platform-prospect-card-compact[draggable="true"]:active{cursor:grabbing}
.platform-prospect-card-compact .platform-prospect-name{font-size:13px}
.platform-prospect-card-compact .platform-card-line{
  margin-top:3px;color:var(--muted);font-size:11px;line-height:1.35;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.platform-prospect-card-compact .platform-card-badges{margin-top:7px}
.platform-kanban-hint{margin:-6px 2px 10px}
.platform-card-list.is-drop-target{
  outline:2px dashed rgba(194,65,53,.55);outline-offset:3px;border-radius:12px;background:rgba(194,65,53,.05)
}
.platform-empty-fields{margin-top:8px}
.platform-empty-fields>summary{
  display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;
  background:#EFEBE5;color:var(--muted);font-size:11px;font-weight:650;cursor:pointer;list-style:none
}
.platform-empty-fields>summary::-webkit-details-marker{display:none}
.platform-empty-fields>summary::before{content:'+';font-weight:750}
.platform-empty-fields[open]>summary::before{content:'−'}
.platform-empty-fields>summary:hover{background:var(--tint);color:var(--coral)}
.platform-empty-fields .platform-typed-list{margin-top:8px;opacity:.75}
.platform-archived-panel{margin-top:14px;padding:14px}
.platform-archived-panel>summary{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;
  cursor:pointer;list-style:none
}
.platform-archived-panel>summary::-webkit-details-marker{display:none}
.platform-archived-panel>summary::before{content:'+';color:var(--muted);font-weight:750}
.platform-archived-panel[open]>summary::before{content:'\2212'}
.platform-archived-panel>p{margin-top:6px}
.platform-archived-panel .cui-table-wrap{margin-top:10px}
.platform-archived-table td .muted{display:block;max-width:42ch}
.platform-prospect-table-wrap{margin-top:2px}
.platform-prospect-table .platform-prospect-row{cursor:pointer}
.platform-prospect-table .platform-prospect-row:hover{background:rgba(194,65,53,.05)}
.platform-prospect-table td b{display:block}
.platform-prospect-table td .muted{display:block;margin-top:2px}
.platform-prospect-name{font-size:14px;font-weight:750;line-height:1.35}
.platform-prospect-meta{display:grid;gap:4px;margin-top:7px;color:var(--muted);font-size:11.5px}
.platform-card-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.platform-card-badges .pill{font-size:10px;padding:3px 7px}
.platform-card-actions{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;margin-top:10px}
.platform-card-actions select{min-height:44px;font-size:12px;padding:8px}
.platform-card-actions .btn{min-width:44px;padding-inline:10px}
.platform-card-managed{display:block}
.platform-contact-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.platform-contact-actions .btn{min-width:44px;min-height:44px;padding-inline:10px}
.platform-lane-empty{padding:10px 5px}
.platform-prospect-list{display:none}
.platform-prospect-list-view:not([hidden]){display:grid;gap:10px}
.platform-kanban[hidden],.platform-prospect-list[hidden]{display:none!important}
.platform-drawer{
  position:fixed;inset:0;z-index:120;display:flex;justify-content:flex-end;
  background:rgba(23,22,26,.32);padding-left:min(8vw,90px)
}
.platform-drawer-panel{
  width:min(720px,100%);height:100%;overflow-y:auto;background:var(--bg);
  box-shadow:-16px 0 48px rgba(23,22,26,.18);padding:24px
}
.platform-drawer-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px
}
.platform-drawer-close{min-width:44px;padding:10px}
.platform-detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.platform-detail-section{margin-top:14px}.platform-detail-section h2{font-size:15px;margin-bottom:8px}
.platform-detail-section pre{
  white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;
  background:#F8F6F2;border:1px solid var(--line);border-radius:10px;padding:12px
}
.platform-modal{
  position:fixed;inset:0;z-index:130;display:grid;place-items:center;padding:18px;
  background:rgba(23,22,26,.36)
}
.platform-modal-panel{
  width:min(680px,100%);max-height:92dvh;overflow-y:auto;background:var(--card);
  border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:24px
}
.platform-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.platform-form-grid .wide{grid-column:1/-1}
.platform-form-actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;margin-top:20px}
.platform-import-preview{max-height:320px;overflow:auto;margin-top:14px}
.platform-error-list{margin:10px 0 0 20px;color:var(--red);font-size:12px}
.platform-sector-list,.platform-commission-list,.platform-billing-list{display:grid;gap:12px}
.platform-sector-card-head,.platform-list-row{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap
}
.platform-module-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.platform-sector-actions{margin-top:14px}
.platform-module-picker{grid-column:1/-1;margin:4px 0 0;padding:0;border:0}
.platform-module-picker>legend{font-size:14px;font-weight:750}
.platform-module-picker>p{margin-top:4px}
.platform-module-group{margin-top:15px}
.platform-module-group h2,.platform-bundle-review h2{font-size:12px;letter-spacing:.01em}
.platform-module-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:7px}
.platform-module-option{
  display:flex;align-items:center;gap:10px;min-height:52px;padding:9px 11px;
  border:1px solid var(--hair);border-radius:11px;background:#FBFAF8;cursor:pointer
}
.platform-module-option:has(input:checked){border-color:rgba(194,65,53,.4);background:var(--tint)}
.platform-module-option input,.platform-review-confirm input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--coral)}
.platform-module-option span{display:grid;gap:2px;min-width:0}
.platform-module-option b{font-size:12.5px}.platform-module-option small{color:var(--muted);font-size:10px}
.platform-module-selection{
  position:sticky;bottom:-1px;display:grid;gap:3px;margin-top:16px;padding:12px 14px;
  border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.96);
  box-shadow:0 -8px 20px rgba(23,22,26,.06)
}
.platform-module-selection b{font-size:12px}.platform-module-selection span{color:var(--muted);font-size:11px;line-height:1.4}
.platform-module-policy-intro{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px;
  padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--tint)
}
.platform-module-policy-intro h2{font-size:17px;margin:2px 0 4px}
.platform-module-policy-intro p{margin:0;max-width:520px}
.platform-module-policy-list{display:grid;gap:16px;margin:0 0 18px}
.platform-module-policy-group{display:grid;gap:8px}
.platform-module-policy-group h3{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.platform-module-policy-options{display:grid;gap:7px}
.platform-module-policy-row{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,190px);align-items:center;gap:14px;
  padding:10px 12px;border:1px solid var(--hair);border-radius:11px;background:#FBFAF8
}
.platform-module-policy-row:focus-within{border-color:rgba(194,65,53,.55);box-shadow:0 0 0 3px rgba(194,65,53,.09)}
.platform-module-policy-copy{display:grid;gap:3px;min-width:0}
.platform-module-policy-copy b{font-size:13px}.platform-module-policy-copy small{color:var(--muted);font-size:11px;line-height:1.35}
.platform-module-policy-row select{width:100%;min-height:40px}
.platform-paged-summary{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin-top:16px;padding:12px 14px;border:1px solid var(--hair);
  border-radius:12px;background:#fff
}
.platform-paged-summary p{margin:0}
.platform-bundle-review{display:grid;gap:16px}
.platform-bundle-diff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.platform-bundle-diff section{padding:12px;border:1px solid var(--hair);border-radius:10px;background:#FBFAF8}
.platform-bundle-diff ul{margin:7px 0 0 18px;font-size:12px}
.platform-review-confirm{
  display:flex;align-items:flex-start;gap:10px;min-height:52px;padding:12px;
  border:1px solid var(--line);border-radius:11px;background:#FBFAF8;cursor:pointer;
  font-size:12.5px;line-height:1.45
}
.platform-money{font-variant-numeric:tabular-nums;font-weight:750}
.platform-health-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.platform-action-queue{display:grid;gap:9px}.platform-action-item{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding:13px 0;border-bottom:1px solid var(--hair)
}
.platform-today{display:grid;gap:16px;margin-bottom:16px}
.platform-today-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.platform-today-head h2{margin-top:3px;font-size:1.45rem}
.platform-today-head p:last-child{margin-top:5px}
.platform-today-list{display:grid;gap:10px}
.platform-today-item{
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;
  padding:15px;border:1px solid var(--line);border-radius:14px;background:#FBFAF8
}
.platform-today-main{display:grid;gap:7px;min-width:0}
.platform-today-main h3{font-size:14px}
.platform-today-reason{color:var(--ink2);font-size:12.5px;font-weight:750}
.platform-today-meta{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0
}
.platform-today-meta div{min-width:0}
.platform-today-meta dt{
  color:var(--muted);font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase
}
.platform-today-meta dd{margin:2px 0 0;font-size:11.5px;overflow-wrap:anywhere}
.platform-today-action{white-space:nowrap}
.platform-today-more{margin-top:-4px}
.platform-today-coverage{
  border:1px solid var(--line);border-radius:12px;background:#FBFAF8;
  color:var(--ink2);font-size:12px
}
.platform-today-coverage summary{
  min-height:44px;display:flex;align-items:center;padding:10px 13px;
  color:var(--ink);font-weight:800;cursor:pointer
}
.platform-today-coverage ul{display:grid;gap:8px;margin:0;padding:0 13px 13px;list-style:none}
.platform-today-coverage li{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.platform-today-coverage li span{text-align:right}
.platform-today-coverage [data-coverage-state="partial"] b{color:#8A5A00}
.platform-today-coverage [data-coverage-state="unavailable"] b{color:var(--coral)}
.platform-control-status{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.platform-control-heading{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.platform-control-heading h3,.platform-consultative-report h3{font-size:14px}
.platform-branch-control-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.platform-branch-control-list .platform-action-item{border:1px solid var(--line);border-radius:14px;padding:12px}
.platform-consultative-report{margin-top:16px}
.platform-action-item:last-child{border-bottom:0}
.platform-preview{
  margin-top:14px;padding:14px;border:1px solid rgba(194,65,53,.3);
  border-radius:var(--r-sm);background:var(--tint)
}
.platform-preview pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
.platform-enterprise-filters{margin-bottom:16px}
.platform-enterprise-filter-grid{
  display:grid;grid-template-columns:minmax(180px,1fr) minmax(170px,.7fr) minmax(240px,1.3fr);
  gap:0 14px;align-items:start
}
.platform-enterprise-filter-grid .cui-field label{margin-top:0}
.platform-checkbox-field{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:13px}
.platform-checkbox-field input{margin:0}
.platform-enterprise-search{grid-column:span 2;display:grid;gap:8px}
.platform-enterprise-search .cui-field label{margin-top:0}
.platform-enterprise-search>p{margin-top:8px;line-height:1.4}
.platform-enterprise-firms{grid-row:span 2}
.platform-enterprise-firms select{min-height:148px}
.platform-enterprise-table .platform-link-button{
