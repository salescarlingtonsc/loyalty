.build-identity{font-variant-numeric:tabular-nums;white-space:nowrap}
.challenge{margin-top:18px;min-height:82px}.challenge-status{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4}
.challenge-retry[hidden]{display:none}.challenge.challenge-passed{min-height:0;margin-top:0}.challenge-retry{display:inline-flex;align-items:center;min-height:44px;background:none;color:var(--coral);font-size:13px;font-weight:600;padding:6px 0;text-decoration:underline}
.logo{display:inline-flex;align-items:center;min-height:44px}
.brand-logo{display:block;width:auto;height:50px;max-width:126px;object-fit:contain}
.wallet-head>a.logo{display:inline-flex;align-items:center;min-height:44px}
.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px}
.ind{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:14px;text-align:center;cursor:pointer;
  background:#fff;transition:border-color .18s var(--ease),transform .22s var(--spring),box-shadow .2s}
.ind:hover{border-color:#E3C9A8;transform:translateY(-2px);box-shadow:var(--shadow)}

.ind.sel{border-color:var(--coral);background:var(--tint);box-shadow:0 0 0 3.5px rgba(255,107,94,.13)}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.chip.on{background:var(--tint);color:#D0562E}
/* ---------- shell: light rail (mockup) + frosted top bar, profile TOP-RIGHT ---------- */
.shell{display:grid;grid-template-columns:246px 1fr;min-height:100dvh}
.side{background:#FCFBF9;border-right:1px solid var(--line);color:var(--ink2);
  padding:max(22px,env(safe-area-inset-top)) 14px max(22px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;min-width:0;
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable}
.side .logo{color:var(--ink);padding:0 10px 22px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:14px;min-height:44px;

.nav,.navgroup,.navbody{min-width:0;max-width:100%}
.nav a:hover{background:#F2EFEA;color:var(--ink)}
.nav a.act{background:var(--tint);color:var(--coral);font-weight:600}
/* Icons get their own fixed-width box so every label starts on the same optical
   column, and so flex `gap` actually applies — an emoji sitting in the same text
   node as its label is one flex item, so gap silently does nothing and the icon
   ends up jammed against the word. This is the difference between "looks bought"
   and "looks generated". */
.nav .ic{width:18px;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;
  flex-shrink:0;line-height:1}
.navhead{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:9px 12px;border-radius:10px;font-size:11px;
  font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);cursor:pointer;text-align:left;background:transparent;
  margin-top:12px;transition:color .14s,background .14s}
.navhead:hover{color:var(--ink2)}
.navhead.act{color:var(--ink2)}
.navhead .chev{margin-left:auto;font-size:10.5px;opacity:.9;transition:transform .22s var(--spring)}
.navbody a{padding-left:22px}
.side .foot{margin-top:auto;padding:10px;font-size:12.5px;color:var(--muted)}
/* the right-hand column: sticky frosted app bar above the scrolling page */
.col{display:flex;flex-direction:column;min-width:0}
.appbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:flex-end;
  gap:10px;padding:max(12px,env(safe-area-inset-top)) max(34px,env(safe-area-inset-right))
    12px max(34px,env(safe-area-inset-left));border-bottom:1px solid var(--hair);
  background:rgba(232,227,218,.94);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.profile{position:relative}
.profile .who{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px 6px 6px;border-radius:100px;
  cursor:pointer;background:#fff;border:1px solid var(--hair);box-shadow:var(--shadow);
  transition:transform .2s var(--spring),box-shadow .2s var(--ease)}
.profile .who:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}

.profile .who .chev{font-size:9px;color:var(--muted);margin-left:2px}
.profile .avatar{width:30px;height:30px;border-radius:100px;background:var(--grad);color:#fff;

  box-shadow:0 2px 6px rgba(255,107,94,.3)}
/* menu now drops DOWN from the top-right chip (was: up from the bottom-left rail) */
.profile .menu{position:absolute;top:calc(100% + 8px);right:0;min-width:212px;
  background:rgba(255,255,255,.86);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border:1px solid var(--hair);border-radius:var(--r-sm);padding:6px;box-shadow:var(--shadow-lg);

.profile .menu a:hover{background:#F2EFEA;color:var(--ink)}
.profile-menu-section{padding:8px 12px;border-top:1px solid var(--hair);margin-top:4px}
.profile-menu-section:first-child{border-top:0;margin-top:0}

.business-workspace-switch,.customer-workspace-switch{position:relative}

.business-workspace-switch>summary::-webkit-details-marker,.customer-workspace-switch>summary::-webkit-details-marker{display:none}
.business-workspace-switch .menu,.customer-workspace-switch .menu{position:absolute;top:calc(100% + 8px);right:0;z-index:42;
  min-width:224px;background:rgba(255,255,255,.94);border:1px solid var(--hair);border-radius:var(--r-sm);
  padding:6px;box-shadow:var(--shadow-lg);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}

/* global top-bar action cluster — search + everyday actions, sits left of the bell so the

.mobile-page-title,.mobile-search-trigger,.mobile-search-sheet{display:none}
.mobile-page-title{min-width:0;align-items:center;gap:9px;font-weight:750;color:var(--ink)}

/* Grow overview: one journey first, engine-specific editors only on demand. */
.grow-overview{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:920px;margin:0 auto}
/* V319 (owner sketch: "two side view", the two categories drawn as neighbouring columns).
   The reading column widens ONLY on the Overview view, because that is the one view now carrying
   two tables abreast; every other view keeps the 920px measure it was designed at. The pair
   stacks well before either table would need to scroll sideways — a five-column table squeezed
   into half of 920px is not a glance, which is what this view is for. */
.grow-overview[data-programme-view="overview"]{max-width:1280px}
/* Unequal on purpose: the rewards table carries five columns and the offers table four, so the
   even split is what broke "Referrals" across two lines mid-word at 1440px. Below 1200px neither
   has the room to sit beside the other without that returning, so they stack. */
.grow-overview-split-v319{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,0.85fr);gap:18px;margin-top:14px;align-items:start}
@media(max-width:1200px){.grow-overview-split-v319{grid-template-columns:minmax(0,1fr)}}
.grow-overview-column-v319{min-width:0;display:grid;gap:8px}
.grow-overview-column-title-v319{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--coral);font-weight:850}
.grow-overview-column-note-v319{margin:0}
.grow-overview-column-v319 .cui-table-wrap{border:1px solid var(--line)}
/* V324 (owner markup 2026-08-14): a line drawn between the two columns with "separate them", a
   ringed "+" beside each heading, and the reward row ringed as belonging to the programme above.
   The divider is a border on the second column and only exists at the width where the two are
   actually side by side — below 1200px the split stacks, and a left border on a stacked column
   is a stray vertical line, not a separator. */
.grow-overview-column-head-v324{display:flex;align-items:center;gap:10px}
.grow-overview-column-head-v324 .grow-overview-column-title-v319{margin:0}
.grow-overview-add-v324{margin-left:auto;min-width:30px;padding:2px 9px;font-size:1.05rem;line-height:1.35;font-weight:800;border-radius:999px}
@media(min-width:1201px){.grow-overview-split-v319{gap:28px}
  .grow-overview-column-v319[data-grow-overview-category-v319="offers"]{border-left:1px solid var(--hair);padding-left:28px}}
/* A date is one token to a reader and must never break across lines — dd/mm/yyyy in a narrow
   column wraps after the "20" and prints the year as "20 26", which is worse than the long form
   it replaced. Only above the 767px stack point: below it the responsive table gives each cell
   the full row width, and nowrap there could push a long value out of the card instead. */
@media(min-width:768px){.grow-overview-column-v319 .cui-table td[data-label="Started"],
  .grow-overview-column-v319 .cui-table td[data-label="Ends"],
  .grow-overview-column-v319 .cui-table td[data-label="Ran from"],
  .grow-overview-column-v319 .cui-table td[data-label="Ran until"]{white-space:nowrap}}
.grow-overview-child-v324{display:block;position:relative;padding-left:17px}

.grow-guide-step .btn{width:100%;min-height:44px;margin-top:10px}
.grow-draft-note{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-sm);background:#E7F6EE;color:#1f6c46;font-size:13px}

.grow-advanced-actions{display:flex;flex-wrap:wrap;gap:10px;padding:0 0 16px}.grow-advanced-actions .btn{min-height:44px}

  border:1px solid var(--line);border-radius:var(--r-sm);background:#fff}
.grow-optional-card p{margin:4px 0 0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.grow-optional-card .btn{min-height:44px;flex:0 0 auto}
.grow-panel-shell{position:relative;min-height:0}.grow-panel-shell:empty{display:none}
.grow-overview.grow-editor-active>:not(.grow-panel-shell){display:none}
.grow-overview.grow-editor-active .grow-panel-shell{display:block}
.grow-editor-single{grid-template-columns:minmax(0,760px);justify-content:start}

.grow-inline-feedback{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);

.grow-inline-feedback.ok{border-color:#9ED7BA;background:#E7F6EE;color:#1f6c46}
.grow-section-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}

  .grow-flow-foot .btn,.grow-advanced-actions .btn,.grow-optional-card .btn{flex:1 1 100%}

/* Program Studio (PS-1A authoring surface) — theme-aware via existing tokens only */
.studio-row{padding:12px 0;border-bottom:1px solid var(--line)}
.studio-row:last-child{border-bottom:none}
.studio-row-main{min-width:0}
.studio-authoring-note{font-style:italic;color:var(--muted)}
.studio-tech{margin-top:8px}

.studio-editor{border:1px solid var(--coral)}
.studio-step{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin:12px 0}

.edCondValCell input,.edCondValCell select,.edEffValCell input,.edEffValCell select{min-width:96px;min-height:44px}
.edEffLbl{font-size:12px;color:var(--muted)}
.edDowLbl{display:inline-flex;align-items:center;gap:5px;font-size:13px;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:100px}
.studio-advanced{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.studio-advanced summary{cursor:pointer;font-weight:600;color:var(--coral);min-height:44px;display:flex;align-items:center}

/* PS-1C.2 execution-truth surfaces: per-effect state breakdown, rule controls, publish preview */
.studio-effect-states{margin-top:8px;border-top:1px solid var(--hair);padding-top:6px}
.studio-effect-state{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:4px 0;flex-wrap:wrap}

.studio-rule-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.studio-emg-banner{margin-top:8px;border:1px solid var(--red);background:var(--tint);border-radius:var(--r-sm);padding:8px 10px;font-size:13px}
.studio-impact-rule{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin-top:10px}
.sv-discrep-list,.sv-pause-list{margin-top:4px}
.sv-discrep{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin-top:10px}

.studio-impact-eff{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:5px 0;flex-wrap:wrap;border-top:1px solid var(--hair)}

.service-media-cell{display:flex;align-items:center;gap:10px;min-width:0}

.service-photo-uploader-v158 input{position:absolute;inset:0;opacity:0;cursor:pointer}
.till-cart-lines{list-style:none;padding:0;margin:12px 0 0}

.till-cart-line .till-cart-line-sub{display:block;font-weight:400;color:var(--muted);font-size:12px}
.till-cart-qty{display:flex;align-items:center;gap:8px}

.till-cart-qty output{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.till-cart-line-amount{min-width:76px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.till-cart-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:1.5rem;font-weight:800;letter-spacing:-.03em}
.till-cart-total .till-cart-total-num{font-variant-numeric:tabular-nums}
.till-cart-status{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:14px}
.till-cart-status.ok{color:var(--green)}
.till-cart-status.no{color:var(--red,#c0392b)}
.till-receipt-lines{list-style:none;padding:0;margin:10px 0}
.till-receipt-lines li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}

.package-customer-tools-v157{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:10px 0 12px}
.package-customer-tools-v157>div{flex:1 1 220px}
/* PS-1C.1 unified checkout panel — server-priced breakdown (all figures authoritative from evaluate_checkout) */
.ck-panel{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:#FBFAF8}
.ck-panel[data-checking]{opacity:.55}
.ck-checking{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;padding:6px 0}
.ck-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14px;font-variant-numeric:tabular-nums}
.ck-row.ck-gst{color:var(--muted);font-size:12.5px}
.ck-effect{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13.5px;color:var(--green);font-variant-numeric:tabular-nums}
.ck-effect .ck-effect-label{display:inline-flex;align-items:center;gap:6px}
.ck-effect.ck-effect-off{color:var(--muted)}
.ck-effect.ck-effect-off .ck-effect-why{font-style:italic}
.ck-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:1.5rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ck-total.ck-stale{color:var(--muted)}
.ck-extras{list-style:none;padding:0;margin:12px 0 0}
.ck-extras li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;font-variant-numeric:tabular-nums}
.ck-extras .ck-extra-note{color:var(--muted);font-size:12px;display:block;font-weight:400}
.ck-notice{margin-top:12px;padding:10px 14px;border-radius:var(--r-sm);font-size:13.5px}
.ck-notice.warn{background:#FBF3E7;color:var(--amber)}
.ck-notice.info{background:#EFF4F1;color:var(--green)}
.dashboard-page{display:grid;gap:16px}
.dashboard-intro{display:flex;align-items:flex-start;gap:13px;padding:18px 20px;border:1px solid #DED7CC;border-radius:var(--r);background:#EDE7DE}
.dashboard-intro>.cui-icon{color:var(--coral);margin-top:3px}.dashboard-intro h1{font-size:1.85rem}.dashboard-intro p{margin-top:4px;line-height:1.5}
.performance-panel{padding:0;overflow:hidden;background:#fff}
.performance-heading{display:flex;align-items:center;gap:12px;padding:17px 20px;background:#F7EEE8;border-bottom:1px solid #EADFD8;flex-wrap:wrap}
.performance-heading>.cui-icon{color:var(--coral)}.performance-heading h2{font-size:1.08rem}.performance-heading p{margin-top:3px}
/* V319 (owner: "filter time move here"): the period strip now lives in this heading. It takes the
   free space between the title block and Minimise on a wide card, and drops to its own full-width
   row — ahead of nothing, so the tap targets keep their size — once the header has to wrap. */
.performance-heading>.dashboard-range-v319{margin-left:auto;justify-content:flex-end}
@media(max-width:900px){.performance-heading>.dashboard-range-v319{order:3;flex-basis:100%;margin-left:0;justify-content:flex-start}}
.performance-body{padding:20px}
.dashboard-kpis{margin-top:16px}
.dashboard-metric{display:block;width:100%;min-height:112px;padding:17px 18px;text-align:left;color:inherit;background:#fff;border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .2s var(--spring),box-shadow .2s var(--ease),border-color .2s}
/* V180 (owner instruction): the four dashboard counters were four identical white cards, so
   nothing told money apart from people at a glance. Each now carries a tinted wash and a
   coloured rail keyed to WHAT THE NUMBER MEANS, not to its position — permissions can hide
   any one of these (see metrics[].filter(Boolean)), and a position-based palette would
   recolour the survivors. Inactive deliberately uses slate, not red: zero inactive customers
   is a good result and must not render as an alarm. */
/* V180: one readable line per teammate. Wraps rather than truncating, because an owner
   scanning for a phone number must never be shown a clipped one. */
.staff-row-line{display:flex;flex-direction:column;align-items:stretch;gap:6px}
/* V226 (owner drew these columns by hand and captioned them "I want clear segmentation").
   The row was a flex wrap, so a field landed at a different x-position on every line and could
   not be read down a column. One shared template drives the header and every row, so the two
   cannot drift apart. Below 900px it stacks and each cell labels itself from data-staff-col. */
:root{--staff-cols-v226:minmax(130px,1.3fr) minmax(105px,.9fr) minmax(170px,1.6fr) minmax(105px,.9fr) minmax(120px,1fr)}
.staff-row-open{display:grid;grid-template-columns:var(--staff-cols-v226);align-items:center;gap:6px 14px;width:100%;min-width:0;text-align:left;background:transparent;border:0;padding:8px 6px;margin:-8px -6px -2px;border-radius:var(--r-sm);color:inherit;min-height:44px}
.staff-col-head-v226{display:grid;grid-template-columns:var(--staff-cols-v226);gap:6px 14px;padding:0 6px 6px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.staff-col-v226{min-width:0;overflow-wrap:anywhere}
/* V260 (owner: Owner & managers vs Roster only tables had different column widths, and the
   App-access/module pills collided with POSITION/COMMISSION text). Root cause: .staff-row-open
   used to flex-grow to fill whatever space its sibling pills+buttons left over, and that
   leftover varied per row (an owner row has one status line; a roster row has two pills plus
   three buttons) — so the SAME grid template rendered at a different pixel width per row,
   drifting the columns and squeezing the last cells into the pills next to them. Giving the
   name/phone/email/position/commission grid its own full-width row, with the pills and action
   buttons on a second row underneath, makes .staff-row-open always render at the row's full
   width — identical to the header's — regardless of how many badges or buttons a given
   teammate has, and removes the possibility of the two ever touching. */
.staff-row-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 6px}
/* V229 (owner: "square boxes for each topics then press in"). The Programmes overview is a
   grid of topic tiles; each drills into its own detail list. */
.grow-topic-tiles-v229{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:14px}
/* V244: ongoing vs pending groups. Same tile, grouped so outstanding setup is obvious. */
.grow-topic-group-v244{margin-top:20px}
.grow-topic-group-head-v244 h3{font-size:1.02rem;font-weight:750}
.grow-topic-group-head-v244 p{margin-top:3px}
.grow-topic-group-empty-v244{margin-top:12px;padding:14px;border:1px dashed var(--line);border-radius:12px}
.grow-topic-tile-pending-v244{border-style:dashed}
.grow-topic-tile-v229{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;min-height:158px;cursor:pointer;color:inherit}
.grow-topic-tile-v229:hover{background:var(--tint);border-color:var(--coral)}
.grow-topic-tile-v229>b{font-size:1.02rem;letter-spacing:-.01em}
.grow-topic-tile-icon-v229{width:36px;height:36px;border-radius:12px;background:var(--tint);color:var(--coral);display:grid;place-items:center}
.grow-topic-tile-open-v229{margin-top:auto;color:var(--coral);font-weight:600;font-size:.85rem}
/* The one choice for what points are FOR — two selectable cards, then a compact chosen state. */
.points-mode-chooser-v229{width:100%}
.points-mode-lead-v229{margin:0 0 10px}
.points-mode-cards-v229{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;width:100%}
.points-mode-card-v229{display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:14px;cursor:pointer;color:inherit}
.points-mode-card-v229:hover{border-color:var(--coral);background:var(--tint)}
.points-mode-card-v229:disabled{opacity:.6;cursor:default}
.points-mode-chosen-v229{display:flex;align-items:center;gap:10px;flex-wrap:wrap;width:100%}
.points-mode-row-v229{cursor:default;flex-wrap:wrap}
/* V250 (owner drew reward boxes with a "+" over the numbered reward rows). Cards reuse the
   existing pill and surface tokens — no new colours — and the grid is minmax(150px,1fr) so two
   still sit side by side at 390px. The add card is the same box in a dashed outline. */
.reward-card-grid-v250{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px}
.reward-card-v250{appearance:none;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-width:0;min-height:118px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);font:inherit}
button.reward-card-v250{cursor:pointer;transition:background .16s ease,border-color .16s ease}
button.reward-card-v250:hover{background:var(--tint);border-color:var(--coral)}
button.reward-card-v250:focus-visible{outline:3px solid rgba(201,67,51,.25);outline-offset:2px}

/* V167 Phase 4: customer-only system dark mode. Merchant/admin surfaces retain their
   established light palette. The redemption QR intentionally stays on a light scan surface. */
.customer-surface{min-height:100dvh;background:var(--bg);color:var(--ink)}
/* v176: customer modals opt into the dark token scope but must keep the scrim, not the page background. */
.modal.customer-surface{min-height:auto;background:rgba(23,22,26,.4)}
html[data-customer-surface="true"] body{background:var(--bg)}
/* v190 (owner: "change the background to same as business background (beige) instead of
   black; light/dark can be adjusted in the profile module"). The customer surface used to flip
   to dark purely because the DEVICE was in dark mode, so one person saw a beige workspace and a
   black wallet on the same phone. Beige is the default for everyone now; these tokens apply
   only when the customer has chosen dark — or chosen to follow their device — in
   Profile → Appearance, which is what sets data-customer-theme on <html>. */
html[data-customer-theme="dark"][data-customer-surface="true"] body{background:#0F1115}
  /* The offer-detail sheet is appended to body, outside .customer-surface,
     so it must join the dark token scope explicitly. */
html[data-customer-theme="dark"] .customer-surface,
html[data-customer-theme="dark"] .customer-offer-detail-modal .modal-card,
html[data-customer-theme="dark"] .customer-business-detail-modal .modal-card{
    color-scheme:dark;
    --bg:#0F1115;--card:#191C22;--ink:#F7F4EF;--ink2:#D8D2CA;--muted:#AAA3AD;
    --line:#343841;--control-border:#737A86;--hair:rgba(255,255,255,.11);
    --coral:#FF8A7E;--coral-hover:#FFAA9F;--amber:#F2C078;--green:#78D5A7;--red:#FF9E95;
    --grad:linear-gradient(135deg,#D95045,#A93631);--tint:#3A211F;
    --shadow:0 1px 2px rgba(0,0,0,.2),0 5px 16px rgba(0,0,0,.24);
    --shadow-lg:0 3px 8px rgba(0,0,0,.28),0 20px 52px rgba(0,0,0,.4)
  }
html[data-customer-theme="dark"] .customer-surface.portal{--coral:#FF8A7E!important;--grad:linear-gradient(135deg,#D95045,#A93631)!important}
  /* v176: doubled class (.customer-surface.customer-surface) + :is() so these dark remaps
     outrank base rules that carry a descendant combinator or a state pseudo-class. */
html[data-customer-theme="dark"] .customer-surface.customer-surface :is(input,select,textarea,.btn.ghost,.customer-primary-nav,.customer-home-quick a,
    .customer-home-offer,.customer-perk-card,.customer-offer-card,.customer-reward-card,
    .customer-programme-compact-head,.wallet-firm,.wallet-reward,
    .customer-inbox-bell,.customer-programme-card,.customer-booking-business,.customer-booking-tabs,.checkrow,.fb-chip,
    .customer-programme-switcher a,.customer-workspace-switch .menu){
    background:var(--card);color:var(--ink);border-color:var(--line)
  }
  /* State styling must survive the raised-specificity remap above. */
html[data-customer-theme="dark"] .customer-surface.customer-surface :is(input,select,textarea):focus{border-color:var(--coral)}
html[data-customer-theme="dark"] .customer-surface.customer-surface :is(input,select,textarea)[aria-invalid="true"]{border-color:var(--red)}
html[data-customer-theme="dark"] .customer-surface.customer-surface .wallet-firm:hover{border-color:var(--coral)}
html[data-customer-theme="dark"] .customer-surface.customer-surface .customer-programme-card-v95:focus-visible{border-color:var(--merchant-accent,var(--coral))}
html[data-customer-theme="dark"] .customer-surface.customer-surface .fb-chip[aria-pressed="true"]{background:var(--tint);border-color:var(--coral);color:var(--coral)}
html[data-customer-theme="dark"] .customer-surface.customer-surface .customer-first-quest{background:linear-gradient(145deg,var(--card) 30%,var(--tint));border-color:rgba(255,138,126,.28)}
html[data-customer-theme="dark"] .customer-surface.customer-surface .customer-programme-logo{background:color-mix(in srgb,var(--merchant-accent,var(--coral)) 22%,var(--card))}
html[data-customer-theme="dark"] .customer-surface.customer-surface .customer-merchant-hero .customer-programme-logo{background:rgba(255,255,255,.94)}
html[data-customer-theme="dark"] .customer-surface .btn.ghost,
html[data-customer-theme="dark"] .customer-surface .svc{background:var(--card);color:var(--ink);border-color:var(--line)}
html[data-customer-theme="dark"] .customer-surface .svc.sel{background:var(--tint);border-color:var(--coral)}
html[data-customer-theme="dark"] .customer-surface.customer-surface :is(.customer-primary-nav a:hover,.customer-primary-nav button:hover,
    .customer-workspace-switch .menu a:hover){background:#252930;color:var(--ink)}
html[data-customer-theme="dark"] .customer-surface .customer-home-nba{background:linear-gradient(145deg,var(--card) 35%,var(--tint))}
html[data-customer-theme="dark"] .customer-surface .customer-home-summary-note{background:linear-gradient(145deg,var(--card) 40%,var(--tint))}
html[data-customer-theme="dark"] .customer-surface .customer-offer-urgent{background:#4A3816;color:#FFD98B}
html[data-customer-theme="dark"] .customer-surface .pill.on,

.platform-contact-actions .btn{min-width:44px;min-height:44px;padding-inline:10px}
.platform-lane-empty{padding:10px 5px}
.platform-prospect-list{display:none}
.platform-prospect-list-view:not([hidden]){display:grid;gap:10px}
.platform-kanban[hidden],.platform-prospect-list[hidden]{display:none!important}
.platform-drawer{
  position:fixed;inset:0;z-index:120;display:flex;justify-content:flex-end;
  background:rgba(23,22,26,.32);padding-left:min(8vw,90px)
}
.platform-drawer-panel{
  width:min(720px,100%);height:100%;overflow-y:auto;background:var(--bg);
  box-shadow:-16px 0 48px rgba(23,22,26,.18);padding:24px
}
.platform-drawer-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px
}
.platform-drawer-close{min-width:44px;padding:10px}
.platform-detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.platform-detail-section{margin-top:14px}.platform-detail-section h2{font-size:15px;margin-bottom:8px}
.platform-detail-section pre{
  white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;
  background:#F8F6F2;border:1px solid var(--line);border-radius:10px;padding:12px
}
.platform-modal{
  position:fixed;inset:0;z-index:130;display:grid;place-items:center;padding:18px;
  background:rgba(23,22,26,.36)
}
.platform-modal-panel{
  width:min(680px,100%);max-height:92dvh;overflow-y:auto;background:var(--card);
  border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:24px
}
.platform-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.platform-form-grid .wide{grid-column:1/-1}
.platform-form-actions{display:flex;justify-content:flex-end;gap:9px;flex-wrap:wrap;margin-top:20px}
.platform-import-preview{max-height:320px;overflow:auto;margin-top:14px}
.platform-error-list{margin:10px 0 0 20px;color:var(--red);font-size:12px}
.platform-sector-list,.platform-commission-list,.platform-billing-list{display:grid;gap:12px}
.platform-sector-card-head,.platform-list-row{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap
}
.platform-module-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.platform-sector-actions{margin-top:14px}
.platform-module-picker{grid-column:1/-1;margin:4px 0 0;padding:0;border:0}
.platform-module-picker>legend{font-size:14px;font-weight:750}
.platform-module-picker>p{margin-top:4px}
.platform-module-group{margin-top:15px}
.platform-module-group h2,.platform-bundle-review h2{font-size:12px;letter-spacing:.01em}
.platform-module-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:7px}
.platform-module-option{
  display:flex;align-items:center;gap:10px;min-height:52px;padding:9px 11px;
  border:1px solid var(--hair);border-radius:11px;background:#FBFAF8;cursor:pointer
}
.platform-module-option:has(input:checked){border-color:rgba(194,65,53,.4);background:var(--tint)}
.platform-module-option input,.platform-review-confirm input{width:20px;height:20px;flex:0 0 auto;accent-color:var(--coral)}
.platform-module-option span{display:grid;gap:2px;min-width:0}
.platform-module-option b{font-size:12.5px}.platform-module-option small{color:var(--muted);font-size:10px}
.platform-module-selection{
  position:sticky;bottom:-1px;display:grid;gap:3px;margin-top:16px;padding:12px 14px;
  border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.96);
  box-shadow:0 -8px 20px rgba(23,22,26,.06)
}
.platform-module-selection b{font-size:12px}.platform-module-selection span{color:var(--muted);font-size:11px;line-height:1.4}
.platform-module-policy-intro{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px;
  padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--tint)
}
.platform-module-policy-intro h2{font-size:17px;margin:2px 0 4px}
.platform-module-policy-intro p{margin:0;max-width:520px}
.platform-module-policy-list{display:grid;gap:16px;margin:0 0 18px}
.platform-module-policy-group{display:grid;gap:8px}
.platform-module-policy-group h3{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.platform-module-policy-options{display:grid;gap:7px}
.platform-module-policy-row{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,190px);align-items:center;gap:14px;
  padding:10px 12px;border:1px solid var(--hair);border-radius:11px;background:#FBFAF8
}
.platform-module-policy-row:focus-within{border-color:rgba(194,65,53,.55);box-shadow:0 0 0 3px rgba(194,65,53,.09)}
.platform-module-policy-copy{display:grid;gap:3px;min-width:0}
.platform-module-policy-copy b{font-size:13px}.platform-module-policy-copy small{color:var(--muted);font-size:11px;line-height:1.35}
.platform-module-policy-row select{width:100%;min-height:40px}
.platform-paged-summary{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin-top:16px;padding:12px 14px;border:1px solid var(--hair);
  border-radius:12px;background:#fff
}
.platform-paged-summary p{margin:0}
.platform-bundle-review{display:grid;gap:16px}
.platform-bundle-diff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.platform-bundle-diff section{padding:12px;border:1px solid var(--hair);border-radius:10px;background:#FBFAF8}
.platform-bundle-diff ul{margin:7px 0 0 18px;font-size:12px}
.platform-review-confirm{
  display:flex;align-items:flex-start;gap:10px;min-height:52px;padding:12px;
  border:1px solid var(--line);border-radius:11px;background:#FBFAF8;cursor:pointer;
  font-size:12.5px;line-height:1.45
}
.platform-money{font-variant-numeric:tabular-nums;font-weight:750}
.platform-health-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.platform-action-queue{display:grid;gap:9px}.platform-action-item{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding:13px 0;border-bottom:1px solid var(--hair)
}
.platform-today{display:grid;gap:16px;margin-bottom:16px}
.platform-today-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.platform-today-head h2{margin-top:3px;font-size:1.45rem}
.platform-today-head p:last-child{margin-top:5px}
.platform-today-list{display:grid;gap:10px}
.platform-today-item{
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;
  padding:15px;border:1px solid var(--line);border-radius:14px;background:#FBFAF8
}
.platform-today-main{display:grid;gap:7px;min-width:0}
.platform-today-main h3{font-size:14px}
.platform-today-reason{color:var(--ink2);font-size:12.5px;font-weight:750}
.platform-today-meta{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0
}
.platform-today-meta div{min-width:0}
.platform-today-meta dt{
  color:var(--muted);font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase
}
.platform-today-meta dd{margin:2px 0 0;font-size:11.5px;overflow-wrap:anywhere}
.platform-today-action{white-space:nowrap}
.platform-today-more{margin-top:-4px}
.platform-today-coverage{
  border:1px solid var(--line);border-radius:12px;background:#FBFAF8;
  color:var(--ink2);font-size:12px
}
.platform-today-coverage summary{
  min-height:44px;display:flex;align-items:center;padding:10px 13px;
  color:var(--ink);font-weight:800;cursor:pointer
}
.platform-today-coverage ul{display:grid;gap:8px;margin:0;padding:0 13px 13px;list-style:none}
.platform-today-coverage li{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.platform-today-coverage li span{text-align:right}
.platform-today-coverage [data-coverage-state="partial"] b{color:#8A5A00}
.platform-today-coverage [data-coverage-state="unavailable"] b{color:var(--coral)}
.platform-control-status{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.platform-control-heading{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.platform-control-heading h3,.platform-consultative-report h3{font-size:14px}
.platform-branch-control-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.platform-branch-control-list .platform-action-item{border:1px solid var(--line);border-radius:14px;padding:12px}
.platform-consultative-report{margin-top:16px}
.platform-action-item:last-child{border-bottom:0}
.platform-preview{
  margin-top:14px;padding:14px;border:1px solid rgba(194,65,53,.3);
  border-radius:var(--r-sm);background:var(--tint)
}
.platform-preview pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}
.platform-enterprise-filters{margin-bottom:16px}
.platform-enterprise-filter-grid{
  display:grid;grid-template-columns:minmax(180px,1fr) minmax(170px,.7fr) minmax(240px,1.3fr);
  gap:0 14px;align-items:start
}
.platform-enterprise-filter-grid .cui-field label{margin-top:0}
.platform-checkbox-field{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:13px}
.platform-checkbox-field input{margin:0}
.platform-enterprise-search{grid-column:span 2;display:grid;gap:8px}
.platform-enterprise-search .cui-field label{margin-top:0}
.platform-enterprise-search>p{margin-top:8px;line-height:1.4}
.platform-enterprise-firms{grid-row:span 2}
.platform-enterprise-firms select{min-height:148px}
.platform-enterprise-table .platform-link-button{
  appearance:none;border:0;background:none;min-height:44px;padding:10px 0;color:var(--ink);text-align:left;
  text-decoration:underline;text-decoration-color:rgba(194,65,53,.28);
  text-underline-offset:3px;cursor:pointer
}
.platform-enterprise-table .platform-link-button:hover{color:var(--coral)}
.platform-enterprise-table .platform-contact-actions{margin-top:0;flex-wrap:nowrap}
.platform-firm-secondary{display:block;margin-top:3px}
.platform-table-link{
  appearance:none;border:0;background:transparent;color:var(--ink);cursor:pointer;
  display:inline-flex;flex-direction:column;font:inherit;padding:0;text-align:left
}
.platform-table-link b{
  color:var(--accent,#c63f32);text-decoration:underline;
  text-decoration-thickness:1px;text-underline-offset:3px
}
.platform-table-link:hover b,.platform-table-link:focus-visible b{text-decoration-thickness:2px}
.platform-enterprise-drawer{width:min(1040px,100%)}
.platform-enterprise-drawer .table-wrap{max-height:390px;overflow:auto}
.platform-report-host{margin-top:18px;scroll-margin-top:86px}
.platform-report-sheet{display:grid;gap:20px}
.platform-report-sheet h2,.platform-report-sheet h3{letter-spacing:-.025em}
.platform-report-insights{display:grid;gap:10px}
/* v176 AI narrative reports (firm drawer). */
.platform-ai-reports .platform-action-item{align-items:flex-start}
.platform-ai-reports .platform-actions{align-items:center;flex-wrap:wrap;gap:8px}
.platform-ai-report-body{
  display:block;margin-top:12px;padding:14px;border:1px solid var(--hair);
  border-radius:12px;background:#FBFAF8;color:var(--ink2);line-height:1.6;
  max-height:min(58vh,620px);overflow-y:auto;overflow-wrap:anywhere
}
.platform-ai-report-body h3,.platform-ai-report-body h4,.platform-ai-report-body h5{
  margin:14px 0 6px;color:var(--ink);font-size:15px;letter-spacing:-.02em
}
.platform-ai-report-body h3:first-child,.platform-ai-report-body h4:first-child{margin-top:0}
.platform-ai-report-body p{margin:0 0 10px}
.platform-ai-report-body ul,.platform-ai-report-body ol{margin:0 0 10px;padding-left:20px}
.platform-ai-report-body li{margin-bottom:6px}
.platform-ai-report-body b{color:var(--ink)}
/* v177 read-only workspace mirror (firm drawer -> full-screen mirror). */
.platform-workspace-mirror-card .platform-actions{align-items:center;flex-wrap:wrap;gap:8px}
.platform-workspace-mirror-controls{
  display:grid;gap:12px;margin-bottom:14px;padding:14px;border:1px solid var(--hair);
  border-radius:12px;background:#FBFAF8
}
.platform-workspace-mirror-controls .cui-field{margin:0;max-width:360px}
.platform-workspace-mirror-controls select{min-height:44px;width:100%}
.platform-workspace-mirror-tabs{display:flex;flex-wrap:wrap;gap:8px}
.platform-workspace-mirror-tabs button{min-height:44px;display:inline-flex;align-items:center;gap:6px}
.platform-workspace-mirror-tabs button.on{
  border-color:var(--ink);background:var(--ink);color:#fff
}
.platform-workspace-mirror>[data-mirror-body]{display:grid;gap:14px}
.platform-insight{
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px;
  border:1px solid var(--hair);border-radius:12px;background:#FBFAF8
}
.platform-insight p{margin-top:4px;color:var(--ink2);line-height:1.55}
.platform-insight small{
  display:block;margin-top:7px;color:var(--muted);overflow-wrap:anywhere
}
.platform-report-method{
  padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px
}
.platform-report-method p{margin-top:5px;line-height:1.5}
.platform-attention-summary{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px
}
.platform-attention-card{
  min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 13px;border:1px solid var(--hair);border-radius:12px;background:#fff;
  color:var(--ink2);text-align:left;cursor:pointer
}
.platform-attention-card:hover,.platform-attention-card:focus-visible{border-color:var(--coral);box-shadow:var(--shadow)}
.platform-attention-card span{font-size:11.5px;font-weight:700}
.platform-attention-card b{font-size:1.25rem;font-variant-numeric:tabular-nums}
.platform-attention-card.no{background:#FBE8E5;color:#8F2A23}
.platform-attention-card.new{background:#FFF3DA;color:#75500D}
.platform-attention-card.ok{background:#E7F5EC;color:#167247}
.platform-filter-panel{margin-bottom:16px}
.platform-filter-primary{
  display:grid;grid-template-columns:minmax(240px,1.4fr) repeat(3,minmax(145px,.6fr));
  align-items:end;gap:0 14px
}
.platform-filter-primary .cui-field label,.platform-filter-grid .cui-field label{margin-top:0}
.platform-filter-submit{
  grid-column:1/-1;display:flex;align-items:center;justify-content:flex-end;
  gap:8px;padding-top:8px
}
.platform-filter-more{margin-top:12px;padding-top:12px;border-top:1px solid var(--hair)}
.platform-filter-more>summary{
  min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--ink2);
  font-size:13px;font-weight:700
}
.platform-filter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
.platform-active-filters{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:12px;
  color:var(--muted);font-size:12px
}
.platform-prospect-contact{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;margin-top:5px;font-size:11.5px}
.platform-prospect-contact span{color:var(--muted)}
.platform-card-facts{display:grid;gap:5px;margin-top:10px}
.platform-card-facts div{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px}
.platform-card-facts dt{color:var(--muted);font-size:10.5px}.platform-card-facts dd{font-size:11px;overflow-wrap:anywhere}
.platform-card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.platform-card-tags span{
  max-width:100%;padding:3px 7px;border:1px solid var(--hair);border-radius:999px;
  background:#F8F6F2;color:var(--ink2);font-size:10px;overflow-wrap:anywhere
}
.platform-import-step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;margin:12px 0}
.platform-import-step>span{
  display:grid;place-items:center;width:32px;height:32px;border-radius:999px;
  background:var(--tint);color:var(--coral);font-size:12px;font-weight:800
}
.platform-import-map-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.platform-import-map-grid label{display:block;margin:0 0 5px;font-size:11px;font-weight:700}
.platform-import-map-grid select{min-height:44px}
.platform-import-summary{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0;padding:11px 12px;
  border:1px solid var(--hair);border-radius:10px;background:#FBFAF8;font-size:12px
}
.platform-import-summary span{padding-left:10px;border-left:1px solid var(--line);color:var(--ink2)}
.platform-import-review-list{max-height:330px;overflow:auto;border-block:1px solid var(--hair)}
.platform-import-review-row{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(140px,.4fr);gap:12px;
  align-items:center;padding:12px 2px;border-bottom:1px solid var(--hair)
}
.platform-confirm-row{align-items:flex-start!important;gap:9px;min-height:44px;padding:9px 0;color:var(--ink2)}
.platform-confirm-row input{width:20px;min-width:20px;height:20px;margin:1px 0 0}
.platform-detail-nav{
  position:sticky;top:-24px;z-index:4;display:flex;gap:4px;overflow-x:auto;
  margin:-6px -4px 12px;padding:7px 4px;border-bottom:1px solid var(--hair);
  background:rgba(244,242,238,.96);backdrop-filter:blur(12px)
}
.platform-detail-nav button{
  flex:0 0 auto;min-height:40px;padding:7px 10px;border:0;border-radius:9px;
  background:transparent;color:var(--muted);font-size:11.5px;font-weight:700;cursor:pointer
}
.platform-detail-nav button:hover,.platform-detail-nav button:focus-visible{background:var(--tint);color:var(--coral)}
.platform-detail-shortcuts{margin-bottom:14px}
.platform-action-disclosure{position:relative}
.platform-action-disclosure>summary{list-style:none;cursor:pointer}
.platform-action-disclosure>summary::-webkit-details-marker{display:none}
.platform-action-disclosure-menu{position:absolute;z-index:8;right:0;top:calc(100% + 6px);display:grid;gap:6px;min-width:230px;padding:8px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
.platform-action-disclosure-menu .btn{justify-content:flex-start;width:100%}
.platform-detail-section{scroll-margin-top:64px}
.platform-typed-list dd{max-width:60%;overflow-wrap:anywhere}
.platform-detail-more{margin-top:14px;border-top:1px solid var(--hair);padding-top:10px}
.platform-detail-more summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-size:12.5px;font-weight:700}
.platform-contact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.platform-contact-card{padding:14px;border:1px solid var(--hair);border-radius:12px;background:#FBFAF8}
.platform-timeline-item{
  position:relative;display:grid;grid-template-columns:12px minmax(0,1fr);gap:10px;
  padding:10px 0;border-bottom:1px solid var(--hair)
}
.platform-timeline-marker{width:10px;height:10px;margin-top:5px;border:2px solid var(--coral);border-radius:999px;background:#fff}
.platform-quality-rules{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.platform-quality-rules span{
  display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border-radius:999px;
  font-size:10.5px;font-weight:700
}
.platform-quality-rules .pass{background:#E7F5EC;color:#167247}.platform-quality-rules .fail{background:#FBE8E5;color:#9F3027}
.platform-upload-progress{min-height:24px;margin-top:10px}
.platform-upload-progress p{padding:9px 10px;border-radius:9px;background:#F8F6F2}
.platform-report-sheet>.platform-detail-section{padding-top:10px;border-top:1px solid var(--hair)}
.platform-report-sheet .platform-report-sheet{padding:0;border:0;box-shadow:none;background:transparent}
.platform-access-summary{
  display:grid;gap:2px;margin:0 6px 14px;padding:11px 12px;border:1px solid var(--hair);
  border-radius:11px;background:#fff
}
.platform-access-summary b{font-size:12px}.platform-access-summary span{color:var(--muted);font-size:10.5px;line-height:1.4}
.platform-denied{
  width:min(680px,calc(100% - 28px));min-height:100dvh;margin:auto;
  display:grid;align-content:center;gap:18px;padding:max(24px,env(safe-area-inset-top))
}
.platform-denied-brand{font-size:1.7rem}.platform-denied>.platform-actions{justify-content:center}
.platform-access-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.platform-access-card{min-width:0}.platform-access-card-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px
}
.platform-access-card-head h2{font-size:15px;overflow-wrap:anywhere}
.platform-access-card-head p{overflow-wrap:anywhere}
.platform-access-facts{display:grid;gap:7px;margin-top:14px;padding-block:12px;border-block:1px solid var(--hair)}
.platform-access-facts div{display:flex;justify-content:space-between;gap:14px}
.platform-access-facts dt{color:var(--muted);font-size:11px}.platform-access-facts dd{text-align:right;font-size:11.5px;font-weight:650}
.platform-access-actions{justify-content:flex-end;margin-top:14px}
.platform-active-toggle,.platform-permission-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:56px;
