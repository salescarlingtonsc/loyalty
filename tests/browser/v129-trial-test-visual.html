      return `<input class="edCondVal edCondValA" type="number" step="${step}" value="${isMoney&&a!==''?(Number(a)/100):esc(a)}" placeholder="low"> <input class="edCondVal edCondValB" type="number" step="${step}" value="${isMoney&&b!==''?(Number(b)/100):esc(b)}" placeholder="high">`;}
    if(op==='in'||op==='not_in'){const list=Array.isArray(value)?value.join(', '):'';
      return `<input class="edCondVal" type="text" value="${esc(list)}" placeholder="comma-separated">`;}
    if(vt==='integer'||vt==='numeric')
      return `<input class="edCondVal" type="number" step="${step}" value="${isMoney&&value!==''&&value!=null?(Number(value)/100):esc(value)}" placeholder="value">`;
    return `<input class="edCondVal" type="text" value="${esc(value==null?'':value)}" placeholder="value">`;
  }
  function readCondValue(row,def,op,field){
    const vt=def.value_type;const catKind=STUDIO_CONDITION_CATALOG[field];const isMoney=/_cents$/.test(field);
    if(vt==='catalog_ref'&&catKind){const el=row.querySelector('.edCondVal');
      if(op==='in'||op==='not_in')return [...el.selectedOptions].map(o=>o.value).filter(Boolean);
      return el.value||null;}
    if(vt==='boolean'){return row.querySelector('.edCondVal').value==='true';}
    if(op==='between'){const a=row.querySelector('.edCondValA').value,b=row.querySelector('.edCondValB').value;
      const n=x=>isMoney?Math.round(Number(x||0)*100):Number(x||0);return [n(a),n(b)];}
    if(op==='in'||op==='not_in'){return row.querySelector('.edCondVal').value.split(',').map(s=>s.trim()).filter(Boolean);}
    const raw=row.querySelector('.edCondVal').value;
    if(vt==='integer'||vt==='numeric')return isMoney?Math.round(Number(raw||0)*100):Number(raw||0);
    return raw;
  }
  function effInputHtml(e){
    const t=e.effect_type;const kind=STUDIO_EFFECT_LABEL[t]?STUDIO_EFFECT_LABEL[t].input:'note';
    if(kind==='amount')return `<label class="sr-only" for="">Amount</label><span class="edEffLbl">Amount (${S.biz.currency||'SGD'})</span><input class="edEffVal" data-f="amount_cents" type="number" min="0" step="0.01" value="${e.amount_cents!=null?(Number(e.amount_cents)/100):''}" placeholder="e.g. 5.00">`;
    if(kind==='pct')return `<span class="edEffLbl">Discount %</span><input class="edEffVal" data-f="discount_pct" type="number" min="0" max="100" step="1" value="${e.discount_pct!=null?e.discount_pct:''}" placeholder="e.g. 20">`;
    if(kind==='points')return `<span class="edEffLbl">Points</span><input class="edEffVal" data-f="points" type="number" min="0" step="1" value="${e.points!=null?e.points:''}" placeholder="e.g. 100">`;
    if(kind==='stamps')return `<span class="edEffLbl">Stamps</span><input class="edEffVal" data-f="stamps" type="number" min="0" step="1" value="${e.stamps!=null?e.stamps:''}" placeholder="e.g. 1">`;
    if(kind==='multiplier')return `<span class="edEffLbl">Multiplier</span><input class="edEffVal" data-f="multiplier" type="number" min="1" step="0.5" value="${e.multiplier!=null?e.multiplier:''}" placeholder="e.g. 2">`;
    if(kind==='free_item'){const kinds=['service','product'];
      return `<span class="edEffLbl">Free item</span><select class="edEffVal" data-f="catalog_kind">${kinds.map(k=>`<option value="${k}" ${e.catalog_kind===k?'selected':''}>${k}</option>`).join('')}</select>
        <select class="edEffVal" data-f="catalog_id">${effItemOptions(e.catalog_kind||'service',e.catalog_id)}</select>`;}
    return `<span class="edEffLbl">Message (optional)</span><input class="edEffVal" data-f="note" type="text" value="${esc(e.note||'')}" placeholder="short note">`;
  }
  function effItemOptions(kind,selected){
    const opts=(cat&&cat.byKind[kind])||[];
    return `<option value="">Choose…</option>`+opts.map(o=>`<option value="${esc(o.id)}" ${selected===o.id?'selected':''}>${esc(o.name)}</option>`).join('');
  }
  function readEffInto(row,e){
    row.querySelectorAll('.edEffVal').forEach(el=>{
      const f=el.dataset.f;
      if(f==='amount_cents')e.amount_cents=Math.round(Number(el.value||0)*100);
      else if(f==='discount_pct')e.discount_pct=Number(el.value||0);
      else if(f==='points')e.points=Number(el.value||0);
      else if(f==='stamps')e.stamps=Number(el.value||0);
      else if(f==='multiplier')e.multiplier=Number(el.value||0);
      else if(f==='catalog_kind')e.catalog_kind=el.value;
      else if(f==='catalog_id')e.catalog_id=el.value||'';
      else if(f==='note')e.note=el.value;
    });
  }

  // ---- paint the editor from the working model ----
  function paintEditor(){
    const m=studioEd;const host=editorHost();if(!host)return;
    if(!m){host.innerHTML='';return;}
    const condOpts=(condByEvent[m.when_event]||[]);
    const effOpts=(effByEvent[m.when_event]||[]);
    const condRows=m.if_conditions.map((c,i)=>{
      const def=condDefLookup(m.when_event,c.field)||condOpts[0]||{};
      const field=c.field||def.field;
      const ops=(condDefLookup(m.when_event,field)||{}).operators||[];
      return `<div class="stCond" data-i="${i}">
        <select class="edCondField">${condOpts.map(o=>`<option value="${esc(o.field)}" ${o.field===field?'selected':''}>${esc(STUDIO_FIELD_LABEL[o.field]||o.field)}</option>`).join('')}</select>
        <select class="edCondOp">${ops.map(o=>`<option value="${o}" ${o===c.op?'selected':''}>${esc(STUDIO_OP_LABEL[o]||o)}</option>`).join('')}</select>
        <span class="edCondValCell">${condValueCellHtml(condDefLookup(m.when_event,field)||{},c.op,field,c.value)}</span>
        <button class="btn ghost sm edCondDel" type="button" aria-label="Remove condition">Remove</button></div>`;
    }).join('');
    const effRows=m.then_effects.map((e,i)=>{
      return `<div class="stEff" data-i="${i}">
        <select class="edEffType">${effOpts.map(o=>`<option value="${esc(o.effect_type)}" ${o.effect_type===e.effect_type?'selected':''}>${esc((STUDIO_EFFECT_LABEL[o.effect_type]&&STUDIO_EFFECT_LABEL[o.effect_type].label)||o.effect_type)}</option>`).join('')}</select>
        <span class="edEffValCell">${effInputHtml(e)}</span>
        <button class="btn ghost sm edEffDel" type="button" aria-label="Remove action">Remove</button></div>`;
    }).join('');
    host.innerHTML=`<div class="card studio-editor"><div class="row" style="align-items:center">
      <b>${m.isNew?'New rule':'Edit rule'}</b><span class="spacer"></span><button class="btn ghost sm" id="edClose" type="button">Close</button></div>
      <label for="edName">Step 1 — Name this rule</label><input id="edName" value="${esc(m.name)}" placeholder="e.g. Double points on Mondays">
      <label style="margin-top:10px"><input type="checkbox" id="edActive" ${m.active?'checked':''}> Include this rule when the draft is published (the publish preview shows whether it will run, shadow-test, or stay off)</label>

      <fieldset class="studio-step"><legend>Step 2 — When (the trigger)</legend>
        <select id="edWhen">${events.map(ev=>`<option value="${esc(ev)}" ${ev===m.when_event?'selected':''}>${esc(studioEventText(ev))}</option>`).join('')}</select></fieldset>

      <fieldset class="studio-step"><legend>Step 3 — If (conditions, optional)</legend>
        <div id="edConds">${condRows||'<p class="muted small">No conditions — the rule matches every time the trigger happens.</p>'}</div>
        ${condOpts.length?'<button class="btn ghost sm" id="edAddCond" type="button">Add condition</button>':'<p class="muted small">This trigger has no conditions to add.</p>'}</fieldset>

      <fieldset class="studio-step"><legend>Step 4 — Then (what happens)</legend>
        <div id="edEffs">${effRows||'<p class="muted small">Add at least one action.</p>'}</div>
        ${effOpts.length?'<button class="btn ghost sm" id="edAddEff" type="button">Add action</button>':''}</fieldset>

      <fieldset class="studio-step"><legend>Step 5 — During (schedule, optional)</legend>
        <label><input type="checkbox" id="edSchedOn" ${m.during.on?'checked':''}> Limit this rule to certain days or times</label>
        <div id="edSchedBody" style="${m.during.on?'':'display:none'};margin-top:8px">
          <div class="muted small">All times are Singapore time.</div>
          <div class="row" style="flex-wrap:wrap;gap:6px;margin-top:6px">${DOW_NAMES.map((d,i)=>`<label class="edDowLbl"><input type="checkbox" class="edDow" value="${i}" ${(m.during.days_of_week||[]).includes(i)?'checked':''}> ${d}</label>`).join('')}</div>
          <div class="split" style="margin-top:8px"><div><label for="edStartDate">Start date</label><input type="date" id="edStartDate" value="${esc(m.during.start_date)}"></div>
            <div><label for="edEndDate">End date</label><input type="date" id="edEndDate" value="${esc(m.during.end_date)}"></div></div>
          <div class="split"><div><label for="edStartTime">Start time</label><input type="time" id="edStartTime" value="${esc(m.during.start_time)}"></div>
            <div><label for="edEndTime">End time</label><input type="time" id="edEndTime" value="${esc(m.during.end_time)}"></div></div>
        </div></fieldset>

      <details class="studio-advanced" ${m.advanced?'open':''}><summary>Advanced — limits, stacking &amp; technical detail</summary>
        <fieldset class="studio-step"><legend>Limits &amp; stacking</legend>
          <label><input type="checkbox" id="edStackable" ${m.using.stackable?'checked':''}> Can combine with other offers</label>
          <div class="split" style="margin-top:8px"><div><label for="edPriority">Priority (higher runs first)</label><input type="number" id="edPriority" value="${esc(m.using.priority)}"></div>
            <div><label for="edMaxStack">Maximum stack (optional)</label><input type="number" id="edMaxStack" min="1" value="${esc(m.using.max_stack)}"></div></div>
          <label for="edExclGroup">Exclusive group (optional)</label><input id="edExclGroup" value="${esc(m.using.exclusive_group)}" placeholder="e.g. birthday-offers"></fieldset>
        <div class="split"><div><label for="edSort">Sort order</label><input type="number" id="edSort" value="${esc(m.sort)}"></div>
          <div><label for="edNotes">Internal notes (optional)</label><input id="edNotes" value="${esc(m.notes)}" placeholder="not shown to customers"></div></div>
        <div class="studio-canon"><b class="muted small">Canonical form &amp; hash</b><pre id="edCanon" class="studio-pre">—</pre></div>
      </details>

      <div id="edPreview" class="studio-preview"></div>
      <div id="edStatus" class="small" style="margin-top:8px" role="status" aria-live="polite"></div>
      <div class="row" style="margin-top:12px;gap:8px"><button class="btn" id="edSave" type="button">${m.isNew?'Save rule to draft':'Save changes'}</button>
        <button class="btn ghost" id="edCancel" type="button">Cancel</button></div>
    </div>`;
    wireEditor();
    liveValidate();
  }

  // ---- editor event wiring ----
  function wireEditor(){
    const host=editorHost();if(!host)return;const m=studioEd;
    host.querySelector('#edClose').onclick=()=>{closeEditor();};
    host.querySelector('#edCancel').onclick=()=>{closeEditor();};
    host.querySelector('#edWhen').onchange=e=>{syncEditorDom();m.when_event=e.target.value;m.if_conditions=[];m.then_effects=[];paintEditor();};
    const addCond=host.querySelector('#edAddCond');
    if(addCond)addCond.onclick=()=>{syncEditorDom();const first=(condByEvent[m.when_event]||[])[0];
      if(first)m.if_conditions.push({field:first.field,op:(first.operators||['eq'])[0],value:defaultCondValue(first)});paintEditor();};
    const addEff=host.querySelector('#edAddEff');
    if(addEff)addEff.onclick=()=>{syncEditorDom();const first=(effByEvent[m.when_event]||[])[0];
      if(first)m.then_effects.push(defaultEffect(first.effect_type));paintEditor();};
    host.querySelectorAll('.stCond').forEach((row,i)=>{
      row.querySelector('.edCondField').onchange=e=>{syncEditorDom();const def=condDefLookup(m.when_event,e.target.value)||{};
        m.if_conditions[i]={field:e.target.value,op:(def.operators||['eq'])[0],value:defaultCondValue(def)};paintEditor();};
      row.querySelector('.edCondOp').onchange=e=>{syncEditorDom();m.if_conditions[i].op=e.target.value;
        m.if_conditions[i].value=defaultCondValue(condDefLookup(m.when_event,m.if_conditions[i].field)||{},e.target.value);paintEditor();};
      row.querySelector('.edCondDel').onclick=()=>{syncEditorDom();m.if_conditions.splice(i,1);paintEditor();};
    });
    host.querySelectorAll('.stEff').forEach((row,i)=>{
      row.querySelector('.edEffType').onchange=e=>{syncEditorDom();m.then_effects[i]=defaultEffect(e.target.value);paintEditor();};
      row.querySelector('.edEffDel').onclick=()=>{syncEditorDom();m.then_effects.splice(i,1);paintEditor();};
      const kindSel=row.querySelector('.edEffVal[data-f="catalog_kind"]');
      if(kindSel)kindSel.onchange=()=>{syncEditorDom();paintEditor();};
    });
    const schedOn=host.querySelector('#edSchedOn');
    if(schedOn)schedOn.onchange=e=>{const body=host.querySelector('#edSchedBody');if(body)body.style.display=e.target.checked?'':'none';liveValidate();};
    const adv=host.querySelector('.studio-advanced');
    if(adv)adv.addEventListener('toggle',()=>{m.advanced=adv.open;});
    host.querySelector('#edSave').onclick=saveRule;
  }
  function defaultCondValue(def,op){
    if(!def)return '';
    if(def.value_type==='boolean')return true;
    if(op==='between')return [0,0];
    if(op==='in'||op==='not_in')return [];
    if(def.value_type==='catalog_ref')return (op==='in'||op==='not_in')?[]:'';
    return '';
  }
  function defaultEffect(t){
    const o={effect_type:t};const kind=STUDIO_EFFECT_LABEL[t]?STUDIO_EFFECT_LABEL[t].input:'note';
    if(kind==='amount')o.amount_cents=0;else if(kind==='pct')o.discount_pct=0;else if(kind==='points')o.points=0;
    else if(kind==='stamps')o.stamps=0;else if(kind==='multiplier')o.multiplier=1;
    else if(kind==='free_item'){o.catalog_kind='service';o.catalog_id='';}else o.note='';
    return o;
  }

  // ---- live validation + preview (dry-run RPC; never invents numbers) ----
  let validateTimer=null;let validateSeq=0;
  function debouncedValidate(){clearTimeout(validateTimer);validateTimer=setTimeout(liveValidate,350);}
  async function liveValidate(){
    if(!studioEd)return;syncEditorDom();
    const m=studioEd;const rule=buildRule(m);const seq=++validateSeq;
    const canonEl=editorHost()&&editorHost().querySelector('#edCanon');
    const {data,error}=await sb.rpc('validate_program_rule',{p_business:S.biz.id,p_rule:rule});
    if(!isCurrent()||seq!==validateSeq||studioEd!==m)return;
    const preview=editorHost()&&editorHost().querySelector('#edPreview');
    const saveBtn=editorHost()&&editorHost().querySelector('#edSave');
    if(error){if(preview)preview.innerHTML=`<div class="err small">Could not check this rule right now.</div>`;return;}
    if(canonEl)canonEl.textContent=JSON.stringify(data.canonical,null,2)+'\n\nhash: '+(data.rule_hash||'—');
    const valid=data.valid&&(rule.name||'').trim().length>0&&rule.then_effects.length>0;
    const nameErr=(rule.name||'').trim().length===0?['Give the rule a name.']:[];
    const effErr=rule.then_effects.length===0?['Add at least one action.']:[];
    const errs=(data.errors||[]).map(studioErrText).concat(nameErr,effErr);
    const est=studioEstimate(rule,agg);
    if(preview)preview.innerHTML=`<div class="studio-preview-card">
      <b>Preview</b>
      <div class="muted small" style="margin-top:6px"><b>When:</b> ${studioWhenText(rule,cat)}</div>
      <div class="muted small"><b>Then:</b> ${studioThenText(rule,cat)}</div>
      <div class="muted small"><b>During:</b> ${studioDuringText(rule.during_schedule)}</div>
      <div class="muted small"><b>Stacking:</b> ${studioUsingText(rule.using_stacking)}</div>
      <div style="margin-top:8px">${(valid?studioStateChip('validated'):studioStateChip('validation_failed'))} <span class="muted small">draft check — not running until you publish it</span></div>
      ${errs.length?`<div class="err small" style="margin-top:8px">${errs.map(e=>esc(e)).join('<br>')}</div>`:''}
      <div class="studio-econ"><b class="muted small">Estimated economics</b>
        ${est.length?est.map(l=>`<div class="studio-econ-line"><div>${esc(l.label)}</div>${l.face?`<div class="small">${esc(l.face)}</div>`:''}${l.est?`<div class="small"><b>${esc(l.est)}</b></div>`:''}<div class="muted small">${esc(l.note)}</div></div>`).join(''):'<div class="muted small">No actions to estimate yet.</div>'}
      </div></div>`;
    if(saveBtn)saveBtn.disabled=!valid;
  }

  function setStatus(state,msg,extraHtml){
    const el=editorHost()&&editorHost().querySelector('#edStatus');if(!el)return;
    const cls={loading:'muted',success:'studio-ok',validation:'err',denied:'err',conflict:'err',error:'err'}[state]||'muted';
    el.innerHTML=`<span class="${cls}">${esc(msg)}</span>${extraHtml||''}`;
    CUI.announce(msg,{assertive:state==='denied'||state==='error'||state==='conflict'});
  }

  // ---- save (snapshot-hash optimistic concurrency; six visible button states) ----
  const retryKey=()=>`frenly:studio-rule:${S.biz.id}:${draftVersionId}`;
  async function saveRule(){
    if(!studioEd)return;syncEditorDom();
    const m=studioEd;const rule=buildRule(m);
    if((rule.name||'').trim().length===0){setStatus('validation','Give the rule a name first.');return;}
    if(rule.then_effects.length===0){setStatus('validation','Add at least one action first.');return;}
    // retry-safe stable id for a brand-new rule
    let ruleId=m.ruleId;
    if(m.isNew){const saved=sessionStorage.getItem(retryKey());if(saved)ruleId=saved;else sessionStorage.setItem(retryKey(),ruleId);}
    const btn=editorHost().querySelector('#edSave');btn.disabled=true;btn.setAttribute('aria-busy','true');
    setStatus('loading','Saving…');
    const {data,error}=await sb.rpc('save_program_rule_draft',{p_config_version:draftVersionId,p_rule_id:ruleId,p_rule:rule,p_expected_snapshot_hash:snapshotHash});
    if(!isCurrent())return;
    btn.removeAttribute('aria-busy');
    if(error){
      btn.disabled=false;
      const code=error.code;
      if(code==='42501'){setStatus('denied','You do not have access to save this rule.');}
      else if(code==='40001'){setStatus('conflict','This draft changed in another tab. ',`<button class="btn ghost sm" id="edReload" type="button">Reload draft</button>`);
        const rl=editorHost().querySelector('#edReload');if(rl)rl.onclick=()=>{studioEd=null;rerender();};}
      else if(code==='22023'){setStatus('validation',error.message||'This rule is not valid yet.');}
      else{setStatus('error',error.message||'Could not save. Please try again.');}
      return;
    }
    if(m.isNew)sessionStorage.removeItem(retryKey());
    setStatus('success','Saved.');
    studioEd=null;
    toast('Rule saved to draft');
    rerender();
  }

  // ---- top-level wiring (templates, list actions, publish) ----
  document.querySelectorAll('.studioTemplate').forEach(b=>b.onclick=()=>{
    const t=TEMPLATES.find(x=>x.id===b.dataset.t);if(!t)return;
    const seed=t.make();const m=blankModel();
    m.name=seed.name;m.when_event=seed.when_event;m.if_conditions=seed.if_conditions||[];m.then_effects=seed.then_effects||[];
    if(seed.during)m.during=Object.assign(m.during,seed.during);
    openEditor(m);
  });
  if($('studioAddRule'))$('studioAddRule').onclick=()=>openEditor(blankModel());
  // Delegated live-validate: attach ONCE to the persistent editor host (paintEditor only replaces
  // its children, so re-painting never accumulates listeners here).
  if(editorHost()){editorHost().addEventListener('input',debouncedValidate);editorHost().addEventListener('change',debouncedValidate);}
  document.querySelectorAll('.studioEditRule').forEach(b=>b.onclick=()=>{
    const r=rules.find(x=>x.rule_id===b.dataset.id);if(r)openEditor(modelFromRule(r));});
  document.querySelectorAll('.studioDelRule').forEach(b=>b.onclick=async()=>{
    if(!confirm(`Delete rule "${b.dataset.name||''}"? This only changes the draft.`))return;
    b.disabled=true;
    const {error}=await sb.rpc('delete_program_rule_draft',{p_config_version:draftVersionId,p_rule_id:b.dataset.id,p_expected_snapshot_hash:snapshotHash});
    if(!isCurrent())return;
    if(error){b.disabled=false;
      if(error.code==='40001'){toast('Draft changed in another tab — reloading');return rerender();}
      if(error.code==='42501')return toast('You do not have access to delete this rule.');
      return fail(error);}
    toast('Rule deleted from draft');rerender();
  });
  /* PS-1C.2 PUBLISH TRUTHFULNESS: never publish blind. First ask the server what publishing THIS
     draft would actually do (preview_publish_impact) — which effects begin executing (live), which
     stay shadow-only, which stay unbuilt, and whether money or customers are touched. When the
     server flags requires_confirmation (a live financial or customer-facing effect will activate),
     the owner must EXPLICITLY confirm by typing PUBLISH before publish_loyalty_config runs. */
  if($('studioPublish'))$('studioPublish').onclick=openPublishFlow;
  const requestedReviewKey=`nestly:grow-publish-review:${draftVersionId}`;
  if(sessionStorage.getItem(requestedReviewKey)==='1'){
    sessionStorage.removeItem(requestedReviewKey);
    queueMicrotask(()=>{if(isCurrent())openPublishFlow()});
  }
  async function openPublishFlow(){
    const btn=$('studioPublish');btn.disabled=true;btn.setAttribute('aria-busy','true');
    const st=$('studioPublishStatus');if(st)st.innerHTML='<span class="muted">Checking exactly what will happen…</span>';
    const {data:impact,error}=await sb.rpc('preview_publish_impact',{p_config_version_id:draftVersionId});
    if(!isCurrent())return;
    btn.removeAttribute('aria-busy');btn.disabled=false;
    if(error){
      const msg=error.code==='42501'?'Only the owner can publish.':(error.message||'Could not check what publishing would do.');
      if(st)st.innerHTML=`<span class="err">${esc(msg)}</span>`;CUI.announce(msg,{assertive:true});return;
    }
    if(st)st.innerHTML='';
    renderPublishImpactDialog(impact||{});
  }
  function studioEffLabel(e){return (STUDIO_EFFECT_LABEL[e.effect_type]&&STUDIO_EFFECT_LABEL[e.effect_type].label)||e.effect_type||'Action';}
  function renderPublishImpactDialog(impact){
    const rules=Array.isArray(impact.rules)?impact.rules:[];
    let live=0,shadow=0,unbuilt=0;
    for(const r of rules)for(const e of (r.effects||[])){
      if(e.state_after_publish==='live')live++;else if(e.state_after_publish==='shadow')shadow++;else unbuilt++;
    }
    const needConfirm=impact.requires_confirmation===true;
    const summary=`<div class="imp-note"><b>What publishing does:</b>
      <div class="muted small" style="margin-top:4px;line-height:1.6">
        <div>${workspaceTemplateHtmlV97(live===1?'publishImpactAction':'publishImpactActions',{live,shadow,unbuilt})}</div>
        <div>${workspaceTemplateHtmlV97(impact.will_activate_live_financial?'publishMoneyLive':'publishMoneyNone')}</div>
        <div>${workspaceTemplateHtmlV97(impact.will_activate_customer_facing?'publishCustomersLive':'publishCustomersNone')}</div>
      </div></div>`;
    const ruleBlocks=rules.length?rules.map(r=>`<div class="studio-impact-rule">
      <div class="row" style="gap:8px;align-items:center;flex-wrap:wrap"><b>${r.name?`<span data-merchant-content>${esc(r.name)}</span>`:'<span data-workspace-i18n>(unnamed)</span>'}</b>${studioStateChip(r.aggregate_state_after_publish)}${r.active===false?'<span class="pill off">Off</span>':''}</div>
      ${(r.effects||[]).map(e=>`<div class="studio-impact-eff"><span>${esc(studioEffLabel(e))}</span>
        <span style="display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap">${studioEffectStateChip(e.state_after_publish)}${e.financial?'<span class="studio-tag fin">changes money</span>':''}${e.customer_facing?'<span class="studio-tag cust">customer sees it</span>':''}</span></div>`).join('')||'<div class="muted small" style="padding:5px 0">No actions on this rule.</div>'}
    </div>`).join(''):'<p class="muted small">This draft has no rules to publish.</p>';
    const confirmBlock=`<div class="${needConfirm?'studio-emg-banner':'imp-note'}" role="note" style="margin-top:14px">${workspaceTemplateHtmlV97(needConfirm?'publishConfirmationSensitive':'publishConfirmationStandard')}</div>
      <label for="studioPubType" class="sr-only">Type PUBLISH to confirm</label>
      <input id="studioPubType" autocomplete="off" placeholder="PUBLISH" style="margin-top:8px">`;
    document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="studioPubModal" role="dialog" aria-modal="true" aria-labelledby="studioPubTitle" tabindex="-1"><div class="modal-card" style="max-width:640px">
      <div class="row"><div><h2 id="studioPubTitle">Review before publishing</h2><p class="muted small">${workspaceTemplateHtmlV97('publishDraftVersion',{version:draft.version_no})}</p></div><span class="spacer"></span><button class="btn ghost sm" id="studioPubClose" type="button">Close</button></div>
      ${summary}
      <div style="margin-top:10px">${ruleBlocks}</div>
      ${confirmBlock}
      <div id="studioPubErr"></div>
      <div class="row" style="margin-top:16px"><button class="btn ${needConfirm?'danger':''}" id="studioPubConfirm" type="button" disabled>Publish now</button><button class="btn ghost sm" id="studioPubCancel" type="button">Cancel</button></div>
    </div></div>`);
    let deactivate;
    const close=()=>{if(deactivate)deactivate();else $('studioPubModal')?.remove();};
    deactivate=CUI.activateDialog($('studioPubModal'),{onClose:close,initialFocus:'#studioPubType'});
    $('studioPubClose').onclick=$('studioPubCancel').onclick=close;
    if($('studioPubType'))$('studioPubType').oninput=e=>{
      $('studioPubConfirm').disabled=(e.target.value||'')!=='PUBLISH';
    };
    $('studioPubConfirm').onclick=async()=>{
      if(($('studioPubType').value||'')!=='PUBLISH'){
        $('studioPubErr').innerHTML='<div class="err">Type PUBLISH to confirm.</div>';return;
      }
      const cbtn=$('studioPubConfirm');cbtn.disabled=true;cbtn.setAttribute('aria-busy','true');
      const {error}=await sb.rpc('publish_loyalty_config',{p_version:draftVersionId});
      if(!isCurrent())return;
      cbtn.removeAttribute('aria-busy');
      if(error){cbtn.disabled=false;
        const msg=error.code==='23514'?(error.message||'One or more rules are not valid — fix them before publishing.'):error.code==='42501'?'Only the owner can publish.':(error.message||'Could not publish.');
        $('studioPubErr').innerHTML=`<div class="err">${esc(msg)}</div>`;CUI.announce(msg,{assertive:true});return;}
      close();
      toast('Published — each rule now shows its live state');
      nav('#/studio');
    };
  }

  // Re-open the editor if one was in flight before this re-render (e.g. after save/delete we clear it,
  // but a live-validate re-render mid-edit should keep the editor visible).
  if(studioEd)paintEditor();
}

/* ============================ Stored value (PS-2A Increment D) ============================
   The FIRST owner-only stored-value surface. Truthfulness is the whole point (STORED_VALUE_CONTRACT
   §10 + INCREMENT_D_CONTRACT §4):
   - authority_state and reconciliation status are rendered VERBATIM from the server; the browser
     NEVER infers, computes or upgrades them.
   - stored value is NEVER presented as usable while authority != 'live' — and 'live' is unreachable
     in PS-2A, so the state is always unbuilt / shadow_testing / reconciliation_blocked / paused.
     There is NO customer spend/top-up/grant UI here; nothing moves real value.
   - reconciliation discrepancies are SHOWN, never hidden, with categories in plain words + cents.
   - every dangerous action (run reconciliation, change authority, pause, lift) is explicitly
     confirmed; the server requires a reason (>=3 chars) where noted.
   - it FAILS CLOSED: if get_sv_authority_overview OR get_sv_reconciliation errors, an error state
     renders and NO control is drawn — nothing is ever assumed live/clean/usable.
   RPCs consumed: get_sv_authority_overview, get_sv_reconciliation, preview_sv_cutover (reads);
   set_sv_authority_state, sv_pause, sv_lift_pause, run_sv_reconciliation, sv_cutover_business
   (owner-only writes). v69: 'live' IS reachable now, for one super-admin-designated business, via
   sv_cutover_business - so the copy on this screen is state-driven rather than asserting that
   nothing is ever live. preview_sv_cutover.ready is a server computation; the browser renders it. */
const SV_ASSET='stored_value';
const SV_SCOPE_WORDS={all:'everything',earn:'top-ups & grants',redeem:'spending'};
const SV_AUTHORITY_WORDS={
  unbuilt:'Not built for this business yet — nothing is live.',
  shadow_testing:'Shadow testing only — simulated. No customer can use this value.',
  reconciliation_blocked:'Blocked by a reconciliation difference — not usable until it is cleared.',
  ready_for_cutover:'Reconciled, awaiting a future authorized cutover — not usable yet.',
  live:'Live.',
  paused:'Paused — no customer can use this value right now.',
  retired:'Retired — superseded; history is preserved.'
};
/* Plain-language names for the six reconciliation discrepancy categories (contract §7). The raw
   category is also shown verbatim beside the plain words — nothing is invented or hidden. */
const SV_DISCREPANCY_WORDS={
  missing_in_studio:'in gift cards, not yet in stored value',
  missing_in_legacy:'in stored value, not in gift cards',
  amount_mismatch:'amounts differ',
  invalid_legacy_balance:'legacy balance invalid',
  duplicate_legacy_event:'duplicate legacy record',
  orphan_legacy_record:'legacy record inconsistent'
};
const svTime=v=>v?esc(String(v).slice(0,16).replace('T',' '))+' (server time)':'';
/* The chip LABEL is the server's authority_state VERBATIM. The browser never computes or infers
   it — only get_sv_authority_overview.authority_state is shown. Only 'live' is ever an affirmative
   pill, and 'live' is unreachable in PS-2A; an unknown value fails closed to a red pill and is
   still shown as-is. Deliberately a SEPARATE function from studioStateChip/legacyStateChip so the
   truthful-state rule stays grep-provable. */
function svAuthorityChip(state){
  const cls=state==='live'?'on'
    :(state==='shadow_testing'||state==='ready_for_cutover')?'new'
    :state==='reconciliation_blocked'?'no'
    :['unbuilt','paused','retired'].includes(state)?'off':'no';
  return `<span class="pill ${cls}">${esc(state==null?'unknown':String(state))}</span>`;
}
/* Reconciliation status rendered verbatim: clean/blocked from the latest snapshot, else not-run. */
function svReconStatusChip(status,hasRun){
  if(!hasRun)return `<span class="pill off">not run yet</span>`;
  const cls=status==='clean'?'ok':status==='blocked'?'no':'off';
  return `<span class="pill ${cls}">${esc(status==null?'unknown':String(status))}</span>`;
}
/* Shared confirm-with-reason modal for the stored-value owner actions. Every dangerous action is
   explicit: the owner must confirm, and — where reasonLabel is set — type a reason (>=3 chars, to
   match sv_apply_authority_state / sv_pause). onSubmit({reason}) performs exactly one RPC and
   returns its {error}; a 42501 surfaces as an owner-only message. String-literal RPC names are used
   at the call sites (not a variable) so writer-discovery audits SEE each writer surface. */
function svOpenActionModal({title,intro,reasonLabel,reasonPlaceholder='',submitLabel,danger=false,onSubmit,onDone}){
  document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="svActionModal" role="dialog" aria-modal="true" aria-labelledby="svActionTitle" tabindex="-1"><div class="modal-card" style="max-width:520px">
    <div class="row"><div><h2 id="svActionTitle">${esc(title)}</h2><p class="muted small">${esc(intro)}</p></div><span class="spacer"></span><button class="btn ghost sm" id="svActionClose" type="button">Close</button></div>
    ${reasonLabel?`<label for="svActionReason">${esc(reasonLabel)}</label><textarea id="svActionReason" rows="3" data-workspace-i18n placeholder="${esc(reasonPlaceholder)}"></textarea>`:''}
    <div id="svActionErr"></div>
    <div class="row" style="margin-top:16px"><button class="btn ${danger?'danger':''}" id="svActionSubmit" type="button">${esc(submitLabel)}</button><button class="btn ghost sm" id="svActionCancel" type="button">Cancel</button></div>
  </div></div>`);
  let deactivate;
  const close=()=>{if(deactivate)deactivate();else $('svActionModal')?.remove();};
  deactivate=CUI.activateDialog($('svActionModal'),{onClose:close,initialFocus:reasonLabel?'#svActionReason':'#svActionSubmit'});
  $('svActionClose').onclick=$('svActionCancel').onclick=close;
  $('svActionSubmit').onclick=async()=>{
    let reason=null;
    if(reasonLabel){
      reason=($('svActionReason').value||'').trim();
      if(reason.length<3){$('svActionErr').innerHTML='<div class="err">Write a short reason (at least 3 characters).</div>';return;}
    }
    const btn=$('svActionSubmit');btn.disabled=true;btn.setAttribute('aria-busy','true');
    let res;
    try{res=await onSubmit({reason});}
    catch(e){res={error:{message:e&&e.message||String(e)}};}
    btn.removeAttribute('aria-busy');
    const error=res&&res.error;
    if(error){
      btn.disabled=false;
      if(error.code==='42501'){$('svActionErr').innerHTML='<div class="err">Only the owner can do this.</div>';return;}
      $('svActionErr').innerHTML=`<div class="err">${esc(error.message||'Could not complete this. Try again.')}</div>`;return;
    }
    close();
    if(onDone)onDone();
  };
}

async function storedValuePage(){
  const routeMain=M();
  const isCurrent=()=>routeMain.isConnected&&M()===routeMain;
  routeMain.innerHTML=CUI.loadingState({title:'Stored value',iconName:'wallet'});
  /* Fail closed: every stored-value read is owner-gated (42501 otherwise). Non-owners never see the
     tab and route() blocks a typed #/storedvalue; this is the last-resort denied state. */
  if(S.myRole!=='owner'){
    routeMain.innerHTML=`${CUI.pageHeader({title:'Stored value',subtitle:'Owner-only stored-value controls.',iconName:'wallet',canWrite:false,moduleLabel:'Stored value'})}
      ${CUI.emptyState({iconName:'wallet',title:'Owner access only',body:'Stored value is the owner-only foundation for prepaid value. Ask an owner for access.'})}`;
    return;
  }
  const [ovRes,rcRes,cutRes,brRes]=await Promise.all([
    sb.rpc('get_sv_authority_overview',{p_business:S.biz.id}),
    sb.rpc('get_sv_reconciliation',{p_business:S.biz.id}),
    sb.rpc('preview_sv_cutover',{p_business:S.biz.id}),
    sb.from('branches').select('id,name').eq('business_id',S.biz.id).eq('active',true).order('name')
  ]);
  if(!isCurrent())return;
  /* FAIL CLOSED: if the authority OR reconciliation read fails, show an error and render NO
     controls at all — never assume the state is live/clean/usable from a missing read. The cutover
     preview is allowed to fail softly below because it can only ever render a DISABLED affordance. */
  if(ovRes.error||rcRes.error){
    const msg=(ovRes.error&&ovRes.error.message)||(rcRes.error&&rcRes.error.message)||'Stored value could not load.';
    const denied=(ovRes.error&&ovRes.error.code==='42501')||(rcRes.error&&rcRes.error.code==='42501');
    routeMain.innerHTML=`${CUI.pageHeader({title:'Stored value',subtitle:'The stored-value state could not be confirmed.',iconName:'wallet',canWrite:false,moduleLabel:'Stored value'})}
      <div class="card"><div class="err" role="alert"><b>Stored value is unavailable.</b> ${esc(denied?'Only the owner can view stored value.':msg)} No controls are shown until the live server state can be read — nothing is assumed live, clean or usable.</div>
      <div style="margin-top:12px"><button class="btn" id="svRetry" type="button">Try again</button></div></div>`;
    if($('svRetry'))$('svRetry').onclick=()=>storedValuePage();
    return;
  }
  const ov=ovRes.data||{};
  const rc=rcRes.data||{};
  const state=ov.authority_state||'unbuilt';               // rendered VERBATIM; never inferred
  const shadowTesting=ov.shadow_testing===true;
  const pauses=Array.isArray(ov.active_pauses)?ov.active_pauses:[];
  const activeScopes=new Set(pauses.map(p=>p.scope));
  const rerender=()=>storedValuePage();

  // ----- Authority: chip verbatim + owner change control (unbuilt <-> shadow_testing only) -----
  const authChangeable=['unbuilt','shadow_testing','reconciliation_blocked'].includes(state);
  const authTargets=state==='reconciliation_blocked'
    ? [['shadow_testing','Shadow testing (simulated)']]
    : [['unbuilt','Unbuilt (nothing built)'],['shadow_testing','Shadow testing (simulated)']];
  const authDefault=state==='shadow_testing'?'unbuilt':'shadow_testing';
  const authControlHtml=authChangeable
    ? `<div class="row" style="margin-top:12px;gap:8px;flex-wrap:wrap;align-items:center">
         <label for="svAuthTarget" class="muted small">Change state to</label>
         <select id="svAuthTarget" style="max-width:280px">${authTargets.map(([v,l])=>`<option value="${v}"${v===authDefault?' selected':''}>${esc(l)}</option>`).join('')}</select>
         <button class="btn sm" id="svAuthChange" type="button">Change authority</button>
       </div>
       <p class="muted small" style="margin-top:6px">Only unbuilt and shadow testing can be chosen here. Live and ready-for-cutover do not exist in this phase — the server refuses them.</p>`
    : `<p class="muted small" style="margin-top:12px">This state cannot be changed from here.</p>`;
  const authorityCard=`<section class="card"><div class="cui-card-head"><h2>Authority</h2><p>The source of truth for stored value, shown exactly as the server reports it.</p></div>
    <div class="row" style="gap:8px;align-items:center;flex-wrap:wrap"><b>Current state:</b> ${svAuthorityChip(state)}${shadowTesting?'<span class="pill new">shadow testing</span>':''}</div>
    <p class="muted small" style="margin-top:6px">${esc(SV_AUTHORITY_WORDS[state]||'Unknown state — treated as not usable.')}</p>
    ${authControlHtml}</section>`;

  // ----- Reconciliation: latest snapshot status + every discrepancy (never hidden) -----
  const snap=rc.latest_snapshot||null;
  const hasRun=rc.has_run===true;
  const discreps=Array.isArray(rc.discrepancies)?rc.discrepancies:[];
  const discrepHtml=discreps.length
    ? `<div class="sv-discrep-list">${discreps.map(d=>{
        const word=SV_DISCREPANCY_WORDS[d.category]||String(d.category||'difference');
        return `<div class="sv-discrep"><div class="row" style="gap:8px;align-items:center;flex-wrap:wrap"><span class="pill no">${esc(String(d.category||'difference'))}</span><b>${esc(word)}</b></div>
          <div class="muted small" style="margin-top:4px;line-height:1.5">
            ${d.legacy_ref?`Record: <code>${esc(String(d.legacy_ref))}</code><br>`:''}
            Gift cards: <b>${money(Number(d.legacy_cents||0))}</b> · Stored value: <b>${money(Number(d.studio_cents||0))}</b> · Difference: <b>${money(Number(d.delta_cents||0))}</b>
            ${d.detail?`<br>${esc(String(d.detail))}`:''}
          </div></div>`;
      }).join('')}</div>`
    : (hasRun?`<p class="muted small" style="margin-top:10px">No differences found in the latest run.</p>`:'');
  const snapHtml=snap
    ? `<div class="muted small" style="margin-top:8px;line-height:1.6">
         <div>Last run: ${svTime(snap.captured_at)}</div>
         <div>Gift-card total: <b>${money(Number(snap.legacy_total_cents||0))}</b> · Stored-value total: <b>${money(Number(snap.studio_total_cents||0))}</b></div>
         <div>Differences found: <b>${Number(snap.discrepancy_count||0)}</b></div>
       </div>`
    : `<p class="muted small" style="margin-top:8px">Reconciliation has not been run for this business yet.</p>`;
  const reconCard=`<section class="card" style="margin-top:16px"><div class="cui-card-head"><h2>Reconciliation</h2><p>Stored value is checked against your gift-card records (read-only). Differences are shown here, never hidden, and are never auto-corrected.</p></div>
    <div class="row" style="gap:8px;align-items:center;flex-wrap:wrap"><b>Latest status:</b> ${svReconStatusChip(snap&&snap.status,hasRun)}</div>
    ${snapHtml}
    ${discrepHtml}
    <div class="row" style="margin-top:14px"><button class="btn sm" id="svReconRun" type="button">Run reconciliation</button></div></section>`;

  // ----- Pause & safety: active pauses (scope/reason/actor/time) + pause / lift controls -----
  const pauseListHtml=pauses.length
    ? `<div class="sv-pause-list">${pauses.map(p=>`<div class="sv-pause studio-emg-banner" role="note">
        <b>Paused: ${esc(SV_SCOPE_WORDS[p.scope]||String(p.scope||''))}</b>
        <div class="muted small" style="margin-top:4px;line-height:1.5">
          ${p.reason?`Reason: ${esc(String(p.reason))}<br>`:''}
          ${p.actor?`By: ${esc(String(p.actor))}<br>`:''}
          ${p.paused_at?`Since: ${svTime(p.paused_at)}`:''}
        </div>
        <div class="studio-rule-controls"><button class="btn ghost sm" type="button" data-sv-lift="${esc(String(p.scope))}">Lift this pause</button></div>
      </div>`).join('')}</div>`
    : `<p class="muted small" style="margin-top:10px">No active pauses.</p>`;
  const pauseScopeOpts=[['all','Everything'],['earn','Top-ups & grants'],['redeem','Spending']]
    .map(([v,l])=>`<option value="${v}">${esc(l)}${activeScopes.has(v)?' — already paused':''}</option>`).join('');
  const pauseCard=`<section class="card" style="margin-top:16px"><div class="cui-card-head"><h2>Pause &amp; safety</h2><p>Emergency stop for stored value. History is always kept — a pause only stops new operations. Lifting a pause is a separate, confirmed action.</p></div>
    ${pauseListHtml}
    <div class="row" style="margin-top:14px;gap:8px;flex-wrap:wrap;align-items:center">
      <label for="svPauseScope" class="muted small">Pause</label>
      <select id="svPauseScope" style="max-width:260px">${pauseScopeOpts}</select>
      <button class="btn sm danger" id="svPauseBtn" type="button">Pause stored value</button>
    </div>
    <p class="muted small" style="margin-top:6px">A pause on top-ups &amp; grants does not stop spending; only a pause on everything or on spending stops a customer using value they already hold.</p></section>`;

  /* ----- Cutover (v69). The `ready` flag and every blocking reason are rendered VERBATIM from
     preview_sv_cutover; the browser never decides readiness and never re-derives a reason. The
     button is enabled ONLY when the server says ready, and even then it opens a modal that requires
     the owner to type this business's slug exactly plus a reason of at least 10 characters, because
     going live is a one-way, one-time act: it cannot be undone by any RPC (pause is the emergency
     control). If the preview fails to load, nothing is offered. ----- */
  const cut=cutRes.error?null:(cutRes.data||{});
  const blocking=cut&&Array.isArray(cut.blocking_reasons)?cut.blocking_reasons:[];
  const cutReady=cut&&cut.ready===true;              // server value, never inferred here
  const cutLive=(cut&&cut.authority_state==='live')||state==='live';
  const cutBodyHtml=cutRes.error
    ? `<p class="err" role="alert" style="margin-top:8px">The cutover preview could not be loaded (${esc(cutRes.error.message||'unavailable')}). Cutover stays unavailable.</p>`
    : cutLive
      ? `<p class="muted small" style="margin-top:8px">This business is already live. Cutover happens once and cannot be undone here — if something is wrong, use <b>Pause &amp; safety</b> above to stop stored value immediately.</p>`
      : `<p class="muted small" style="margin-top:8px">Cutover makes stored value real for this business: customers can top up and spend actual money. It happens once, it cannot be undone from this screen, and it needs a super admin to designate this business first.</p>
       ${blocking.length?`<div class="muted small" style="margin-top:8px;line-height:1.6"><b>Still blocking:</b><ul style="margin:6px 0 0 18px">${blocking.map(r=>`<li>${esc(String(r))}</li>`).join('')}</ul></div>`:''}`;
  const cutBtnHtml=(cutRes.error||cutLive)
    ? ''
    : `<div class="row" style="margin-top:14px"><button class="btn sm danger" id="svCutoverBtn" type="button"${cutReady?'':' disabled aria-disabled="true" title="The server has not confirmed this business is ready"'}>Go live with stored value</button></div>`;
  const cutCard=`<section class="card" style="margin-top:16px"><div class="cui-card-head"><h2>Cutover</h2><p>${cutLive?'Stored value is live for this business.':'One-time, one-way. Everything below comes straight from the server.'}</p></div>
    <div class="row" style="gap:8px;align-items:center;flex-wrap:wrap"><b>Ready:</b> ${cutReady?'<span class="pill on">yes</span>':'<span class="pill no">no</span>'}</div>
    ${cutBodyHtml}
    ${cutBtnHtml}</section>`;

  // ----- Top-ups: staff-assisted top-up sale (v66). Server-authoritative; the UI computes NO value. -----
  /* Truthfulness rules (contract §13): top-ups are hidden/disabled unless the server would permit them.
     unbuilt → nothing sellable; shadow_testing/ready_for_cutover → only a labelled SYNTHETIC TEST top-up
     (test method, value NOT spendable); live → real top-ups. Every price/bonus/expiry/limit shown comes
     from get_sellable_sv_topup_plans / preview_sv_topup_sale / record_sv_topup_sale — never recomputed here. */
  const svBranches=(brRes&&!brRes.error&&Array.isArray(brRes.data))?brRes.data:[];
  const topupTestOnly=(state==='shadow_testing'||state==='ready_for_cutover');
  const topupSellable=(state==='live'||topupTestOnly);
  const topupNote=state==='unbuilt'
    ? 'Top-ups are not on sale. Stored value is unbuilt for this business — nothing can be sold or issued.'
    : topupTestOnly
      ? 'Testing only. In this state a top-up is accepted for a structurally-synthetic test customer using the test method, and the value issued is NOT spendable. No real money is collected and no spendable value is created.'
      : state==='live'
        ? 'Live. A top-up collects payment and issues spendable stored value to the customer.'
        : 'Stored value is '+state+' for this business. Top-ups are not available.';
  const topupCard=`<section class="card" id="svTopupCard" style="margin-top:16px"><div class="cui-card-head"><h2>Top-ups</h2><p>Sell a prepaid stored-value plan to a customer. Every figure — price, bonus, expiry, limits — comes straight from the server; this screen never calculates value.</p></div>
    <div class="row" style="gap:8px;align-items:center;flex-wrap:wrap"><b>Selling state:</b> ${svAuthorityChip(state)}${topupTestOnly?'<span class="pill new">test only</span>':''}</div>
    <p class="muted small" style="margin-top:6px">${esc(topupNote)}</p>
    ${topupSellable&&!svBranches.length?'<p class="muted small">No active branch is configured, so a top-up cannot be recorded.</p>':''}
    <div class="row" style="margin-top:12px"><button class="btn sm" id="svTopupStart" type="button"${(!topupSellable||!svBranches.length)?' disabled aria-disabled="true"':''}>${topupTestOnly?'Record a synthetic test top-up':'Record a top-up'}</button></div>
    <div id="svTopupFlow" style="margin-top:14px"></div></section>`;

  /* The banner is state-driven, never a fixed claim: since v69 a business CAN be live, and telling a
     live firm that "nothing here moves real money" would be false. Both variants are rendered from
     the server's authority_state, which the browser never infers. */
  const svLive=state==='live';
  routeMain.innerHTML=`${CUI.pageHeader({title:'Stored value',subtitle:svLive?'Owner-only stored-value authority, reconciliation and safety controls. Stored value is LIVE for this business.':'Owner-only stored-value authority, reconciliation and safety controls. Not live for this business.',iconName:'wallet',canWrite:true,moduleLabel:'Stored value'})}
    <aside class="permission-banner" role="note" style="border-color:var(--line)">${CUI.icon('info',{size:19})}<div>
      ${svLive
        ? `<b>Live — this is real customer money</b><p>Customers can top up and spend stored value at this business. Every figure below comes straight from the server. If anything looks wrong, use <b>Pause &amp; safety</b> to stop new operations immediately — history is always kept.</p>`
        : `<b>Not live — nothing moves real money yet</b><p>Stored value is not switched on for any customer here: nothing on this screen moves real money or can be used to pay. Every state below comes straight from the server.</p>`}</div></aside>
    ${authorityCard}
    ${topupCard}
    ${reconCard}
    ${pauseCard}
    ${cutCard}`;

  // ----- wire the owner controls (only reached when the reads succeeded → fail-closed holds) -----
  const authBtn=$('svAuthChange'),authSel=$('svAuthTarget');
  if(authBtn&&authSel){
    const syncAuthBtn=()=>{authBtn.disabled=authSel.value===state;};
    authSel.onchange=syncAuthBtn;syncAuthBtn();
    authBtn.onclick=()=>{
      const target=authSel.value;
      if(!target||target===state)return;
      svOpenActionModal({
        title:'Change stored-value authority',
        intro:`Move stored-value authority from "${state}" to "${target}". This is simulated only — it can never make value usable in this phase. Record why.`,
        reasonLabel:'Reason (required, at least 3 characters)',
        reasonPlaceholder:'Why change the authority state?',
        submitLabel:`Change to ${target}`,
        onSubmit:({reason})=>sb.rpc('set_sv_authority_state',{p_business:S.biz.id,p_asset:SV_ASSET,p_state:target,p_reason:reason}),
        onDone:()=>{toast('Stored-value authority updated');rerender();}
      });
    };
  }
  if($('svReconRun'))$('svReconRun').onclick=()=>{
    svOpenActionModal({
      title:'Run reconciliation',
      intro:'Compare stored value against your gift-card records (read-only — no gift card is changed and no value moves). Any difference is recorded and, if found, drives the authority to reconciliation_blocked. Nothing is auto-corrected.',
      submitLabel:'Run reconciliation now',
      onSubmit:()=>sb.rpc('run_sv_reconciliation',{p_business:S.biz.id}),
      onDone:()=>{toast('Reconciliation complete');rerender();}
    });
  };
  if($('svPauseBtn'))$('svPauseBtn').onclick=()=>{
    const scope=$('svPauseScope')?$('svPauseScope').value:'all';
    svOpenActionModal({
      title:'Pause stored value',
      intro:`Immediately stop ${SV_SCOPE_WORDS[scope]||scope} for stored value. History is kept; only new operations of this kind are stopped. Record why.`,
      reasonLabel:'Reason (required, at least 3 characters)',
      reasonPlaceholder:'What is wrong and who asked for this stop?',
      submitLabel:'Pause now',
      danger:true,
      onSubmit:({reason})=>sb.rpc('sv_pause',{p_business:S.biz.id,p_asset:SV_ASSET,p_scope:scope,p_reason:reason}),
      onDone:()=>{toast('Stored value paused');rerender();}
    });
  };
  document.querySelectorAll('[data-sv-lift]').forEach(b=>b.onclick=()=>{
    const scope=b.dataset.svLift;
    svOpenActionModal({
      title:'Lift stored-value pause',
      intro:`Lift the pause on ${SV_SCOPE_WORDS[scope]||scope}. That operation family can run again once lifted (still only when authority is live, which is not possible in this phase). Record why it is safe to lift.`,
      reasonLabel:'Reason (required, at least 3 characters)',
      reasonPlaceholder:'Why is it safe to lift this pause?',
      submitLabel:'Lift pause',
      onSubmit:({reason})=>sb.rpc('sv_lift_pause',{p_business:S.biz.id,p_asset:SV_ASSET,p_scope:scope,p_reason:reason}),
      onDone:()=>{toast('Stored-value pause lifted');rerender();}
    });
  });
  /* Cutover (v69). Deliberately NOT the shared svOpenActionModal: this is the only irreversible
     action on the screen, so it demands a typed match of the business slug in addition to a reason,
     and it replays the exact evidence hash the preview returned (a stale hash is refused server-side
     with sv_evidence_stale rather than acting on evidence that has moved). A FRESH idempotency key is
     generated per attempt: this does NOT replay a cached envelope, so a genuinely lost response is
     not idempotently re-served. It is still safe against a double transition - a retry re-takes the
     cutover locks and, because the first attempt already made the business live, is refused with
     sv_already_live, so no second transition can occur. (An exact idempotent replay would require
     reusing the same key, which this control does not do.) */
  const svCutoverBtn=$('svCutoverBtn');
  if(svCutoverBtn&&!svCutoverBtn.disabled)svCutoverBtn.onclick=()=>{
    const slug=String(S.biz&&S.biz.slug||'');
    const evidence=String((cut&&cut.evidence_hash)||'');
    document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="svCutModal" role="dialog" aria-modal="true" aria-labelledby="svCutTitle" tabindex="-1"><div class="modal-card" style="max-width:560px">
      <div class="row"><div><h2 id="svCutTitle">Go live with stored value</h2><p class="muted small">This makes stored value real money for <b data-merchant-content>${esc(S.biz&&S.biz.name||slug)}</b>. It happens once and cannot be undone from this app. If something goes wrong afterwards, use Pause &amp; safety.</p></div><span class="spacer"></span><button class="btn ghost sm" id="svCutClose" type="button">Close</button></div>
      <label for="svCutSlug">Type <b>${esc(slug)}</b> to confirm</label>
      <input id="svCutSlug" type="text" autocomplete="off" spellcheck="false" data-merchant-content placeholder="${esc(slug)}">
      <label for="svCutReason">Reason (required, at least 10 characters)</label>
      <textarea id="svCutReason" rows="3" placeholder="Who authorised this go-live, and on what evidence?"></textarea>
      <div id="svCutErr"></div>
      <div class="row" style="margin-top:16px"><button class="btn danger" id="svCutSubmit" type="button">Go live now</button><button class="btn ghost sm" id="svCutCancel" type="button">Cancel</button></div>
    </div></div>`);
    let deactivate;
    const close=()=>{if(deactivate)deactivate();else $('svCutModal')?.remove();};
    deactivate=CUI.activateDialog($('svCutModal'),{onClose:close,initialFocus:'#svCutSlug'});
    $('svCutClose').onclick=$('svCutCancel').onclick=close;
    $('svCutSubmit').onclick=async()=>{
      const typed=($('svCutSlug').value||'').trim();
      const reason=($('svCutReason').value||'').trim();
      if(typed!==slug){$('svCutErr').innerHTML='<div class="err">Type the business name exactly as shown to confirm.</div>';return;}
      if(reason.length<10){$('svCutErr').innerHTML='<div class="err">Write a reason of at least 10 characters. This is a financial go-live.</div>';return;}
      if(!evidence){$('svCutErr').innerHTML='<div class="err">The readiness evidence is missing. Reload this page and try again.</div>';return;}
      const btn=$('svCutSubmit');btn.disabled=true;btn.setAttribute('aria-busy','true');
      let res;
      try{res=await sb.rpc('sv_cutover_business',{p_business:S.biz.id,p_reason:reason,p_evidence_hash:evidence,p_idempotency_key:crypto.randomUUID()});}
      catch(e){res={error:{message:e&&e.message||String(e)}};}
      btn.removeAttribute('aria-busy');
      if(res&&res.error){
        btn.disabled=false;
        $('svCutErr').innerHTML=res.error.code==='42501'
          ? '<div class="err">Only the owner of this business can do this.</div>'
          : `<div class="err">${esc(res.error.message||'Could not go live. Nothing was changed.')}</div>`;
        return;
      }
      close();toast('Stored value is live');rerender();
    };
  };
  const svTopupStartBtn=$('svTopupStart');
  if(svTopupStartBtn&&!svTopupStartBtn.disabled)svTopupStartBtn.onclick=()=>svRunTopupFlow({branches:svBranches,state,testOnly:topupTestOnly});
}

/* ============================ Stored value — staff-assisted top-up sale (v66) ============================
   A fully SERVER-AUTHORITATIVE inline wizard rendered into #svTopupFlow. The client NEVER computes a
   price, bonus, expiry, discount or balance: it identifies the customer (lookup_client_by_phone), lists
   sellable plans (get_sellable_sv_topup_plans), shows a server preview (preview_sv_topup_sale), and, only
   on explicit confirmation, records the sale (record_sv_topup_sale) with a single idempotency key. It
   surfaces every server blocker/refusal verbatim and never says value is "available to spend" unless the
   server's own `spendable` flag is true (only ever in `live`). In shadow_testing/ready_for_cutover the
   only offered method is `test` and the copy states plainly that nothing real is collected or spendable. */
async function svRunTopupFlow({branches,state,testOnly}){
  const host=$('svTopupFlow'); if(!host)return;
  const methodOpts=testOnly
    ? [['test','Test (no real money)']]
    : [['cash','Cash'],['card_terminal','Card terminal'],['paynow','PayNow'],['manual','Manual']];
  const st={step:'customer',branchId:(branches[0]&&branches[0].id)||null,phone:'',cust:null,plans:[],
    versionId:null,method:methodOpts[0][0],reference:'',staffConfirmed:false,preview:null,idemKey:null,
    result:null,busy:false,err:null};
  const alive=()=>host.isConnected&&$('svTopupFlow')===host;
  const selPlan=()=>st.plans.find(p=>p&&p.version_id===st.versionId)||null;
  const needsReference=()=>['card_terminal','paynow','manual'].includes(st.method);
  const paymentObj=p=>{ // p = the plan projection whose amount/currency we must match exactly
    const o={method:st.method,amount_cents:p?Number(p.price_cents):0,currency:(p&&p.currency)||S.biz.currency||'SGD'};
    const ref=st.reference.trim(); if(ref)o.reference=ref;
    o.staff_confirmed=needsReference()?!!st.staffConfirmed:true;
    return o;
  };

  async function loadPlans(){
    st.busy=true;st.err=null;render();
    const {data,error}=await sb.rpc('get_sellable_sv_topup_plans',{p_business:S.biz.id,p_branch:st.branchId,p_client:st.cust.client_id});
    if(!alive())return; st.busy=false;
    if(error){st.err=error.message||'Plans could not be loaded.';render();return;}
    st.plans=(data&&Array.isArray(data.plans))?data.plans:[];
    const firstOk=st.plans.find(p=>p&&p.ok); st.versionId=firstOk?firstOk.version_id:(st.plans[0]&&st.plans[0].version_id)||null;
    st.step='plan';render();
  }
  async function findCustomer(){
    const phone=(($('svtPhone')||{}).value||'').trim();
    if(!phone){st.err='Enter the customer mobile number.';render();return;}
    st.phone=phone;st.busy=true;st.err=null;render();
    const {data,error}=await sb.rpc('lookup_client_by_phone',{p_business:S.biz.id,p_phone:phone});
    if(!alive())return; st.busy=false;
    if(error){st.err=error.message||'Lookup failed.';render();return;}
    if(data.status==='found'){st.cust={client_id:data.client_id,full_name:data.full_name,phone:data.phone||phone};loadPlans();return;}
    if(data.status==='not_found'){st.cust=null;st.err='No customer with that number. A top-up needs an existing customer; add them first from Customers or Record sale.';render();return;}
    st.err=(data&&data.message)||'Enter a valid Singapore number.';render();
  }
  async function doPreview(){
    const p=selPlan(); if(!p){st.err='Choose a plan first.';render();return;}
    if(needsReference()&&!st.reference.trim()){st.err='A payment reference is required for this method.';render();return;}
    if(needsReference()&&!st.staffConfirmed){st.err='Tick the confirmation box before previewing this method.';render();return;}
    st.busy=true;st.err=null;render();
    const {data,error}=await sb.rpc('preview_sv_topup_sale',{p_business:S.biz.id,p_branch:st.branchId,p_client:st.cust.client_id,p_plan_version:st.versionId,p_payment:paymentObj(p)});
    if(!alive())return; st.busy=false;
    if(error){st.err=error.message||'Preview failed.';render();return;}
    st.preview=data;st.idemKey=crypto.randomUUID();st.step='confirm';render();
  }
  async function doRecord(){
    const p=selPlan(); if(!p||!st.idemKey)return;
    st.busy=true;st.err=null;render();
    const {data,error}=await sb.rpc('record_sv_topup_sale',{p_business:S.biz.id,p_branch:st.branchId,p_client:st.cust.client_id,p_plan_version:st.versionId,p_payment:paymentObj(p),p_idempotency_key:st.idemKey});
    if(!alive())return; st.busy=false;
    if(error){st.err=error.message||'The top-up could not be recorded.';render();return;}
    if(data&&data.status&&data.status!=='ok'){st.err='The top-up was not completed: '+String(data.reason||data.status)+'.';render();return;}
    st.result=data;st.step='done';render();
  }

  function blockersHtml(list){
    const b=Array.isArray(list)?list:[];
    return b.length?`<div class="muted small" style="margin-top:6px;line-height:1.6"><b>Not sellable right now:</b><ul style="margin:6px 0 0 18px">${b.map(x=>`<li>${esc(String(x))}</li>`).join('')}</ul></div>`:'';
  }
  function expiryWords(days){return days==null?'no expiry':days+' day'+(Number(days)===1?'':'s');}

  function render(){
    if(!alive())return;
    const busyAttr=st.busy?' disabled aria-busy="true"':'';
    const errHtml=st.err?`<div class="err" role="alert" style="margin-top:10px">${esc(st.err)}</div>`:'';
    const branchPicker=branches.length>1?`<div><label for="svtBranch" class="muted small">Branch</label><br><select id="svtBranch" style="max-width:280px">${branches.map(b=>`<option value="${esc(b.id)}"${b.id===st.branchId?' selected':''}>${esc(b.name||'Branch')}</option>`).join('')}</select></div>`:'';
    let body='';
    if(st.step==='customer'){
      body=`<div class="cui-card-head"><h3>Who is this top-up for?</h3></div>
        <div class="row" style="gap:8px;flex-wrap:wrap;align-items:end">
          ${branchPicker}
          <div><label for="svtPhone" class="muted small">Customer mobile</label><br><input id="svtPhone" type="tel" inputmode="tel" autocomplete="off" value="${esc(st.phone)}" placeholder="e.g. 8123 4567" style="max-width:220px"></div>
          <button class="btn sm" id="svtFind" type="button"${busyAttr}>${st.busy?'Finding…':'Find customer'}</button>
        </div>${errHtml}`;
    } else if(st.step==='plan'){
      const p=selPlan();
      const planRadios=st.plans.length?st.plans.map(pl=>{
        const dis=!pl.ok?' disabled':'';
        return `<label class="row" style="gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:8px${pl.ok?'':';opacity:.7'}">
          <input type="radio" name="svtPlan" value="${esc(pl.version_id)}"${pl.version_id===st.versionId?' checked':''}${dis} style="margin-top:4px">
          <div style="flex:1;min-width:0"><div style="font-weight:700">${esc(pl.plan_name||'Plan')}</div>
            <div class="muted small" style="margin-top:2px">Pay <b>${money(Number(pl.price_cents||0))}</b>${Number(pl.bonus_cents||0)>0?` · bonus <b>${money(Number(pl.bonus_cents))}</b>`:''} · total value <b>${money(Number(pl.total_usable_cents||0))}</b></div>
            <div class="muted small">Paid value expiry: ${esc(expiryWords(pl.paid_expiry_days))}${Number(pl.bonus_cents||0)>0?` · bonus expiry: ${esc(expiryWords(pl.bonus_expiry_days))}`:''}</div>
            ${blockersHtml(pl.blockers)}</div></label>`;
      }).join(''):`<p class="muted small" style="margin-top:8px">No sellable plans for this customer at this branch. ${state==='unbuilt'?'Stored value is unbuilt.':'Publish a top-up plan first, or check the plan restrictions.'}</p>`;
      const methodSel=`<div><label for="svtMethod" class="muted small">Payment method</label><br><select id="svtMethod" style="max-width:220px"${testOnly?' disabled':''}>${methodOpts.map(([v,l])=>`<option value="${v}"${v===st.method?' selected':''}>${esc(l)}</option>`).join('')}</select></div>`;
      const refField=needsReference()?`<div><label for="svtRef" class="muted small">Payment reference (required)</label><br><input id="svtRef" type="text" value="${esc(st.reference)}" placeholder="e.g. terminal approval code" style="max-width:260px"></div>`:'';
      const confirmBox=needsReference()?`<label class="row small" style="gap:8px;align-items:flex-start;margin-top:8px"><input type="checkbox" id="svtConfirm"${st.staffConfirmed?' checked':''} style="margin-top:3px"><span>I confirm the customer has paid${p?` ${money(Number(p.price_cents||0))}`:''}. <b>${esc(BRAND.productName)} has not verified this payment</b> — you are attesting it was received.</span></label>`:'';
      body=`<div class="cui-card-head"><h3>${esc(st.cust.full_name||'Customer')} · ${esc(st.cust.phone||'')}</h3><p>Choose the plan and payment. Amounts are set by the plan and cannot be edited here.</p></div>
        ${planRadios}
        <div class="row" style="gap:10px;flex-wrap:wrap;align-items:end;margin-top:14px">${methodSel}${refField}</div>
        ${confirmBox}${errHtml}
        <div class="row" style="gap:8px;margin-top:14px"><button class="btn ghost sm" id="svtBack" type="button">Back</button><button class="btn sm" id="svtPreview" type="button"${(!p||!p.ok)?' disabled aria-disabled="true"':''}${busyAttr}>${st.busy?'Checking…':'Preview'}</button></div>`;
    } else if(st.step==='confirm'){
      const pv=st.preview||{};
      const cash=Number(pv.price_cents||0), bonus=Number(pv.bonus_cents||0), total=Number(pv.total_usable_cents||0);
      const cur=(pv.currency||S.biz.currency||'SGD');
      const blocked=Array.isArray(pv.blockers)&&pv.blockers.length>0;
      const spendable=pv.spendable===true;
      body=`<div class="cui-card-head"><h3>Confirm this top-up</h3></div>
        <aside class="permission-banner" role="note" style="border-color:var(--line)">${CUI.icon('info',{size:19})}<div>
          <b>You are collecting ${esc(cur)} ${(cash/100).toFixed(2)} and issuing ${esc(cur)} ${(cash/100).toFixed(2)} paid value${bonus>0?` plus ${esc(cur)} ${(bonus/100).toFixed(2)} promotional bonus`:''}.</b>
          <p>${spendable?'This value will be spendable by the customer.':'This is a test in this phase — the value is <b>not</b> spendable and no real money is collected.'}</p></div></aside>
        <dl class="cui-readonly-list" style="margin-top:12px">
          <div class="cui-readonly-row"><dt>Customer</dt><dd>${esc(st.cust.full_name||'')} · ${esc(st.cust.phone||'')}</dd></div>
          <div class="cui-readonly-row"><dt>Plan</dt><dd>${esc(pv.plan_name||'')}</dd></div>
          <div class="cui-readonly-row"><dt>Collect</dt><dd><b>${money(cash)}</b> · ${esc((methodOpts.find(m=>m[0]===st.method)||['',st.method])[1])}</dd></div>
          <div class="cui-readonly-row"><dt>Paid value issued</dt><dd>${money(cash)}</dd></div>
          ${bonus>0?`<div class="cui-readonly-row"><dt>Bonus value issued</dt><dd>${money(bonus)}</dd></div>`:''}
          <div class="cui-readonly-row"><dt>Total value</dt><dd><b>${money(total)}</b></dd></div>
          <div class="cui-readonly-row"><dt>Paid value expiry</dt><dd>${esc(expiryWords(pv.paid_expiry_days))}</dd></div>
          ${bonus>0?`<div class="cui-readonly-row"><dt>Bonus value expiry</dt><dd>${esc(expiryWords(pv.bonus_expiry_days))}</dd></div>`:''}
          ${st.reference.trim()?`<div class="cui-readonly-row"><dt>Reference</dt><dd>${esc(st.reference.trim())}</dd></div>`:''}
          <div class="cui-readonly-row"><dt>Projected balance after</dt><dd>${money(Number(pv.projected_account_total_cents||0))}${spendable?'':' (not spendable)'}</dd></div>
        </dl>
        ${blockersHtml(pv.blockers)}${errHtml}
        <div class="row" style="gap:8px;margin-top:14px"><button class="btn ghost sm" id="svtBack" type="button">Back</button><button class="btn sm" id="svtRecord" type="button"${blocked?' disabled aria-disabled="true"':''}${busyAttr}>${st.busy?'Recording…':'Confirm & record'}</button></div>`;
    } else if(st.step==='done'){
      const r=st.result||{};
      const spendable=r.spendable===true;
      body=`<div class="cui-card-head"><h3>Top-up recorded</h3></div>
        <div class="ok" role="status" style="margin-top:6px"><b>Done.</b> ${spendable?'The value is now available to the customer.':'This was a test — the value is recorded but is <b>not</b> available to spend.'}</div>
        <dl class="cui-readonly-list" style="margin-top:12px">
          <div class="cui-readonly-row"><dt>Cash collected</dt><dd>${money(Number(r.cash_collected_cents||0))}</dd></div>
          <div class="cui-readonly-row"><dt>Paid value issued</dt><dd>${money(Number(r.paid_value_issued_cents||0))}</dd></div>
          ${Number(r.bonus_value_issued_cents||0)>0?`<div class="cui-readonly-row"><dt>Bonus value issued</dt><dd>${money(Number(r.bonus_value_issued_cents))}</dd></div>`:''}
          <div class="cui-readonly-row"><dt>Total account value</dt><dd><b>${money(Number(r.account_total_after_cents||0))}</b>${spendable?'':' (not spendable)'}</dd></div>
          <div class="cui-readonly-row"><dt>Spendable</dt><dd>${spendable?'Yes':'No — '+esc(String(r.authority_state||state))}</dd></div>
          ${r.operation_id?`<div class="cui-readonly-row"><dt>Reference</dt><dd><code>${esc(String(r.operation_id))}</code></dd></div>`:''}
        </dl>
        <div class="row" style="gap:8px;margin-top:14px"><button class="btn sm" id="svtAgain" type="button">Record another</button></div>`;
    }
    host.innerHTML=`<div class="card" style="border-color:var(--line)">${body}</div>`;
    if($('svtBranch'))$('svtBranch').onchange=e=>{st.branchId=e.target.value;};
    if($('svtFind'))$('svtFind').onclick=findCustomer;
    if($('svtPhone'))$('svtPhone').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();findCustomer();}};
    host.querySelectorAll('input[name="svtPlan"]').forEach(r=>r.onchange=()=>{st.versionId=r.value;st.err=null;render();});
    if($('svtMethod'))$('svtMethod').onchange=e=>{st.method=e.target.value;st.err=null;render();};
    if($('svtRef'))$('svtRef').oninput=e=>{st.reference=e.target.value;};
    if($('svtConfirm'))$('svtConfirm').onchange=e=>{st.staffConfirmed=e.target.checked;};
    if($('svtPreview'))$('svtPreview').onclick=doPreview;
    if($('svtRecord'))$('svtRecord').onclick=doRecord;
    if($('svtBack'))$('svtBack').onclick=()=>{st.err=null;st.step=(st.step==='confirm')?'plan':'customer';if(st.step==='customer'){st.plans=[];}render();};
    if($('svtAgain'))$('svtAgain').onclick=()=>{st.step='customer';st.cust=null;st.phone='';st.plans=[];st.versionId=null;st.preview=null;st.idemKey=null;st.result=null;st.reference='';st.staffConfirmed=false;st.err=null;render();};
  }
  render();
}
  function renderHistPage(history,n){
  const rows=history.slice(0,n);
  if(!rows.length) return '<div class="empty small" style="margin-top:6px">No activity yet. When this customer buys, books, or earns a reward, it appears here.</div>';
  const when=t=>`<div class="c360-tl-when">${esc(sgt(t)||'')}</div>`;
  const item=(tone,iconName,titleHtml,detailHtml,sideHtml)=>`<li class="c360-tl-item">
    <span class="c360-tl-ic ${tone}" aria-hidden="true">${CUI.icon(iconName,{size:17})}</span>
    <div class="c360-tl-main"><div class="t">${titleHtml}</div>${detailHtml?`<div class="d">${detailHtml}</div>`:''}</div>
    <div class="c360-tl-side">${sideHtml||''}</div></li>`;
  return `<ul class="c360-timeline">${rows.map(h=>{
    if(h.kind==='sale'){
      const isRev=!!h.is_reversal;
      const relation=isRev?`<span class="pill no"><span data-workspace-i18n>reversal of</span> <span data-merchant-content>${esc(h.original_sale_id||'')}</span></span>`
        :h.reversal_sale_id?`<span class="pill off"><span data-workspace-i18n>reversed →</span> <span data-merchant-content>${esc(h.reversal_sale_id)}</span></span>`:'';
      const action=h.can_reverse?`<button class="btn danger sm" data-reverse-kind="sale" data-reverse-id="${h.id}">Reverse</button>`
        :h.refusal_reason?`<span class="muted small">${esc(h.refusal_reason)}</span>`:'';
      const detail=`${esc((h.saleKind||'sale').replace('_',' '))}${h.staff?' · '+esc(h.staff):''}${h.note?' — '+esc(h.note):''}`
        +`${h.is_package_session?'<br><span class="muted small">Package session · reversal restores one session with no payment refund</span>':''}`
        +`${action?'<br>'+action:''}`;
      const amt=Number((h.amount??h.amount_cents)??0);
      const side=`<div class="c360-tl-amt">${money(amt)}</div>${h.reversal_sale_id?`<div class="c360-tl-when">Net ${money(Number(h.net_amount_cents||0))}</div>`:''}${when(h.t)}`;
      return item(isRev?'reversal':'sale',isRev?'retention':'sales',`${isRev?'Reversal':'Sale'} ${relation}`,detail,side);
    }
    if(h.kind==='redemption'){
      const relation=h.reversal_id?'<span class="pill off">reversed</span>':'';
      const action=h.can_reverse?`<button class="btn danger sm" data-reverse-kind="redemption" data-reverse-id="${h.id}">Reverse</button>`
        :`<span class="muted small">${esc(h.refusal_reason||'Not reversible')}</span>`;
      const detail=`${esc(h.reward_name||'Loyalty reward')} · ${Number(h.points_spent||0)} points${h.credit_cents?` → ${money(Number(h.credit_cents))} credit`:''}<br>${action}`;
      return item('reward','redeem',`Reward redeemed ${relation}`,detail,when(h.t));
    }
    if(h.kind==='grant'){
      const campaign=campaignEntitlementDisplayV99(h);
      if(campaign.pending){
        const detail=`${esc(h.program||'Retention program')} · ${esc(campaign.title)} · <span data-workspace-i18n>Merchant fulfilment pending</span><br><span data-workspace-i18n>No wallet value was posted.</span>`;
        return item('reward','loyalty','<span data-workspace-i18n>Campaign reward pending</span>',detail,when(h.t));
      }
      const value=h.fulfillment_kind==='credit'?money(Number(h.reward_value||0))
        :h.fulfillment_kind==='discount_pct'?`${h.reward_value}% off`:esc(h.reward_item||'free item');
      const detail=`${esc(h.program||'Retention program')} · ${esc(h.reward_label||'Reward')} · ${value}`;
      const side=`${h.fulfillment_kind==='credit'?`<div class="c360-tl-amt">${money(Number(h.reward_value||0))}</div>`:''}${when(h.t)}`;
      return item('reward','loyalty','Retention reward earned',detail,side);
    }
    if(h.kind==='membership'){
      const status=`<span class="pill ${h.status==='active'?'on':h.status==='cancelled'?'no':'off'}">${esc((h.status||'').replace(/_/g,' '))}</span>`;
      const detail=`${esc(h.plan||'Membership')}${h.cadence?' · '+esc(h.cadence):''}${h.renews?' · renews '+esc(String(h.renews).slice(0,10)):''}`;
      return item('membership','memberships',`Membership ${status}`,detail,when(h.t));
    }
    if(h.kind==='package'){
      const status=`<span class="pill ${h.status==='active'?'on':'off'}">${esc((h.status||'').replace(/_/g,' '))}</span>`;
      const detail=`${esc(h.plan||'Package')} · ${Number(h.remaining||0)}/${h.sessions||'?'} sessions left`;
      return item('package','packages',`Package ${status}`,detail,when(h.t));
    }
    const status=`<span class="pill ${h.status==='completed'?'ok':h.status==='booked'?'new':'off'}">${esc(h.status||'')}</span>`;
    const title=`Appointment${h.upcoming?' <span class="c360-upcoming">· upcoming</span>':''}`;
    return item('appt','appointments',title,`${esc(h.service||'general visit')} · ${status}`,when(h.t));
  }).join('')}</ul>`;
}
  async function tillPage(){
  const routeMain=M();
  const isTillCurrent=()=>routeMain.isConnected&&M()===routeMain;
  const canRecordSalesAtWorkspace=hasRoleCapability('create_sales')&&canReadModule('clients');
  if(!canRecordSalesAtWorkspace){
    routeMain.innerHTML=`${CUI.pageHeader({title:'Record sale',subtitle:'Customer lookup and purchase recording are unavailable for this role.',iconName:'till',canWrite:false,moduleLabel:'Record sale'})}${CUI.card({title:'Additional access required',description:'Record sale requires customer read access and permission to record purchases.',body:'<p class="muted small">Ask an owner to review your Customers and Record sale assignments.</p>'})}`;
    return;
  }
  routeMain.innerHTML=CUI.loadingState({title:'Record sale',iconName:'till'});
  const [
    {data:tillStaff,error:tillStaffError},{data:tillBranches,error:tillBranchError},
    {data:tillStaffBranches,error:tillStaffBranchError}
  ]=await Promise.all([
    sb.from('staff').select('id').eq('business_id',S.biz.id).eq('user_id',S.user.id).eq('active',true).limit(1),
    sb.from('branches').select('id,name,is_default').eq('business_id',S.biz.id).eq('active',true).order('name'),
    sb.from('staff_branches').select('staff_id,branch_id').eq('business_id',S.biz.id)
  ]);
  if(!isTillCurrent())return;
  if(tillStaffError||tillBranchError||tillStaffBranchError)throw tillStaffError||tillBranchError||tillStaffBranchError;
  const tillStaffId=tillStaff?.[0]?.id||null;
  const canSeeAllTillBranches=S.myRole==='owner'||S.myRole==='manager';
  const tillAssignedBranchIds=new Set((tillStaffBranches||[]).filter(row=>row.staff_id===tillStaffId).map(row=>row.branch_id));
  const assignedTillBranches=(tillBranches||[]).filter(branch=>canSeeAllTillBranches||tillAssignedBranchIds.has(branch.id));
  const branchModuleResults=await Promise.all(assignedTillBranches.map(async branch=>{
    const result=await sb.rpc('get_my_modules_at_v115',{
      p_business:S.biz.id,p_branch:branch.id
    });
    return {branch,result};
  }));
  if(!isTillCurrent())return;
  const branchModuleFailure=branchModuleResults.find(item=>item.result.error||!item.result.data);
  if(branchModuleFailure){
    routeMain.innerHTML=`${CUI.pageHeader({title:'Record sale',subtitle:'Branch access could not be checked safely.',iconName:'till',canWrite:false,moduleLabel:'Record sale'})}${CUI.card({title:'Record sale could not be loaded',description:'No purchase, redemption, or package use was recorded.',body:'<button type="button" class="btn ghost" id="tBranchModulesRetry">Try again</button>'})}`;
    $('tBranchModulesRetry').onclick=tillPage;
    return;
  }
  const branchModulePermsById=new Map(branchModuleResults.map(({branch,result})=>[
    branch.id,result.data.module_perms&&typeof result.data.module_perms==='object'
      ?result.data.module_perms:{}
  ]));
  const branchCanRead=(branchId,module)=>['r','rw'].includes(branchModulePermsById.get(branchId)?.[module]);
  const branchCanWrite=(branchId,module)=>branchModulePermsById.get(branchId)?.[module]==='rw';
  const canAddClient=()=>branchCanWrite(tillBranchId,'clients');
  const accessibleTillBranches=assignedTillBranches.filter(branch=>
    branchCanWrite(branch.id,'till')&&branchCanRead(branch.id,'clients')
  );
  let tillBranchId=accessibleTillBranches.some(branch=>branch.id===selectedBranchId)?selectedBranchId:
    (accessibleTillBranches.find(branch=>branch.is_default)?.id||accessibleTillBranches[0]?.id||'');
  const canRecordSales=hasRoleCapability('create_sales')&&Boolean(tillBranchId);
  const canScanRedemption=()=>canScanCustomerRedemption({
    createSales:hasRoleCapability('create_sales'),
    clientsReadable:branchCanRead(tillBranchId,'clients'),
    loyaltyWritable:branchCanWrite(tillBranchId,'loyalty')
  });
  if(!tillStaffId||!tillBranchId){
    routeMain.innerHTML=`${CUI.pageHeader({title:'Record sale',subtitle:'A staff identity and branch with Record sale access are required before taking payment.',iconName:'till',canWrite:false,moduleLabel:'Record sale'})}${CUI.card({title:'Record sale is not available',description:'Ask an owner or Peekaa administrator to review this staff member and branch module policy.',body:'<p class="muted small">No purchase, redemption, or package use was recorded.</p>'})}`;
    return;
  }
  selectedBranchId=tillBranchId;
  recordProductInteractionV100('merchant.counter_action_opened',S.biz.id,{
    branchId:tillBranchId,
    context:{action_key:'quick_earn',entry_point:'workspace_route',locale:workspaceLocale,surface_version:'v100'}
  });
  let step=1;             // 1=enter number, 2=customer card / new customer / invalid, 3=done
  let phone='';           // digits typed so far in step 1
