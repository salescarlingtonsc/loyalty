/* ---------- Grow: one customer journey over separate versioned engines ----------
   The engines remain separate because their accounting and version histories are different.
   This surface deliberately does not expose that implementation detail as peer navigation.
   A single owner action creates or resumes ONE coherent configuration draft; it never publishes.
   Staff only receive the published status/result summary. Advanced authoring is owner-only and
   remains a secondary disclosure, while the old deep links continue to resolve for bookmarks. */
async function growOverviewSnapshot({canRewards,canWinback,canSetupGrow,modules=[],isCurrent}){
  const none={data:[],error:null};
  const businessRequest=sb.from('businesses').select('active_config_version_id').eq('id',S.biz.id).single();
  const loyaltyRequest=canRewards
    ?sb.from('loyalty_programs').select('id,active,loyalty_model,current_config_version_id,earn_points_per_dollar,redeem_points,reward_credit_cents,stamp_per_cents,expiry_mode,expiry_days').eq('business_id',S.biz.id).limit(1)
    :Promise.resolve(none);
  const rewardsRequest=canRewards
    ?sb.from('loyalty_rewards').select('id,active,customer_name,name,cost_points,estimated_cost_cents,sort,claim_available_from,claim_available_until').eq('business_id',S.biz.id).order('sort')
    :Promise.resolve(none);
  const productsRequest=S.myRole==='owner'
    ?sb.rpc('owner_list_reward_profitability_products_v122',{p_business:S.biz.id})
    :Promise.resolve(none);
  const referralsRequest=modules.includes('referrals')
    ?sb.from('referral_programs').select('id,enabled,reward_cents,min_spend_cents').eq('business_id',S.biz.id).limit(1)
    :Promise.resolve(none);
  const membershipsRequest=modules.includes('memberships')
    ?sb.from('membership_plans').select('id,name,active').eq('business_id',S.biz.id).order('created_at',{ascending:false})
    :Promise.resolve(none);
  const giftcardsRequest=modules.includes('giftcards')
    ?sb.rpc('business_get_checkout_preferences_v102',{p_business:S.biz.id})
    :Promise.resolve({data:null,error:null});
  const [{data:business,error:businessError},{data:loyalty,error:loyaltyError},
    {data:rewards,error:rewardsError},{data:products,error:productsError},
    {data:referrals,error:referralsError},{data:memberships,error:membershipsError},
    {data:giftcardPreferences,error:giftcardsError}]
    =await Promise.all([businessRequest,loyaltyRequest,rewardsRequest,productsRequest,
      referralsRequest,membershipsRequest,giftcardsRequest]);
  if(!isCurrent())return null;
  if(businessError)throw businessError;
  const currentVersion=business?.active_config_version_id||null;
  const retentionRequest=canWinback&&currentVersion
    ?sb.from('retention_programs').select('id,name,active,goal_visits,period_days,starts_on').eq('business_id',S.biz.id)
      .eq('current_config_version_id',currentVersion)
    :Promise.resolve(none);
  const birthdayRequest=canRewards&&currentVersion
    ?sb.rpc('get_active_birthday_program',{p_business_id:S.biz.id})
    :Promise.resolve(none);
  let draftRequest=Promise.resolve(none);
  if(canSetupGrow){
    let query=sb.from('firm_config_versions').select('id,version_no,based_on_version_id,status')
      .eq('business_id',S.biz.id).eq('status','draft');
    query=currentVersion?query.eq('based_on_version_id',currentVersion):query.is('based_on_version_id',null);
    draftRequest=query.order('version_no',{ascending:false}).limit(1);
  }
  const [{data:retention,error:retentionError},{data:drafts,error:draftError},
    {data:birthday,error:birthdayError}]
    =await Promise.all([retentionRequest,draftRequest,birthdayRequest]);
  if(!isCurrent())return null;
  /* Overview reads are intentionally fail-soft. A failed optional-engine read must not hide the
     rest of Grow or be mistaken for an unconfigured programme; its row remains Unavailable. */
  return {
    currentVersion,
    asOf:birthdayError?null:birthday?.as_of||null,
    loyalty:loyaltyError?null:(loyalty||[])[0]||null,
    rewards:rewardsError?[]:rewards||[],
    products:productsError?[]:(Array.isArray(products?.items)?products.items:[]),
    birthday:birthdayError?null:(Array.isArray(birthday?.programs)?birthday.programs[0]:null)||null,
    retention:retentionError?[]:retention||[],
    referral:referralsError?null:(referrals||[])[0]||null,
    memberships:membershipsError?[]:memberships||[],
    giftcards:giftcardsError?null:{available:giftcardPreferences?.status==='available'
      &&typeof giftcardPreferences?.gift_card_sales_enabled==='boolean',
      enabled:giftcardPreferences?.gift_card_sales_enabled===true},
    draft:draftError?null:(drafts||[])[0]||null,
    overviewErrors:{loyalty:Boolean(loyaltyError),rewards:Boolean(rewardsError),birthday:Boolean(birthdayError),
      retention:Boolean(retentionError),referrals:Boolean(referralsError),memberships:Boolean(membershipsError),
      giftcards:Boolean(giftcardsError)||Boolean(modules.includes('giftcards')&&giftcardPreferences?.status!=='available')}
  };
}
function ownerRewardJourneyV122({rewards=[],birthday=null,loyalty=null,loyaltyModel=null,asOf=null}={}){
  const model=loyalty?.loyalty_model||loyaltyModel||'points';
  const unit=model==='stamps'?'stamps':'points';
  const programmeActive=loyalty?.active===true;
  const asOfMs=Number.isFinite(Date.parse(asOf||''))?Date.parse(asOf):Date.now();
  const compactNumber=value=>Number.isInteger(Number(value))?String(Number(value)):String(Number(value)).replace(/\.0+$/,'');
  const pointsRate=Math.max(0,Number(loyalty?.earn_points_per_dollar||0));
  const stampSpendCents=Math.max(0,Number(loyalty?.stamp_per_cents||0));
  const earning=!loyalty?null:model==='stamps'
    ?{model,unit,rate:stampSpendCents,availableToCustomers:programmeActive,label:`Earn 1 stamp per SGD ${(stampSpendCents/100).toFixed(2)} spent`}
    :{model,unit,rate:pointsRate,availableToCustomers:programmeActive,label:`Earn ${compactNumber(pointsRate)} points per SGD 1 spent`};
  const allRewards=Array.isArray(rewards)?rewards:[];
  const ordered=allRewards
    .filter(reward=>reward?.active!==false)
    .sort((a,b)=>Number(a.cost_points||0)-Number(b.cost_points||0)||Number(a.sort||0)-Number(b.sort||0));
  const milestones=ordered
    .map((reward,index)=>{
      const startsAt=reward.claim_available_from?Date.parse(reward.claim_available_from):null;
      const endsAt=reward.claim_available_until?Date.parse(reward.claim_available_until):null;
      const availability=!loyalty?'programme_unconfigured':!programmeActive?'programme_paused':model==='classic'?'not_current_model'
        :Number.isFinite(startsAt)&&startsAt>asOfMs?'not_started'
        :Number.isFinite(endsAt)&&endsAt<=asOfMs?'ended':'available';
      return {
        id:reward.id||String(index),name:reward.customer_name||reward.name||'Reward',
        threshold:Math.max(0,Number(reward.cost_points||0)),unit,
        additional:index?Math.max(0,Number(reward.cost_points||0)-Number(ordered[index-1]?.cost_points||0)):Math.max(0,Number(reward.cost_points||0)),
        estimatedCostCents:Math.max(0,Number(reward.estimated_cost_cents||0)),
        availability,availableToCustomers:availability==='available'
      };
    });
  const archivedRewards=allRewards.filter(reward=>reward?.active===false)
    .sort((a,b)=>Number(a.sort||0)-Number(b.sort||0)||Number(a.cost_points||0)-Number(b.cost_points||0))
    .map((reward,index)=>({
      id:reward.id||reward.reward_id||`archived-${index}`,
      name:reward.customer_name||reward.name||'Reward',threshold:Math.max(0,Number(reward.cost_points||0)),unit,
      estimatedCostCents:Math.max(0,Number(reward.estimated_cost_cents||0)),active:false
    }));
  const redeemPoints=Math.max(0,Number(loyalty?.redeem_points||0));
  const rewardCreditCents=Math.max(0,Number(loyalty?.reward_credit_cents||0));
  const classicReward=model==='classic'&&redeemPoints>0&&rewardCreditCents>0?{
    id:`classic:${loyalty?.id||'programme'}`,name:'Points redemption',threshold:redeemPoints,unit:'points',
    value:`SGD ${(rewardCreditCents/100).toFixed(2)} store credit`,availableToCustomers:programmeActive
  }:null;
  const birthdayReward=!birthday?null:{
    id:birthday.id||birthday.program_id||'birthday',
    active:birthday.active!==false,
    name:birthday.customer_label||'Birthday reward',
    description:birthday.customer_description||'Available in the configured birthday window.',
    value:birthday.fulfillment_kind==='discount_pct'
      ?`${Number(birthday.discount_percent||0)}% off`
      :birthday.manual_item||'Configured birthday benefit'
  };
  return {model,unit,earning,milestones,archivedRewards,classicReward,birthday:birthdayReward};
}

/* v104 starts with a zero-credit structured copy assistant. It deliberately does not call a
   model from the browser or expose a provider key. The policy below is also the contract for
   a future server-side model: merchant facts are immutable inputs, never suggestions. */
const PROMOTION_COPY_POLICY_V104=Object.freeze({
  system:'You are Peekaa’s SME promotion copy assistant. Transform only the merchant-provided facts into concise Singapore English. Preserve every number, percentage, date, named item, eligibility condition and term exactly. Never invent scarcity, prices, availability, outcomes, endorsements or legal claims. Return one headline and one short message. End the message with the matching call to action from the approved CTA list. Do not add hashtags or emojis.',
  ctas:Object.freeze({book:'Book now',programme:'View offer',counter:'Show at counter'}),
  messageCtas:Object.freeze({
    book:'Book now to enjoy this offer.',
    programme:'View the offer and plan your visit.',
    counter:'Show this offer at the counter when you visit.'
  })
});
function promotionDateInputV104(value){
  if(!value)return '';
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Singapore',year:'numeric',month:'2-digit',day:'2-digit'})
    .formatToParts(new Date(value));
  const byType=Object.fromEntries(parts.map(part=>[part.type,part.value]));
  return `${byType.year}-${byType.month}-${byType.day}`;
}
function promotionDateTextV104(value){
  if(!value)return '';
  const instant=/^\d{4}-\d{2}-\d{2}$/.test(String(value))
    ?new Date(`${value}T12:00:00+08:00`):new Date(value);
  return new Intl.DateTimeFormat('en-SG',{timeZone:'Asia/Singapore',day:'numeric',month:'long',year:'numeric'}).format(instant);
}
function promotionBoundaryV104(date,{end=false}={}){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(date||'')))return null;
  return new Date(`${date}T${end?'23:59:59.999':'00:00:00.000'}+08:00`).toISOString();
}

function promotionRpcErrorIsAmbiguousV104(error){

    .test(String(error.message||error.error||error));

    pendingRewardEstimateCents=Math.round(Number(raw)*100);
    const action={surface:'rewards',focusTarget:'rwAdd',activateTarget:true};
    if(!growDraftVersionId){
      openRewardsAutoSetup(action);
      return;
    }
    mountGrowSurface(action.surface,{draftOverride:growDraftVersionId,...action});
  });
  /* A deep link is a deliberate request to open an engine. The normal #/loyalty and
     #/retention destinations stop at this overview, so ordinary Grow use stays coherent. */
  if((routedAction&&isOwner)||(hashParam&&isOwner)||['studio','storedvalue'].includes(routedSurface)){
    const initialAction=routedAction||{surface:routedSurface};
    await mountGrowSurface(initialAction.surface,{focus:false,draftOverride:hashParam||growDraftVersionId,...initialAction});
  }
}

/* ---------- Bring-back playbooks (v50 campaign / holdout / incremental-lift engine) ----------
   The measurement layer over the LIVE v50 RPCs. A playbook finds lapsed regulars (the exact
   Customer-360 "overdue" predicate: >=M net visits AND no qualifying visit in >N days), sends a
   PUBLISHED retention rule to most of them, holds a deterministic slice back untouched, then
   compares observed repeat-visit rates against that control. New DB surface used here is exactly the seven
   v50 RPCs + owner-read .from() on retention_campaigns (draft criteria) and
   retention_campaign_members (treatment roster) + one owner-read .from() on
   retention_program_versions (the only source of the published version id the create RPC needs)
   + reuse of the clients/sales reads the app already performs for the audience maths.
   Every async write back into the page is guarded so a late resolve from an abandoned route or a
   removed modal is dropped. Idempotency: activation reuses a deterministic key per campaign;
   offer issuance a deterministic key per (campaign,client) — so retries never double-fire. */
const pbAudienceCache=new Map();   // business_id -> {clients, byClient} (session cache for the preview maths)
const pbIssuing=new Set();         // campaign_ids with an issuance loop in flight (double-fire guard)
const PB_STEPS=['Who','Reward','Safety','Review'];
const pbCur=()=>S.biz?.currency||'SGD';
function pbStatusChip(st){
  const m={draft:['new','Draft'],active:['on','Active'],completed:['ok','Completed'],cancelled:['off','Cancelled']};
  const [cls,label]=m[st]||['','Unknown'];
  return `<span class="pill ${cls}">${esc(label)}</span>`;
}
function pbRewardLabel(v){
  return v.fulfillment_kind==='credit'?`${money(v.credit_cents||0)} credit`
    :v.fulfillment_kind==='discount_pct'?`${v.discount_percent||0}% off`
    :(v.manual_item||'free item');
}
function pbWaNumber(phone){
  const d=String(phone||'').replace(/\D/g,'');
  if(!d)return '(no phone on file)';
  return '+'+(d.length===8?('65'+d):d);
}
/* Lazy, cached read of every client + qualifying-visit sale for the business. netVisits and
   lastVisit reproduce Customer 360 byte-for-byte: each counts_as_visit row is +1, its reversal
   -1; last visit is the max occurred_at over non-reversal visit rows. Owner-only paths call this. */
async function pbLoadAudience(){
  const hit=pbAudienceCache.get(S.biz.id);
  if(hit)return hit;
  const [clients,sales]=await Promise.all([
    fetchAllRows(()=>sb.from('clients').select('id,full_name,phone').eq('business_id',S.biz.id)),
    fetchAllRows(()=>sb.from('sales').select('client_id,occurred_at,counts_as_visit,reversal_of').eq('business_id',S.biz.id).eq('counts_as_visit',true))
  ]);
  const byClient=new Map();
  for(const s of sales){
    const e=byClient.get(s.client_id)||{net:0,lastIso:''};
    e.net+=s.reversal_of?-1:1;
    if(!s.reversal_of&&(s.occurred_at||'')>e.lastIso)e.lastIso=s.occurred_at;
    byClient.set(s.client_id,e);
  }
  const out={clients,byClient};
  pbAudienceCache.set(S.biz.id,out);
  return out;
}
function pbComputeCandidates(audience,lapsedDays,minVisits){
  const now=Date.now(),dayMs=86400000,out=[];
  for(const c of audience.clients){
    const e=audience.byClient.get(c.id)||{net:0,lastIso:''};
    const lastDays=e.lastIso?Math.floor((now-new Date(e.lastIso).getTime())/dayMs):null;
    if(e.net>=minVisits&&lastDays!=null&&lastDays>lapsedDays)
      out.push({id:c.id,full_name:c.full_name,phone:c.phone,netVisits:e.net,lastVisitDays:lastDays});
  }
  out.sort((a,b)=>b.lastVisitDays-a.lastVisitDays); // most overdue first
  return out;
}
async function pbActivateCampaign(campaignId,clientIds){
  // Deterministic key: idempotent replay on retry, and the SQL advisory lock is per-campaign,
  // so a re-run of an already-active campaign returns the frozen split instead of re-splitting.
  return sb.rpc('activate_retention_campaign',{p_business:S.biz.id,p_campaign:campaignId,p_client_ids:clientIds,p_idempotency_key:'v50-activate:'+campaignId});
}

/* Resume a created-but-not-started draft from the list: re-read its frozen intent (audience
   criteria), recompute today's matching clients, then activate with the deterministic key. */
async function pbActivateDraft(c,ctx){
  const {data:row,error:e1}=await sb.from('retention_campaigns').select('audience_criteria').eq('id',c.campaign_id).eq('business_id',S.biz.id).maybeSingle();
  if(e1)return fail(e1);
  const crit=row?.audience_criteria||{};
  if(crit.segment!=='lapsed')return toast('Open this draft in the wizard to start it');
  const audience=await pbLoadAudience();
  const cands=pbComputeCandidates(audience,crit.lapsed_days||45,crit.min_visits||3);
  if(!cands.length)return toast('No customers currently match this playbook — cancel it or start a fresh one');
  if(!confirm(`Start "${c.name}"? This freezes ${cands.length} customer${cands.length===1?'':'s'} and holds back ${c.holdout_percent}% as a control.`))return;
  const {error}=await pbActivateCampaign(c.campaign_id,cands.map(x=>x.id));
  if(error)return fail(error);
  toast('Playbook started');
  if(ctx.isCurrent())renderPlaybooks(ctx);
}

function pbResolveExposureRetryChannel(existingChannels,displayedChannel){
  const displayed=String(displayedChannel||'').trim();
  const frozen=[...new Set((existingChannels||[]).map(value=>String(value||'').trim()).filter(Boolean))];
  if(frozen.length>1)return {ok:false,channel:null,reason:'mixed_retry_channels'};
  if(frozen.length===1&&frozen[0]!==displayed){
    return {ok:false,channel:frozen[0],reason:'changed_retry_channel'};
  }
  return {ok:!!displayed,channel:frozen[0]||displayed,reason:displayed?null:'missing_channel'};
}

  deactivate=CUI.activateDialog(modal,{onClose:close,initialFocus:'#pbIssueRun'});
  $('pbIssueClose').onclick=close;
  $('pbCopyContacts').onclick=async()=>{
    const prepared=[...entitlementRows.values()].map(row=>row.target);
    await copyTextToClipboard(pbContactListText(c,prepared),{button:$('pbCopyContacts'),
      success:'Contact list copied — paste into WhatsApp or your notes',
      failure:'Copy was blocked. Select the prepared contacts and copy them manually.'});
  };
  function renderEntitlementOutcome({failed=[],capped=false}={}){
    const outEl=$('pbIssueOutcome');if(!outEl)return;
    const rows=[...entitlementRows.values()];
    const pending=rows.filter(row=>row.exposureStatus!=='verified');
    outEl.innerHTML=`<div class="card" style="background:var(--tint);border:none">
      <b>${rows.length} reward entitlement${rows.length===1?'':'s'} prepared.</b>
      <p class="muted small" style="margin-top:6px">These rewards are visible in customer history with merchant fulfilment pending. No points or store credit were posted.</p>
      ${capped?'<p class="err" style="margin-top:6px">Budget cap reached — no entitlement was created for the remaining customers.</p>':''}
      ${failed.length?`<p class="err" style="margin-top:6px">${failed.length} could not be prepared: ${esc(failed.slice(0,6).map(f=>f.full_name||'Customer').join(', '))}${failed.length>6?` and ${failed.length-6} more`:''}.</p><button class="btn ghost sm" id="pbRetryFailed" style="margin-top:8px">Retry failed only</button>`:''}
    </div>
    ${rows.length?`<section class="card" style="margin-top:10px"><h3>Confirm actual receipt</h3>
      <p class="muted small" style="margin-top:5px">Select only customers who have actually been shown or sent their reward. This is your manual attestation, not automated delivery evidence.</p>
      <label for="pbExposureChannel" style="margin-top:12px">How was it shown or sent?</label>
      <select id="pbExposureChannel"><option value="whatsapp">WhatsApp</option><option value="sms">SMS</option><option value="email">Email</option><option value="in_app">Shown in the customer portal</option><option value="other">Other manual method</option></select>
      <div style="margin-top:10px">${rows.map(row=>`<label class="row" style="padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start">
        <input type="checkbox" data-pb-exposure="${esc(row.campaignGrantId)}" style="width:auto;margin-top:3px" ${row.exposureStatus==='verified'?'checked disabled':''}>
        <span><b>${esc(row.target.full_name||'Customer')}</b><span class="muted small" style="display:block">${esc(row.rewardLabel||'Campaign reward')} · ${row.exposureStatus==='verified'?'Receipt confirmed':'Awaiting actual receipt'}</span></span>
      </label>`).join('')}</div>
      ${pending.length?'<button class="btn sm" id="pbConfirmExposure" style="margin-top:12px">Confirm actual receipt for selected</button>':'<div class="imp-note" style="margin-top:12px"><b>All prepared customers are confirmed.</b> Close this panel, review the totals, then start the measurement window separately.</div>'}
      <div id="pbExposureStatus" class="muted small" role="status" aria-live="polite" style="margin-top:8px"></div>
    </section>`:''}`;
    const copy=$('pbCopyContacts');if(copy)copy.disabled=rows.length===0;
    if($('pbRetryFailed'))$('pbRetryFailed').onclick=()=>runIssue(failed);
    if($('pbConfirmExposure'))$('pbConfirmExposure').onclick=confirmSelectedExposures;
  }
  async function confirmSelectedExposures(){
    const selected=[...modal.querySelectorAll('[data-pb-exposure]:checked:not(:disabled)')]
      .map(input=>entitlementRows.get(input.dataset.pbExposure)).filter(Boolean);
    if(!selected.length)return toast('Select at least one customer who actually received the reward');
    const displayedChannel=$('pbExposureChannel').value;
    const retryChannel=pbResolveExposureRetryChannel(
      selected.map(row=>exposureAttempts.get(row.campaignGrantId)?.channel),
      displayedChannel
    );
    if(!retryChannel.ok){
      const status=$('pbExposureStatus');
      const message=retryChannel.reason==='changed_retry_channel'
        ?workspaceTemplateTextV97('exposureRetryChannelLocked',{channel:retryChannel.channel.replace('_',' ')})
        :workspaceTemplateTextV97('exposureRetryMixedChannels');
      if(status)status.textContent=message;
      return toast(message);
    }
    const channel=retryChannel.channel;
    if(!confirm(`Confirm that ${selected.length} selected customer${selected.length===1?'':'s'} actually received the reward via ${channel.replace('_',' ')}? This records your manual attestation; it is not a provider delivery receipt.`))return;
    const button=$('pbConfirmExposure'),status=$('pbExposureStatus');
    button.disabled=true;status.textContent='Recording manual receipt confirmations…';
    let confirmed=0;const failed=[];
    for(const row of selected){
      let attempt=exposureAttempts.get(row.campaignGrantId);
      if(!attempt){attempt={key:crypto.randomUUID(),channel};exposureAttempts.set(row.campaignGrantId,attempt)}
      const {data,error}=await sb.rpc('attest_campaign_exposure_v99',{
        p_business:S.biz.id,p_campaign:c.campaign_id,p_campaign_grant:row.campaignGrantId,
        p_channel:attempt.channel,p_confirmed:true,p_idempotency_key:attempt.key,
        p_exposed_at:null,p_evidence_context:{entry_point:'owner_confirmation'}
      });
      if(error)failed.push(row);
      else if(data?.attested===true&&data?.exposure_status==='verified'){
        row.exposureStatus='verified';confirmed++;exposureAttempts.delete(row.campaignGrantId);
      }else failed.push(row);
    }
    toast(workspaceTemplateTextV97(
      confirmed===1?'receiptConfirmationRecorded':'receiptConfirmationsRecorded',
      {count:confirmed}
    ));
    renderEntitlementOutcome({failed:[]});
    const nextStatus=$('pbExposureStatus');
    if(failed.length&&nextStatus)nextStatus.textContent=workspaceTemplateTextV97(
      failed.length===1?'receiptConfirmationFailed':'receiptConfirmationsFailed',
      {count:failed.length}
    );
  }
  async function runIssue(list){
    if(pbIssuing.has(c.campaign_id))return;
    pbIssuing.add(c.campaign_id);
    const runBtn=$('pbIssueRun');if(runBtn)runBtn.disabled=true;
    const prog=$('pbIssueProgress'),outEl=$('pbIssueOutcome');
    outEl.innerHTML='';
    let done=0,capped=false;const failed=[];
    for(const t of list){
      // The server issues the customer-history entitlement and immutable campaign link
      // atomically. This call does not attest receipt, post spendable value, or fulfil it.
      const {data,error}=await sb.rpc('issue_campaign_offer',{
        p_business:S.biz.id,p_campaign:c.campaign_id,p_client:t.client_id,
        p_idempotency_key:'v99-entitlement:'+c.campaign_id+':'+t.client_id,
        p_offer_cost_cents:null,p_reward_grant_id:null
      });
      done++;
      if(error){
        if(error.code==='23514'||/budget cap/i.test(error.message||'')){capped=true;break;}
        failed.push(t);
      }else{
        const campaignGrantId=data?.campaign_grant_id,rewardGrantId=data?.reward_grant_id;
        if(!campaignGrantId||!rewardGrantId||data?.entitlement_status!=='granted'
           ||!data?.fulfillment_kind||data?.customer_history_visible!==true
           ||data?.economic_value_posted!==false||data?.delivery_provider_status!=='not_configured'
           ||data?.redemption_mode!=='merchant_fulfilment_pending'
           ||!['awaiting_manual_attestation','verified'].includes(data?.exposure_status)){
          failed.push(t);
        }else entitlementRows.set(campaignGrantId,{
          target:t,campaignGrantId,rewardGrantId,rewardLabel:data?.reward_label||'Campaign reward',
          exposureStatus:data?.exposure_status||'awaiting_manual_attestation'
        });
      }
      if(prog)prog.innerHTML=pbProgressBar(done,list.length);
    }
    pbIssuing.delete(c.campaign_id);
    if(runBtn)runBtn.disabled=true;
    renderEntitlementOutcome({failed,capped});
  }
  $('pbIssueRun').onclick=()=>runIssue(targets);
}
function pbProgressBar(done,total){
  const pct=total?Math.round(done/total*100):0;
  return `<div class="row" style="justify-content:space-between"><span class="small">Preparing reward entitlements…</span><b class="small">${done}/${total}</b></div>
    <div style="height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:4px"><div style="height:100%;width:${pct}%;background:var(--green);transition:width .2s var(--ease)"></div></div>`;
}

/* Four-step create wizard. Step content is swapped inside one modal; inputs bind live to state so
   Back/Next never lose a value. The final action creates then activates as a pair under ONE
   deterministic activation key: a create-succeeded-but-activate-failed partial keeps the campaign
   id so "Retry start" re-activates the SAME draft rather than creating a second one. */
function openPlaybookWizard(ctx){
  document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="pbWizModal" role="dialog" aria-modal="true" aria-labelledby="pbWizTitle" tabindex="-1"><div class="modal-card" style="max-width:640px">
    <div class="row"><div><h2 id="pbWizTitle">New bring-back playbook</h2><p class="muted small" id="pbWizStepLabel">Loading…</p></div><span class="spacer"></span><button class="btn ghost sm" id="pbWizClose">Close</button></div>
    <ol id="pbWizSteps" style="display:flex;gap:6px;list-style:none;padding:0;margin:14px 0 4px" aria-hidden="true"></ol>
    <div id="pbWizBody" style="margin-top:6px"><p class="muted small" role="status">Loading customer data…</p></div>
    <div id="pbWizNav" class="row" style="margin-top:18px"></div>
  </div></div>`);
  const modal=$('pbWizModal');
  let deactivate;
  const close=()=>{deactivate?deactivate():modal.remove()};
  deactivate=CUI.activateDialog(modal,{onClose:close,initialFocus:'#pbWizClose'});
  $('pbWizClose').onclick=close;
  const state={step:0,lapsedDays:45,minVisits:3,candidates:[],audience:null,versions:[],version:null,holdout:10,capDollars:'',windowDays:30,upsideDollars:'',name:'',createdCampaignId:null,busy:false};

  (async()=>{
    let audience,versions=[];
    try{
      const versionsReq=ctx.currentVersion
        ?sb.from('retention_program_versions').select('id,name,fulfillment_kind,credit_cents,discount_percent,manual_item')
          .eq('business_id',S.biz.id).eq('config_version_id',ctx.currentVersion).eq('active',true).order('sort')
        :Promise.resolve({data:[],error:null});
      const [aud,{data:vs,error:vErr}]=await Promise.all([pbLoadAudience(),versionsReq]);
      if(vErr)throw vErr;
      audience=aud;versions=vs||[];
    }catch(e){
      if(!modal.isConnected)return;
      $('pbWizBody').innerHTML=`<div class="err" role="alert">Could not prepare the playbook. ${esc(e.message||String(e))}</div>`;
      return;
    }
    if(!modal.isConnected)return;
    state.audience=audience;state.versions=versions;
    state.candidates=pbComputeCandidates(audience,state.lapsedDays,state.minVisits);
    if(versions.length)state.version=versions[0];
    state.name=`Bring back lapsed regulars · ${new Date().toISOString().slice(0,10)}`;
    renderStep();
  })();

  function treatmentCount(){return Math.round(state.candidates.length*(100-state.holdout)/100)}
  function expectedCostCents(){return (state.version&&state.version.fulfillment_kind==='credit')?(state.version.credit_cents||0)*treatmentCount():0}
  function renderStepMeter(){
    $('pbWizSteps').innerHTML=PB_STEPS.map((s,i)=>`<li style="flex:1;text-align:center;font-size:11px;font-weight:600;padding:6px 4px;border-radius:8px;background:${i===state.step?'var(--tint)':'transparent'};color:${i===state.step?'var(--coral)':i<state.step?'var(--green)':'var(--muted)'}"><span data-merchant-content>${i+1}.</span> <span data-workspace-i18n>${esc(s)}</span></li>`).join('');
  }
  function whoPreview(){
    const n=state.candidates.length;
    const names=state.candidates.slice(0,8).map(c=>esc(c.full_name||'Customer')).join(', ');
    return `<div class="card" style="background:var(--tint);border:none">
      <div style="font-size:1.5rem;font-weight:700">${n} customer${n===1?'':'s'} match</div>
      <p class="muted small" style="margin-top:6px">${n?`${names}${n>8?` and ${n-8} more`:''}`:'No customers match yet — widen the days or lower the visit count.'}</p>
      <p class="muted small" style="margin-top:6px">Regulars with ${state.minVisits}+ past visits and none in over ${state.lapsedDays} days — the same rule a customer profile uses to flag someone as overdue.</p>
    </div>`;
  }
  function rewardInfo(){
    const v=state.version;if(!v)return '';
    return `<div class="card" style="background:var(--tint);border:none">
      <div class="row"><span>Reward configuration</span><span class="spacer"></span><b>${esc(pbRewardLabel(v))}</b></div>
      <div class="row" style="margin-top:6px"><span>Treatment group</span><span class="spacer"></span><b>${treatmentCount()} customer${treatmentCount()===1?'':'s'}</b></div>
      <div class="row" style="margin-top:6px"><span>Expected reward cost</span><span class="spacer"></span><b>${v.fulfillment_kind==='credit'?money(expectedCostCents()):'No direct credit cost'}</b></div>
    </div>`;
  }
  function stepWho(){
    return `<p class="muted small">Find regulars who have stopped coming.</p>
      <div class="split">
        <div><label for="pbLapsed">No visit in more than (days)</label><input id="pbLapsed" type="number" min="1" max="365" value="${state.lapsedDays}"></div>
        <div><label for="pbMinV">At least (past visits)</label><input id="pbMinV" type="number" min="1" max="99" value="${state.minVisits}"></div>
      </div>
      <div id="pbWhoPreview" style="margin-top:12px"></div>`;
  }
  function stepReward(){
    if(!state.versions.length)
      return `<div class="imp-note"><b>No published bring-back rule yet.</b> A playbook uses one published rule as the reward configuration. Starting the playbook freezes the audience only; reward entitlements are prepared later. Publish a Bring-back rule below first, then come back.</div>`;
    return `<label for="pbVersion">Which reward should be prepared?</label>
      <select id="pbVersion">${state.versions.map(v=>`<option value="${esc(v.id)}" ${state.version&&state.version.id===v.id?'selected':''}>${esc(v.name)} — ${esc(pbRewardLabel(v))}</option>`).join('')}</select>
      <div id="pbRewardInfo" style="margin-top:10px"></div>
      <label for="pbUpside" style="margin-top:12px">Sales you hope to win back (optional, ${esc(pbCur())})</label>
      <input id="pbUpside" type="number" min="0" step="0.01" value="${esc(state.upsideDollars)}" placeholder="e.g. 500">`;
  }
  function stepSafety(){
    return `<div class="card" style="background:var(--tint);border:none">
        <b>Friendly measurement defaults</b>
        <p class="muted small" style="margin-top:6px">Peekaa will place 90% of matched customers in the treatment group and hold 10% back. Reward entitlements are prepared only when you choose Prepare rewards; customer contact and receipt confirmation remain manual.</p>
      </div>
      <details class="studio-advanced" style="margin-top:12px">
        <summary>Advanced measurement settings</summary>
        <label for="pbHoldout">Hold back for proof (%)</label>
        <input id="pbHoldout" type="number" min="0" max="90" value="${state.holdout}">
        <p class="muted small" style="margin-top:6px">Held-back customers receive no campaign reward entitlement, so Peekaa can compare observed return rates. This comparison alone does not prove causation. 10% is the recommended default.</p>
        <div class="split" style="margin-top:12px">
          <div><label for="pbCap">Budget cap (${esc(pbCur())}, 0 = none)</label><input id="pbCap" type="number" min="0" step="0.01" value="${esc(state.capDollars)}"></div>
          <div><label for="pbWindow">Measure returns for (days)</label><input id="pbWindow" type="number" min="1" max="365" value="${state.windowDays}"></div>
        </div>
        <p class="muted small" style="margin-top:8px">A real visit inside the measurement window is recorded as an observed return.</p>
      </details>`;
  }
  function stepReview(){
    const v=state.version,treat=treatmentCount(),hold=state.candidates.length-treat;
    return `<label for="pbName">Playbook name</label><input id="pbName" value="${esc(state.name)}" maxlength="120">
      <div class="card" style="margin-top:12px">
        <div class="row"><span>Audience</span><span class="spacer"></span><b>${state.candidates.length} lapsed regular${state.candidates.length===1?'':'s'}</b></div>
        <div class="row" style="margin-top:6px"><span>Treatment group</span><span class="spacer"></span><b>${treat} customer${treat===1?'':'s'}</b></div>
        <div class="row" style="margin-top:6px"><span>Held back (proof)</span><span class="spacer"></span><b>${hold} · ${state.holdout}%</b></div>
        <div class="row" style="margin-top:6px"><span>Reward configuration</span><span class="spacer"></span><b>${v?esc(pbRewardLabel(v)):'—'}</b></div>
        <div class="row" style="margin-top:6px"><span>Expected reward cost</span><span class="spacer"></span><b>${v&&v.fulfillment_kind==='credit'?money(expectedCostCents()):'No direct credit cost'}</b></div>
        ${state.upsideDollars&&parseFloat(state.upsideDollars)>0?`<div class="row" style="margin-top:6px"><span>Sales you hope to win back</span><span class="spacer"></span><b>${money(Math.round(parseFloat(state.upsideDollars)*100))}</b></div>`:''}
        <div class="row" style="margin-top:6px"><span>Measure for</span><span class="spacer"></span><b>${state.windowDays} days</b></div>
        ${state.capDollars&&parseFloat(state.capDollars)>0?`<div class="row" style="margin-top:6px"><span>Budget cap</span><span class="spacer"></span><b>${money(Math.round(parseFloat(state.capDollars)*100))}</b></div>`:''}
      </div>
      <p class="muted small" style="margin-top:10px">Starting freezes this audience and splits the held-back group now. It does not create rewards or contact anyone. Prepare reward entitlements, actually show or send them, and confirm receipt from the playbook afterward.</p>
      <div id="pbLaunchOutcome" style="margin-top:8px"></div>`;
  }
  function wireStep(){
    if(state.step===0){
      const upd=()=>{
        state.lapsedDays=Math.max(1,Math.min(365,parseInt($('pbLapsed').value||'0')||45));
        state.minVisits=Math.max(1,Math.min(99,parseInt($('pbMinV').value||'0')||3));
        state.candidates=pbComputeCandidates(state.audience,state.lapsedDays,state.minVisits);
        $('pbWhoPreview').innerHTML=whoPreview();
        const nx=$('pbNext');if(nx)nx.disabled=!state.candidates.length;
      };
      $('pbLapsed').oninput=upd;$('pbMinV').oninput=upd;$('pbWhoPreview').innerHTML=whoPreview();
    }else if(state.step===1&&state.versions.length){
      $('pbVersion').onchange=()=>{state.version=state.versions.find(v=>v.id===$('pbVersion').value)||state.versions[0];$('pbRewardInfo').innerHTML=rewardInfo()};
      $('pbUpside').oninput=()=>{state.upsideDollars=$('pbUpside').value};
      $('pbRewardInfo').innerHTML=rewardInfo();
    }else if(state.step===2){
      $('pbHoldout').oninput=()=>{state.holdout=Math.max(0,Math.min(90,parseInt($('pbHoldout').value||'0')||0))};
      $('pbCap').oninput=()=>{state.capDollars=$('pbCap').value};
      $('pbWindow').oninput=()=>{state.windowDays=Math.max(1,Math.min(365,parseInt($('pbWindow').value||'0')||30))};
    }else if(state.step===3){
      $('pbName').oninput=()=>{state.name=$('pbName').value};
    }
  }
  function renderNav(){
    const nav=$('pbWizNav');if(!nav)return;
    const back=state.step>0?`<button class="btn ghost sm" id="pbBack">Back</button>`:'';
    let right;
    if(state.step<3){
      const blocked=(state.step===0&&!state.candidates.length)||(state.step===1&&!state.versions.length);
      right=`<button class="btn" id="pbNext" ${blocked?'disabled':''}>Next</button>`;
    }else{
      right=`<button class="btn" id="pbLaunch">${CUI.icon('check',{size:16})}<span>${state.createdCampaignId?'Retry start':'Create & start'}</span></button>`;
    }
    nav.innerHTML=`${back}<span class="spacer"></span>${right}`;
    if($('pbBack'))$('pbBack').onclick=()=>{state.step--;renderStep()};
    if($('pbNext'))$('pbNext').onclick=()=>{state.step++;renderStep()};
    if($('pbLaunch'))$('pbLaunch').onclick=launch;
  }
  function renderStep(){
    renderStepMeter();
    $('pbWizStepLabel').innerHTML=workspaceTemplateHtmlV97(['wizardStepWho','wizardStepReward','wizardStepSafety','wizardStepReview'][state.step],{step:state.step+1,total:4});
    $('pbWizBody').innerHTML=[stepWho,stepReward,stepSafety,stepReview][state.step]();
    wireStep();renderNav();
  }
  function resetLaunch(label){const b=$('pbLaunch');if(b){b.disabled=false;b.querySelector('span').textContent=label}}
  async function launch(){
    if(state.busy)return;
    if(!state.version)return toast('Pick a reward first');
    if(!state.candidates.length)return toast('No customers match the audience');
    state.busy=true;
    const b=$('pbLaunch');if(b){b.disabled=true;b.querySelector('span').textContent='Starting…'}
    const out=$('pbLaunchOutcome');
    const name=(state.name||'').trim()||`Bring back lapsed regulars · ${new Date().toISOString().slice(0,10)}`;
    const clientIds=state.candidates.map(c=>c.id);
    const criteria={segment:'lapsed',lapsed_days:state.lapsedDays,min_visits:state.minVisits,computed_at:new Date().toISOString()};
    const capCents=Math.round((parseFloat(state.capDollars)||0)*100);
    const expUpside=state.upsideDollars?Math.round(parseFloat(state.upsideDollars)*100):null;
    try{
      if(!state.createdCampaignId){
        const {data,error}=await sb.rpc('create_retention_campaign',{
          p_business:S.biz.id,p_program_version_id:state.version.id,p_name:name,p_audience_criteria:criteria,
          p_holdout_percent:state.holdout,p_budget_cap_cents:capCents,p_attribution_window_days:state.windowDays,
          p_expected_cost_cents:expectedCostCents(),p_expected_upside_cents:expUpside,p_explanation:null});
        if(error){out.innerHTML=`<div class="err" role="alert">Could not create: ${esc(error.message||'')}</div>`;resetLaunch('Create & start');state.busy=false;return;}
        state.createdCampaignId=data.campaign_id;
      }
      const {error:actErr}=await pbActivateCampaign(state.createdCampaignId,clientIds);
      if(actErr){
        out.innerHTML=`<div class="err" role="alert"><b>Created, but couldn’t start.</b> ${esc(actErr.message||'')} It’s saved as a draft — press Retry start.</div>`;
        resetLaunch('Retry start');state.busy=false;
        if(ctx.isCurrent())renderPlaybooks(ctx);
        return;
      }
      toast('Playbook started — audience frozen and split');
      close();
      if(ctx.isCurrent())renderPlaybooks(ctx);
    }catch(e){
      out.innerHTML=`<div class="err" role="alert">${esc(e.message||String(e))}</div>`;
      resetLaunch(state.createdCampaignId?'Retry start':'Create & start');state.busy=false;
    }
  }
}

/* ---------- Program Studio (PS-1A authoring + PS-1B/1C execution truth) ----------
   Owner-only surface that lives as a third tab on the Grow page (see growPage). The overview
   PROJECTS every live engine + every studio rule into one uniform WHEN/THEN list
   (get_programs_overview); the authoring editor builds studio rules into a config draft
   (save/delete_program_rule_draft) that rides the SAME create_loyalty_config_draft /
   publish_loyalty_config flow the loyalty & retention editors use. Every write is snapshot-hash
   optimistic-concurrency (40001 => reload) exactly like save_retention_program_draft.
   PS-1C.2 TRUTHFULNESS: checkout and recurring studio rules genuinely EXECUTE now (PS-1B/PS-1C),
   so the old PS-1A rule ("a studio chip may never claim the rule is operating") is SUPERSEDED.
   The chip label is the server's execution_state VERBATIM — one of nine states (draft /
   validation_failed / validated / live / partially_live / shadow_testing / ready_for_activation /
   paused / retired). The browser NEVER computes or infers state; it only renders what
   get_programs_overview returns per rule (execution_state == aggregate_state, plus effect_states
   for the per-effect breakdown). See studioStateChip() below; it is the ONLY chip used for studio
   rows (legacyStateChip is used ONLY for legacy_trigger engines). */

/* ----- allowlist-driven vocabulary (plain language; never raw JSON to the owner) ----- */
const STUDIO_EVENT_LABEL={

  'points.redeemed':'When points are redeemed',
  'birthday.activated':"On a customer's birthday",
  'referral.qualified':'When a referral is completed',
  'membership.renewed':'When a membership renews'

const STUDIO_FIELD_LABEL={
  amount_cents:'Sale amount',kind:'Sale type',branch_id:'Branch',staff_id:'Staff member',
  counts_as_visit:'Counts as a visit',earns_points:'Earns points',reward_id:'Reward',
  points_spent:'Points spent',credit_cents:'Credit amount',birthday_year:'Birthday year',
  fulfillment_kind:'Benefit type',reward_cents:'Referral reward',plan_id:'Membership plan',
  min_spend_cents:'Minimum spend',visits_in_period:'Visits in the period',points_earned:'Points earned'
};
const STUDIO_OP_LABEL={eq:'is',neq:'is not',gt:'is more than',gte:'is at least',lt:'is less than',
  lte:'is at most',between:'is between',in:'is one of',not_in:'is not one of'};
const STUDIO_EFFECT_LABEL={
  earn_bonus_points:{label:'Give bonus points',input:'points'},
  earn_bonus_stamps:{label:'Give bonus stamps',input:'stamps'},
  grant_credit:{label:'Give store credit',input:'amount'},

/* PS-1C.2 per-effect execution words — the server's effect state (live|shadow|unbuilt) rendered
   verbatim as plain language; the browser never derives which engine runs an effect. */
const STUDIO_EFFECT_STATE_WORDS={live:'running now',shadow:'shadow test only',unbuilt:'not built yet'};
const STUDIO_EFFECT_STATE_PILL={live:'ok',shadow:'new',unbuilt:'off'};
const STUDIO_CATALOG_SRC={
  service:{table:'services',name:'name'},product:{table:'products',name:'name'},
  branch:{table:'branches',name:'name'},staff:{table:'staff',name:'full_name'},
  reward:{table:'loyalty_rewards',name:'customer_name'},tier:{table:'loyalty_tiers',name:'name'},
  membership_plan:{table:'membership_plans',name:'name'}
};
const STUDIO_CONDITION_CATALOG={branch_id:'branch',staff_id:'staff',reward_id:'reward',plan_id:'membership_plan'};
const DOW_NAMES=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

const studioCatalogCache=new Map();  // business_id -> {byKind,byId}
const studioSalesAggCache=new Map();  // business_id -> {count30,avgBill,ok}

const shortId=id=>String(id||'').slice(0,8);

/* ----- plain-language summarisers (used by overview rows AND the authoring preview) ----- */
function studioEventText(ev){return STUDIO_EVENT_LABEL[ev]||('When '+String(ev||'something happens'));}
function studioMoney(v){return money(Number(v||0));}
function studioValueText(field,val,cat){
  const catKind=STUDIO_CONDITION_CATALOG[field];
  if(catKind){const ids=Array.isArray(val)?val:[val];
    return ids.map(id=>cat&&cat.byId&&cat.byId[id]?esc(cat.byId[id].name):shortId(id)).join(', ');}
  if(/_cents$/.test(field)){if(Array.isArray(val))return val.map(studioMoney).join(' and ');return studioMoney(val);}
  if(typeof val==='boolean')return val?'yes':'no';
  if(Array.isArray(val))return val.map(v=>esc(String(v))).join(', ');
  return esc(String(val));
}
function studioConditionText(c,cat){
  return `${esc(STUDIO_FIELD_LABEL[c.field]||c.field)} ${esc(STUDIO_OP_LABEL[c.op]||c.op)} ${studioValueText(c.field,c.value,cat)}`;
}
function studioEffectText(e,cat){
  const t=e.effect_type;
  switch(t){
    case 'grant_credit':return `Give ${studioMoney(e.amount_cents)} store credit`;
    case 'apply_discount_amount':return `Take ${studioMoney(e.amount_cents)} off`;
    case 'apply_discount_pct':return `Take ${Number(e.discount_pct||0)}% off`;
    case 'earn_bonus_points':
      if(e.points_per_dollar!=null)return `Earn ${Number(e.points_per_dollar)} point${Number(e.points_per_dollar)===1?'':'s'} per $1 spent`;
      return `Give ${Number(e.points||0)} bonus points`;
    case 'earn_bonus_stamps':
      if(e.per_cents!=null)return `Earn 1 stamp per ${studioMoney(e.per_cents)} spent`;
      return `Give ${Number(e.stamps||0)} bonus stamps`;
    case 'tier_multiplier':return `Multiply points by ${Number(e.multiplier||1)}x`;
    case 'grant_free_item':{const nm=e.catalog_id&&cat&&cat.byId&&cat.byId[e.catalog_id]?cat.byId[e.catalog_id].name:null;
      return nm?`Give a free ${esc(nm)}`:'Give a free item';}
    case 'display_perk':return 'Show a perk (nothing is given)';
    case 'send_notification':return 'Send a notification';
    default:return esc(t||'action');
  }
}
function studioWhenText(rule,cat){
  let s=studioEventText(rule.when_event);
  const conds=rule.if_conditions||[];
  if(conds.length)s+=' — only when '+conds.map(c=>studioConditionText(c,cat)).join(', and ');
  return s;
}
function studioThenText(rule,cat){
  const eff=rule.then_effects||[];
  if(!eff.length)return 'No action set yet';
  return eff.map(e=>studioEffectText(e,cat)).join('; ');
}
function studioDuringText(during){
  if(!during||Object.keys(during).length===0)return 'Any time';
  const parts=[];const dow=during.days_of_week;
  if(Array.isArray(dow)&&dow.length)parts.push('on '+dow.map(d=>DOW_NAMES[d]||d).join(', '));
  if(during.start_time||during.end_time)parts.push('between '+(during.start_time||'00:00')+' and '+(during.end_time||'23:59'));
  if(during.start_date||during.end_date)parts.push('from '+(during.start_date||'today')+' to '+(during.end_date||'no end date'));
  parts.push('(Singapore time)');
  return parts.join(' ');
}
function studioUsingText(using){
  if(!using||Object.keys(using).length===0)return 'Standard stacking';
  const parts=[];
  if(using.stackable===false)parts.push('cannot combine with other offers');
  else if(using.stackable===true)parts.push('can combine with other offers');
  if(using.priority!=null)parts.push('priority '+using.priority);
  if(using.max_stack!=null)parts.push('up to '+using.max_stack+' time'+(Number(using.max_stack)===1?'':'s'));
  if(using.exclusive_group)parts.push('group "'+esc(String(using.exclusive_group))+'"');
  return parts.join(', ')||'Standard stacking';
}

/* ----- state chips. Two SEPARATE functions so the truthful-state rule is grep-provable. ----- */
function legacyStateChip(state){
  const m={live:['on','Live'],paused:['off','Paused'],inactive:['off','Inactive'],disabled:['no','Disabled']};
  const p=m[state]||['off','Unknown'];
  return `<span class="pill ${p[0]}">${p[1]}</span>`;
}
function studioStateChip(state){
  /* PS-1C.2 TRUTHFULNESS: the label is the server's execution_state VERBATIM. The browser NEVER
     computes or infers this state — it only renders the value get_programs_overview / preview
     returns. Checkout and recurring studio rules genuinely execute now (PS-1B/PS-1C), so Live /
     Partially live / Shadow testing are truthful, server-derived facts (this SUPERSEDES the old
     PS-1A rule that a studio chip may never claim the rule is operating). The reachable set is
     exactly these nine server states; an unknown value fails closed to Validation failed. */
  const m={draft:['new','Draft'],validation_failed:['no','Validation failed'],
    validated:['ok','Validated'],live:['ok','Live'],partially_live:['new','Partially live'],
    shadow_testing:['new','Shadow testing'],ready_for_activation:['new','Ready for activation'],
    paused:['off','Paused'],retired:['off','Retired']};
  const p=m[state]||['no','Validation failed'];
  return `<span class="pill ${p[0]}">${p[1]}</span>`;
}
/* PS-1C.2 per-effect breakdown — renders each effect_state {effect_index, effect_type, state}
   the server returns, so a partially-executing rule is NEVER shown as a bare 'Live'. State words
   are the server's verbatim (live -> running now / shadow -> shadow test only / unbuilt -> not
   built yet); nothing is inferred client-side. */
function studioEffectStateChip(st){
  const pill=STUDIO_EFFECT_STATE_PILL[st]||'off';const word=STUDIO_EFFECT_STATE_WORDS[st]||'not built yet';
  return `<span class="pill ${pill}">${esc(word)}</span>`;
}
function studioEffectBreakdownHtml(effectStates){
  const list=Array.isArray(effectStates)?effectStates.slice():[];
  if(!list.length)return '';
  list.sort((a,b)=>(Number(a.effect_index)||0)-(Number(b.effect_index)||0));
  const rows=list.map(es=>{
    const label=(STUDIO_EFFECT_LABEL[es.effect_type]&&STUDIO_EFFECT_LABEL[es.effect_type].label)||es.effect_type||'Action';
    return `<div class="studio-effect-state"><span>${esc(label)}</span>${studioEffectStateChip(es.state)}</div>`;
  }).join('');
  return `<div class="studio-effect-states" role="group" aria-label="What each action is doing right now">
    <div class="muted small">What each action is doing right now:</div>${rows}</div>`;
}
/* Show the per-effect breakdown whenever the rule is not uniformly one state — always for
   partially_live / shadow_testing, and for any rule whose effects disagree (mixed). */
function studioShouldBreakdown(item){
  const list=Array.isArray(item&&item.effect_states)?item.effect_states:[];
  if(!list.length)return false;
  const st=item.execution_state;
  if(st==='partially_live'||st==='shadow_testing')return true;
  return new Set(list.map(e=>e.state)).size>1;
}
/* Read an ACTIVE emergency pause off an overview row, whatever shape the RPC exposes. Defensive:
   accepts a nested object (lifted_at IS NULL => active), or flat *_reason/*_at/*_by fields. */
function studioActiveEmergencyPause(item){
  if(!item)return null;
  const ep=item.emergency_pause||item.active_emergency_pause||null;
  if(ep&&typeof ep==='object'){if(ep.lifted_at)return null;return ep;}
  if(item.emergency_pause_active===true||item.emergency_paused===true){
    return {reason:item.emergency_pause_reason||item.pause_reason||null,
      paused_at:item.emergency_paused_at||item.paused_at||null,
      actor:item.emergency_paused_by_name||item.emergency_paused_by||item.paused_by||null};
  }
  return null;
}

/* ----- PS-1C.2 published-rule controls: normal pause/resume + emergency pause/lift -----
   Every control is a VERSIONED, audited server change. Normal pause/resume publishes a new config
   version (set_studio_rule_active); emergency pause/lift writes an append-only pause row and stops
   NEW effects without deleting any historical fulfilment/discount/reservation. The chip that
   re-renders afterwards is the server's fresh state — no client guessing. */
function studioSetRuleActive(item,active,onDone){
  if(!item||!item.rule_id)return toast('This rule cannot be changed from here.');
  const verb=active?'Resume':'Pause';
  if(!confirm(`${verb} "${item.name||'this rule'}"? This publishes a NEW configuration version and takes effect at the counter immediately.`))return;
  sb.rpc('set_studio_rule_active',{p_business:S.biz.id,p_rule_id:item.rule_id,p_active:active}).then(({error})=>{
    if(error){
      if(error.code==='42501')return toast('Only the owner can pause or resume a rule.');
      return fail(error);
    }
    toast(active?'Rule resumed — new version published':'Rule paused — new version published');
    if(onDone)onDone();
  });
}
/* Shared reason modal for emergency pause (kind='pause') and lift (kind='lift'). Reason is
   MANDATORY (server requires btrim >= 3). Reactivation is deliberately explicit — a lift is its
   own confirmed action with its own reason, never automatic. */
function openStudioEmergencyDialog(kind,item,onDone){
  if(!item||!item.rule_id)return toast('This rule cannot be changed from here.');
  const isLift=kind==='lift';
  const title=isLift?'Lift emergency pause':'Emergency pause';
  const intro=isLift
    ?`Reactivate "${esc(item.name||'this rule')}". It will start running again immediately — record why you are lifting the pause.`
    :`Immediately stop "${esc(item.name||'this rule')}" from applying any new discount, benefit or message. History is kept; only new effects stop. Record why.`;
  document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="studioEmgModal" role="dialog" aria-modal="true" aria-labelledby="studioEmgTitle" tabindex="-1"><div class="modal-card" style="max-width:520px">
    <div class="row"><div><h2 id="studioEmgTitle">${esc(title)}</h2><p class="muted small">${intro}</p></div><span class="spacer"></span><button class="btn ghost sm" id="studioEmgClose" type="button">Close</button></div>
    <label for="studioEmgReason">Reason (required, at least 3 characters)</label>
    <textarea id="studioEmgReason" rows="3" data-workspace-i18n placeholder="${isLift?'Why is it safe to resume?':'What is wrong and who asked for this stop?'}"></textarea>
    <div id="studioEmgErr"></div>
    <div class="row" style="margin-top:16px"><button class="btn ${isLift?'':'danger'}" id="studioEmgSubmit" type="button">${isLift?'Lift pause and resume':'Emergency pause now'}</button><button class="btn ghost sm" id="studioEmgCancel" type="button">Cancel</button></div>
  </div></div>`);
  let deactivate;
  const close=()=>{if(deactivate)deactivate();else $('studioEmgModal')?.remove();};
  deactivate=CUI.activateDialog($('studioEmgModal'),{onClose:close,initialFocus:'#studioEmgReason'});
  $('studioEmgClose').onclick=$('studioEmgCancel').onclick=close;
  $('studioEmgSubmit').onclick=async()=>{
    const reason=($('studioEmgReason').value||'').trim();
    if(reason.length<3){$('studioEmgErr').innerHTML='<div class="err">Write a short reason (at least 3 characters).</div>';return;}
    const btn=$('studioEmgSubmit');btn.disabled=true;btn.setAttribute('aria-busy','true');
    // String-literal RPC names (not a variable) so the PS-0 writer-discovery audit and the v21
    // authenticated-RPC grant check both SEE these two writer surfaces — hiding an authenticated
    // RPC behind a variable would defeat the exhaustiveness contract.
    const args={p_business:S.biz.id,p_rule_id:item.rule_id,p_reason:reason};
    const {error}=isLift
      ? await sb.rpc('lift_emergency_pause',args)
      : await sb.rpc('emergency_pause_studio_rule',args);
    btn.removeAttribute('aria-busy');
    if(error){
      btn.disabled=false;
      if(error.code==='42501'){$('studioEmgErr').innerHTML='<div class="err">Only the owner can do this.</div>';return;}
      $('studioEmgErr').innerHTML=`<div class="err">${esc(error.message||'Could not complete this. Try again.')}</div>`;return;
    }
    close();
    toast(isLift?'Emergency pause lifted — rule resumed':'Rule emergency-paused — new effects stopped');
    if(onDone)onDone();
  };
}

  stacking_bad_number:'Check the stacking numbers.'
};
function studioErrText(code){
  const parts=String(code||'').split(':');const base=parts[0],arg=parts[1];
  if(base==='unknown_condition_field')return `"${esc(arg||'')}" is not a valid condition for this event.`;
  if(base==='invalid_operator')return `"${esc(arg||'')}" is not a valid comparison.`;
  if(base==='invalid_effect')return `"${esc(arg||'')}" is not a valid action for this event.`;
  if(base==='catalog_ref_not_found')return `A selected ${esc(arg||'item')} could not be found.`;
  return STUDIO_ERRMAP[base]||esc(code);
}

/* ----- catalog + sales reads (reads the app already performs elsewhere; cached per business) ----- */
async function loadStudioCatalog(guard){
  const hit=studioCatalogCache.get(S.biz.id);if(hit)return hit;
  const kinds=Object.keys(STUDIO_CATALOG_SRC);
  const results=await Promise.all(kinds.map(k=>{
    const src=STUDIO_CATALOG_SRC[k];
    return sb.from(src.table).select(`id,${src.name}`).eq('business_id',S.biz.id)
      .then(r=>({k,rows:r.error?[]:(r.data||[]).map(x=>({id:x.id,name:x[src.name]||'(unnamed)'}))}));
  }));
  if(guard&&!guard())return null;
  const cat={byKind:{},byId:{}};
  for(const r of results){cat.byKind[r.k]=r.rows;for(const row of r.rows)cat.byId[row.id]={kind:r.k,name:row.name};}
  studioCatalogCache.set(S.biz.id,cat);return cat;
}
async function loadStudioSalesAgg(guard){
  const hit=studioSalesAggCache.get(S.biz.id);if(hit)return hit;
  const since=new Date(Date.now()-30*86400000).toISOString();
  const {data,count,error}=await sb.from('sales').select('amount_cents',{count:'exact'})
    .eq('business_id',S.biz.id).is('reversal_of',null).gte('occurred_at',since).limit(1000);
  if(guard&&!guard())return null;
  let sum=0;const rows=(!error&&data)?data:[];
  for(const s of rows)sum+=Number(s.amount_cents||0);
  const agg={count30:error?null:(count||0),avgBill:rows.length?Math.round(sum/rows.length):0,ok:!error};
  studioSalesAggCache.set(S.biz.id,agg);return agg;
}

/* ----- HONEST economics: exact face value per trigger; a monthly figure ONLY when the data the
   app already reads supports it, always labelled "rough estimate"; otherwise "no estimate". ----- */
function studioEstimate(rule,agg){
  const eff=rule.then_effects||[];const ev=rule.when_event;
  const monthly=(ev==='sale.completed'&&agg&&agg.count30!=null)?agg.count30:null;
  const lines=[];
  for(const e of eff){
    const t=e.effect_type;
    if(t==='grant_credit'||t==='apply_discount_amount'){
      const per=Number(e.amount_cents||0);
      lines.push({label:STUDIO_EFFECT_LABEL[t].label,face:`${studioMoney(per)} each time this rule gives it`,
        est:monthly!=null?`Rough estimate: about ${studioMoney(per*monthly)} per month`:null,
        note:monthly!=null?'Based on the last 30 days of sales; real cost depends on how often this rule matches once activated.'
          :'No monthly estimate available — it depends on how often this rule matches.'});
    }else if(t==='apply_discount_pct'){
      const pct=Number(e.discount_pct||0);const avg=agg&&agg.avgBill?agg.avgBill:null;
      const perApprox=avg!=null?Math.round(avg*pct/100):null;
      lines.push({label:STUDIO_EFFECT_LABEL[t].label,face:`${pct}% off the bill`,
        est:(monthly!=null&&perApprox!=null)?`Rough estimate: about ${studioMoney(perApprox*monthly)} per month`:null,
        note:(monthly!=null&&perApprox!=null)?`Assumes an average bill of ${studioMoney(avg)} over the last 30 days; real cost varies with bill size and match rate.`
          :'No monthly estimate available — it depends on bill size and how often this rule matches.'});
    }else{
      const why={earn_bonus_points:'Points cost depends on future redemption, so no cash estimate is shown.',
        earn_bonus_stamps:'Stamp cost depends on future redemption, so no cash estimate is shown.',
        tier_multiplier:'Extra points cost depends on future redemption, so no cash estimate is shown.',
        grant_free_item:'Item cost depends on your own cost for the item, so no cash estimate is shown.',
        display_perk:'Shows a message only — no value is given.',
        send_notification:'Sends a message only — no value is given.'};
      lines.push({label:(STUDIO_EFFECT_LABEL[t]&&STUDIO_EFFECT_LABEL[t].label)||t,face:null,est:null,
        note:why[t]||'No estimate available.'});
    }
  }
  return lines;
}

/* ---------------- Overview: every programme exactly once, uniform WHEN/THEN + truthful state -------------- */
async function studioOverview(routeMain,isCurrent){
  const [overviewRes,cat]=await Promise.all([
    sb.rpc('get_programs_overview',{p_business:S.biz.id}),
    loadStudioCatalog(isCurrent)
  ]);
  if(!isCurrent())return;
  const {data:overview,error}=overviewRes;
  if(error){
    routeMain.innerHTML=`${CUI.pageHeader({title:'Program Studio',iconName:'loyalty',canWrite:false,moduleLabel:'Program Studio'})}
      <div class="card"><p class="err" role="alert">${esc(error.message||'Program Studio could not load.')}</p>
      <button class="btn" id="studioRetry">Try again</button></div>`;
    if($('studioRetry'))$('studioRetry').onclick=()=>studioPage();
    return;
  }
  const legacy=(overview&&overview.legacy_programs)||[];
  const studio=(overview&&overview.studio_rules)||[];
  const registry=(overview&&overview.registry)||[];
  const currentVersion=overview&&overview.active_config_version_id||null;
  // resumable draft (same detection as retentionPage): a draft based on the active version.
  let resumableDraft=null;
  if(currentVersion){
    const {data:drafts}=await sb.from('firm_config_versions').select('id,version_no')
      .eq('business_id',S.biz.id).eq('status','draft').eq('based_on_version_id',currentVersion)
      .order('version_no',{ascending:false}).limit(1);
    if(!isCurrent())return;
    resumableDraft=drafts&&drafts[0]||null;
  }
  const authorityByEngine={};for(const r of registry)authorityByEngine[r.source_engine]=r;
  // Uniform rows: legacy engines first, then studio rules — each programme exactly once.
  const rowFor=(item,kind)=>{
    const chip=kind==='studio'?studioStateChip(item.execution_state):legacyStateChip(item.execution_state);
    const reg=authorityByEngine[item.source_engine];
    const detail=`<details class="studio-tech"><summary>Technical detail</summary>
      <div class="muted small" style="margin-top:6px;line-height:1.6">

        ${item.rule_hash?`<div>Rule hash: <code>${esc(String(item.rule_hash).slice(0,16))}…</code></div>`:''}

      const controllable=!!item.rule_id&&['live','partially_live','shadow_testing','ready_for_activation','paused'].includes(st);
      const breakdown=studioShouldBreakdown(item)?studioEffectBreakdownHtml(item.effect_states):'';

          controls=`<button class="btn ghost sm" type="button" data-studio-lift="${esc(item.rule_id)}">Lift emergency pause</button>`;
        }else if(item.active===false){
          controls=`<button class="btn ghost sm" type="button" data-studio-active="${esc(item.rule_id)}" data-active="true">Resume rule</button>`;
        }else{
          controls=`<button class="btn ghost sm" type="button" data-studio-active="${esc(item.rule_id)}" data-active="false">Pause rule</button>
            <button class="btn ghost sm danger" type="button" data-studio-emg="${esc(item.rule_id)}">Emergency pause</button>`;
        }
      }
      studioExtra=`${breakdown}${banner}${controls?`<div class="studio-rule-controls">${controls}</div>`:''}`;
    }
    return `<div class="studio-row">
      <div class="studio-row-main">
        <div class="row" style="gap:8px;align-items:center;flex-wrap:wrap"><b data-merchant-content>${esc(item.name||'(unnamed)')}</b>${chip}
          <span class="pill off" title="Where this rule runs from">${kind==='studio'?'Studio rule':'Live engine'}</span></div>
        <div class="muted small" style="margin-top:4px;line-height:1.5"><b>When:</b> ${studioWhenText(item,cat)}</div>
        <div class="muted small" style="line-height:1.5"><b>Then:</b> ${studioThenText(item,cat)}</div>
        ${studioExtra}
        ${detail}

  };
  const rerender=()=>studioPage();
  const legacyRows=legacy.map(x=>rowFor(x,'legacy')).join('');
  const studioRows=studio.map(x=>rowFor(x,'studio')).join('');
  const versionTools=`<div class="card" style="margin-bottom:16px"><div class="row" style="flex-wrap:wrap;gap:10px">
    <div><b>Authoring drafts</b><div class="muted small">Studio rules are authored inside a configuration draft. Publishing a draft can turn rules on immediately — the publish preview shows exactly what will run before you confirm.</div></div>
    <span class="spacer"></span>
    ${resumableDraft?`<a class="btn" href="#/studio/${resumableDraft.id}">Resume draft v${resumableDraft.version_no}</a>`
      :`<button class="btn" id="studioNewDraft">Create authoring draft</button>`}</div></div>`;
  routeMain.innerHTML=`${CUI.pageHeader({title:'Program Studio',subtitle:'One view of every programme — live engines and the rules you author here.',iconName:'loyalty',canWrite:true,moduleLabel:'Program Studio'})}
    <aside class="permission-banner" role="note" style="border-color:var(--line)">${CUI.icon('info',{size:19})}<div>
      <b>Real execution state</b><p>Program Studio lets you write programme rules, check them, and turn them on. Published checkout and recurring rules genuinely run — each rule below shows its state straight from the server (Live, Partially live, Shadow testing, Paused and so on). Your loyalty, retention, referral, birthday and membership engines keep running as before.</p></div></aside>
    ${versionTools}
    <section class="card"><div class="cui-card-head"><h2>Live engines</h2><p>These are running now. State comes straight from each engine.</p></div>
      ${legacy.length?legacyRows:CUI.emptyState({iconName:'loyalty',title:'No live programmes yet',body:'Set up loyalty, retention or other programmes to see them here.'})}</section>
    <section class="card" style="margin-top:16px"><div class="cui-card-head"><h2>Studio rules</h2><p>Each rule shows its real execution state from the server. When a rule only partly executes, the actions below it show what is running now, what is shadow-testing, and what is not built yet.</p></div>
      ${studio.length?studioRows:CUI.emptyState({iconName:'loyalty',title:'No studio rules yet',body:'Create an authoring draft to write your first rule.'})}</section>`;
  if($('studioNewDraft'))$('studioNewDraft').onclick=async()=>{
    const btn=$('studioNewDraft');btn.disabled=true;
    const {data,error:draftError}=await sb.rpc('create_loyalty_config_draft',{p_business:S.biz.id,p_based_on:currentVersion,p_source:'owner_program_studio'});
    if(!isCurrent())return;
    if(draftError){btn.disabled=false;return fail(draftError);}
    nav(`#/studio/${data.version_id}`);
  };
  // PS-1C.2 published-rule controls (studio rows only) — each re-renders to the fresh server state.
  document.querySelectorAll('[data-studio-active]').forEach(b=>b.onclick=()=>{
    const item=studio.find(x=>x.rule_id===b.dataset.studioActive);
    if(item)studioSetRuleActive(item,b.dataset.active==='true',rerender);
  });
  document.querySelectorAll('[data-studio-emg]').forEach(b=>b.onclick=()=>{
    const item=studio.find(x=>x.rule_id===b.dataset.studioEmg);
    if(item)openStudioEmergencyDialog('pause',item,rerender);
  });
  document.querySelectorAll('[data-studio-lift]').forEach(b=>b.onclick=()=>{
    const item=studio.find(x=>x.rule_id===b.dataset.studioLift);
    if(item)openStudioEmergencyDialog('lift',item,rerender);
  });
}

/* ---------------- Draft editor: Quick Start + Guided + Advanced, live-validated ---------------- */
let studioEd=null;  // in-flight working rule for the open editor (null = editor closed)

async function studioDraftEditor(routeMain,isCurrent,draftVersionId){
  const [draftRes,cat,agg]=await Promise.all([
    sb.rpc('get_program_rules_draft',{p_config_version:draftVersionId}),
    loadStudioCatalog(isCurrent),
    loadStudioSalesAgg(isCurrent)
  ]);
  if(!isCurrent())return;
  const {data:draft,error}=draftRes;
  if(error){
    routeMain.innerHTML=`${CUI.pageHeader({title:'Program Studio — draft',iconName:'loyalty',canWrite:false,moduleLabel:'Program Studio'})}
      <div class="card"><p class="err" role="alert">${esc(error.message||'This draft could not load.')}</p>
      <div class="row" style="margin-top:12px"><button class="btn" id="studioDraftRetry">Try again</button>
      <a class="btn ghost" href="#/studio">Back to Program Studio</a></div></div>`;
    if($('studioDraftRetry'))$('studioDraftRetry').onclick=()=>studioPage(draftVersionId);
    return;
  }
  const allow=draft.allowlists||{conditions:[],effects:[],events:[]};
  const rules=draft.rules||[];
  let snapshotHash=draft.snapshot_hash||null;
  // Group allowlist by event for the editor selects.
  const condByEvent={},effByEvent={};
  for(const c of (allow.conditions||[])){(condByEvent[c.event_type]=condByEvent[c.event_type]||[]).push(c);}
  for(const e of (allow.effects||[])){(effByEvent[e.event_type]=effByEvent[e.event_type]||[]).push(e);}
  const events=(allow.events||[]).slice();
  const condDefLookup=(ev,field)=>(condByEvent[ev]||[]).find(c=>c.field===field);

  const editorHost=()=>$('studioEditorHost');
  const rerender=()=>studioDraftEditor(routeMain,isCurrent,draftVersionId);

  // ----- QUICK START templates (only rules that validate cleanly against the allowlist) -----
  const TEMPLATES=[
    {id:'weekday2x',label:'Double points on a weekday',desc:'2x points every Monday',
      make:()=>({name:'Double points on Mondays',when_event:'sale.completed',if_conditions:[],
        then_effects:[{effect_type:'tier_multiplier',multiplier:2}],
        during:{on:true,days_of_week:[1],start_date:'',end_date:'',start_time:'',end_time:''}})},
    {id:'bigfree',label:'Free item on a big visit',desc:'Free item when a sale is $50 or more',
      make:()=>({name:'Free item on a $50+ visit',when_event:'sale.completed',
        if_conditions:[{field:'amount_cents',op:'gte',value:5000}],
        then_effects:[{effect_type:'grant_free_item',catalog_kind:'service',catalog_id:''}]})},
    {id:'bday',label:"Birthday % off",desc:'20% off on a birthday',
      make:()=>({name:'Birthday treat — 20% off',when_event:'birthday.activated',if_conditions:[],
        then_effects:[{effect_type:'apply_discount_pct',discount_pct:20}]})}
  ];

  // ----- render the page shell -----
  const ruleRowHtml=(r)=>{
    const v=r.validation||{};const errs=(v.errors||[]);
    return `<div class="studio-row"><div class="studio-row-main">
      <div class="row" style="gap:8px;align-items:center;flex-wrap:wrap"><b>${r.name?`<span data-merchant-content>${esc(r.name)}</span>`:'<span data-workspace-i18n>(unnamed)</span>'}</b>
        ${studioStateChip(r.execution_state)}${r.active===false?'<span class="pill off">Off</span>':''}</div>
      <div class="muted small" style="margin-top:4px;line-height:1.5"><b>When:</b> ${studioWhenText(r,cat)}</div>
      <div class="muted small" style="line-height:1.5"><b>Then:</b> ${studioThenText(r,cat)}</div>
      <p class="muted small studio-authoring-note" style="margin-top:4px">Draft — not running yet. The publish preview shows exactly what will run once you publish.</p>
      ${errs.length?`<div class="err small" style="margin-top:6px">${errs.map(e=>esc(studioErrText(e))).join('<br>')}</div>`:''}
      <div class="row" style="margin-top:8px;gap:8px"><button class="btn ghost sm studioEditRule" data-id="${esc(r.rule_id)}">Edit</button>
        <button class="btn ghost sm studioDelRule" data-id="${esc(r.rule_id)}" data-name="${esc(r.name||'')}">Delete</button></div>
    </div></div>`;
  };
  routeMain.innerHTML=`${CUI.pageHeader({title:'Program Studio — authoring draft',subtitle:`Draft v${draft.version_no}. Author and check rules — the publish preview shows what will run before anything goes live.`,iconName:'loyalty',canWrite:true,moduleLabel:'Program Studio'})}
    <div class="card" style="margin-bottom:16px"><div class="row" style="flex-wrap:wrap;gap:10px">
      <div><b>Draft configuration</b><div class="muted small">Every save checks the draft hash. Publishing can turn rules on immediately — you will see a preview of exactly what begins running, what stays shadow-only, and what stays off before you confirm.</div></div>
      <span class="spacer"></span>
      <a class="btn ghost" href="#/studio">Leave draft</a>
      <button class="btn" id="studioPublish">Publish draft</button></div>
      <div id="studioPublishStatus" class="small" style="margin-top:8px" role="status" aria-live="polite"></div></div>
    <div class="card" style="margin-bottom:16px"><b>Quick start</b>
      <p class="muted small" style="margin:4px 0 10px">Pick a starting point, then adjust it.</p>
      <div class="row" style="flex-wrap:wrap;gap:8px">${TEMPLATES.map(t=>`<button class="qbtn studioTemplate" data-workspace-i18n data-t="${t.id}" title="${esc(t.desc)}">${esc(t.label)}</button>`).join('')}</div></div>
    <div id="studioEditorHost"></div>
    <div class="card" style="margin-top:16px"><div class="row" style="align-items:center"><b>Rules in this draft</b><span class="spacer"></span>
      <button class="btn sm" id="studioAddRule">New rule</button></div>
      <div id="studioRuleList" style="margin-top:10px">${rules.length?rules.map(ruleRowHtml).join(''):CUI.emptyState({iconName:'loyalty',title:'No rules yet',body:'Use Quick start or New rule to author your first programme rule.'})}</div></div>`;

  // ----- editor open/close + model helpers -----
  function openEditor(model){studioEd=model;paintEditor();
    const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    editorHost().scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});}
  function closeEditor(){studioEd=null;if(editorHost())editorHost().innerHTML='';}

  function blankModel(){
    return {ruleId:crypto.randomUUID(),isNew:true,name:'',active:true,when_event:events[0]||'sale.completed',
      if_conditions:[],then_effects:[],during:{on:false,days_of_week:[],start_date:'',end_date:'',start_time:'',end_time:''},
      using:{stackable:true,priority:0,max_stack:'',exclusive_group:''},sort:0,notes:'',advanced:false};
  }
  function modelFromRule(r){
    const d=r.during_schedule||{};const u=r.using_stacking||{};
    return {ruleId:r.rule_id,isNew:false,name:r.name||'',active:r.active!==false,when_event:r.when_event,
      if_conditions:(r.if_conditions||[]).map(c=>({field:c.field,op:c.op,value:c.value})),
      then_effects:(r.then_effects||[]).map(e=>Object.assign({},e)),
      during:{on:!!(d.days_of_week||d.start_date||d.end_date||d.start_time||d.end_time),
        days_of_week:d.days_of_week||[],start_date:d.start_date||'',end_date:d.end_date||'',start_time:d.start_time||'',end_time:d.end_time||''},
      using:{stackable:u.stackable!==false,priority:u.priority!=null?u.priority:0,max_stack:u.max_stack!=null?u.max_stack:'',exclusive_group:u.exclusive_group||''},
      sort:r.sort||0,notes:r.notes||'',advanced:false};
  }

  // Build the canonical rule payload (dollars->cents, catalog ids, arrays) from the working model.
  function buildRule(m){
    const ev=m.when_event;
    const if_conditions=(m.if_conditions||[]).map(c=>({field:c.field,op:c.op,value:c.value}));
    const then_effects=(m.then_effects||[]).map(e=>{
      const t=e.effect_type;const o={effect_type:t};
      if(t==='grant_credit'||t==='apply_discount_amount')o.amount_cents=Math.round(Number(e.amount_cents||0));
      else if(t==='apply_discount_pct')o.discount_pct=Number(e.discount_pct||0);
      else if(t==='earn_bonus_points')o.points=Math.round(Number(e.points||0));
      else if(t==='earn_bonus_stamps')o.stamps=Math.round(Number(e.stamps||0));
      else if(t==='tier_multiplier')o.multiplier=Number(e.multiplier||0);
      else if(t==='grant_free_item'){o.catalog_kind=e.catalog_kind||'service';if(e.catalog_id)o.catalog_id=e.catalog_id;}
      else if(t==='display_perk'||t==='send_notification'){if(e.note)o.note=e.note;}
      return o;
    });
    const during={};
    if(m.during.on){
      during.timezone='Asia/Singapore';
      if((m.during.days_of_week||[]).length)during.days_of_week=m.during.days_of_week.slice().sort((a,b)=>a-b);
      if(m.during.start_date)during.start_date=m.during.start_date;
      if(m.during.end_date)during.end_date=m.during.end_date;
      if(m.during.start_time)during.start_time=m.during.start_time;
      if(m.during.end_time)during.end_time=m.during.end_time;
    }
    const using={stackable:m.using.stackable!==false,priority:Math.round(Number(m.using.priority||0))};
    if(m.using.max_stack!==''&&m.using.max_stack!=null)using.max_stack=Math.round(Number(m.using.max_stack));
    if(m.using.exclusive_group)using.exclusive_group=String(m.using.exclusive_group);
    return {name:m.name||'',active:m.active!==false,schema_version:1,when_event:ev,
      if_conditions,then_effects,with_params:{},during_schedule:during,using_stacking:using,
      sort:Math.round(Number(m.sort||0)),notes:m.notes||null};
  }

  // Sync editable DOM (name/meta/values) into the model before any structural re-render or validate.
  function syncEditorDom(){
    const m=studioEd;if(!m)return;
    const host=editorHost();if(!host)return;
    const g=id=>host.querySelector(id);
    if(g('#edName'))m.name=g('#edName').value;
    if(g('#edActive'))m.active=g('#edActive').checked;
    if(g('#edSort'))m.sort=g('#edSort').value;
    if(g('#edNotes'))m.notes=g('#edNotes').value;
    // conditions
    host.querySelectorAll('.stCond').forEach((row,i)=>{
      const c=m.if_conditions[i];if(!c)return;
      const def=condDefLookup(m.when_event,c.field)||{};
      c.value=readCondValue(row,def,c.op,c.field);
    });
    // effects
    host.querySelectorAll('.stEff').forEach((row,i)=>{
      const e=m.then_effects[i];if(!e)return;
      readEffInto(row,e);
    });
    // schedule
    if(g('#edSchedOn'))m.during.on=g('#edSchedOn').checked;
    m.during.days_of_week=[...host.querySelectorAll('.edDow:checked')].map(x=>Number(x.value));
    if(g('#edStartDate'))m.during.start_date=g('#edStartDate').value;
    if(g('#edEndDate'))m.during.end_date=g('#edEndDate').value;
    if(g('#edStartTime'))m.during.start_time=g('#edStartTime').value;
    if(g('#edEndTime'))m.during.end_time=g('#edEndTime').value;
    // stacking
    if(g('#edStackable'))m.using.stackable=g('#edStackable').checked;
    if(g('#edPriority'))m.using.priority=g('#edPriority').value;
    if(g('#edMaxStack'))m.using.max_stack=g('#edMaxStack').value;
    if(g('#edExclGroup'))m.using.exclusive_group=g('#edExclGroup').value;
  }

  // ---- value cell rendering / reading (typed by allowlist value_type + operator) ----
  function condValueCellHtml(def,op,field,value){
    const vt=def.value_type;
    const catKind=STUDIO_CONDITION_CATALOG[field];
    if(vt==='catalog_ref'&&catKind){
      const opts=(cat&&cat.byKind[catKind])||[];
      const multi=(op==='in'||op==='not_in');
      const sel=multi?(Array.isArray(value)?value:[]):(value||'');
      return `<select class="edCondVal" ${multi?'multiple size="3"':''}>${multi?'':'<option value="">Choose…</option>'}${opts.map(o=>`<option value="${esc(o.id)}" ${multi?(sel.includes(o.id)?'selected':''):(sel===o.id?'selected':'')}>${esc(o.name)}</option>`).join('')}</select>`;
    }
    if(vt==='boolean')
      return `<select class="edCondVal"><option value="true" ${value===true?'selected':''}>yes</option><option value="false" ${value===false?'selected':''}>no</option></select>`;
    const isMoney=/_cents$/.test(field);
    const step=isMoney?'0.01':'1';
    if(op==='between'){const a=Array.isArray(value)?value[0]:'';const b=Array.isArray(value)?value[1]:'';
