.customer-merchant-hero .customer-programme-logo{width:66px;height:66px;margin-bottom:18px;background:rgba(255,255,255,.94);color:var(--merchant-accent,var(--coral));box-shadow:var(--shadow)}
.customer-merchant-hero h1{font-size:clamp(2rem,6vw,3.25rem);line-height:1.02;letter-spacing:-.045em;overflow-wrap:anywhere;word-break:break-word}.customer-merchant-hero p{color:rgba(255,255,255,.86);line-height:1.55;margin-top:8px}
.customer-balance-panel{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,.75fr);gap:14px;margin-top:14px}
.customer-balance-panel.customer-balance-panel-single{grid-template-columns:minmax(0,560px)}
.customer-balance-value{font-size:clamp(1.85rem,5vw,2.6rem);font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.customer-tier-track{height:10px;margin-top:13px;border-radius:999px;background:var(--hair);overflow:hidden}.customer-tier-track span{display:block;height:100%;width:var(--tier-progress,0%);border-radius:inherit;background:var(--merchant-accent,var(--coral));transition:width .25s var(--ease)}
/* v186 tier ladder. Every tier stays fully legible; the ones that are not yours are drained of
   colour and dimmed, which reads instantly as "not mine" without hiding a single benefit. The
   state pill carries the same meaning in words, so greyscale is never the only signal. */
.customer-theme-choice{display:grid;gap:8px;margin-top:12px}
.customer-theme-option{display:flex;align-items:flex-start;gap:10px;margin:0;padding:12px 14px;border:1px solid var(--control-border);border-radius:var(--r-sm);background:var(--card);color:var(--ink);font-weight:500;font-size:14px;cursor:pointer}
.customer-theme-option input{width:20px;min-width:20px;min-height:20px;margin-top:1px}
.customer-theme-option:has(input:checked){border-color:var(--coral);background:var(--tint)}
.customer-tier-ladder{border-top:1px solid var(--hair);padding-top:14px}
/* V192 (owner: tiers should read Basic -> Gold -> Diamond left to right, not stacked). Side by
   side makes the ladder legible as a progression at a glance. auto-fit with a 200px floor so a
   phone still stacks them rather than crushing three columns into an unreadable strip. */
.customer-tier-rungs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px;padding:0;list-style:none;counter-reset:tier;align-items:stretch}
.customer-tier-rung{padding:12px 14px;border:1px solid var(--hair);border-radius:var(--r-sm);background:var(--card);filter:grayscale(1);opacity:.62;transition:opacity var(--motion-ui) var(--ease),filter var(--motion-ui) var(--ease)}
.customer-tier-rung.is-achieved{opacity:.78}
.customer-tier-rung.is-current{filter:none;opacity:1;border-color:var(--merchant-accent,var(--coral));background:var(--tint);box-shadow:var(--shadow)}
.customer-tier-rung .rec-why{margin-top:6px}
@media(prefers-reduced-motion:reduce){.customer-tier-rung{transition:none}}
.wallet-history-disclosure{margin-top:14px;padding:0;overflow:hidden}.wallet-history-disclosure>summary{display:flex;align-items:center;gap:10px;min-height:56px;padding:16px 18px;cursor:pointer;font-weight:750;list-style-position:inside}.wallet-history-disclosure>summary .muted{font-weight:500}.wallet-history-disclosure[open]>summary{border-bottom:1px solid var(--hair)}.wallet-history-disclosure-body{display:grid;gap:14px;padding:14px}.wallet-history-disclosure .wallet-section{margin:0;box-shadow:none}
.customer-perks-grid,.customer-offers-grid,.customer-rewards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px;margin-top:12px}
.customer-perk-card,.customer-offer-card,.customer-reward-card{overflow:hidden;min-height:120px;padding:16px;border:1px solid var(--hair);border-radius:15px;background:#fff}
.customer-feature-card{min-height:0}
.customer-feature-card b{display:block}
.customer-feature-image{width:100%;height:120px;object-fit:cover;border-radius:16px;margin-bottom:12px;background:var(--wash);border:1px solid var(--line)}
.customer-feature-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px}
.customer-feature-meta .pill{font-size:11px}
.customer-perk-card img,.customer-offer-card img,.customer-reward-card img{width:calc(100% + 32px);height:132px;margin:-16px -16px 14px;object-fit:cover;background:var(--bg)}
.customer-section-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:24px}.customer-section-title h2{font-size:22px}
.customer-programme-compact-head{display:flex;align-items:center;gap:12px;min-width:0;padding:14px 16px;border:1px solid var(--hair);border-radius:18px;background:#fff;box-shadow:var(--shadow);margin-bottom:16px}
/* v194 identity + booking in the programme header, and Tier / Reward points as tabs. */
.customer-programme-identity{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:0;border:0;background:none;text-align:left;color:inherit}
.customer-programme-identity .customer-programme-compact-copy{display:block}
.customer-programme-identity b{display:block;font-size:clamp(1.15rem,3.6vw,1.5rem);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.customer-programme-identity-hint{color:var(--coral)!important;font-weight:600}
/* v286 (audit: the mobile header lost its only affordance). Hiding this hint at 560px left the
   row as a logo plus a name — no chevron, no tier, nothing saying the header opens the company
   sheet with the address and phone the v194/v195 owner annotation asked for. The long wording
   is what does not fit at 390px, not the affordance, so the short label and the tier stay. */
.customer-programme-identity-hint-short{display:none}
.customer-programme-book{flex:0 0 auto}
/* v326 (owner mockup: cover photo, logo, name, Book now on the photo; phone/address/branch as
   their own lines below). Two-classes-on-one-element beats the base .customer-programme-compact-head
   flex/padding rules on specificity alone, at every viewport, so the 760px mobile padding
   override above keeps working unmodified. */
.customer-programme-compact-head.customer-programme-compact-head-v326{display:block;padding:0;gap:0;overflow:hidden}
.customer-programme-cover-v326{position:relative;min-height:104px;padding:14px 16px;display:flex;align-items:flex-end;background:var(--merchant-cover,none) center/cover no-repeat,linear-gradient(135deg,var(--merchant-accent,#28212f),color-mix(in srgb,var(--merchant-accent,#28212f) 55%,#17161a))}
.customer-programme-cover-v326::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,13,18,.05),rgba(15,13,18,.58));pointer-events:none}
.customer-programme-head-row-v326{position:relative;z-index:1;display:flex;align-items:center;gap:12px;width:100%}
.customer-programme-head-row-v326 .customer-programme-identity{flex:1;min-width:0}
.customer-programme-head-row-v326 .customer-programme-identity b,.customer-programme-head-row-v326 .customer-programme-identity-hint{color:#fff}
.customer-programme-head-row-v326 .customer-programme-logo{background:rgba(255,255,255,.94);box-shadow:var(--shadow)}
.customer-programme-head-row-v326 .customer-programme-book{background:#fff;color:var(--ink);box-shadow:none}
.customer-programme-contact-v326{padding:12px 16px 14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.customer-programme-contact-v326 .customer-programme-contact-more-v326{flex:1 1 auto;min-width:0}
.customer-programme-contact-line-v326{display:flex;align-items:center;gap:6px;min-width:0}
.customer-programme-contact-line-v326 a{color:inherit}
.customer-programme-contact-more-v326{border:0;background:none;padding:0;margin-top:2px;color:var(--coral);font-weight:600;font-size:.85rem;text-align:left;cursor:pointer}
.customer-programme-tabs{margin-bottom:14px;padding:0}
.customer-programme-tablist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:6px;border-bottom:1px solid var(--hair)}
/* V300: how many times a reward has actually been redeemed, on its card. */
.reward-card-redeemed-v300{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
/* V300: the customer's own referral code — dashed coupon treatment so it reads as a thing
   you hand to a friend, not as data. */
.customer-referral-code-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.customer-referral-code{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border:1.5px dashed var(--coral);border-radius:12px;background:var(--tint);color:var(--coral);font-size:1.3rem;font-weight:750;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.customer-referral-count{margin-top:10px}
/* V299: when a firm runs tiers AND spendable points, the balance is visible on the tab bar
   itself — the customer's number one fact must not hide behind the unselected tab. */
.customer-programme-tablist--with-balance{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
.customer-programme-tab-balance{display:inline-flex;align-items:baseline;gap:4px;align-self:center;padding:0 10px 0 6px;font-weight:750;font-size:14.5px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.customer-programme-tab-balance small{font-weight:600;font-size:11px;color:var(--muted);letter-spacing:0}
.customer-programme-single{padding:16px}
.customer-programme-single-head{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:16px}
.customer-programme-single .customer-tier-now{margin-top:14px}
.customer-programme-single-head svg{flex:none;color:var(--coral)}
.customer-programme-tab{display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;border-radius:11px;background:transparent;color:var(--ink2);font-weight:650;letter-spacing:-.01em}
.customer-programme-tab svg{flex:none}
.customer-programme-tab[aria-selected="true"]{background:var(--tint);color:var(--coral)}
#customerProgrammePanel{padding:16px 18px 18px}
.customer-programme-rewards{margin-top:14px;padding-top:14px;border-top:1px solid var(--hair)}
.customer-programme-rewards-lede{margin-bottom:10px}
.customer-programme-balance{font-size:clamp(1.6rem,6vw,2.1rem);line-height:1;letter-spacing:-.03em}
.customer-programme-balance span{font-size:.85rem;font-weight:600;letter-spacing:0}
/* V310 (W4b) — the programme stack. One card per programme the firm runs, fixed order, identical
   three slots per card. The tab rules above are NOT retired: they are what the pre-v310 fallback
   path renders for the whole Cloudflare window and on rollback. */
.customer-programme-stack{display:grid;gap:9px;margin-bottom:10px}
/* nestly_v415 (owner, photo 5: "fix the alignment issues, not able to scroll fully and words and
   buttons got cut off").
   MEASURED, not guessed: at a 390px viewport the programme page's documentElement.scrollWidth was
   803px, and section.customer-programme-card-v310 measured 803px wide inside it. The card is a
   GRID ITEM of .customer-programme-stack, and a grid item's default min-width is `auto`, so it
   refuses to shrink below its content's minimum — and its content is the rewards carousel, whose
   four 280px cards want 1150px. The column grew to fit them, the card grew with it, and the whole
   PAGE became horizontally scrollable. That is exactly what the owner photographed: the app bar
   is fixed and stays put while everything under it slides left, so the heading loses its first
   letter, the lede loses its last words, and the cards run off both edges.
   min-width:0 lets the column be the width of the viewport again; the carousel then scrolls
   INSIDE it, which is what the swipe was always meant to do. The same floor is put on the two
   elements between the card and the track so no future child can re-open the same hole.
   Re-measured after: scrollWidth 390 at 390, 412 at 412, and the track still scrolls to 1150. */
.customer-programme-stack>*{min-width:0}
.customer-programme-rewards{min-width:0}
.customer-programme-card-v310{padding:13px 16px 15px;margin:0}
.customer-programme-card-head-v310{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:16px}
.customer-programme-card-head-v310 svg{flex:none;color:var(--coral)}
.customer-programme-card-line-v310{margin-top:8px}
.customer-programme-paused-since{margin-top:4px;font-variant-numeric:tabular-nums}
/* The stamp ring row. Filled = solid fill AND a tick glyph; empty = dashed outline. Both signals
   are carried without colour, so the row reads in greyscale and to a colour-blind eye — the same
   rule the v186 tier ladder already follows. Wraps rather than scrolls: a row the thumb has to
   drag sideways hides the goal, which is the one thing this figure exists to show.
   nestly_v463 (owner ruling R3c, 2026-08-23): it wraps at exactly FIVE now, not at whatever the
   card happens to be wide. This is the same row the workspace stamp editor draws (five fixed
   tracks since v449) and the same row the red hero draws, so all three show one card the same
   shape: 15 is three rows, 12 is 5/5/2, 6 is 5+1. The hero's own copy of this row already used
   repeat(5,26px) — see .customer-business-stamp-figure-v386 below — so this brings the detail
   page into line with a rule the surface was already half following.
   5x30 + 4x7 = 178px, inside the 390px the customer shell caps .wallet-inner at at every viewport,
   so five tracks can never make this row overflow its card. */
.customer-programme-stamp-rings{display:grid;grid-template-columns:repeat(5,30px);justify-content:start;gap:7px;margin:2px 0 2px}
.customer-programme-stamp-ring{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;border:2px dashed var(--line);color:transparent;background:transparent;transition:background-color .18s ease,border-color .18s ease}
.customer-programme-stamp-ring.is-filled{border-style:solid;border-color:var(--coral);background:var(--coral);color:#fff}
.customer-programme-stamp-ring.is-goal{border-width:2.5px;border-color:var(--coral);box-shadow:0 0 0 3px var(--tint)}
.customer-programme-stamp-ring svg{display:block}
.customer-programme-stamp-count{font-size:clamp(1.6rem,6vw,2.1rem);line-height:1;letter-spacing:-.03em}
.customer-programme-stamp-count span{font-size:.85rem;font-weight:600;letter-spacing:0}
@media (prefers-reduced-motion:reduce){.customer-programme-stamp-ring{transition:none}}
/* The claimable-now strip: absent unless something really is claimable, so it never becomes
   furniture the eye learns to skip. */
.customer-claimable-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;padding:10px 14px;border:1.5px solid var(--coral);border-radius:14px;background:var(--tint)}
.customer-claimable-strip-label{display:inline-flex;align-items:center;gap:6px;color:var(--coral)}

/* v192 (owner: "the promotion content occupies more than a screen — i need it to be smaller").
   The artwork is still never cropped and never painted over: object-fit:contain only SCALES it,
   so an EDM with its words baked in stays whole — just smaller in the list. Full size is one tap
   away in the offer sheet, which is what that sheet is for. */
.customer-promotion-card{position:relative;overflow:hidden;border-radius:18px;background:#17161a;color:#fff;box-shadow:0 12px 30px rgba(23,22,26,.16);display:flex;flex-direction:column}
/* Uploaded promotion artwork is the business's own marketing creative — often an
   EDM with its words baked in. Never crop it and never paint anything over it:
   contain at natural ratio (height-capped) with the card's copy strictly below.
   Only the no-photo fallback keeps a fixed ratio and decorative gradient. */
/* ---- nestly_v417: ONE offer-card format ------------------------------------------------------
   Owner, photos 1, 3 and 4:
     "picture not max out ... i want uploaded photo full to picture"
     "why here have big empty space"
     "even when two offers photo are different size, pls simplify to one fixed size/format so it
      appears uniform in customer app"
   THIS REVERSES A STATED RULE, deliberately. The cards were object-fit:contain under an explicit
   promise — "Your photo is always shown whole — never cropped or covered" — so a 4:5 poster in a
   16:9 frame was letterboxed, which is the empty space in photo 1, and two offers with different
   source ratios produced two differently shaped cards, which is photo 4. Filling the frame means
   cropping, and the owner has chosen that; the workspace's own upload help now says so instead of
   promising the opposite.
   Scoped to the CARD only. Opening an offer still shows the photo WHOLE — the detail dialog and
   the full-page offer view keep object-fit:contain — so nothing a firm designed is ever lost,
   it is only framed consistently in the list. */

   Owner, photo 8: the carousel crossed out — "i don't want this page to scrollable to left like

/* nestly_v422: the narrow template names TWO rows, and the action sat in row 2 — so the name, the
   cost and the description, which are auto-placed, landed in implicit rows 3 and below and the
   button rendered ABOVE the reward it claims (measured on origin/main at 390px: action top 130,
   name top 180). It was invisible until now because a card only carries that button when the
   reward is claimable, and until v422 this list was mostly cards that were not. Now every card on
   the Available tab has one. The action row is dropped from the template so the button
   auto-places after the copy, where it belongs; the wide layout below is untouched and still puts
   it on the row's own line. */
.wallet-rewards.customer-rewards-carousel-v337 .wallet-reward{max-width:none;
  display:grid;grid-template-columns:64px minmax(0,1fr);grid-template-areas:'photo copy';

   was its own grid row, so the 64px photo — pinned to row 1, which the pill only needs 26px of —
   stretched that first row to 64 and pushed the name (row 2) clear of the pill. The gap was the
   photo's height leaking into the copy column.
   A CSS-only span does not fix this: negative row indices resolve against the EXPLICIT grid,
   which `grid-template-areas:'photo copy'` gives exactly ONE row, so `grid-row:1/-2` silently
   collapses back to row 1. The copy is therefore ONE grid cell now (.customer-reward-copy-v492),
   which is what it always was semantically: the row's height is the copy's own height, the photo
   sits at the top of it, and the lines inside space themselves by their own margins.
   The actions row stays a separate child spanning both columns, so the full-width QR button is
   unchanged. */
.customer-rewards-carousel-v337 .customer-reward-copy-v492{grid-area:copy;min-width:0}

.customer-rewards-carousel-v337 .wallet-reward>:not(.customer-reward-photo-v340):not(.customer-reward-card-head-v339):not(.wallet-reward-actions){grid-column:2}
.customer-rewards-carousel-v337 .wallet-reward-actions{grid-column:1/-1;margin-top:8px}

/* ---- nestly_v446 (REG-002): the three-column row asks the ROW how wide it is -----------------
   WAS `@media(min-width:641px)`. The viewport is not what this layout depends on: the customer
   shell caps `.wallet-inner` at 390px at every viewport, so the row's own box is 324px on a phone
   and 324px on a 1440px monitor. Above 640 the browser was therefore asked to fit
   `64px minmax(0,1fr) auto` into 324px. The `auto` action track sizes to the claim button's
   max-content and takes it; the copy track, floored at 0 by `minmax(0,1fr)`, is left with the
   remainder. MEASURED on origin/main at 834/1024/1180/1440: `64px 31.1406px 174.859px` — a 31px
   copy column, so `.customer-reward-name-v339`'s overflow-wrap:anywhere shattered "Free Kopi Set
   Breakfast Platter" into ten lines, the description into twelve, and the nowrap "Ready to claim"
   pill spilled 60px across the claim button. Nothing about that is a wide-screen refinement; it is
   a layout that never fitted the box it was applied to.
   A container query asks the question that actually decides the answer, so the row is deliberate
   at EVERY width: three columns when the ROW is wide enough to hold them, stacked when it is not.
   Today the shell's cap means "not", at 390 and at 1440 alike — the phone layout is now the
   layout, rather than an accident of being under 641px. Lift the cap and the wide row returns on
   its own.
   460px is the floor at which all three fit: 64 photo + 24 gaps + 26 padding + the button's
   ~175px max-content still leaves the copy column over 170px. `minmax(9rem,1fr)` is the second
   guard and the important one — whatever a longer button label or a future track does, the copy
   column can never be squeezed below a readable measure again. */
@container rewardrow (min-width:460px){
  .wallet-rewards.customer-rewards-carousel-v337 .wallet-reward{
    grid-template-columns:64px minmax(9rem,1fr) auto;grid-template-areas:'photo copy action';align-items:center}
  .customer-rewards-carousel-v337 .wallet-reward-actions{grid-area:action;margin-top:0}
  .customer-rewards-carousel-v337 .wallet-reward-actions .btn{width:auto}
}

/* nestly_v471 (owner, photo 1: the gallery cards ringed, "misalignment" written beside them).
   MEASURED at the 552px form card, which is the width the owner photographed: the grid resolves
   to two 187.5px tracks, so a card's content box is 165.5px — and this row's min-content width is
   185px (44 + 44 + 79 for the three buttons, plus 3x6px gaps). It is a nowrap flex, so it did not
   shrink; it overflowed its card by 19.5px and painted "Remove" across the card beside it, which
   is the misalignment in the photo. The same overflow pushed the row under "Add photo".
   Wrapping drops the row's min-content width to its widest single button (79px), so it fits at
   every column width the auto-fill grid can produce. The buttons are NOT made smaller: 44px is
   the tap target the low-literacy-first rule in CLAUDE.md sets, and shrinking them to win one
   line would trade a real usability guarantee for a cosmetic one. min-width:0 on the card's
   children stops the same thing happening to a long caption. */

.customer-home-offers{margin:0 0 12px}.customer-home-offers-track{gap:12px;margin:0 -16px;padding:0 16px 12px;scroll-padding-inline:16px}.customer-home-offer{flex:0 0 min(72vw,288px)!important;min-height:266px!important;height:266px;border-radius:20px;overflow:hidden}/* nestly_v395 (owner photo 2: "picture too small", drawn across the whole top strip of the card). The artwork had 82px of a 214px card — and because V371 correctly letterboxes it rather than cropping, a landscape photo shrank to a thin band with empty gutters either side. The media block takes 130px now and the card grows to match, so the picture is the thing the customer sees first. object-fit:contain is untouched: the merchant's image is still never cropped. *//* nestly_v417: one ratio at every width — three different ones WERE the unevenness. */.customer-home-offer-copy{position:relative;min-height:auto;height:136px;padding:24px 10px 12px}.customer-home-offer-copy::before{top:-22px;height:50px;background:var(--peekaa-card)}.customer-home-offer-logo{position:static;top:auto;left:auto;flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:5px solid var(--peekaa-card);box-shadow:var(--shadow-warm)}.customer-offer-new{top:9px;left:10px;min-height:24px;padding:0 10px;font-size:12px}.customer-home-offer-copy h3{font-size:15px!important;line-height:1.02!important;font-weight:760;letter-spacing:0;color:var(--peekaa-text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}/* v386 (owner photo 1, "put company name"): this rule was written to drop the validity line, which is a direct child <p class="muted small">, but .muted also matches the business-name <span> NESTED inside .customer-home-offer-business — so the card painted a merchant avatar with no merchant beside it. Scoped to direct children, which is the set it was always meant to hide. */.customer-home-offer-copy>.muted{display:none}/* v386 fix-2 (owner: "i still dont see the company name"). Un-hiding the name was not enough: it sat in flow BELOW the title, in the 38px strip the absolutely-positioned "Ends in N days" pill occupies, so the pill painted straight over it (elementFromPoint at the name's centre returned the countdown). The name is now the FIRST line of the copy block, indented clear of the 46px avatar so it reads beside it — which is exactly where the owner drew it — and the copy block became a flex column so `order` can hoist it without moving it in the markup (the desktop/tablet layouts keep the original order). */.customer-home-offer-copy{display:flex;flex-direction:column}/* nestly_v395 (owner photo 2: the avatar and the name ringed together, "move here" with an arrow pointing to the right of the avatar). v386 hoisted the name to the first line of the copy with order:-2 and meant it to sit BESIDE the 46px avatar, but the avatar is position:absolute at top:-30px while the name stayed in flow — so the name began exactly where the avatar ended and read as a caption UNDER it. The row is pinned to the avatar's own box now (same top/left origin, same 46px height) and indented past it, so the two read as one line: coin, then name. Out of flow, so the copy column below is unaffected and nothing can reflow into it. */.customer-home-offer-business{position:absolute!important;top:-30px;left:10px;right:10px;z-index:2;margin:0;min-height:46px;height:46px;display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.05em;color:var(--peekaa-text-secondary);font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.customer-home-offer-meta{order:-1}.customer-home-offer-copy h3{order:0;flex:0 0 auto}/* The countdown is a line of the copy now (see customerHomeOfferMarkupV167), so it sorts after the title rather than floating over the artwork. */.customer-home-offer-copy>.customer-home-offer-countdown{order:1;align-self:flex-start;margin-top:8px}
/* v400 (owner-diagnosed clip): the chip used to be position:absolute with its own top/right,

   visually occupied — the box stayed a fixed 83px regardless of content, so "Ends in 4 days"
   rendered as "Ends in 4" and the rest was clipped. The chip has been a normal static flex child
   ever since, sized by its own content like any inline-flex pill elsewhere in the app, and that is
   what nestly_v395 carried down into the copy block: the absolutely-positioned slot that used to

   Slots wrap over rows; past 30 slots the cells step down a size rather than the card hiding any
   of them — the owner's ruling, 2026-08-22. Everything is drawn in the hero's own white-on-red
   palette, so no new colour token is introduced.
   nestly_v463 (owner ruling R3c, 2026-08-23): FIVE per row, not auto-fit. auto-fit sized the row
   to whatever the hero happened to be wide, so a 15-stamp card was one long line on the phone the
   owner was holding and the workspace editor beside it — which has been a fixed five-track grid
   since v449 — drew the same card as three rows of five. The merchant and the customer are meant
   to be looking at the same object, so the customer's copy now wraps where the editor's does: 15
   is three rows, 12 is 5/5/2, 6 is 5+1. This is the same change v449 made on the business side and
   it is made the same way — fixed tracks, left-aligned, identical at 390 and at 1440.
   5x28 + 4x8 = 172px, and the compact variant is 5x22 + 4x6 = 134px; both sit well inside the
   390px the customer shell caps .wallet-inner at, so no width can make this row overflow. */

   its fixed repeat(5,28px) tracks, so the card still wraps exactly where the workspace editor's
   grid does — the photo takes the ~154px that were empty beside it, not space from the stamps. */

   Owner ruling: "the NAME takes the space it needs; Directions/Call yield." Two causes, both
   MEASURED on 9a57bac at 390 and 1180:
     (1) the wordy placeholder actions took a 172px track (fixed in app.js — they are icon-only
         now, matching the row the contact read writes over them), and
     (2) even with the approved 106px icon row, `white-space:nowrap;text-overflow:ellipsis` on the
         name clipped anything past ~156px: "Ah Xiang Traditional Kopitiam & Bakery" measured a
         177px box against 347px of content, and a 27-character Tamil name 170px against 263px.
   (2) is the one that cannot be solved by making something else narrower, and it is why this rule
   does not depend on English label widths at all: the name WRAPS instead of being cut. A long
   name costs the header a second line, which is the trade the ruling names. The bio underneath
   keeps its deliberate v417 two-line clamp — that is a description, not an identity. */
.customer-business-header-v346 .customer-business-identity-v346 b{
  white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:break-word}
.customer-business-header-v346 .customer-business-identity-v346{align-items:flex-start}
/* Both actions stay reachable and both reach the 44px the design system sets in --control-h. */
.customer-business-actions-v346 .customer-programme-contact-item-v337{min-height:var(--control-h)!important}

/* --- B-REG-018: the two worst tap targets on the customer surface -----------------------------
   MEASURED: "View all ›" 62.8x16.8 and "See all" 45.3x16.8 — under half the 44px --control-h sets,
   on a product whose brief is explicitly big-tap-target, low-literacy-first. Real height, not a
   pseudo-element expander: an invisible 44px overlay centred on a 17px line reaches ~14px past a
   10px margin and would sit on top of the first card's own links, which is the overlap class this
   wave has just spent its time removing. The section head grows by ~23px; nothing else moves. */
.customer-home-section-head-v343 a,.customer-home-offers-head a,.customer-business-offers-head-v349 a{
  display:inline-flex;align-items:center;gap:2px;min-height:44px}
/* The reward-directory filter chips measured 36px tall. */
.customer-rewards-filter-chip-v395,.customer-rewards-filter-chips-v344 span{min-height:44px}

/* V167 Phase 4: customer-only system dark mode. Merchant/admin surfaces retain their
   established light palette. The redemption QR intentionally stays on a light scan surface. */
.customer-surface{min-height:100dvh;background:var(--bg);color:var(--ink)}
/* v176: customer modals opt into the dark token scope but must keep the scrim, not the page background. */
.modal.customer-surface{min-height:auto;background:rgba(23,22,26,.4)}
html[data-customer-surface="true"] body{background:var(--bg)}
/* v190 (owner: "change the background to same as business background (beige) instead of
   black; light/dark can be adjusted in the profile module"). The customer surface used to flip
   to dark purely because the DEVICE was in dark mode, so one person saw a beige workspace and a
   black wallet on the same phone. Beige is the default for everyone now; these tokens apply
   only when the customer has chosen dark — or chosen to follow their device — in
   Profile → Appearance, which is what sets data-customer-theme on <html>. */
html[data-customer-theme="dark"][data-customer-surface="true"] body{background:#0F1115}
  /* The offer-detail sheet is appended to body, outside .customer-surface,
     so it must join the dark token scope explicitly. */
html[data-customer-theme="dark"] .customer-surface,
html[data-customer-theme="dark"] .customer-offer-detail-modal .modal-card,
html[data-customer-theme="dark"] .customer-business-detail-modal .modal-card{
    color-scheme:dark;
    --bg:#0F1115;--card:#191C22;--ink:#F7F4EF;--ink2:#D8D2CA;--muted:#AAA3AD;--muted-on-soft:var(--muted);
    --line:#343841;--control-border:#737A86;--hair:rgba(255,255,255,.11);
    --coral:var(--brand-red-on-dark);--coral-hover:var(--brand-red-on-dark-2);--amber:#F2C078;--green:#78D5A7;--red:#FF9E95;
    /* A FILLED brand surface keeps the deeper gradient. --brand-red-on-dark exists to carry brand
       red as TEXT or an icon on a dark ground; white on #E4776B measures 2.9:1, so a button painted
       with it fails the label it carries. #C24135 under white is 5.8:1 and still reads as Peekaa. */
    --grad:linear-gradient(135deg,var(--brand-red),var(--brand-red-dark));--tint:#3A211F;
    --brand-red-soft:var(--brand-red-soft-on-dark);--brand-red-faint:var(--brand-red-faint-on-dark);
    --brand-red-on-soft:var(--brand-red-on-dark);
    /* ===== the semantic pairs get dark GROUNDS, not light ones ===============================
       Wave 1 introduced one colour pair per meaning; this block was written before it, so a
       "Ends soon" chip painted #FFF3D6 and an "Appointment" pill painted #E7F6EE straight onto a
       #191C22 card. Dark inverts the pair — a deep desaturated ground carrying light type — rather
       than dimming the light one, which would have kept dark text on a pale plate. */
    --success:#78D5A7;--success-bg:#183A2D;
    --danger:#FF9E95; --danger-bg:#432321;
    --warn:#F2C078;   --warn-bg:#4A3816;
    --neutral-bg:#292C33;
    --gold:#E3C173;   --gold-bg:#3D3218;
    --bg-cust:#0F1115;--head-tint:#20242C;
    --shadow:0 1px 2px rgba(0,0,0,.2),0 5px 16px rgba(0,0,0,.24);
    --shadow-lg:0 3px 8px rgba(0,0,0,.28),0 20px 52px rgba(0,0,0,.4);
    /* Warm shadows are cast in a brown ink at 5-11% alpha — literally invisible over #0F1115.
       Dark separates surfaces with a deeper, blacker shadow; the brand glow keeps its hue but needs
       roughly double the alpha to register at all. */
    --shadow-warm:0 1px 2px rgba(0,0,0,.34),0 8px 24px rgba(0,0,0,.36);
    --shadow-warm-lg:0 4px 10px rgba(0,0,0,.42),0 18px 44px rgba(0,0,0,.48);
    --glow-brand:0 8px 26px rgba(194,65,53,.5);
    /* ===== the --peekaa-* aliases are NOT self-following — measured, not assumed ==============
       At :root they read `--peekaa-card:var(--card)`, and a custom property containing var() is
       substituted at computed-value time ON THE ELEMENT THAT DECLARES IT. :root is light, so every
       alias froze to its light value there and inherited down as a literal; redefining --card on
       this descendant could never move them. Before this block, dark measured --peekaa-card
       #FFFFFF, --peekaa-text #17161A and --peekaa-bg #F8F4F1 — and the V343/V345 customer shell
       paints its page, its cards and its type from exactly those three, so the customer app was
       still light beige under a dark <body>, with dark ink on dark cards where the base tokens did
       reach. They are re-declared HERE, on the element the dark values live on, which is the only
       place the substitution can pick them up. Keep them in step with the base tokens above. */
    --peekaa-bg:#0F1115;--peekaa-card:#191C22;--peekaa-white:#191C22;
    --peekaa-text:#F7F4EF;--peekaa-text-secondary:#AAA3AD;--peekaa-text-muted:#AAA3AD;
    --peekaa-border:#343841;--peekaa-divider:#343841;
    --peekaa-success:#78D5A7;--peekaa-success-bg:#183A2D;
    --peekaa-gold:#E3C173;--peekaa-gold-bg:#3D3218;
    --peekaa-red:var(--brand-red-on-dark);--peekaa-red-dark:var(--brand-red-dark);
    --peekaa-red-soft:var(--brand-red-soft-on-dark);--peekaa-red-faint:var(--brand-red-faint-on-dark);
    --peekaa-red-on-soft:var(--brand-red-on-dark)
  }

  /* v176: doubled class (.customer-surface.customer-surface) + :is() so these dark remaps

html[data-customer-theme="dark"] .customer-surface .customer-home-summary-note{background:linear-gradient(145deg,var(--card) 40%,var(--tint))}

html[data-customer-theme="dark"] .customer-surface .pill.ok{background:#183A2D;color:#8EE0B8}

html[data-customer-theme="dark"] .customer-surface .wallet-skeleton{background:linear-gradient(90deg,var(--bg),#252930,var(--bg));background-size:200% 100%}
/* ---- components written after the token block, which carry light values in their own rules ----
   A token remap cannot reach a literal. Each rule below closes one failure measured by
   tools/qa-sweep/dark-sweep.mjs; all are scoped to the customer dark surface, so light mode and the

/* Wave 2B progress components: the unfilled stamp dot was a WHITE disc with a pale-pink hairline —

html[data-customer-theme="dark"] .customer-surface .cui-stamp-dots-v2b i{background:rgba(255,255,255,.08);border-color:var(--coral)}

html[data-customer-theme="dark"] .customer-surface .cui-progress-track-v2b i{background:var(--coral)}

html[data-customer-theme="dark"] .customer-surface .is-near-goal-v2b{box-shadow:var(--shadow-warm),inset 0 0 0 1.5px color-mix(in srgb,var(--gold) 55%,#000)!important}

html[data-customer-theme="dark"] .customer-surface .customer-booking-date-tile-v344{background:var(--card);color:var(--ink)}
html[data-customer-theme="dark"] .customer-surface .wallet-appt{background:linear-gradient(135deg,var(--card),#20242C)}
html[data-customer-theme="dark"] .customer-surface .customer-programme-compact-head-v339.customer-programme-compact-head-v337{background:var(--card)}
html[data-customer-theme="dark"] .customer-surface .customer-programme-compact-head-v339 .customer-programme-tier-jump-v327{background:#22262E}
/* Filled brand marks: same reasoning as --grad above, plus the white "cutout" rings that separate

html[data-customer-theme="dark"] .customer-surface .customer-nav-scan-fab{background:var(--brand-red)!important;border-color:var(--card)}
html[data-customer-theme="dark"] .customer-surface .customer-inbox-badge{background:var(--brand-red);border-color:var(--card)}

html[data-customer-theme="dark"] .customer-surface .customer-claimable-banner-icon-v337{background:#4A3D1C!important;color:var(--gold)!important}
html[data-customer-theme="dark"] .customer-surface .customer-claimable-banner-kicker-v337,
html[data-customer-theme="dark"] .customer-surface .customer-claimable-strip-label{color:var(--gold)!important}
/* The merchant hero paints a saturated BRAND ground in both themes — it is not a theme surface —

html[data-customer-theme="dark"] .customer-surface .card.customer-business-summary-v346,
