/* ============================================================================
   Frenly design system v2 — "mockup layout, iOS polish" (owner ruling 2026-07-18)
   Principles: 8pt grid · SF-grade type with tight optical tracking · hairline
   borders instead of heavy strokes · layered low-opacity shadows (never one big
   blur) · frosted glass on floating surfaces · springy motion on interaction.
   The wordmark is an image asset, not type — headings run on the system
   (SF on Apple) stack, which is what makes it read as a native app rather than a
   generic web dashboard.
   ============================================================================ */
:root{
  --bg:#F4F2EE; --card:#FFFFFF; --ink:#17161A; --ink2:#3D3B44; --muted:#6B6673;
  --line:#EAE6DF; --control-border:#817B88; --hair:rgba(23,22,26,.06);
  /* ===== BRAND RED — SINGLE SOURCE OF TRUTH (owner ruling 2026-08-18) =====================
     Peekaa red is #C24135. It was previously two colours: the business app used #C24135 and
     the customer app used #F06A4F, with 79 customer rules on one and 45 on the other, so the
     two apps did not read as the same product. Every red below now derives from --brand-red.
     TO CHANGE THE BRAND RED: edit --brand-red and the four --brand-red-* steps ONLY. Nothing
     else in this file hardcodes a brand red. --coral and --peekaa-red are kept as aliases so
     no rule had to be rewritten; both now resolve to the same colour. */
  --brand-red:#C24135;           /* the brand red */
  --brand-red-dark:#9D352C;      /* pressed / hover / gradient end */
  --brand-red-soft:#F7DCD7;      /* selected chip + active nav background */
  --brand-red-faint:#FDEEEB;     /* large tinted surfaces */
  /* Dark surfaces need a lighter accent to stay legible; these are the SAME hue lifted, not a
     second brand. Change these two together with --brand-red above. */
  --brand-red-on-dark:#E4776B;   /* accent text/icons on a dark ground */
  --brand-red-on-dark-2:#F0A199; /* hover step on a dark ground */
  /* ===== LAYOUT BREAKPOINTS (owner ruling 2026-08-18) ==================================
     The workspace shell is governed by TWO thresholds, and only these two:
       <= 768px   compact layout — mobile page padding, stacked page headers, responsive
                  tables, single-column dashboard. iPad portrait (768) sits INSIDE this.
       <= 960px   no room for a persistent sidebar — rail hidden, mobile dock shown.
                  iPad portrait and 11in Pro portrait (834) get the dock; iPad landscape
                  (1024) keeps the rail.
     Before this, four thresholds (760 / 767 / 768 / 960) governed the same decision, which
     left 761-767px and exactly 768px in hybrid states nobody designed: mobile padding with
     a desktop-centred header. Component-local breakpoints (small-phone tweaks, short
     viewports, individual carousels) are deliberately left alone — they are per-component
     decisions, not shell layout. Do not introduce a third shell threshold. */
  --coral:var(--brand-red); --coral-hover:var(--brand-red-dark); --red:var(--brand-red-dark);
  /* ===== ONE-PEEKAA SEMANTIC TOKENS (wave 1, owner-approved 2026-08-19) ==================
     One neutral system and one colour pair per meaning, both apps. The --peekaa-* names
     below became ALIASES of these so no selector had to be rewritten; new code uses the
     canonical names. The retired strays (var(--brand-red) var(--danger) var(--success) var(--success) var(--tint), the warm
     cream cluster, the three customer shadow inks) all resolve to these now. */
  --success:#1F6B48; --success-bg:#E7F6EE;
  --danger:#9D352C;  --danger-bg:#FBEAE7;
  --warn:#8A6D1A;    --warn-bg:#FFF3D6;
  --neutral-bg:#F1EEE9;
  --gold:#D8B15A;    --gold-bg:var(--warn-bg);
  --bg-cust:#F8F4F1;
  --shell:#FCFBF9;   --appbar-bg:rgba(232,227,218,.94);
  --head-tint:#FBF5F0;
  --amber:var(--warn); --green:var(--success);
  --grad:linear-gradient(135deg,var(--brand-red),var(--brand-red-dark));
  --peekaa-red:var(--brand-red);--peekaa-red-dark:var(--brand-red-dark);--peekaa-red-soft:var(--brand-red-soft);--peekaa-red-faint:var(--brand-red-faint);
  --peekaa-bg:var(--bg-cust);--peekaa-card:var(--card);--peekaa-white:var(--card);
  --peekaa-text:var(--ink);--peekaa-text-secondary:var(--muted);--peekaa-text-muted:var(--muted);
  --peekaa-border:var(--line);--peekaa-divider:var(--line);
  --peekaa-success:var(--success);--peekaa-success-bg:var(--success-bg);
  --peekaa-gold:var(--gold);--peekaa-gold-bg:var(--gold-bg);
  /* V299: the one categorical palette for DOM proportion bars (reports, playbooks). */
  --chart-1:#C24135; --chart-2:#1F6B48; --chart-3:#1F5199; --chart-4:#8A5A12; --chart-5:#7A2E9D; --chart-6:#6B6673;
  --tint:#FFF0EC;            /* coral wash for selected/active surfaces */
  /* iOS uses generous, continuous corner radii */
  --r:18px; --r-sm:12px; --r-lg:24px;
  /* Depth = several cheap shadows stacked, not one expensive one */

  --shadow-lg:0 2px 6px rgba(23,22,26,.05),0 18px 44px rgba(23,22,26,.10);

@media(max-width:768px){
  .v150-segment{max-width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .v150-segment::-webkit-scrollbar{display:none}
  .v150-segment button,.v150-segment a{flex:0 0 auto;white-space:nowrap}
  /* The app-bar page title must survive against the Customer-view button: label collapses to its
     icon, the title keeps one readable line (audit P0-9: every route truncated to ~5 chars). */
  .mobile-page-title{flex:1 1 auto;min-width:0}
  .mobile-page-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .appbar a[aria-label="Open customer view"] span{display:none}
  /* The raised Scan-QR circle pushed its label ~8px below the other four nav labels. */
  .customer-primary-nav .customer-nav-scan>span{position:relative;top:-8px}
  /* Label/value metric tables have no column headers; the responsive collapse was stamping every
     cell "DETAILS". The row's first cell IS the label — drop the generic pseudo-label. */
  table[data-responsive="true"] td[data-label="Details"]{display:block}
  table[data-responsive="true"] td[data-label="Details"]::before{content:none}
}
/* Numeric identity cells never break mid-token (audit P0-12b: SKU "CL200" wrapped as CL20/0). */
td[data-label="SKU"],td[data-label="Sell for"],td[data-label="Stock"]{white-space:nowrap}
.ci-tabs-v368{margin:14px 0 4px;max-width:100%;overflow-x:auto}
/* V369 — the tier-benefit editor row and the till's benefit list.
   The editor row is a grid so the kind, its value, the limit, the period and Remove line up
   column-for-column down the list instead of wrapping differently on every row; the preview
   sentence spans the full width underneath. The till list is one benefit per line, inside the
   narrow cart column — it used to lay its blocks out side by side and overflow the page. */
.grow-tier-benefit-row-v365{display:grid;gap:8px;align-items:center;margin-top:8px;
  grid-template-columns:minmax(120px,150px) minmax(140px,1fr) 96px minmax(110px,150px) auto}
.grow-tier-benefit-row-v365 input,.grow-tier-benefit-row-v365 select{width:100%;min-width:0;margin:0}
.grow-tier-benefit-value-v369{display:flex;gap:6px;align-items:center;min-width:0}
.grow-tier-benefit-value-v369 input,.grow-tier-benefit-value-v369 select{flex:1;min-width:0}
.grow-tier-benefit-value-v369 b{flex:none;font-size:13px}
.grow-tier-benefit-preview-v369{grid-column:1/-1;margin-top:-2px}
@media(max-width:900px){
  .grow-tier-benefit-row-v365{grid-template-columns:1fr 1fr;}
  .grow-tier-benefit-row-v365>button{grid-column:2;justify-self:end}
}
/* V372: the container itself must stop being a ROW. V369 made this list "vertical, one benefit
   per line" by styling the rows — but the banner inherits .permission-banner{display:flex}, whose
   default direction is row with no wrap, so every benefit stayed a flex item on one line and ran
   off the right of the screen (owner screenshot, Record sale, Diamond benefits). Styling the
   children could never fix that; the parent's own axis had to change. */
.till-tier-benefits-v369{flex-direction:column;align-items:stretch;flex-wrap:wrap}
.till-tier-benefits-v369 .till-tier-benefit-row-v369{display:flex;gap:10px;align-items:center;
  justify-content:space-between;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--hair)}
.till-tier-benefits-v369 .till-tier-benefit-row-v369>span{display:flex;flex-direction:column;min-width:0;flex:1}
.till-tier-benefits-v369 .till-tier-benefit-row-v369 b{overflow-wrap:anywhere}

/* V200 sub-module tabs. The strip scrolls horizontally rather than wrapping: a wrapped pill strip
   changes height as tabs re-flow, which shifts the whole page under the owner's thumb on the exact
   tap they were aiming at. `flex` on the buttons is off so labels keep their natural width. */
.section-subtabs-v200{display:flex;max-width:100%;margin:0 0 16px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.section-subtabs-v200::-webkit-scrollbar{display:none}
.section-subtabs-v200 button{flex:0 0 auto;white-space:nowrap}
/* V209 staff list groups. The heading carries the count so an owner can see "3 roster only" at a
   glance; the subtitle says what the group MEANS, because "roster only" is jargon until someone
   tells you it means no login and no seat. */
.staff-group-v209+.staff-group-v209{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.staff-group-head-v209{margin-bottom:10px}
.staff-group-head-v209 h3{font-size:1rem;display:flex;align-items:center;gap:8px}
.staff-group-count-v209{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--tint);color:var(--coral);font-size:12px;font-weight:750}
.staff-group-head-v209 p{margin-top:3px}
/* V210 branch scope in the top bar. It sits beside the language picker and stays put: the owner
   asked for it "fixed all the way", because the scope decides what every figure on the page
   means. Hidden below 900px, where the bar is already tight — the profile menu still carries the
   branch NAME there, so the scope is never invisible, only relocated. */
.topbar-branch-scope-v210{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.topbar-branch-scope-v210 select{width:auto;min-width:150px;max-width:220px;min-height:44px;padding:8px 12px;border-radius:999px;font-size:13.5px;font-weight:600}
.topbar-branch-label-v210{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:750}
@media(max-width:900px){.topbar-branch-scope-v210{display:none}}
.profile-branch-readout-v210{display:none}
@media(max-width:900px){.profile-branch-readout-v210{display:block}}
/* V206: the row a notification sent you to. A brief tint, not a permanent one — it is a "here it
   is", and a highlight that never fades becomes noise on the next render. Respects reduced
   motion by simply not animating; the tint still lands. */
.is-notified-v206>td{background:var(--tint)!important;transition:background .5s var(--ease)}
@media(prefers-reduced-motion:reduce){.is-notified-v206>td{transition:none}}
/* V329: persistent "N awaiting confirmation" pill (top right, next to the bell) and the
   urgent banner of unconfirmed requests on the Day calendar. */
.booking-requests-badge-v329{border-color:var(--red)!important;color:var(--red)!important;font-weight:700}
.pending-request-banner{border:2px solid var(--red);margin-bottom:14px}
.pending-request-card{padding:10px 0;border-top:1px solid var(--hair)}
.pending-request-card:first-of-type{border-top:none}
@keyframes pendingRequestPulseV329{0%,50%{box-shadow:0 0 0 4px rgba(157,53,44,.22);background:var(--tint)}100%{box-shadow:none;background:transparent}}
.pending-request-highlight-v329{animation:pendingRequestPulseV329 1.3s ease-out 2;border-radius:10px}
@media(prefers-reduced-motion:reduce){.pending-request-highlight-v329{animation:none;background:var(--tint);border-radius:10px}}
.pending-request-core-v330{font-size:14.5px;font-weight:750;color:var(--ink)}
/* V330: a still-pending request drawn on the calendar grid itself, deliberately styled to read
   as "not real yet" — dashed red border + diagonal stripe, same visual language as a blocked
   window, at a lower z-index than a confirmed .day-timeline-event so a genuine appointment
   always wins the eye if the two ever overlap. */
.day-timeline-pending-v330{position:absolute;left:5px;right:5px;z-index:5;min-height:44px;overflow:hidden;padding:5px 8px;border:2px dashed var(--red);border-radius:7px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--red) 10%,#fff) 0 6px,color-mix(in srgb,var(--red) 18%,#fff) 6px 12px);color:var(--ink);text-align:left;line-height:1.15;cursor:pointer}
.day-timeline-pending-v330:hover,.day-timeline-pending-v330:focus-visible{z-index:9;box-shadow:var(--shadow)}
.day-timeline-pending-v330 span,.day-timeline-pending-v330 b,.day-timeline-pending-v330 small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-timeline-pending-v330 span{font-size:11px;font-weight:750;font-variant-numeric:tabular-nums;color:var(--red)}
.day-timeline-pending-v330 small{margin-top:1px;color:var(--red);font-weight:700}

.icon-whatsapp-v330{color:#25D366}

.loyalty-strip-v235{background:var(--shell);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;font-size:13px;color:var(--ink2)}

   that pushes its control to the bottom, and the labels reserve one consistent line, so every
   input and the Apply/Clear pair share one baseline. */

.build-identity{font-variant-numeric:tabular-nums;white-space:nowrap}
.challenge{margin-top:18px;min-height:82px}.challenge-status{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4}
.challenge-retry[hidden]{display:none}.challenge.challenge-passed{min-height:0;margin-top:0}.challenge-retry{display:inline-flex;align-items:center;min-height:44px;background:none;color:var(--coral);font-size:13px;font-weight:600;padding:6px 0;text-decoration:underline}
.logo{display:inline-flex;align-items:center;min-height:44px}
.brand-logo{display:block;width:auto;height:50px;max-width:126px;object-fit:contain}
.wallet-head>a.logo{display:inline-flex;align-items:center;min-height:44px}
.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px}
.ind{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:14px;text-align:center;cursor:pointer;
  background:#fff;transition:border-color .18s var(--ease),transform .22s var(--spring),box-shadow .2s}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.chip.on{background:var(--tint);color:var(--brand-red)}
/* ---------- shell: light rail (mockup) + frosted top bar, profile TOP-RIGHT ---------- */
.shell{display:grid;grid-template-columns:246px 1fr;min-height:100dvh}
.side{background:var(--shell);border-right:1px solid var(--line);color:var(--ink2);
  padding:max(22px,env(safe-area-inset-top)) 14px max(22px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;min-width:0;
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable}
.side .logo{color:var(--ink);padding:0 10px 22px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:14px;min-height:44px;
  min-width:0;max-width:100%;overflow-wrap:anywhere;
  font-weight:500;margin-bottom:1px;color:var(--ink2);transition:background .14s var(--ease),color .14s}
.nav,.navgroup,.navbody{min-width:0;max-width:100%}
.nav a:hover{background:#F2EFEA;color:var(--ink)}
.nav a.act{background:var(--tint);color:var(--coral);font-weight:600}
/* Icons get their own fixed-width box so every label starts on the same optical
   column, and so flex `gap` actually applies — an emoji sitting in the same text
   node as its label is one flex item, so gap silently does nothing and the icon
   ends up jammed against the word. This is the difference between "looks bought"
   and "looks generated". */
.nav .ic{width:18px;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;
  flex-shrink:0;line-height:1}
.navhead{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:9px 12px;border-radius:10px;font-size:11px;
  font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);cursor:pointer;text-align:left;background:transparent;
  margin-top:12px;transition:color .14s,background .14s}
.navhead:hover{color:var(--ink2)}
.navhead.act{color:var(--ink2)}
.navhead .chev{margin-left:auto;font-size:10.5px;opacity:.9;transition:transform .22s var(--spring)}
.navbody a{padding-left:22px}
.side .foot{margin-top:auto;padding:10px;font-size:12.5px;color:var(--muted)}
/* the right-hand column: sticky frosted app bar above the scrolling page */
.col{display:flex;flex-direction:column;min-width:0}
.appbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:flex-end;
  gap:10px;padding:max(12px,env(safe-area-inset-top)) max(34px,env(safe-area-inset-right))
    12px max(34px,env(safe-area-inset-left));border-bottom:1px solid var(--hair);
  background:var(--appbar-bg);

.profile{position:relative}
.profile .who{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px 6px 6px;border-radius:999px;
  cursor:pointer;background:#fff;border:1px solid var(--hair);box-shadow:var(--shadow);
  transition:transform .2s var(--spring),box-shadow .2s var(--ease)}
.profile .who:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.profile .who:active{transform:scale(.975)}
.profile .who .chev{font-size:9px;color:var(--muted);margin-left:2px}
.profile .avatar{width:30px;height:30px;border-radius:999px;background:var(--grad);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;
  box-shadow:0 2px 6px rgba(194,65,53,.3)}
/* menu now drops DOWN from the top-right chip (was: up from the bottom-left rail) */
.profile .menu{position:absolute;top:calc(100% + 8px);right:0;min-width:212px;
  background:rgba(255,255,255,.86);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border:1px solid var(--hair);border-radius:var(--r-sm);padding:6px;box-shadow:var(--shadow-lg);
  transform-origin:top right;animation:pop .2s var(--spring)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(-6px)}to{opacity:1;transform:scale(1) translateY(0)}}
.profile .menu a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
  color:var(--ink2);font-size:13.5px;font-weight:500;white-space:nowrap}
.profile .menu a:hover{background:#F2EFEA;color:var(--ink)}
.profile-menu-section{padding:8px 12px;border-top:1px solid var(--hair);margin-top:4px}
.profile-menu-section:first-child{border-top:0;margin-top:0}
.profile-menu-section label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:0 0 6px;display:block}
.profile-menu-section input,.profile-menu-section select{min-height:var(--control-h);font-size:14px;border-radius:12px}
.profile-menu-section .row{gap:6px;align-items:center}
.profile-menu-saved{font-size:12px;color:var(--ok);min-height:16px;margin-top:4px}
.business-workspace-switch,.customer-workspace-switch{position:relative}
.business-workspace-switch>summary,.customer-workspace-switch>summary{list-style:none}
.business-workspace-switch>summary::-webkit-details-marker,.customer-workspace-switch>summary::-webkit-details-marker{display:none}
.business-workspace-switch .menu,.customer-workspace-switch .menu{position:absolute;top:calc(100% + 8px);right:0;z-index:42;
  min-width:224px;background:rgba(255,255,255,.94);border:1px solid var(--hair);border-radius:var(--r-sm);
  padding:6px;box-shadow:var(--shadow-lg);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
.business-workspace-switch .menu a,.customer-workspace-switch .menu a{display:flex;align-items:center;min-height:44px;

.business-workspace-switch .menu a:hover,.customer-workspace-switch .menu a:hover{background:#F2EFEA;color:var(--ink)}
/* notification bell — sits left of the profile chip, same frosted-popover language */
.bellwrap{position:relative}
.bellbtn{position:relative;width:44px;height:44px;border-radius:999px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;background:#fff;border:1px solid var(--hair);box-shadow:var(--shadow);
  font-size:16px;transition:transform .2s var(--spring),box-shadow .2s var(--ease)}
.bellbtn:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.bellbtn:active{transform:scale(.94)}
.bellbtn .dot{position:absolute;top:-3px;right:-3px;background:var(--coral);color:#fff;border-radius:999px;
  min-width:16px;height:16px;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  padding:0 3px;box-shadow:0 0 0 2px #fff}
.notif-menu{position:absolute;top:calc(100% + 8px);right:0;width:320px;max-width:calc(100vw - 40px);
  background:rgba(255,255,255,.86);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border:1px solid var(--hair);border-radius:var(--r-sm);padding:8px;box-shadow:var(--shadow-lg);
  transform-origin:top right;animation:pop .2s var(--spring);max-height:420px;overflow-y:auto;z-index:41}
.notif-item{display:block;width:100%;padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;background:transparent;color:inherit;transition:background .14s var(--ease)}
.notif-item:hover{background:#F2EFEA}
.notif-item.unread{background:var(--tint)}
.notif-item .t{font-size:13px;font-weight:600;color:var(--ink)}
.notif-item .b{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.notif-item .ago{font-size:10.5px;color:var(--muted);margin-top:4px}
.notif-empty{text-align:center;padding:24px 12px;color:var(--muted);font-size:13px}
/* global top-bar action cluster — search + everyday actions, sits left of the bell so the
   jobs used all day (find a customer, quick earn, new appointment) are one reach from any route */
.global-actions{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0;margin-right:auto}
.global-search{display:flex;align-items:center;gap:6px;flex:0 1 340px;min-width:0;height:44px;padding-left:13px;
  background:#fff;border:1px solid var(--hair);border-radius:999px;box-shadow:var(--shadow);
  transition:border-color .16s var(--ease),box-shadow .16s var(--ease)}
.global-search:focus-within{border-color:var(--coral);box-shadow:0 0 0 3px rgba(194,65,53,.18)}
.global-search-ic{display:inline-flex;align-items:center;color:var(--muted);flex-shrink:0}
.global-search input{flex:1 1 auto;min-width:0;width:auto;min-height:0;height:42px;border:0;background:transparent;
  box-shadow:none;padding:0 4px;font-size:13.5px;color:var(--ink)}
.global-search input:focus{outline:none;border:0;box-shadow:none}
.global-search-go{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex-shrink:0;
  border-radius:999px;background:var(--grad);color:#fff;box-shadow:0 1px 2px rgba(194,65,53,.2)}
.global-search-go:active{transform:scale(.92)}
.global-quick{display:flex;align-items:center;gap:8px;flex-shrink:0}
.global-act{white-space:nowrap}.global-act svg{flex-shrink:0}
.dashboard-appbar-branch{display:block;flex:0 1 196px;min-width:150px}
.dashboard-appbar-branch select{width:100%;min-width:0;margin:0;background:#fff;box-shadow:var(--shadow);font-size:13px}
.dashboard-mobile-branch{display:none}
.mobile-page-title,.mobile-search-trigger,.mobile-search-sheet{display:none}
.mobile-page-title{min-width:0;align-items:center;gap:9px;font-weight:750;color:var(--ink)}
.mobile-page-title .mobile-page-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--tint);color:var(--coral)}
.mobile-page-title span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mobile-search-trigger{width:44px;height:44px;border-radius:999px;background:#fff;border:1px solid var(--hair);box-shadow:var(--shadow);color:var(--ink2);align-items:center;justify-content:center}
.mobile-search-sheet[open]{display:block;position:fixed;inset:0;z-index:190;background:rgba(23,22,26,.22);padding:max(16px,env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom))}
.mobile-search-panel{margin:0 auto;background:#fff;border:1px solid var(--hair);border-radius:20px;padding:14px;box-shadow:var(--shadow-lg);max-width:520px}
.mobile-search-panel .row{gap:8px}.mobile-search-panel input{font-size:16px}
.mobile-action-sheet{display:grid;gap:10px;padding:8px 6px 12px;border-bottom:1px solid var(--hair);margin-bottom:8px}
.mobile-action-sheet .workspace-language-picker{width:100%;min-width:0;border-radius:12px;font-size:16px}
.mobile-action-sheet .btn{width:100%;justify-content:center}
.mobile-language-label{font-size:11.5px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.mobile-workspace-summary{padding:10px 11px;border:1px solid var(--hair);border-radius:13px;background:var(--shell)}
.mobile-workspace-summary b,.mobile-workspace-summary span{display:block;overflow-wrap:anywhere}
.mobile-workspace-summary .muted{font-size:12px;line-height:1.35}
/* Phone-first staff navigation. The high-frequency jobs stay thumb-reachable while the
   complete, permission-filtered workspace navigation remains available behind More. */
.staff-mobile-dock{display:none}
.staff-mobile-more{position:relative;min-width:0}
.staff-mobile-more>summary{list-style:none}
.staff-mobile-more>summary::-webkit-details-marker{display:none}
.staff-mobile-drawer{position:absolute;right:0;bottom:calc(100% + 10px);width:min(330px,calc(100vw - 24px));
  max-height:min(68dvh,560px);overflow:auto;padding:10px;background:rgba(255,255,255,.97);
  border:1px solid var(--hair);border-radius:18px;box-shadow:var(--shadow-lg);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
.staff-mobile-drawer .nav{display:block}
.staff-mobile-drawer .navhead{margin-top:6px}
.staff-mobile-drawer .navbody a{padding-left:22px}
.staff-mobile-action{min-width:0;min-height:52px;padding:5px 2px;border-radius:12px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:650}
.staff-mobile-action svg{width:20px;height:20px}
.staff-mobile-action.act{color:var(--coral);background:var(--tint)}
.staff-mobile-action:active{transform:scale(.96)}
.team-member-card,.staff-invite-card{padding:11px 0;border-bottom:1px solid var(--line)}
.team-member-card .row,.staff-invite-card .row{gap:8px}
.team-member-main,.staff-invite-main{min-width:0}
.team-member-main b,.staff-invite-main b{overflow-wrap:anywhere}
.staff-invite-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.09em;font-weight:800;color:var(--ink)}
.staff-invite-meta{display:grid;gap:4px;margin-top:7px;color:var(--muted);font-size:12.5px}
.staff-invite-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.staff-invite-actions .btn{min-height:var(--control-h)}
/* settings — tabbed sections so each save has a clear, small scope instead of one long page */
.settings-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line)}
/* Wave 1 (Top-20 #4): the folder-tab (red underline, squared top corners) was one of five
   selected-tab languages. Tabs are now members of the one segmented pattern. */
.settings-tab{min-height:44px;padding:10px 16px;border:0;background:transparent;
  color:var(--muted);font-size:13.5px;font-weight:700;cursor:pointer;border-radius:999px;white-space:nowrap;
  transition:color .14s,background .14s}
.settings-tab:hover{color:var(--ink2);background:var(--neutral-bg)}
.settings-tab[aria-selected="true"]{color:#fff;background:var(--ink)}
.settings-panel[hidden]{display:none}
.settings-save-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.settings-save-row .btn{flex:0 0 auto}
.workspace-logo-editor{display:grid;grid-template-columns:92px minmax(0,1fr);gap:16px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.workspace-logo-preview{width:92px;height:92px;border-radius:24px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;overflow:hidden;font-size:30px;font-weight:800;color:var(--red)}
.workspace-logo-preview img{width:100%;height:100%;object-fit:cover;display:block}
.workspace-logo-fields{min-width:0}
.settings-scope{color:var(--muted);font-size:12px;line-height:1.4;flex:1 1 160px;min-width:0}
.switchrow{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 4px;font-size:12.5px;color:var(--ink2)}
.tglsw{position:relative;width:44px;height:44px;border-radius:999px;background:transparent;cursor:pointer}
.tglsw::before{content:'';position:absolute;left:4px;top:11px;width:36px;height:21px;border-radius:999px;background:var(--line);
  transition:background .18s var(--ease);flex-shrink:0}
.tglsw.on::before{background:var(--green)}
.tglsw::after{content:'';position:absolute;top:13px;left:6px;width:17px;height:17px;border-radius:999px;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s var(--spring)}
.tglsw.on::after{transform:translateX(15px)}
/* universal importer modal */
.modal{position:fixed;inset:0;z-index:210;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(23,22,26,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .18s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:640px;max-width:100%;
  max-height:88vh;overflow-y:auto;padding:26px;animation:pop .22s var(--spring);transform-origin:center}
/* V350 (owner mockup, photo 3): welcome offer modal — icon hero, an icon+label toggle row instead
   of a bare checkbox, card-style radio options with a selected highlight, and a tinted info box.
   V362 (owner, photo 4: "compact, premium SaaS form, not large accessibility-style controls").
   Every control here was oversized: a 22px checkbox rendering as a giant blue square, option cards
   with huge padding, tall inputs, and section gaps ~30% larger than the rest of the admin UI. The
   sizes below are the owner's own numbers. The selected state deliberately changes only colour —
   never size — so a row cannot change height when it is picked. */
.welcome-offer-modal-v350 .modal-card{position:relative;padding:22px}
.welcome-offer-modal-v350 .welcome-offer-close-v350{position:absolute;top:18px;right:18px}
.welcome-offer-modal-v350 h2#welcomeOfferTitleV215{font-size:1.45rem!important}
.welcome-offer-modal-v350 label{font-size:14px}
.welcome-offer-modal-v350 input:not([type="checkbox"]):not([type="radio"]),
.welcome-offer-modal-v350 select{min-height:48px;border-radius:12px;padding:10px 12px;font-size:15px}
.welcome-offer-modal-v350 .welcome-offer-hero-v350{width:46px;height:46px;min-width:46px;flex:none;border-radius:14px;background:var(--tint);color:var(--coral);display:flex;align-items:center;justify-content:center;margin-top:2px}
/* Problem 5 — a compact setting row, not a bordered selection box. */
.welcome-offer-modal-v350 .welcome-offer-togglerow-v350{display:flex;align-items:center;gap:10px;min-height:58px;padding:10px 14px;border:1px solid var(--control-border);border-radius:12px;background:var(--shell);cursor:pointer}
.welcome-offer-modal-v350 .welcome-offer-togglerow-v350>b{flex:1;min-width:0;font-size:15px}
.welcome-offer-modal-v350 .welcome-offer-togglerow-icon-v350{width:28px;height:28px;min-width:28px;border-radius:9px;background:var(--tint);color:var(--coral);display:flex;align-items:center;justify-content:center}
/* Problem 1 — a normal compact checkbox. accent-color keeps the native tick inside the box. */
.welcome-offer-modal-v350 .welcome-offer-togglerow-v350 input[type="checkbox"]{margin-left:auto;flex:none;
  width:20px;height:20px;min-width:20px;max-width:20px;min-height:20px;max-height:20px;
  appearance:auto;-webkit-appearance:checkbox;accent-color:var(--coral);cursor:pointer}
/* Problem 2 — compact selectable rows; colour-only selected state. */
.welcome-offer-modal-v350 .welcome-offer-optioncard-v350{display:flex;align-items:center;gap:12px;
  min-height:76px;padding:16px 18px;border:1px solid var(--control-border);border-radius:12px;margin-top:8px;cursor:pointer}
.welcome-offer-modal-v350 .welcome-offer-optioncard-v350>span{flex:1;min-width:0}
.welcome-offer-modal-v350 .welcome-offer-optioncard-v350 b{font-size:15px;font-weight:650}
.welcome-offer-modal-v350 .welcome-offer-optioncard-v350 p{font-size:13.5px;overflow-wrap:anywhere}
.welcome-offer-modal-v350 .welcome-offer-optioncard-v350 input[type="radio"]{flex:none;margin:0;
  width:20px;height:20px;min-width:20px;max-width:20px;min-height:20px;max-height:20px;
  appearance:auto;-webkit-appearance:radio;accent-color:var(--coral);cursor:pointer}
.welcome-offer-modal-v350 .welcome-offer-optioncard-v350.selected{border-color:var(--coral);background:#FFF6F4}
/* Problem 4 — consistent, tighter section rhythm. */
.welcome-offer-modal-v350 fieldset{margin-top:18px!important}
.welcome-offer-modal-v350 legend.small{margin-bottom:2px}
.welcome-offer-modal-v350 .welcome-offer-infobox-v350{display:flex;align-items:flex-start;gap:8px;margin-top:16px;padding:10px 12px;border-radius:12px;background:#FBF3E7;color:var(--ink);font-size:13px}
.welcome-offer-modal-v350 .welcome-offer-infobox-v350>span:first-child{color:var(--amber);flex-shrink:0;margin-top:1px}
/* V366 — the Birthday gift modal (owner markup, photo 1: oversized checkbox, a double-outlined
   dropdown, oversized radios, and timing options spread too far apart). Every one of those is the
   same root cause: the modal reused the welcome-offer MARKUP but not its class, so its controls

  width:22px;height:22px;min-width:22px;max-width:22px;min-height:22px;max-height:22px;

   around the select; inside this modal focus is a thin coral border with a soft 2px halo. */

/* Issues 3 and 4 — compact selectable rows (~30% tighter) with a normal-sized radio. */

.grow-secondary>summary{display:flex;align-items:center;min-height:56px;cursor:pointer;font-weight:700;color:var(--ink)}
.grow-secondary-body{display:grid;gap:18px;padding:0 0 18px}.grow-secondary-intro{padding:2px 2px 0}
.reward-auto-dialog{display:grid;grid-template-rows:auto minmax(0,1fr) auto;width:min(560px,100%);max-width:560px;max-height:min(92dvh,720px);overflow:hidden}
.reward-auto-head{display:flex;align-items:flex-start;gap:14px}.reward-auto-head>div{min-width:0;flex:1}
.reward-auto-content{min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 2px}
.reward-auto-step{margin-top:18px}.reward-auto-step h3{font-size:18px;margin-top:4px}
.reward-auto-choice{display:flex;align-items:flex-start;gap:12px;min-height:64px;padding:13px;margin-top:14px;border:1px solid var(--coral);border-radius:14px;background:var(--tint)}
.reward-auto-choice input{flex:0 0 auto;width:22px;min-height:22px;margin-top:2px}.reward-auto-choice label{margin:0;color:var(--ink);font-size:14px}.reward-auto-choice p{margin-top:4px}
.reward-auto-summary{display:grid;gap:9px;margin-top:14px}.reward-auto-summary>div{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--hair)}
.reward-auto-summary dt{color:var(--muted)}.reward-auto-summary dd{font-weight:700;text-align:right;overflow-wrap:anywhere}
.reward-auto-actions{position:sticky;bottom:0;z-index:1;display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--hair);background:#fff}.reward-auto-actions .btn{min-height:44px}
.reward-auto-status{min-height:22px;margin-top:12px}.reward-auto-safety{padding:12px;border-radius:12px;background:var(--success-bg);color:#1f6c46;line-height:1.5}
.grow-flow{display:grid;grid-template-columns:1fr;gap:8px;list-style:none;padding:0;margin:0}
.grow-flow-step{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;column-gap:12px;min-width:0;min-height:76px;padding:12px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;box-shadow:var(--shadow)}
.grow-flow-step:not(:last-child)::after{display:none}
.grow-flow-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:var(--tint);color:var(--coral)}
.grow-flow-step h2{font-size:16px;margin:0 0 3px}.grow-flow-step p{font-size:12.5px;line-height:1.45;color:var(--muted);margin:0}
.grow-flow-step h2,.grow-flow-step>p{grid-column:2}.grow-flow-icon{grid-row:1/3}.grow-flow-foot{grid-column:3;grid-row:1/3;display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}.grow-flow-foot .btn{min-height:44px}
.reward-milestone-track{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;list-style:none;margin:14px 0 0;padding:0}
.grow-programme-list{display:grid;grid-template-columns:1fr;gap:0;margin-top:14px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.grow-programme-row{appearance:none;display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-width:0;min-height:72px;padding:12px 14px;border:0;border-bottom:1px solid var(--hair);background:#fff;color:var(--ink);font:inherit;text-align:left;text-decoration:none}
.grow-overview[data-programme-view="list"] .programme-category .grow-programme-list{gap:18px;border:0;background:transparent;overflow:visible}
.grow-overview[data-programme-view="list"] .programme-category .grow-programme-row{min-height:110px;padding:22px 24px;border:1px solid var(--hair);border-radius:18px;background:#fff;box-shadow:0 18px 42px rgba(48,36,28,.08)}
.grow-overview[data-programme-view="list"] .programme-category .grow-programme-icon,
.grow-overview[data-programme-view="list"] .programme-category .reward-milestone-number{width:58px;height:58px;border-radius:999px;background:var(--tint);color:var(--coral)}
.grow-overview[data-programme-view="list"] .programme-category-title{font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink);margin-top:8px}
.grow-programme-row:last-child{border-bottom:0}.grow-programme-row>div{min-width:0}.grow-programme-row b,.grow-programme-row p{overflow-wrap:anywhere}.grow-programme-row p{margin:3px 0 0;line-height:1.4}
.grow-programme-row .rewards-overview-edit-label{min-height:24px;margin-top:3px}
button.grow-programme-row,a.grow-programme-row{cursor:pointer;transition:background .16s ease,box-shadow .16s ease}
/* V173: the Running / To-set-up tab filters set the hidden attribute, but an authored display
   value defeats [hidden]'s UA display:none — these two rules are what make the tabs real. */
.grow-programme-row[hidden]{display:none!important}
.programme-category[hidden]{display:none!important}
.programme-suggest{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px 12px 66px;background:#FFFDF9;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.programme-suggest b{color:var(--ink);font-weight:600}
.programme-suggest[hidden]{display:none!important}
button.grow-programme-row:hover,a.grow-programme-row:hover{background:var(--tint)}
button.grow-programme-row:focus-visible,a.grow-programme-row:focus-visible{position:relative;z-index:1;outline:3px solid rgba(201,67,51,.25);outline-offset:-3px}
.grow-programme-icon{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--coral);font-weight:750}
.grow-programme-meta{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}.grow-programme-action{min-height:44px;display:inline-flex;align-items:center;color:var(--coral);font-size:12px;font-weight:750;white-space:nowrap}
.grow-programme-access{font-size:11px;color:var(--muted);white-space:nowrap}
.rewards-overview-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
.rewards-overview-card{appearance:none;width:100%;min-height:92px;display:flex;gap:11px;align-items:flex-start;padding:14px;
  border:1px solid var(--line);border-radius:14px;background:var(--shell);color:var(--ink);font:inherit;text-align:left;min-width:0}
button.rewards-overview-card{cursor:pointer;transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease}
button.rewards-overview-card:hover{border-color:var(--coral);box-shadow:0 7px 18px rgba(201,67,51,.1);transform:translateY(-1px)}
button.rewards-overview-card:focus-visible{outline:3px solid rgba(201,67,51,.25);outline-offset:2px;border-color:var(--coral)}
.rewards-overview-card>div{min-width:0;flex:1}.rewards-overview-card b,.rewards-overview-card p{overflow-wrap:anywhere}
.rewards-overview-edit-label{display:inline-flex;align-items:center;min-height:44px;margin-top:7px;color:var(--coral);font-size:12px;font-weight:700}
.reward-milestone-track li,.birthday-reward-overview{display:flex;gap:11px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--shell)}
.reward-milestone-number{display:grid;place-items:center;flex:0 0 32px;height:32px;border-radius:50%;background:var(--tint);color:var(--coral);font-weight:700}
.birthday-reward-overview{margin-top:10px}.profitability-product-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px}
.profitability-product-grid article{padding:14px;border:1px solid var(--line);border-radius:14px}.profitability-product-grid dl{display:grid;gap:6px;margin:10px 0}
.profitability-product-grid dl div{display:flex;justify-content:space-between;gap:12px}.profitability-product-grid dt{color:var(--muted);font-size:12px}.profitability-product-grid dd{font-weight:650;text-align:right}
.grow-guide{border:1px solid var(--coral);border-radius:var(--r-sm);background:#fff;padding:0 16px}
.grow-guide>summary,.grow-advanced>summary{display:flex;align-items:center;gap:10px;min-height:52px;cursor:pointer;font-weight:700}
.grow-guide-body{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:0 0 16px}
.grow-guide-step{padding:13px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--tint)}
.grow-guide-step b{display:block;margin-bottom:4px}.grow-guide-step p{font-size:12.5px;color:var(--muted);line-height:1.45}
.grow-guide-step .btn{width:100%;min-height:44px;margin-top:10px}
.grow-draft-note{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-sm);background:var(--success-bg);color:#1f6c46;font-size:13px}
.grow-advanced{border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;padding:0 16px}
.grow-advanced-actions{display:flex;flex-wrap:wrap;gap:10px;padding:0 0 16px}.grow-advanced-actions .btn{min-height:44px}
.grow-optional{display:grid;grid-template-columns:1fr;gap:10px}
.grow-optional-card{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;min-width:0;padding:14px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:#fff}
.grow-optional-card p{margin:4px 0 0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.grow-optional-card .btn{min-height:44px;flex:0 0 auto}
.grow-panel-shell{position:relative;min-height:0}.grow-panel-shell:empty{display:none}
.grow-overview.grow-editor-active>:not(.grow-panel-shell){display:none}
.grow-overview.grow-editor-active .grow-panel-shell{display:block}
.grow-editor-single{grid-template-columns:minmax(0,760px);justify-content:start}
.grow-panel-shell.grow-panel-updating{opacity:.72;pointer-events:none;transition:opacity .18s ease}
.grow-inline-feedback{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:10px 12px;border:1px solid var(--line);
  border-radius:var(--r-sm);background:#fff;color:var(--muted);font-size:13px}
.grow-inline-feedback.ok{border-color:#9ED7BA;background:var(--success-bg);color:#1f6c46}
.grow-section-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grow-section-heading .btn{min-height:44px}
@media(max-width:900px){.grow-guide-body{grid-template-columns:1fr}}
@media(max-width:640px){.grow-hero{padding:18px}.grow-primary{width:100%}
  .reward-auto-dialog{width:100%;max-height:92dvh;border-radius:20px 20px 0 0;padding:20px 18px calc(16px + env(safe-area-inset-bottom))}
  .reward-auto-modal{align-items:flex-end;padding:0}.reward-auto-actions{display:grid;grid-template-columns:1fr}.reward-auto-actions .btn{width:100%}
  .grow-flow-step{grid-template-columns:40px minmax(0,1fr)}.grow-flow-foot{grid-column:1/-1;grid-row:auto;justify-content:flex-start;margin-top:8px}
  .grow-programme-row{grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:8px;padding:10px 11px}.grow-programme-icon,.grow-programme-row .reward-milestone-number{width:36px;height:36px}.grow-programme-meta{grid-column:auto;justify-content:flex-end;align-items:flex-end;flex-direction:column;gap:2px}.grow-programme-action{min-height:24px}
  .grow-flow-foot .btn,.grow-advanced-actions .btn,.grow-optional-card .btn{flex:1 1 100%}
  .grow-optional-card{flex-direction:column;overflow-wrap:anywhere}}
@media(max-height:700px){.reward-auto-dialog{max-height:96dvh;padding-top:14px}.reward-auto-head .muted.small{display:none}.reward-auto-step{margin-top:10px}.reward-auto-summary{gap:5px;margin-top:8px}.reward-auto-summary>div{padding:7px 0}.reward-auto-actions{margin-top:8px;padding-top:8px}}
@media(max-height:700px) and (min-width:641px){.reward-auto-review{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:18px}.reward-auto-review>h3{grid-column:1/-1}.reward-auto-review .reward-auto-summary{grid-column:1}.reward-auto-guardrails{grid-column:2;align-self:start;padding-top:8px}.reward-auto-guardrails .reward-auto-safety{padding:9px}}
@media(max-width:600px){.rewards-overview-grid{grid-template-columns:1fr}.rewards-overview-card{min-height:88px}}
@media(prefers-reduced-motion:reduce){.grow-panel-shell.grow-panel-updating{transition:none}}
/* Program Studio (PS-1A authoring surface) — theme-aware via existing tokens only */
.studio-row{padding:12px 0;border-bottom:1px solid var(--line)}
.studio-row:last-child{border-bottom:none}
.studio-row-main{min-width:0}
.studio-authoring-note{font-style:italic;color:var(--muted)}
.studio-tech{margin-top:8px}
.studio-tech summary{cursor:pointer;color:var(--coral);font-size:12px;font-weight:600;min-height:32px;display:flex;align-items:center}
.studio-tech code{overflow-wrap:anywhere}
.studio-editor{border:1px solid var(--coral)}
.studio-step{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin:12px 0}
.studio-step legend{font-size:12px;font-weight:700;color:var(--muted);padding:0 6px;text-transform:uppercase;letter-spacing:.05em}
.stCond,.stEff{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--hair)}
.stCond:last-child,.stEff:last-child{border-bottom:none}
.stCond>select,.stEff>select{flex:0 1 auto;min-width:130px;min-height:44px}
.edCondValCell,.edEffValCell{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1 1 170px;min-width:0}
.edCondValCell input,.edCondValCell select,.edEffValCell input,.edEffValCell select{min-width:96px;min-height:44px}
.edEffLbl{font-size:12px;color:var(--muted)}
.edDowLbl{display:inline-flex;align-items:center;gap:5px;font-size:13px;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:999px}
.studio-advanced{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.studio-advanced summary{cursor:pointer;font-weight:600;color:var(--coral);min-height:44px;display:flex;align-items:center}
.studio-canon{margin-top:10px}
.studio-pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--tint);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;font-size:11.5px;max-height:220px;overflow:auto;margin-top:6px}
.studio-preview{margin-top:12px}
.studio-preview-card{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:var(--tint)}
.studio-econ{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.studio-econ-line{padding:6px 0;border-bottom:1px solid var(--hair)}
.studio-econ-line:last-child{border-bottom:none}
.studio-ok{color:var(--green);font-weight:600}
/* PS-1C.2 execution-truth surfaces: per-effect state breakdown, rule controls, publish preview */
.studio-effect-states{margin-top:8px;border-top:1px solid var(--hair);padding-top:6px}
.studio-effect-state{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:4px 0;flex-wrap:wrap}
.studio-effect-state>span{font-size:13px}
.studio-rule-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.studio-emg-banner{margin-top:8px;border:1px solid var(--red);background:var(--tint);border-radius:var(--r-sm);padding:8px 10px;font-size:13px}
.studio-impact-rule{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin-top:10px}
.sv-discrep-list,.sv-pause-list{margin-top:4px}
.sv-discrep{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin-top:10px}
.sv-discrep code{overflow-wrap:anywhere}
.studio-impact-eff{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:5px 0;flex-wrap:wrap;border-top:1px solid var(--hair)}
.studio-impact-eff:first-of-type{border-top:none}
.studio-impact-flags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.studio-tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.studio-tag.fin{border-color:var(--red);color:var(--red)}
.studio-tag.cust{border-color:var(--coral);color:var(--coral)}
@media(max-width:520px){.stCond>select,.stEff>select,.edCondValCell,.edEffValCell{flex:1 1 100%}
  .edCondValCell input,.edEffValCell input,.edCondValCell select,.edEffValCell select{flex:1 1 auto;width:100%}}
.spacer{flex:1}
.frontline-card{max-width:460px;margin:0 auto}
.frontline-phone{font-size:34px;text-align:center;height:64px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.frontline-keypad{grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.frontline-keypad .btn{height:60px;font-size:22px;font-weight:700}
.frontline-tenders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.frontline-tenders .btn{min-height:52px;font-size:15px}
.frontline-tenders .btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.till-cart-card{max-width:560px}
.till-cart-catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-top:6px}
.till-cart-catalog .btn,.till-cart-catalog .choice-button{min-height:64px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;padding:10px 12px;font-size:14px;font-weight:600;line-height:1.25}
.till-cart-catalog .btn .till-cart-price,.till-cart-catalog .choice-button .till-cart-price{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.till-cart-catalog .choice-button{position:relative}
.till-cart-catalog .choice-button.has-image{display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:10px;padding-right:40px}
	.till-choice-image,.catalogue-thumb{width:42px;height:42px;border-radius:12px;object-fit:cover;background:var(--wash);border:1px solid var(--line);box-shadow:0 4px 12px rgba(32,24,18,.08)}
	.catalogue-thumb:not(img){display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.till-choice-text{min-width:0;display:flex;flex-direction:column;gap:2px}
.till-cart-catalog .choice-button.is-selected{border-color:var(--coral);background:#FFF3EE;box-shadow:0 0 0 1px rgba(196,61,50,.12)}
.till-choice-qty{position:absolute;top:8px;right:8px;min-width:24px;height:24px;border-radius:999px;background:var(--coral);color:white;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.till-sale-package-options{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--shell);padding:0 12px}
.till-sale-package-options>summary{min-height:46px;display:flex;align-items:center;cursor:pointer;font-weight:750}
.till-sale-package-options[open]{padding-bottom:12px}
/* ===== V373 — one Record sale flow (owner: "too crowded and no tabs to consolidate it") =====
   Phone first: the customer is one line, the things a counter taps are a two-column grid of
   big targets, and the cart never leaves the screen. Everything else is in a bottom sheet. */
.till-flow-v373{padding-bottom:0}
.till-head-v373{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.till-head-id-v373{min-width:0}
.till-head-name-v373{display:block;font-size:1.15rem;font-weight:750;letter-spacing:-.03em;overflow-wrap:anywhere}
.till-head-standing-v373{font-weight:700;color:var(--coral)}
.till-who-v373{margin-top:10px;border-top:1px solid var(--line);padding-top:4px}
.till-who-v373>summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--muted)}
.till-quick-head-v373{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.till-quick-grid-v373{grid-template-columns:repeat(2,minmax(0,1fr))}
.till-cart-catalog .choice-button.till-add-tile-v373{border-style:dashed;background:var(--shell);color:var(--coral);flex-direction:row;align-items:center;gap:10px}
.till-cart-catalog .choice-button.till-add-tile-v373 b{color:var(--ink)}
.till-rewards-v373{margin-top:16px}
.till-stage-tabs-v374{margin:14px 0 4px;max-width:100%}
.till-stage-tabs-v374 button{gap:6px}
.till-stage-tab-count-v374{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;
  border-radius:999px;background:var(--coral);color:#fff;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums}
.v150-segment.till-stage-tabs-v374 button[aria-pressed="true"] .till-stage-tab-count-v374{background:#fff;color:var(--ink)}
.till-stage-panel-v374{min-height:120px}
.till-benefit-auto-v373>span>.muted{color:var(--green)}
/* The cart the owner asked never to have to scroll for. It reports only figures the price check
   returned — the item count is the one number this bar works out for itself. */
.till-sticky-cart-v373{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin:16px -22px 0;padding:12px 22px calc(12px + env(safe-area-inset-bottom));

   declarations was silently losing to the base rule above. The week view therefore inherited

/* v190 (owner: "change the background to same as business background (beige) instead of
   black; light/dark can be adjusted in the profile module"). The customer surface used to flip
   to dark purely because the DEVICE was in dark mode, so one person saw a beige workspace and a
   black wallet on the same phone. Beige is the default for everyone now; these tokens apply
   only when the customer has chosen dark — or chosen to follow their device — in
   Profile → Appearance, which is what sets data-customer-theme on <html>. */
html[data-customer-theme="dark"][data-customer-surface="true"] body{background:#0F1115}
  /* The offer-detail sheet is appended to body, outside .customer-surface,
     so it must join the dark token scope explicitly. */

    color-scheme:dark;

    --line:#343841;--control-border:#737A86;--hair:rgba(255,255,255,.11);

.fb-star{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;cursor:pointer;border-radius:10px}
.fb-star-glyph{font-size:30px;line-height:1;color:var(--line);transition:color .12s}
.fb-star:hover .fb-star-glyph{color:#D99400}
.fb-star.on .fb-star-glyph{color:#C88300}
.fb-star:focus-within{outline:3px solid rgba(194,65,53,.45);outline-offset:1px}
.fb-caption{margin-top:6px;font-weight:600;color:var(--amber);min-height:18px}
.fb-rating{letter-spacing:2px;color:#C88300;font-size:16px;white-space:nowrap}
.fb-review-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:600;color:var(--coral);text-decoration:underline;overflow-wrap:anywhere;word-break:break-word}
.fb-share{margin-top:14px;padding:14px;border:1px solid var(--coral);background:var(--tint);border-radius:10px}
.fb-item{padding:12px 0;border-bottom:1px solid var(--hair)}.fb-item:last-child{border-bottom:0}
.fb-chips{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 14px}
.fb-chip{min-height:44px;padding:8px 15px;border:1px solid var(--control-border);background:#fff;border-radius:999px;color:var(--ink);cursor:pointer;font-weight:600;font-size:13px}
.fb-chip[aria-pressed="true"]{border-color:var(--coral);color:var(--coral);background:var(--tint)}
.fb-row{padding:14px 0;border-bottom:1px solid var(--hair)}.fb-row:last-child{border-bottom:0}
.fb-row.open{border-left:3px solid var(--coral);padding-left:12px}
.fb-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fb-prov{margin-top:8px;font-size:12px;color:var(--muted)}

      if(!tender){$('tErr3').innerHTML='<div class="err">Choose how the customer paid</div>';return}
      if(!saleIdem) saleIdem=crypto.randomUUID(); // fresh key for this sale; reused on retry

      busy=false;
      if(error){$('tConfirm').disabled=false;$('tConfirm').textContent='Record sale';return fail(error)}
      doneInfo=(data.status==='duplicate_ignored')
        ?{name:data.full_name,pointsEarned:0,pointsTotal:data.points,method:data.payment_method,duplicate:true,saleId:data.sale_id||null}
        :{name:data.full_name,pointsEarned:data.points_earned||0,pointsTotal:data.points,method:data.payment_method,duplicate:false,saleId:data.sale_id||null};
      step=3;draw();
    };
  }

  /* ---- catalogue-first checkout: compose an itemized sale from the firm's existing list ----
     Honest write-path map (verified against the v51 migrations, LIVE):
       • service / retail / custom lines -> ONE public.record_cart_sale carrying real line items
         (public.sale_items). That parent row is a kind='quick_sale' via record_quick_sale, so it
         keeps the exact points/retention/referral firing and the reserve->complete idempotency of
         the till today. A single-retail cart FEFO-deducts stock server-side; multi-retail does not.
       • gift cards -> issue_gift_card (unchanged), one call per line, AFTER the sale.
       • packages -> sell_package_v102(…,p_branch,p_idempotency_key) with an authoritative receipt; memberships ->
         enroll_membership_v41(…,p_idempotency_key uuid) 4-arg overload. Both are now server-
         idempotent (v51a keyed ledger), so they are admitted as their own per-line calls exactly
         like gift cards — NEVER as record_cart_sale line items (the engine treats those item_types
         as descriptive; the real package/membership sale rows come only from the overloads). */
  async function loadCatalog(){
    if(catalog||catalogLoading) return;
    catalogLoading=true;catalogError=null;
    /* V286: the ONE async path on this surface with no epoch guard. Switching branch (or customer)
       while this fetch is in flight cleared catalog, but the redraw's loadCatalog() bounced off
       catalogLoading — so when the old response landed it published the PREVIOUS branch's services,
       products and the previous customer's entitlements under the new label, and nothing refetched.
       Staff could then tap items business_get_checkout_catalogue_v94 deliberately withheld, and
       evaluate_checkout rejected the sale with a generic price-check error. Capture what this fetch
       is for and discard it if either changed; the bail redraws, and drawCartComposer's
       `catalog===null` re-issues the load for the branch actually on screen. */
    const forBranchV286=tillBranchId, forClientV286=cust?cust.client_id:null, forWalkinV286=walkin;
    // A walk-in has no customer, so no plan can be sold to one and no entitlement can exist.
    const wantPackages=branchCanWrite(tillBranchId,'packages')&&!walkin;
    const wantMemberships=branchCanWrite(tillBranchId,'memberships')&&!walkin;
    const [checkout,pkg,mem,preferences,entitlements,serviceMeta,bundleRows,tierBenefitsV365,giftCatalogueV392,recentItemsV392]=await Promise.all([
      /* Server returns only checkout-active items effective at this branch. In particular,
         services configured in service_branches must include p_branch; the browser never
         reconstructs or broadens that availability rule. */
      sb.rpc('business_get_checkout_catalogue_v94',{
        p_business:S.biz.id,p_branch:tillBranchId,p_include_inactive:false
      }),
      wantPackages?sb.from('package_plans').select('id,name,price_cents,active').eq('business_id',S.biz.id).eq('active',true).order('name')
        :Promise.resolve({data:null,error:null}),
      wantMemberships?sb.from('membership_plans').select('id,name,price_cents,cadence,active').eq('business_id',S.biz.id).eq('active',true).order('name')
        :Promise.resolve({data:null,error:null}),
      sb.rpc('business_get_checkout_preferences_v102',{p_business:S.biz.id}),
      walkin?Promise.resolve({data:null,error:null}):sb.rpc('staff_get_customer_entitlements_v102',{
        p_business:S.biz.id,p_client:cust.client_id
      }),
      sb.from('services').select('id,name,variant_label,duration_min')
        .eq('business_id',S.biz.id),
      /* v187: bundles were authorable but unsellable. Read the bundle and its member services
         here; which of those services may actually be sold at THIS branch is still decided by
         the checkout catalogue above, never by this list. */
      sb.from('bundles').select('id,name,price_cents,active,bundle_items(service_id)')
        .eq('business_id',S.biz.id).eq('active',true).order('name'),
      /* V365 (owner, photo 4: "there must be a qrcode for merchant to scan and issue the
         rewards"). The scan already exists — "Scan customer QR" resolves the member code to this
         client (staff_scan_member_qr_v327) — so what was missing was the thing to issue at the
         end of it. This read answers "what is this customer's tier entitled to, and how much of
         it is left in the current period", and rides the same load as the entitlements above for
         the same reason they do: one round trip per looked-up customer.
         Fail-soft: a database without the v365 migration simply yields no panel. */
      walkin?Promise.resolve({data:null,error:null}):sb.rpc('staff_tier_benefits_for_client_v365',{
        p_business:S.biz.id,p_client:cust.client_id
      }),
      /* V392 (owner, photo 1: "only show latest 2 services & products for specified customer").
         What THIS customer had last is a far better guess than the top of the catalogue, and the
         counter is usually repeating a regular's usual. Rides this same load — one round trip per
         looked-up customer, exactly as the entitlements and tier benefits above do.
         An inner join on sales is what scopes these lines to this customer; RLS still decides
         which sales are visible at all. Fail-soft: no history simply means no preference, and the
         grid falls back to the catalogue order it has always used. */
      /* V392 (owner, photo 2: "need to show available rewards" ringed over "Nothing to give on
         this sale" — for a customer holding 75,907 points). The Benefits tab listed vouchers
         already ISSUED, tier benefits and the two one-off offers, but never the point-funded
         gifts this customer could claim right now, so a counter had no way to see that the
         person in front of them could take something home.
         This is the SAME projection Customer 360 uses, deliberately: readiness is resolved
         server-side against the active config version, the redemption capability and the real
         balance. Reading loyalty_rewards and comparing cost to points in the browser would be
         the exact thing v145 forbids — and it would be wrong, because a gift can be live in the
         catalogue and still not claimable. */
      walkin?Promise.resolve({data:null,error:null}):sb.rpc('staff_get_customer_actionable_loyalty_v145',{
        p_business:S.biz.id,p_client:cust.client_id,p_branch:tillBranchId
      }),
      walkin?Promise.resolve({data:null,error:null}):sb.from('sale_items')
        .select('item_type,ref_id,created_at,sales!inner(client_id,business_id)')
        .eq('business_id',S.biz.id).eq('sales.client_id',cust.client_id)
        .in('item_type',['service','product'])
        .not('ref_id','is',null)
        .order('created_at',{ascending:false}).limit(60)
    ]);
    if(!isTillCurrent())return;
    catalogLoading=false;
    // V286: stale response — the branch, the customer or the walk-in flag moved on while it was in flight.
    if(tillBranchId!==forBranchV286||(cust?cust.client_id:null)!==forClientV286||walkin!==forWalkinV286){draw();return;}
    if(checkout.error||!checkout.data){
      catalogError=checkout.error?.message||'The checkout catalogue could not be loaded.';
      draw();return;
    }
    if(checkout.data.platform_allowed===false||checkout.data.enabled!==true){
      catalogueSelectionEnabled=false;S.biz.quick_earn_catalogue_enabled=false;draw();return;
    }
    const preferenceState=checkoutPreferencesStateV102(preferences);
    const preferencesAvailable=preferenceState.available;
    if(preferencesAvailable){
      S.biz.gift_card_sales_enabled=preferenceState.giftCardSalesEnabled;
    }else{
      S.biz.gift_card_sales_enabled=null;
    }
    const activeItems=(Array.isArray(checkout.data.items)?checkout.data.items:[])
      .filter(item=>item?.checkout_active===true&&item?.branch_available!==false);
    const serviceById=Object.fromEntries((serviceMeta.data||[]).map(service=>[service.id,service]));
    /* V392: the customer's own recent item ids, newest first, de-duplicated. Ids only — the name
       and price still come from the checkout catalogue, so an item withdrawn from this branch
       cannot reappear through history. */
    const recentIdsV392=(kind=>{
      const seen=[];
      for(const row of (recentItemsV392?.data||[])){
        if(row?.item_type!==kind||!row.ref_id)continue;
        if(!seen.includes(row.ref_id))seen.push(row.ref_id);
      }
      return seen;
    });
	    catalog={
	      customerGiftsV392:giftCatalogueV392?.error?null:(giftCatalogueV392?.data||null),
	      recentServiceIdsV392:recentIdsV392('service'),
	      recentProductIdsV392:recentIdsV392('product'),
	      services:activeItems.filter(item=>item.item_type==='service')
	        .map(item=>({id:item.item_id,
	          name:serviceDisplayName(serviceById[item.item_id]||item),
	          unit_cents:item.unit_cents||0,
	          image_url:item.image_url||''})),
	      products:activeItems.filter(item=>item.item_type==='product')
	        .map(item=>({id:item.item_id,name:item.name,unit_cents:item.unit_cents||0,image_url:item.image_url||''})),
      packages:(pkg.error||!pkg.data)?null:pkg.data.map(p=>({id:p.id,name:p.name,unit_cents:p.price_cents||0})),
      memberships:(mem.error||!mem.data)?null:mem.data.map(p=>({id:p.id,name:p.name,unit_cents:p.price_cents||0,cadence:p.cadence})),
      customerPackages:entitlements.error?[]:(entitlements.data?.packages||[]),
      customerVouchers:entitlements.error?[]:(entitlements.data?.vouchers||[]),
      /* v215: the welcome offer for a first-time sign-up rides in the same entitlements
         payload as packages and vouchers, because this is the one read the till already
         makes for a looked-up customer. */
      customerWelcomeOffer:entitlements.error?null:(entitlements.data?.welcome_offer||null),
      /* V362: a bring-back voucher rides in the SAME entitlements payload as the welcome offer,
         for the same reason — this is the one read the till already makes for a looked-up
         customer, so a second round-trip would be a second thing to keep in sync. */
      customerBringbackOffer:entitlements.error?null:(entitlements.data?.bringback_offer||null),
      /* V365: the customer's claimable tier benefits, each with what is left this period. */
      customerTierBenefits:tierBenefitsV365?.error?null:(tierBenefitsV365?.data||null),
      packageEarnsPoints:preferenceState.packageEarnsPoints,
      /* A bundle is offered only when EVERY service in it is sellable at this branch — a bundle
         missing a service is not the deal the customer was quoted, so it is withheld rather than
         quietly sold short. Prices come from the branch's own catalogue. */
      bundles:bundleRows.error?null:(bundleRows.data||[]).map(bundle=>{
        const catalogueById=new Map(activeItems.filter(item=>item.item_type==='service')
          .map(item=>[item.item_id,item]));
        const wanted=(bundle.bundle_items||[]).map(row=>row.service_id).filter(Boolean);
        const items=wanted.map(serviceId=>{
          const listed=catalogueById.get(serviceId);
          if(!listed)return null;
          return {id:serviceId,
            name:serviceDisplayName(serviceById[serviceId]||listed),
            unit_cents:listed.unit_cents||0};
        });
        return {id:bundle.id,name:bundle.name,unit_cents:bundle.price_cents||0,
          items:items.filter(Boolean),complete:wanted.length>0&&items.every(Boolean)};
      }).filter(bundle=>bundle.complete)
    };
    draw();
  }
  function addCatalogLine(type,item){
    if(cartLocked())return;
    const ex=cart.find(l=>l.type===type&&l.ref===item.id);
    if(ex){ex.qty++;}
    else cart.push({lineId:crypto.randomUUID(),type,ref:item.id,label:item.name,unit_cents:item.unit_cents,qty:1});
    CUI.announce(workspaceTemplateTextV97('itemAdded',{item:item.name}));onSaleLinesChanged();
  }
  /* v187 (owner: "i dont see in record sale to sell" a bundle). A bundle is several services at
     one price, and it was authorable in Services → Bundles but unsellable at the till.
     sale_items has no bundle type, and inventing one would put a line in the ledger that no
     report, commission rule or staff-performance figure knows how to read. So a bundle is sold
     as what it IS: its member services, each recorded as a normal service line, priced pro-rata
     from their own list prices so the lines sum to EXACTLY the bundle price. Staff performance,
     service reporting and commissions keep working; revenue is the bundle price, not the sum of
     the parts. The remainder cent goes on the last line, so no rounding is invented or lost. */
  /* V204 removed bundleLinePricesV187. It split a bundle's price across its services in the
     browser — a calculation whose result the server was never willing to accept, which is how
     the till came to show one number and charge another. app.ps1c_bundle_lines_v204 does the
     same allocation where the price actually lives. */
  function addBundleLines(bundle){
    if(cartLocked())return;
    if(!Array.isArray(bundle?.items)||!bundle.items.length){
      return toast('That bundle has no services in it yet.');
    }
    const existing=cart.find(line=>line.type==='bundle'&&line.ref===bundle.id);
    if(existing){existing.qty+=1}
    else{
      cart.push({lineId:crypto.randomUUID(),type:'bundle',ref:bundle.id,
        label:bundle.name,unit_cents:bundle.unit_cents,qty:1});
    }
    CUI.announce(workspaceTemplateTextV97('itemAdded',{item:bundle.name}));onSaleLinesChanged();
  }
  // Custom "Other item": an OPTIONAL note rides with the line and is sent to
  // evaluate_checkout / record_cart_sale as amount_cents + reason; the server validates both.
  // The amount may be negative — a correction the other way — and the server refuses to let one
  // take the sale to zero or below.
  function addCustomLine(cents,reason){
    if(cartLocked())return;
    cart.push({lineId:crypto.randomUUID(),type:'custom',ref:null,label:'Other item',unit_cents:cents,qty:1,reason});
    CUI.announce('Item added');onSaleLinesChanged();
  }
  /* Package/membership lines use qty 1 and a stable per-line uuid key minted at
     add-time (reused verbatim on retry so the authoritative writer dedupes), always a NEW line. */
  function addPlanLine(type,plan){
    if(cartLocked())return;
    cart.push({lineId:crypto.randomUUID(),type,ref:plan.id,label:plan.name,unit_cents:plan.unit_cents,qty:1,key:crypto.randomUUID()});
    CUI.announce(workspaceTemplateTextV97('itemAdded',{item:plan.name}));
    /* V257: a screen-reader announcement was the ONLY feedback, and the redraw closed the drawer
       it was added from, so a sighted owner saw nothing at all. Say it out loud. */
    toast(workspaceTemplateTextV97('itemAdded',{item:plan.name}));
    draw(); // extras do not affect the kernel total
  }
  async function useCustomerPackage(clientPackageId){
    if(busy||cartLocked())return;
    const owned=catalog?.customerPackages?.find(item=>item.client_package_id===clientPackageId);
    if(!owned)return toast('That package is no longer available');
    /* V291 (audit follow-up): a native confirm() cannot be translated, so the one dialog that
       takes value off a customer's package spoke English to a workforce CLAUDE.md says may not
       read it. Same deliberate-confirmation dialog as V288; the fixed sentences are registered in
       the workspace copy tables, and only the plan name and remaining count are interpolated. */
    const confirmedSessionV291=await confirmDeliberateV288({
      title:'Use one session?',
      body:`${owned.plan_name} \u00b7 ${owned.remaining} remaining now.`,
      summaryHtml:'<b>What this does</b><p class="small" style="margin-top:5px">One session is taken off this customer\u2019s package straight away. It is recorded as a $0 visit, so nothing is charged and nothing is refunded. If you take it off by mistake, reverse the session record in Sales.</p>',
      acknowledgement:'I understand one session will be taken off.',

    if(!confirmedSessionV291||!isTillCurrent()||busy||cartLocked())return;

    busy=true;

      p_business:S.biz.id,p_client_package:clientPackageId,p_branch:tillBranchId,

  }
  /* v215: give the first-visit free item. p_qualifying_sale is the sale that proves the
