/* ============================================================================
   Frenly design system v2 — "mockup layout, iOS polish" (owner ruling 2026-07-18)
   Principles: 8pt grid · SF-grade type with tight optical tracking · hairline
   borders instead of heavy strokes · layered low-opacity shadows (never one big
   blur) · frosted glass on floating surfaces · springy motion on interaction.
   The wordmark is an image asset, not type — headings run on the system
   (SF on Apple) stack, which is what makes it read as a native app rather than a
   generic web dashboard.
   ============================================================================ */
:root{
  --bg:#F4F2EE; --card:#FFFFFF; --ink:#17161A; --ink2:#3D3B44; --muted:#6B6673;
  --line:#EAE6DF; --control-border:#817B88; --hair:rgba(23,22,26,.06);
  /* ===== BRAND RED — SINGLE SOURCE OF TRUTH (owner ruling 2026-08-18) =====================
     Peekaa red is #C24135. It was previously two colours: the business app used #C24135 and
     the customer app used #F06A4F, with 79 customer rules on one and 45 on the other, so the
     two apps did not read as the same product. Every red below now derives from --brand-red.
     TO CHANGE THE BRAND RED: edit --brand-red and the four --brand-red-* steps ONLY. Nothing
     else in this file hardcodes a brand red. --coral and --peekaa-red are kept as aliases so
     no rule had to be rewritten; both now resolve to the same colour. */
  --brand-red:#C24135;           /* the brand red */
  --brand-red-dark:#9D352C;      /* pressed / hover / gradient end */
  --brand-red-soft:#F7DCD7;      /* selected chip + active nav background */
  /* Text/icons ON --brand-red-soft. The brand red itself measures 3.94:1 there — under AA — and
     wave 1 propagated that pair to every active nav label, selected tab, filter chip and status
     pill at once. This step is --brand-red-dark, i.e. a red the palette already contains, and it
     is 5.43:1 on the same pink. Nothing else about the chip changes. */
  --brand-red-on-soft:var(--brand-red-dark);
  --brand-red-faint:#FDEEEB;     /* large tinted surfaces */
  /* Dark surfaces need a lighter accent to stay legible; these are the SAME hue lifted, not a
     second brand. Change these two together with --brand-red above. */
  --brand-red-on-dark:#E4776B;   /* accent text/icons on a dark ground */
  --brand-red-on-dark-2:#F0A199; /* hover step on a dark ground */
  /* The two tinted steps also need a dark counterpart: #F7DCD7 and #FDEEEB are pale pinks that
     become near-white plates on a #191C22 card. These are the same two roles (selected chip /
     progress track ground, and large tinted surface) inverted for a dark ground. Change all four
     on-dark steps together with --brand-red above. */
  --brand-red-soft-on-dark:#3A211F;
  --brand-red-faint-on-dark:#2A1917;
  /* ===== LAYOUT BREAKPOINTS (owner ruling 2026-08-18) ==================================
     The workspace shell is governed by TWO thresholds, and only these two:
       <= 768px   compact layout — mobile page padding, stacked page headers, responsive
                  tables, single-column dashboard. iPad portrait (768) sits INSIDE this.
       <= 960px   no room for a persistent sidebar — rail hidden, mobile dock shown.
                  iPad portrait and 11in Pro portrait (834) get the dock; iPad landscape
                  (1024) keeps the rail.
     Before this, four thresholds (760 / 767 / 768 / 960) governed the same decision, which
     left 761-767px and exactly 768px in hybrid states nobody designed: mobile padding with
     a desktop-centred header. Component-local breakpoints (small-phone tweaks, short
     viewports, individual carousels) are deliberately left alone — they are per-component
     decisions, not shell layout. Do not introduce a third shell threshold. */
  --coral:var(--brand-red); --coral-hover:var(--brand-red-dark); --red:var(--brand-red-dark);
  /* ===== ONE-PEEKAA SEMANTIC TOKENS (wave 1, owner-approved 2026-08-19) ==================
     One neutral system and one colour pair per meaning, both apps. The --peekaa-* names
     below became ALIASES of these so no selector had to be rewritten; new code uses the
     canonical names. The retired strays (var(--brand-red) var(--danger) var(--success) var(--success) var(--tint), the warm
     cream cluster, the three customer shadow inks) all resolve to these now. */
  --success:#1F6B48; --success-bg:#E7F6EE;
  --danger:#9D352C;  --danger-bg:#FBEAE7;
  --warn:#7D6217;    --warn-bg:#FFF3D6;
  --neutral-bg:#F1EEE9;
  --gold:#D8B15A;    --gold-bg:var(--warn-bg);
  --bg-cust:#F8F4F1;
  --shell:#FCFBF9;   --appbar-bg:rgba(232,227,218,.94);
  --head-tint:#FBF5F0;
  --amber:var(--warn); --green:var(--success);
  --grad:linear-gradient(135deg,var(--brand-red),var(--brand-red-dark));
  --peekaa-red:var(--brand-red);--peekaa-red-dark:var(--brand-red-dark);--peekaa-red-soft:var(--brand-red-soft);--peekaa-red-faint:var(--brand-red-faint);
  --peekaa-red-on-soft:var(--brand-red-on-soft);
  --peekaa-bg:var(--bg-cust);--peekaa-card:var(--card);--peekaa-white:var(--card);
  --peekaa-text:var(--ink);--peekaa-text-secondary:var(--muted);--peekaa-text-muted:var(--muted);
  --peekaa-border:var(--line);--peekaa-divider:var(--line);
  --peekaa-success:var(--success);--peekaa-success-bg:var(--success-bg);
  --peekaa-gold:var(--gold);--peekaa-gold-bg:var(--gold-bg);
  /* V299: the one categorical palette for DOM proportion bars (reports, playbooks). */
  --chart-1:#C24135; --chart-2:#1F6B48; --chart-3:#1F5199; --chart-4:#8A5A12; --chart-5:#7A2E9D; --chart-6:#6B6673;
  --tint:#FFF0EC;            /* coral wash for selected/active surfaces */
  /* iOS uses generous, continuous corner radii */
  --r:18px; --r-sm:12px; --r-lg:24px;
  /* Depth = several cheap shadows stacked, not one expensive one */
  --shadow:0 1px 2px rgba(23,22,26,.04),0 4px 12px rgba(23,22,26,.045);
  --shadow-lg:0 2px 6px rgba(23,22,26,.05),0 18px 44px rgba(23,22,26,.10);
  --shadow-warm:0 2px 8px rgba(54,44,35,.05),0 8px 28px rgba(54,44,35,.07);
  --shadow-warm-lg:0 6px 16px rgba(54,44,35,.06),0 18px 42px rgba(54,44,35,.11);
  --glow-brand:0 8px 22px rgba(194,65,53,.28);
  --spring:cubic-bezier(.34,1.4,.64,1);
  --ease:cubic-bezier(.2,.8,.2,1);
  --motion-fast:160ms;
  --motion-ui:220ms;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px;
  --control-h:44px;
  /* B1 (owner ruling): --muted #6B6673 on --brand-red-soft is 4.29. #625E6A is the smallest
     darkening that clears 4.5 with margin (4.86) and still reads as secondary — the ruling was
     to preserve the hierarchy, not to maximise the ratio. Dark maps it back to --muted, whose
     grounds differ, so dark renders exactly as before. */
  --muted-on-soft:#625E6A;
  --sf:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Inter',system-ui,'Segoe UI',sans-serif;
  /* ===== DIALOG WIDTH LADDER (W5-2, owner spec 2026-08-19) ================================
     Every modal-card width in the app collapses onto these four steps. Each existing width was
     measured and mapped to the nearest step that is EQUAL OR WIDER, never narrower, so no dialog
     shrinks and nothing can newly overflow. Mobile viewport caps (calc(100vw - Npx) etc.) are
     untouched — this ladder only governs the desktop/tablet ceiling. */
  --dialog-w-sm:420px; --dialog-w-md:520px; --dialog-w-lg:640px; --dialog-w-xl:760px;

/* nestly_v449: every rule below describes the INLINE card — the five-column row that the gift

.grow-overview[data-programme-view="points"] .grow-points-form-card-v343:not(.grow-points-form-modal-v410){display:grid;grid-template-columns:minmax(120px,.5fr) minmax(160px,.85fr) minmax(110px,.55fr) minmax(200px,.95fr) minmax(190px,.8fr);gap:10px 14px;align-items:end;padding:14px 16px;border:1px solid #F2D5D1;border-radius:14px;background:#fff;box-shadow:0 10px 24px rgba(48,36,28,.06)}

.grow-overview[data-programme-view="points"] .grow-points-form-card-v343:not(.grow-points-form-modal-v410) input,.grow-overview[data-programme-view="points"] .grow-points-form-card-v343:not(.grow-points-form-modal-v410) textarea{max-width:none!important;text-align:center;font-weight:600;min-height:36px;padding:4px 8px}

.grow-overview[data-programme-view="points"] .grow-points-form-card-v343:not(.grow-points-form-modal-v410)>[role="alert"],.grow-overview[data-programme-view="points"] .grow-points-form-card-v343:not(.grow-points-form-modal-v410)>.notice{grid-column:1/-1;margin:0!important}
.grow-overview[data-programme-view="points"] .grow-points-form-card-v343:not(.grow-points-form-modal-v410)>.row{grid-column:1/-1;margin-top:6px!important;justify-content:flex-end}

.v150-titlebar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}

.v150-soft-head{background:linear-gradient(180deg,var(--tint),var(--card));border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;margin:-22px -22px 16px;padding:16px 22px}

/* V368: the Customer settings tab strip is built from links (each tab is a real hash a reader can

.v150-segment a{min-height:44px;display:inline-flex;align-items:center;border-radius:999px;background:transparent;color:var(--muted);font-weight:700;padding:8px 16px;text-decoration:none}

/* Compact widths: the segmented control scrolls instead of clipping (Reports @390 hid two of its
   four sections behind the viewport edge) or wrapping into two rows (Grow @390). */
@media(max-width:768px){
  .v150-segment{max-width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .v150-segment::-webkit-scrollbar{display:none}
  .v150-segment button,.v150-segment a{flex:0 0 auto;white-space:nowrap}
  /* The app-bar page title must survive against the Customer-view button: label collapses to its
     icon, the title keeps one readable line (audit P0-9: every route truncated to ~5 chars). */
  .mobile-page-title{flex:1 1 auto;min-width:0}
  .mobile-page-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .appbar a[aria-label="Open customer view"] span{display:none}
  /* The raised Scan-QR circle pushed its label ~8px below the other four nav labels. */
  .customer-primary-nav .customer-nav-scan>span{position:relative;top:-8px}
  /* Label/value metric tables have no column headers; the responsive collapse was stamping every
     cell "DETAILS". The row's first cell IS the label — drop the generic pseudo-label. */
  table[data-responsive="true"] td[data-label="Details"]{display:block}
  table[data-responsive="true"] td[data-label="Details"]::before{content:none}
}

/* V369 — the tier-benefit editor row and the till's benefit list.
   The editor row is a grid so the kind, its value, the limit, the period and Remove line up
   column-for-column down the list instead of wrapping differently on every row; the preview

   narrow cart column — it used to lay its blocks out side by side and overflow the page. */
.grow-tier-benefit-row-v365{display:grid;gap:8px;align-items:center;margin-top:8px;

/* nestly_v657 (owner photo 2: "the saved benefits and editing benefits is seated at the same area

.grow-tier-benefit-list-v657{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}

/* V372: the container itself must stop being a ROW. V369 made this list "vertical, one benefit

/* V399: V372 set align-items:stretch here at (0,1,0), but .permission-banner sets
   align-items:flex-start at the same specificity and appears LATER in this sheet, so flex-start
   won and every row shrank to its own text width — the rows stacked (V372's flex-direction did
   apply) but stayed a third of the card wide, which is the cramped column in the owner's photo.
   Qualifying with .permission-banner takes it to (0,2,0) so the rows fill the banner. Measured
   in Chromium: row width goes from shrink-to-fit to the full content box. */

.till-tier-benefits-v369{flex-direction:column;align-items:stretch;flex-wrap:wrap}

@media(max-width:520px){

/* V399 (owner, photo 3: the full-width "Scan customer QR" button crossed out, a small square
   icon drawn in its place, "smaller button"). Icon-only, square, and sized to stay a comfortable
   tap target on a counter tablet — 44px is the floor a thumb needs, so "smaller" stops there
   rather than at whatever the glyph alone would measure. */
.till-gift-scan-v399{display:inline-flex;align-items:center;justify-content:center;
  width:44px;height:44px;min-height:44px;padding:0;margin-top:10px;flex:0 0 auto}

/* V200 sub-module tabs. The original rule chose horizontal scrolling over wrapping, and said why:
   "a wrapped pill strip changes height as tabs re-flow, which shifts the whole page under the
   owner's thumb on the exact tap they were aiming at."

   V458 revisits that, because the scroll it chose was made invisible in the same rule
   (scrollbar-width:none plus a ::-webkit-scrollbar reset), and measurement showed the cost:
   on #/reports the strip is 682px inside a 561px box at 599, so elementFromPoint at the fourth
   tab's centre returns MAIN, not the button. At 430 and 390, two tabs are unreachable. And
   "Team Performance" lost its own rail row at V272, so this strip is its ONLY door — an owner on
   a phone cannot reach that report at all, with no cue that anything is missing.

   The original objection does not apply to these strips: each carries a FIXED set of tabs for its
   page, so the wrapped height is constant at a given viewport width and cannot change under a
   thumb mid-tap. What genuinely moves a page under a thumb is a control the owner cannot see.
   flex-wrap is also self-limiting — a strip that fits stays exactly as it was, on one row, so
   nothing changes at desktop width. overflow-x:auto stays as the fallback for the pathological
   case of a single tab wider than its container.

   `flex` on the buttons is off so labels keep their natural width. */
.section-subtabs-v200{display:flex;flex-wrap:wrap;row-gap:4px;max-width:100%;margin:0 0 16px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}

.section-subtabs-v200 button{flex:0 0 auto;white-space:nowrap}
/* V209 staff list groups. The heading carries the count so an owner can see "3 roster only" at a

.staff-group-head-v209{margin-bottom:10px}

@media(max-width:900px){.profile-branch-readout-v210{display:block}}
/* V206: the row a notification sent you to. A brief tint, not a permanent one — it is a "here it

/* V399 (owner, photo 6: a line drawn round the whole KPI row out to the card's right edge,
   "fill until here too empty"). The row was repeat(auto-fit,minmax(170px,1fr)). auto-fit only
   collapses tracks that NOTHING occupies, and the delta legend under the tiles is a
   grid-column:1/-1 item — it spans every track, so none of them could ever collapse. On a
   1040px row that resolved to FIVE tracks for FOUR tiles: each tile took a fifth of the width
   and the row stopped ~211px short of the card edge, which is the emptiness in the photo.
   The count is now the real number of tiles (2, 3 or 4 depending on module access), published
   by the painter as --kpi-count, so the row fills at any tile count and the legend can go on
   spanning it. Below 1100px the two-column rule after this one still wins. */

.appointment-list-filters{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:10px;align-items:end}

/* V225 (owner marked this row "misalignment"). From and To are input[type=date] and the status
   is a select; the two render at different intrinsic heights in every engine, and min-height
   alone does not settle it — so with align-items:end their bottoms matched while their tops and
   labels did not. An explicit equal height on every control in this bar removes the variable. */
.appointment-list-filters>div>input,
.appointment-list-filters>div>select{height:var(--control-h);min-height:var(--control-h);box-sizing:border-box;margin:0}
.appointment-list-filters[hidden]{display:none!important}.appointment-filter-with-icon{position:relative}.appointment-filter-with-icon select{padding-left:38px}.appointment-filter-icon{position:absolute;left:12px;bottom:13px;color:var(--muted);pointer-events:none}

.sales-filter-panel{display:grid;gap:10px;margin-bottom:14px}.sales-filter-row{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;align-items:stretch}.sales-filter-row.secondary{grid-template-columns:repeat(4,minmax(150px,1fr))}
/* V180: the filter labels used to sit at different heights. Cause was the global
   label{margin:16px 0 6px} inheriting into cells that were bottom-aligned (align-items:end):
   any cell whose control was a different height floated its label out of line. Each cell is now
   its own bottom-aligned column with a normalised label margin, so labels share one baseline
   and controls share another regardless of control type. */
.sales-filter-row>div{display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.sales-filter-row>div>label{margin:0 0 6px}
.sales-filter-row>.btn{align-self:end}

.wl-period-chip-v571.is-on{background:var(--peekaa-red,var(--coral));border-color:transparent;color:#fff}
.wl-period-v571 input[type=date]{height:var(--control-h);min-height:var(--control-h);box-sizing:border-box;margin:0}
/* nestly_v571 (owner, two photos, the same complaint on both: the From / To / search boxes
   ringed on Sales & refunds and on Customer intelligence — "fix this boxes misalignment cause
   it's overlapping"). Same cause as V225 on the appointments bar: input[type=date] and
   input[type=search] have DIFFERENT intrinsic heights (a date input is markedly taller on iPad
   Safari, which is what the owner is looking at). The cells are bottom-aligned, so the taller
   control pushed its own label up into the box beside it. Pinning one explicit height on every
   control in the bar removes the variable, exactly as V225 did. */
.sales-filter-row>div>input,
.sales-filter-row>div>select{height:var(--control-h);min-height:var(--control-h);box-sizing:border-box;margin:0}
/* nestly_v577 — owner batch: FIVE photos ringing the same defect on five different pages
   ("boxes overlapping, solve!", "misalignment, solve!!!", "overlapping"): Sales & refunds,
   Waitlist, Rewards Overview, Rewards History and Sales again.

   V225 and v571 both read this as a HEIGHT problem and pinned --control-h on every control. That
   was real but it was not this. The remaining defect is WIDTH: input[type=date] carries an
   intrinsic minimum width from the UA stylesheet (markedly wider on iPad Safari, which is what
   the owner photographs), the cells are grid/flex items, and while the CELL was given min-width:0
   so its track may shrink, the INPUT inside it never was — so the input keeps its intrinsic width
   and paints straight over the neighbouring cell's label. Measured in-browser against a simulated
   UA floor: 78px of overflow before this rule, 0px after.

   Pinning the control to its cell (width:100% + min-width:0 at a specificity above the UA rule)
   is what removes it. The date text may ellipsise on a very narrow column, which is the correct
   trade: a clipped date is legible, a date printed on top of the next label is not. */
.sales-filter-row>div>input,.sales-filter-row>div>select,
.v150-filterbar>div>input,.v150-filterbar>div>select,
.wl-period-v571>label>input,
.appointment-list-filters>div>input,.appointment-list-filters>div>select,
.staff-performance-filterbar>div>input,.staff-performance-filterbar>div>select{
  width:100%;min-width:0;max-width:100%;box-sizing:border-box}

   or the cell itself is what overflows and the rule above has nothing to shrink into. */
.v150-filterbar>div,.wl-period-v571>label{min-width:0;flex-shrink:1}

/* nestly_v594 (owner photo 2: "please align it, the words overlapping the boxes"). A <legend> is

/* Toast: frosted, springs up from the bottom like a native banner */
.toast{position:fixed;bottom:26px;left:50%;background:rgba(23,22,26,.9);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  color:#fff;padding:12px 22px;border-radius:999px;font-size:13.5px;font-weight:500;
  box-shadow:0 12px 40px rgba(0,0,0,.3);z-index:99;opacity:0;pointer-events:none;
  transform:translateX(-50%) translateY(12px) scale(.96);
  transition:opacity .26s var(--ease),transform .32s var(--spring)}
/* V451: the phone toast has to clear the bottom dock. This was declared in the shared 768px
   block 15 lines ABOVE the rule above, so `bottom:26px` won and every toast on a phone was
   painted behind the dock. */
@media(max-width:768px){.toast{width:min(calc(100vw - 28px),520px);bottom:calc(78px + env(safe-area-inset-bottom));border-radius:18px;text-align:center}}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

/* P0-5 (audit): .err is a page-level alert block, and inside a table cell it was still INLINE —
   so a sentence too long for the column shattered into one background fragment per line (8 of
   them in the Expenses AMOUNT column at 1024px), each starting at the line box while the 14px
   padding landed only on the first and last. Every wrapped line therefore began 14px left of the
   first line's text, the cell grew to 162px, and margin-top was silently dead on an inline box.
   In a cell it is ONE chip: a single box that starts at the cell's content edge and wraps its
   text INSIDE itself. */
td>.err{display:inline-block;max-width:100%;margin:0;padding:6px 10px;line-height:1.4;text-align:left}
/* One box also means one wrap width, so a column squeezed to 55px would set the sentence 3 words
   tall. In real table mode the chip asks for a readable minimum, which auto table layout hands to
   the column; .cui-table-wrap already scrolls. Below 769px the row is stacked and there is no
   column to widen, so the minimum is not asked for. */
@media(min-width:769px){td>.err{min-width:16ch}}

/* Icons get their own fixed-width box so every label starts on the same optical
   column, and so flex `gap` actually applies — an emoji sitting in the same text

/* the right-hand column: sticky frosted app bar above the scrolling page */
.col{display:flex;flex-direction:column;min-width:0}
.appbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:flex-end;
  gap:10px;padding:max(12px,env(safe-area-inset-top)) max(34px,env(safe-area-inset-right))
    12px max(34px,env(safe-area-inset-left));border-bottom:1px solid var(--hair);
  background:var(--appbar-bg);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.profile{position:relative}
.profile .who{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px 6px 6px;border-radius:999px;
  cursor:pointer;background:#fff;border:1px solid var(--hair);box-shadow:var(--shadow);
  transition:transform .2s var(--spring),box-shadow .2s var(--ease)}
.profile .who:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
/* nestly_v612 (owner, photo 3: the avatar and its +/− ringed together — "clicking anywhere on the
   icon should open the drop down"). Measured before changing anything: every point INSIDE the
   button already opened the menu, and the button stops six pixels past the +. It sits in the top
   right corner, where a thumb naturally lands on the corner itself rather than on a 66x44 pill, so
   the taps that missed were the ones just outside it. This grows the target by 10px on each side
   and 8px above and below WITHOUT moving anything: the pill is drawn by the button, the hit area
   by this overlay, so nothing on the header shifts. */
.profile .who:active{transform:scale(.975)}
.profile .who .chev{font-size:9px;color:var(--muted);margin-left:2px}
.profile .avatar{width:30px;height:30px;border-radius:999px;background:var(--grad);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;
  box-shadow:0 2px 6px rgba(194,65,53,.3)}
/* menu now drops DOWN from the top-right chip (was: up from the bottom-left rail) */
/* V440: the account/profile menu is the outermost popover in the .appbar family — it must win
   paint order against everything else opened from the bar (and against ordinary page content,
   which is what broke: the menu had no explicit z-index, so the Dashboard Performance card's
   heading, date range and Minimise button painted through it at 1180px). The bar's popover scale
   is .appbar(40) < .notif-menu(41) < .business-workspace-switch/.customer-workspace-switch
   .menu(42); this menu is opened last / sits top-right / and — once the workspace switcher moves
   inside it — will contain that 42-ranked menu as a descendant, so it is slotted one above at 43,
   keeping the scale monotonic instead of introducing an unrelated number. */
/* V450: the owner reported dashboard text showing through this menu; V440 fixed the paint ORDER
   (z-index 43, above the whole appbar family) but the menu was still the most SEE-THROUGH popover
   in that family at .86 while its own sibling .business-workspace-switch .menu already sat at .94 —
   and this is the one that opens over the busiest surface. Measured live on the dashboard: "Minimise",
   "Apply", "Open calendar" and "INACTIVE CUSTOMERS" all sit behind it and "Minimise" read legibly
   through it, on top of the Settings row. Opaque here: the blur still frames the menu against the
   page, but nothing behind it can be read as if it were part of the menu. Legibility beats the
   glass effect on a popover that covers live figures. */
.profile .menu{position:absolute;top:calc(100% + 8px);right:0;min-width:212px;z-index:43;
  background:var(--card,#fff);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border:1px solid var(--hair);border-radius:var(--r-sm);padding:6px;box-shadow:var(--shadow-lg);
  transform-origin:top right;animation:pop .2s var(--spring)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(-6px)}to{opacity:1;transform:scale(1) translateY(0)}}
.profile .menu a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
  color:var(--ink2);font-size:13.5px;font-weight:500;white-space:nowrap}
.profile .menu a:hover{background:#F2EFEA;color:var(--ink)}
.profile-menu-section{padding:8px 12px;border-top:1px solid var(--hair);margin-top:4px}
.profile-menu-section:first-child{border-top:0;margin-top:0}
.profile-menu-section label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin:0 0 6px;display:block}
.profile-menu-section input,.profile-menu-section select{min-height:var(--control-h);font-size:14px;border-radius:12px}
.profile-menu-section .row{gap:6px;align-items:center}
.profile-menu-saved{font-size:12px;color:var(--ok);min-height:16px;margin-top:4px}
.business-workspace-switch,.customer-workspace-switch{position:relative}
.business-workspace-switch>summary,.customer-workspace-switch>summary{list-style:none}
.business-workspace-switch>summary::-webkit-details-marker,.customer-workspace-switch>summary::-webkit-details-marker{display:none}
.business-workspace-switch .menu,.customer-workspace-switch .menu{position:absolute;top:calc(100% + 8px);right:0;z-index:42;
  /* V450: opaque with the rest of the appbar popover family. At .94 the bleed was slight, but this
     list now renders INSIDE the account menu (V443) as well as standalone on the customer shell,
     so it has to be readable against both a menu and live page content. */
  min-width:224px;background:var(--card,#fff);border:1px solid var(--hair);border-radius:var(--r-sm);
  padding:6px;box-shadow:var(--shadow-lg);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
.business-workspace-switch .menu a,.customer-workspace-switch .menu a{display:flex;align-items:center;min-height:44px;
  padding:9px 12px;border-radius:8px;color:var(--ink2);font-size:13.5px;font-weight:600;white-space:nowrap}
.business-workspace-switch .menu a:hover,.customer-workspace-switch .menu a:hover{background:#F2EFEA;color:var(--ink)}
/* notification bell — sits left of the profile chip, same frosted-popover language */
.bellwrap{position:relative}
.bellbtn{position:relative;width:44px;height:44px;border-radius:999px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;background:#fff;border:1px solid var(--hair);box-shadow:var(--shadow);
  font-size:16px;transition:transform .2s var(--spring),box-shadow .2s var(--ease)}
.bellbtn:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.bellbtn:active{transform:scale(.94)}
.bellbtn .dot{position:absolute;top:-3px;right:-3px;background:var(--coral);color:#fff;border-radius:999px;
  min-width:16px;height:16px;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
  padding:0 3px;box-shadow:0 0 0 2px #fff}
/* V461 "Peekaa" — the bell peeks in and shakes when a fresh notification lands (wiggleBell()
   in app.js). A rotation-only keyframe so it never nudges the profile chip beside it. */
@keyframes peekaaBellWiggle{
  0%,100%{transform:rotate(0)}
  15%{transform:rotate(-16deg)}
  30%{transform:rotate(13deg)}
  45%{transform:rotate(-10deg)}
  60%{transform:rotate(7deg)}
  75%{transform:rotate(-4deg)}
  88%{transform:rotate(2deg)}
}
.bellbtn.peekaa-wiggle{animation:peekaaBellWiggle .65s cubic-bezier(.34,1.56,.64,1)}
.bellbtn.peekaa-wiggle .dot{animation:pop .3s var(--spring) .1s backwards}
@media(prefers-reduced-motion:reduce){.bellbtn.peekaa-wiggle,.bellbtn.peekaa-wiggle .dot{animation:none}}
/* V450: same fix as .profile .menu below — this dropdown opens over the same dashboard figures and
   carried the same rgba(255,255,255,.86). It was not in the owner's report only because it needs
   unread notifications to open; the defect is identical, so it is fixed with its sibling rather
   than left in the register as a known-identical bug. */
.notif-menu{position:absolute;top:calc(100% + 8px);right:0;width:320px;max-width:calc(100vw - 40px);
  background:var(--card,#fff);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border:1px solid var(--hair);border-radius:var(--r-sm);padding:8px;box-shadow:var(--shadow-lg);
  transform-origin:top right;animation:pop .2s var(--spring);max-height:420px;overflow-y:auto;z-index:41}
.notif-item{display:block;width:100%;padding:10px 12px;border-radius:8px;cursor:pointer;text-align:left;background:transparent;color:inherit;transition:background .14s var(--ease)}
.notif-item:hover{background:#F2EFEA}
.notif-item.unread{background:var(--tint)}
.notif-item .t{font-size:13px;font-weight:600;color:var(--ink)}
.notif-item .b{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.notif-item .ago{font-size:10.5px;color:var(--muted);margin-top:4px}
.notif-empty{text-align:center;padding:24px 12px;color:var(--muted);font-size:13px}
/* global top-bar action cluster — search + everyday actions, sits left of the bell so the

.global-actions{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0;margin-right:auto}
.global-search{display:flex;align-items:center;gap:6px;flex:0 1 340px;min-width:0;height:44px;padding-left:13px;

.dashboard-appbar-branch{display:block;flex:0 1 196px;min-width:150px}
.dashboard-appbar-branch select{width:100%;min-width:0;margin:0;background:#fff;box-shadow:var(--shadow);font-size:13px}
.dashboard-mobile-branch{display:none}
.mobile-page-title,.mobile-search-trigger,.mobile-search-sheet{display:none}
.mobile-page-title{min-width:0;align-items:center;gap:9px;font-weight:750;color:var(--ink)}
.mobile-page-title .mobile-page-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--tint);color:var(--coral)}
.mobile-page-title span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mobile-search-trigger{width:44px;height:44px;border-radius:999px;background:#fff;border:1px solid var(--hair);box-shadow:var(--shadow);color:var(--ink2);align-items:center;justify-content:center}
.mobile-search-sheet[open]{display:block;position:fixed;inset:0;z-index:190;background:rgba(23,22,26,.22);padding:max(16px,env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom))}
.mobile-search-panel{margin:0 auto;background:#fff;border:1px solid var(--hair);border-radius:20px;padding:14px;box-shadow:var(--shadow-lg);max-width:520px}
.mobile-search-panel .row{gap:8px}.mobile-search-panel input{font-size:16px}
/* The tablet header. Between 769 and 1180 there is not room for a 340px search field AND the
   action buttons, so the field collapses to a 48px icon button. This block MUST stay below the
   base .appbar, .global-search, .global-quick and .dashboard-appbar-branch rules above it — a
   media query adds no specificity, and it lived 260 lines ABOVE them until V451, so every
   declaration here except the one property no base rule sets (the search input's display) was
   silently beaten.
   The half-applied result: a 340px-flex search pill with its input hidden but its magnifier and
   its 44px flex-shrink:0 go-arrow still drawn, so at 961-1040px the arrow overflowed its own
   shrunken pill and landed ON the Record sale button — measured 24.0px of overlap at 961,
   10.0px at 1024. Note the band: 1180 itself was CLEAR, so the owner's own screen never showed
   it and a check pinned at 1180 alone would pass. */
@media(min-width:769px) and (max-width:1180px){
  .appbar{gap:8px;padding:10px 14px;overflow:visible}
  .global-actions{gap:6px;min-width:0}
  .global-search{flex:0 0 48px;width:48px;min-width:48px;padding-left:0;justify-content:center}
  .global-search input{display:none}
  .global-search-ic{display:none}
  .global-search-go{width:44px;height:44px;background:#fff;color:var(--coral);box-shadow:var(--shadow)}
  .global-quick{gap:6px}
  .global-act{min-height:44px;padding-inline:12px}
  .dashboard-appbar-branch{flex:0 1 170px;min-width:132px}
  .dashboard-appbar-branch select{font-size:12.5px;padding-left:12px;padding-right:28px;text-overflow:ellipsis}
  .workspace-language-picker{display:none}
  .business-workspace-switch .who,.profile .who{max-width:156px}
  .business-workspace-switch .who span:not(.avatar),.profile .who div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}

.mobile-action-sheet .workspace-language-picker{width:100%;min-width:0;border-radius:12px;font-size:16px}
.mobile-action-sheet .btn{width:100%;justify-content:center}

/* settings — tabbed sections so each save has a clear, small scope instead of one long page */
.settings-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line)}
/* Wave 1 (Top-20 #4): the folder-tab (red underline, squared top corners) was one of five
   selected-tab languages. Tabs are now members of the one segmented pattern. */
.settings-tab{min-height:44px;padding:10px 16px;border:0;background:transparent;

  transition:color .14s,background .14s}

.workspace-logo-editor{display:grid;grid-template-columns:92px minmax(0,1fr);gap:16px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.workspace-logo-preview{width:92px;height:92px;border-radius:24px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;overflow:hidden;font-size:30px;font-weight:800;color:var(--red)}
.workspace-logo-preview img{width:100%;height:100%;object-fit:cover;display:block}
.workspace-logo-fields{min-width:0}
.settings-scope{color:var(--muted);font-size:12px;line-height:1.4;flex:1 1 160px;min-width:0}
.switchrow{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 4px;font-size:12.5px;color:var(--ink2)}
.tglsw{position:relative;width:44px;height:44px;border-radius:999px;background:transparent;cursor:pointer}
.tglsw::before{content:'';position:absolute;left:4px;top:11px;width:36px;height:21px;border-radius:999px;background:var(--line);
  transition:background .18s var(--ease);flex-shrink:0}

.tglsw::after{content:'';position:absolute;top:13px;left:6px;width:17px;height:17px;border-radius:999px;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s var(--spring)}

/* universal importer modal */
.modal{position:fixed;inset:0;z-index:210;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(23,22,26,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .18s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:var(--dialog-w-lg);max-width:100%;
  max-height:88vh;overflow-y:auto;padding:26px;animation:pop .22s var(--spring);transform-origin:center}
/* W5-2 shared mobile-sheet behaviour ("sheets for content and actions, centred cards for short
   confirmations"): a content-heavy dialog becomes a full-width bottom sheet at <=600px instead of
   a centred card. One rule for all six dialogs that need it, replacing six near-identical copies.
   customer-scan-modal already carries its own unconditional bottom-anchored pill treatment
   (declared later in this file), which — being equal specificity and later in source — continues
   to win for it at every width; it is listed here for the categorisation, not to override that
   design. customer-confirmation-modal and customer-redemption-modal are deliberately NOT sheets —
   a one-line decision and a celebration moment both read better centred. */
@media(max-width:600px){
  .till-add-sheet-v373,.appointment-detail-modal,.customer-scan-modal,.customer-offer-detail-modal,
  .customer-business-detail-modal,.customer-share-modal{align-items:flex-end;padding:0}
  .till-add-sheet-v373 .modal-card,.appointment-detail-modal .modal-card,.customer-scan-modal .modal-card,
  .customer-offer-detail-modal .modal-card,.customer-business-detail-modal .modal-card,.customer-share-modal .modal-card{
    width:100%;max-height:92dvh;border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
}
/* V350 (owner mockup, photo 3): welcome offer modal — icon hero, an icon+label toggle row instead
   of a bare checkbox, card-style radio options with a selected highlight, and a tinted info box.
   V362 (owner, photo 4: "compact, premium SaaS form, not large accessibility-style controls").
   Every control here was oversized: a 22px checkbox rendering as a giant blue square, option cards
   with huge padding, tall inputs, and section gaps ~30% larger than the rest of the admin UI. The
   sizes below are the owner's own numbers. The selected state deliberately changes only colour —
   never size — so a row cannot change height when it is picked. */
.welcome-offer-modal-v350 .modal-card{position:relative;padding:22px}
.welcome-offer-modal-v350 .welcome-offer-close-v350{position:absolute;top:18px;right:18px}
.welcome-offer-modal-v350 h2#welcomeOfferTitleV215{font-size:22px!important}
.welcome-offer-modal-v350 label{font-size:14px}
.welcome-offer-modal-v350 input:not([type="checkbox"]):not([type="radio"]),
.welcome-offer-modal-v350 select{min-height:48px;border-radius:12px;padding:10px 12px;font-size:15px}
.welcome-offer-modal-v350 .welcome-offer-hero-v350{width:46px;height:46px;min-width:46px;flex:none;border-radius:14px;background:var(--tint);color:var(--coral);display:flex;align-items:center;justify-content:center;margin-top:2px}
/* Problem 5 — a compact setting row, not a bordered selection box. */
.welcome-offer-modal-v350 .welcome-offer-togglerow-v350{display:flex;align-items:center;gap:10px;min-height:58px;padding:10px 14px;border:1px solid var(--control-border);border-radius:12px;background:var(--shell);cursor:pointer}
.welcome-offer-modal-v350 .welcome-offer-togglerow-v350>b{flex:1;min-width:0;font-size:15px}
.welcome-offer-modal-v350 .welcome-offer-togglerow-icon-v350{width:28px;height:28px;min-width:28px;border-radius:9px;background:var(--tint);color:var(--coral);display:flex;align-items:center;justify-content:center}
/* Problem 1 — a normal compact checkbox. accent-color keeps the native tick inside the box. */
.welcome-offer-modal-v350 .welcome-offer-togglerow-v350 input[type="checkbox"]{margin-left:auto;flex:none;

/* V366 — the Birthday gift modal (owner markup, photo 1: oversized checkbox, a double-outlined
   dropdown, oversized radios, and timing options spread too far apart). Every one of those is the
   same root cause: the modal reused the welcome-offer MARKUP but not its class, so its controls
   fell through to the global `input,select,textarea{width:100%;min-height:var(--control-h)}` rule
   and a checkbox became a 44px square. This is the welcome-offer treatment, scoped to its own
   class and tightened to the sizes the owner asked for. */
.birthday-gift-modal-v366 .welcome-offer-togglerow-v350{display:flex;align-items:center;gap:10px;min-height:52px;padding:9px 14px;border:1px solid var(--control-border);border-radius:12px;background:var(--shell);cursor:pointer}

/* Issue 1 — a standard compact checkbox, fixed box so the row cannot grow when it is ticked. */

/* V324 (owner markup 2026-08-14): a line drawn between the two columns with "separate them", a
   ringed "+" beside each heading, and the reward row ringed as belonging to the programme above.
   The divider is a border on the second column and only exists at the width where the two are
   actually side by side — below 1200px the split stacks, and a left border on a stacked column
   is a stray vertical line, not a separator. */
.grow-overview-column-head-v324{display:flex;align-items:center;gap:10px}
.grow-overview-column-head-v324 .grow-overview-column-title-v319{margin:0}
.grow-overview-add-v324{margin-left:auto;min-width:30px;padding:2px 9px;font-size:16px;line-height:1.35;font-weight:800;border-radius:999px}
@media(min-width:1201px){.grow-overview-split-v319{gap:28px}
  .grow-overview-column-v319[data-grow-overview-category-v319="offers"]{border-left:1px solid var(--hair);padding-left:28px}}
/* ============ v401 — REWARDS OVERVIEW VISUAL PASS ==========================================
   The page carried zero icons and four nested .card levels all painted #FFFFFF, while the list
   view one click away carried seven marks and the Dashboard already led its section headings with
   a coral glyph. Nothing here invents a new language; it applies the one that already exists at
   its three established sizes (56px thumb / 40px tile / 18-24px inline glyph).
   Colour stays inside coral, blush, neutral and the two semantics already in use. */

/* The module mark on the page's own H1 — the slot every other top-level page already fills. */
.grow-title-mark-v401{display:inline-flex;align-items:center;color:var(--coral);flex:0 0 auto}

/* Both column heads become one tinted bar, with the ringed "+" pulled inside it so the control
   sits with the thing it adds to rather than floating at the far end of a bare flex row. */
.grow-overview-column-head-v324{gap:9px;padding:9px 12px;border-radius:12px;background:var(--tint)}
.grow-overview-column-mark-v401{display:inline-flex;align-items:center;color:var(--coral);flex:0 0 auto}
.grow-overview-add-v324{background:transparent;border-color:transparent}
.grow-overview-add-v324:hover{background:#fff;border-color:var(--hair)}

/* The type mark on a parent programme row. Muted so a column of them reads as texture rather
   than as eight competing accents; child rows never get one (see growOverviewNameColumnV324). */
.grow-overview-name-v401{display:inline-flex;align-items:baseline;gap:7px;min-width:0;text-align:left}
.grow-overview-row-mark-v401{color:var(--coral);opacity:.72;flex:0 0 auto;align-self:center}

/* The analytic half of the page. The heading takes the same icon+copy composition the Dashboard's
   .performance-heading uses, and the illustration sits opposite it. */
/* align-items:center, not flex-start, and the illustration stays IN FLOW. Both were arrived at by
   measurement. Top-aligned and in flow, a 96px image beside 43px of copy made the row 96px tall and
   left a 67px hole above the comeback card. Pulled out of flow with position:absolute the hole
   closed, but the image then hung 29px down over that card's top-right corner. A 96px ornament next
   to a 43px heading can only add height or overlap something, so it becomes a deliberate header
   band instead: the copy centres against the image, and the band reads as the divider between the
   configuration half of the page and the measurement half. */
.grow-analytics-head-v401{display:flex;align-items:center;gap:20px}
.grow-analytics-head-copy-v401{min-width:0;flex:1 1 auto}
.grow-analytics-head-v401 h2{display:flex;align-items:center;gap:9px}
.grow-analytics-head-v401 h2>.cui-icon{color:var(--coral);flex:0 0 auto}

/* Nesting level 3 steps back to the page ground so the KPI tiles at level 4 — which stay white —
   become the brightest surface on the page. This is the inversion that keeps the two comeback
   numbers dominant, and it is why no illustration goes inside this card. */
.grow-comeback-card-v401{background:var(--bg);box-shadow:none;border:1px solid var(--hair)}
.grow-comeback-kpi-v401{background:#fff}
.grow-comeback-kpi-v401 .l{display:flex;align-items:center;gap:6px}
.grow-comeback-kpi-v401 .l>.cui-icon{color:var(--coral);flex:0 0 auto}
.grow-comeback-kpi-v401.is-returned-v401 .l>.cui-icon{color:var(--green)}
.grow-comeback-kpi-v401 .v{font-size:2.125rem}

/* --- the two illustrations ---------------------------------------------------------------
   Both are decoration: aria-hidden, and each is gated so it can only appear where it has room.
   Hidden by default, shown by the media queries below — so a viewport that matches neither rule
   renders no illustration at all rather than an unsized one. */
.grow-illus-v401{display:none;flex:0 0 auto;height:auto;max-width:100%;user-select:none;pointer-events:none}

/* Retention: 96px, right-aligned in the heading's margin, ornamental and subordinate by design.
   Below 1024 the heading's free width falls to 62px, which will not take it, so it goes. */
/* Below 1024 the heading's free width falls to 62px, which will not take it, so it goes entirely —
   and because it is display:none the browser never fetches the file at all. */
@media(min-width:1024px){.grow-illus-retention-v401{display:block;width:96px;opacity:.92}}

/* Limited Offer: 132px, centred, the focal object of an otherwise empty panel. Gated on the SAME
   1201px breakpoint the two-column split uses — the void it fills is created by that split, so
   when the columns stack the illustration has no reason to exist. That gate also means it never
   reaches tablet or phone. The size gap (132 vs 96) plus centred-vs-margin placement is what keeps
   the two from reading as competing objects when both are on screen. */
.grow-overview-column-v319 .empty .grow-illus-offer-v401{margin:0 auto 14px}
@media(min-width:1201px){.grow-illus-offer-v401{display:block;width:132px}}

@media(prefers-reduced-motion:no-preference){.grow-illus-v401{transition:opacity .2s ease}}

@media(max-width:640px){
  .grow-overview-column-head-v324{padding:8px 10px}
  .grow-analytics-head-v401{gap:0}
  .grow-comeback-kpi-v401 .v{font-size:1.9rem}
}
/* A date is one token to a reader and must never break across lines — dd/mm/yyyy in a narrow
   column wraps after the "20" and prints the year as "20 26", which is worse than the long form
   it replaced. Only above the 767px stack point: below it the responsive table gives each cell
   the full row width, and nowrap there could push a long value out of the card instead. */
@media(min-width:768px){.grow-overview-column-v319 .cui-table td[data-label="Started"],
  .grow-overview-column-v319 .cui-table td[data-label="Ends"],
  .grow-overview-column-v319 .cui-table td[data-label="Ran from"],
  .grow-overview-column-v319 .cui-table td[data-label="Ran until"]{white-space:nowrap}}
/* V385: the child indent is a real glyph now, not a ::before connector a narrow-screen rule
   deleted — on a tablet the gift rows lost their indent AND ran into the parent note. */
.grow-overview-child-v324{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:6px;align-items:start}
.grow-overview-arrow-v385{color:var(--muted);font-size:13px;line-height:1.45}

/* ---- nestly_v413: the usage table's gift groups collapse -----------------------------------
   Owner, photo 1: a brace down the ten gifts under Point system ("if under point system, then
   minimise under Point System") and a second on the lone Birthday benefit gift ("minimise").
   The disclosure IS the category name, so it must not look like a button dropped into a table
   cell: no border, no background, no padding that would shift the name off the column edge the
   other parent rows align to. It reads as the same bold name it was, with a caret in front and
   the gift count behind. Only the caret and the hover underline say it is pressable. */
.grow-usage-disclosure-v413{display:inline-flex;align-items:baseline;gap:6px;flex-wrap:wrap;
  background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.grow-usage-disclosure-v413 b{font:inherit;font-weight:700}
.grow-usage-disclosure-v413:hover b{text-decoration:underline}
.grow-usage-disclosure-v413:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.grow-usage-caret-v413{color:var(--muted);font-size:11px;line-height:1.6}
.grow-usage-count-v413{font-weight:400}

/* ---- v401b: parent/child hierarchy in the Rewards & Loyalty table ------------------------
   Measured before this block: the parent name sat at x=189 and the child name at x=183, so a
   child reward was OUTDENTED by 6px — the arrow took the slot the parent's kind mark occupies and
   the name then started earlier than its parent's. With both names at weight 750 and zero row gap,
   three rows read as three peers, which is what the owner saw.
   Every rule below is scoped to the rewards column so History and the usage table are untouched.
   The row-shape selectors use :has(), already used elsewhere in this stylesheet, because
   growTableV271 is shared by several tables and emits a bare <tr> with no per-row hook. */
.grow-overview-column-v319[data-grow-overview-category-v319="rewards"] .grow-overview-child-v324{
  padding-left:28px}
/* Readable, not shouted: one weight step down and the secondary ink, never a smaller size — these
   are reward names an owner has to be able to read at a glance. */
.grow-overview-column-v319[data-grow-overview-category-v319="rewards"] .grow-overview-child-v324 b,
.grow-overview-column-v319[data-grow-overview-category-v319="rewards"] .grow-overview-child-v324 .grow-overview-open-v388{
  font-weight:600;color:var(--ink2)}
.grow-overview-column-v319[data-grow-overview-category-v319="rewards"] .grow-overview-arrow-v385{
  color:var(--coral);opacity:.55}

/* nestly_v410 (owner photo 2: a hand-drawn arrow against each gift row in "Customers who used each
   programme", with "put arrow under point system if it's under point system"). V401b gave the
   Rewards & Loyalty table this hierarchy and scoped every rule to that column, saying so in its own
   comment — so this table stayed flat and four gifts read as peers of the engine they hang off.
   Same class names, same indent step, same one-weight-down treatment, scoped to this table. */
[data-grow-usage-table-v410] .grow-overview-child-v324{display:inline-flex;align-items:baseline;gap:6px;padding-left:20px}
[data-grow-usage-table-v410] .grow-overview-child-v324 b{font-weight:600;color:var(--ink2)}
[data-grow-usage-table-v410] .grow-overview-arrow-v385{color:var(--coral);opacity:.55}
/* Below the stack point a row is three stacked cells, so the indent would sit under a label rather
   than under the parent's name. The arrow alone carries the relationship there. */
@media(max-width:768px){[data-grow-usage-table-v410] .grow-overview-child-v324{padding-left:0}}

/* Vertical grouping. A child gets a little more room than a plain row; the FIRST child gets a
   touch more still, and a parent that follows a child group gets the largest step, so the eye
   reads "new programme starts here" without a rule or a background.
   Scoped to >=768px because below the stack point a row is FOUR stacked cells, not one line —
   padding on every cell multiplied by four, which grew each child row from 155px to 231px. */
@media(min-width:768px){
  .grow-overview-column-v319[data-grow-overview-category-v319="rewards"] tbody tr:has(.grow-overview-child-v324)>td{
    padding-top:16px;padding-bottom:16px}
  .grow-overview-column-v319[data-grow-overview-category-v319="rewards"] tbody tr:not(:has(.grow-overview-child-v324))+tr:has(.grow-overview-child-v324)>td{
    padding-top:19px}
  .grow-overview-column-v319[data-grow-overview-category-v319="rewards"] tbody tr:has(.grow-overview-child-v324)+tr:not(:has(.grow-overview-child-v324))>td{
    padding-top:22px}
}
/* Two consecutive children belong together, so the hairline between THEM is softened while the
   hairline that closes the group is left alone. Softened, not removed — the row boundary still
   has to exist for a reader scanning the Setting column. */
.grow-overview-column-v319[data-grow-overview-category-v319="rewards"] tbody tr:has(.grow-overview-child-v324):has(+tr:has(.grow-overview-child-v324))>td{
  border-bottom-color:var(--hair)}

/* Below the stack point each row becomes four labelled blocks. The indent still works — the value
   sits in a grid column that starts at a fixed left edge, not against the right rail — so it is
   kept, slightly tighter for the narrower measure. The group break is put on the Programme cell
   ALONE, which is where the eye enters the block, instead of on all four. */
@media(max-width:767px){
  .grow-overview-column-v319[data-grow-overview-category-v319="rewards"] .grow-overview-child-v324{
    padding-left:26px}
  .grow-overview-column-v319[data-grow-overview-category-v319="rewards"] tbody tr:not(:has(.grow-overview-child-v324))+tr:has(.grow-overview-child-v324)>td:first-child,
  .grow-overview-column-v319[data-grow-overview-category-v319="rewards"] tbody tr:has(.grow-overview-child-v324)+tr:not(:has(.grow-overview-child-v324))>td:first-child{
    padding-top:14px}
}

@media(max-width:600px){.grow-usage-chart-row-v386{grid-template-columns:minmax(0,1fr) auto}.grow-usage-chart-track-v386{grid-column:1/-1;order:3}}

/* Program Studio (PS-1A authoring surface) — theme-aware via existing tokens only */
.studio-row{padding:12px 0;border-bottom:1px solid var(--line)}
.studio-row:last-child{border-bottom:none}
.studio-row-main{min-width:0}
.studio-authoring-note{font-style:italic;color:var(--muted)}
.studio-tech{margin-top:8px}
.studio-tech summary{cursor:pointer;color:var(--coral);font-size:12px;font-weight:600;min-height:32px;display:flex;align-items:center}
.studio-tech code{overflow-wrap:anywhere}
.studio-editor{border:1px solid var(--coral)}
.studio-step{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;margin:12px 0}
.studio-step legend{font-size:12px;font-weight:700;color:var(--muted);padding:0 6px;text-transform:uppercase;letter-spacing:.05em}
.stCond,.stEff{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--hair)}
.stCond:last-child,.stEff:last-child{border-bottom:none}
.stCond>select,.stEff>select{flex:0 1 auto;min-width:130px;min-height:44px}
.edCondValCell,.edEffValCell{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex:1 1 170px;min-width:0}
.edCondValCell input,.edCondValCell select,.edEffValCell input,.edEffValCell select{min-width:96px;min-height:44px}
.edEffLbl{font-size:12px;color:var(--muted)}
.edDowLbl{display:inline-flex;align-items:center;gap:5px;font-size:13px;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:999px}
.studio-advanced{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.studio-advanced summary{cursor:pointer;font-weight:600;color:var(--coral);min-height:44px;display:flex;align-items:center}
.studio-canon{margin-top:10px}
.studio-pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--tint);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;font-size:11.5px;max-height:220px;overflow:auto;margin-top:6px}
.studio-preview{margin-top:12px}
.studio-preview-card{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:var(--tint)}
.studio-econ{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.studio-econ-line{padding:6px 0;border-bottom:1px solid var(--hair)}
.studio-econ-line:last-child{border-bottom:none}
.studio-ok{color:var(--green);font-weight:600}

.studio-effect-state{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:4px 0;flex-wrap:wrap}
.studio-effect-state>span{font-size:13px}
.studio-rule-controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.studio-emg-banner{margin-top:8px;border:1px solid var(--red);background:var(--tint);border-radius:var(--r-sm);padding:8px 10px;font-size:13px}
.studio-impact-rule{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin-top:10px}

.spacer{flex:1}
.frontline-card{max-width:460px;margin:0 auto}
/* V399 (owner, photo 1: the typed number ringed with "number increase size, too small").
   The keypad digit below it is 22px on a 60px key; the number those keys PRODUCE was barely
   half a step larger, so the one value the cashier has to read back to a customer was the
   smallest confident thing on the card.
   The size was not the whole story. `.frontline-phone` is (0,1,0) and the base control rule
   `input:not([type="checkbox"]):not([type="radio"])` above is (0,2,1), so the base rule won and
   the number had been rendering at the ordinary 15px control size all along — the declared 34px
   never reached the screen once. Measured in Chromium before and after, not read off the
   stylesheet. Hence the selector carries the card too: (0,2,1), and later in the sheet, so it
   actually applies. Raised to 46px with a matching height bump — the card keeps its 460px
   max-width, so nothing around it moves. */
.frontline-card input.frontline-phone{font-size:46px;font-weight:700;text-align:center;height:76px;
  letter-spacing:.06em;font-variant-numeric:tabular-nums}
.frontline-keypad{grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.frontline-keypad .btn{height:60px;font-size:22px;font-weight:700}
.frontline-tenders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.frontline-tenders .btn{min-height:52px;font-size:15px}
/* nestly_v578 (owner, photo 2): the tender buttons now carry a pictogram beside their label. The
   icon takes the button's own colour, so it inverts with the label on the pressed (filled) state
   instead of needing a second rule. */
.frontline-tenders .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px}
.frontline-tenders .btn>svg{flex:0 0 auto;opacity:.85}
.frontline-tenders .btn[aria-pressed="true"]>svg{opacity:1}
.frontline-tenders .btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.till-cart-card{max-width:560px}
.till-cart-catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-top:6px}
.till-cart-catalog .btn,.till-cart-catalog .choice-button{min-height:64px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;text-align:left;padding:10px 12px;font-size:14px;font-weight:600;line-height:1.25}
.till-cart-catalog .btn .till-cart-price,.till-cart-catalog .choice-button .till-cart-price{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.till-cart-catalog .choice-button{position:relative}
.till-cart-catalog .choice-button.has-image{display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:10px;padding-right:40px}
	.till-choice-image,.catalogue-thumb{width:42px;height:42px;border-radius:12px;object-fit:cover;background:var(--wash);border:1px solid var(--line);box-shadow:0 4px 12px rgba(32,24,18,.08)}
	.catalogue-thumb:not(img){display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.till-choice-text{min-width:0;display:flex;flex-direction:column;gap:2px}
.till-cart-catalog .choice-button.is-selected{border-color:var(--coral);background:#FFF3EE;box-shadow:0 0 0 1px rgba(196,61,50,.12)}
.till-choice-qty{position:absolute;top:8px;right:8px;min-width:24px;height:24px;border-radius:999px;background:var(--coral);color:white;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.till-sale-package-options{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--shell);padding:0 12px}

/* V458: the ladder contains its own overhang at EVERY width. Each stop is position:absolute with
   translateX(-50%) and min-width:92px, so the top tier — always at left:100% by construction, it
   is the one that defines the maximum — hangs ~46px past the ladder's right edge, and a long tier
   name hangs further still. `overflow:auto` was applied only inside @media(max-width:768px), so
   below 769 the ladder swallowed its own overflow and above it the overflow reached the document:
   measured documentElement.scrollWidth - clientWidth = 4px at 1024/1180/1280/1440, 0px at 900 and
   below. Same shape as REG-003 — a containment rule that exists but is scoped away from the
   widths that need it — except here the media query is too NARROW rather than defeated.
   `overflow-x:clip` is the containment rather than `auto`, for two measured reasons. `auto` (or
   `hidden`) on one axis forces the other to `auto` too, and the stops legitimately paint 6px below
   the ladder's box — that turned into a clipped label or a stray vertical scrollbar. `clip` is the
   only value that leaves `overflow-y:visible` alone. And `overflow-clip-margin` lets the 46px
   overhang keep PAINTING while contributing no scrollable overflow, so the fix costs nothing
   visually: the top tier's label still sits centred on the end of the rail, it just no longer
   drags the document with it. The @media(max-width:768px) rule below still switches the ladder to
   a real scroller, because there the rail is deliberately wider than the screen. */
.grow-tier-ladder-v343{position:relative;min-height:118px;margin:4px 8px 0;padding:26px 0 62px;overflow-x:clip;overflow-y:visible;overflow-clip-margin:60px}

.grow-points-form-card-v343.grow-points-form-modal-v410{position:fixed;z-index:71;top:50%;left:50%;transform:translate(-50%,-50%);

     wrapping flex row in the responsive layer below it (measured: computed display is `flex`, which
     is why an earlier attempt at grid-template-columns changed nothing). In a dialog that width
     does not exist, so it becomes a plain column: one field per line, full width. Declared as flex
     rather than grid so it wins whichever of the two the cascade has landed on.
     nestly_v422 (owner photo 3, the whole dialog ringed: "please fix this misalignment").
     flex-wrap:wrap came in from `.grow-setup-rewardlist-v301>li` and was never overridden here, so

     appeared beside the title instead of under the form), and each wrapped column shrank to its
     own content — 273px inside a 480px dialog, so no two fields ended at the same place.

   flex column and each child is simply bounded by it. */

   box's breathing room inside a sentence. With width:100% and border-box that is 8px MORE than
   the content box, so the field would run past the dialog's right edge by exactly that much.

/* nestly_v748 (owner photos 1 and 2, red boxes drawn round the tier-name field). Every field in
   these pop-ups is written as `<label><br><input>` inside one <p>. An inline-block input sits on
   the text baseline, so the line box that holds it reserves a descender's worth of leading BELOW
   it and the label's own half-leading above — 104px of paragraph for a 17px label and a 44px
   field. The label therefore floated a long way from the box it names, and the run of fields had
   no rhythm at all: the gap inside a field group was larger than the gap between groups.
   Stacking the paragraph as a flex column removes the baseline entirely, so the label sits 6px
   above its own input and the groups are separated by the dialog's own 12px gap. The <br> is a
   line break with nothing left to break and would otherwise become a flex item of its own.
   `:not(.row)` keeps the paragraphs that are deliberately horizontal (the "+ Add benefit" row)
   exactly as they are. */
.grow-inline-modal-v658 .grow-setup-sentence-v301:not(.row){display:flex;flex-direction:column;align-items:stretch;gap:6px}

   MEASURED: the generic `label{margin:16px 0 6px}` rule (this sheet, base element styles) still
   applied to every <label> inside these paragraphs — a flex item's own margin is not absorbed by
   its parent's `gap`, the two simply add — so "Tier name" sat 16px below the paragraph's own top
   edge and 12px above its input (6px of that own margin-bottom plus the paragraph's 6px gap),
   not the 6px the v748 comment describes. Zeroed here, the same way the paragraph's OWN margin is
   zeroed three lines up: the flex column's 6px gap becomes the entire, single source of the
   label-to-input rhythm this dialog already declared. */
.grow-inline-modal-v658 .grow-setup-sentence-v301:not(.row)>label{margin:0}

   the points fields under A free gift). The flex rule above is a class selector, so it outranks
   the browser's own [hidden]{display:none} — the same trap nestly_v745 hit with .password-icon-
   button. The four referral paragraphs that swap with the reward kind are toggled with `hidden`,
   and from v748 on they were never actually hidden. Restated here at higher specificity so
   `hidden` means hidden again, whatever display the paragraph otherwise has. */
.grow-inline-modal-v658 .grow-setup-sentence-v301[hidden]{display:none!important}
.grow-inline-modal-v658>.row{margin-top:0!important;justify-content:flex-end}

/* V212 (owner, third report: "calendar still not able to press into the appointment details").
   This header is sticky at z-index 7 and the appointment buttons are z-index 6, so once the track
   is scrolled the header sits OVER the top of an appointment — including its name, which is
   exactly where anyone taps. Measured in the browser: at one ordinary scroll position the block's
   title was 68px underneath the header, and that region belongs to the header, which does
   nothing when clicked. Scroll-dependent, which is why it read as intermittent and why two
   earlier fixes of mine missed it.
   The header carries no controls at all — an avatar, a name and the opening hours — so it can
   keep covering the content visually while never intercepting a tap. scroll-padding-top then
   stops programmatic scrolls parking an appointment underneath it in the first place. */

/* V200 (owner: "not able to click in the specific appointments"). These three rules used to live
   ~760 lines EARLIER in this sheet. `.week-blocked-window` and `.day-blocked-window` are both
   single-class selectors, so specificity ties and source order decides — every one of these
   declarations was silently losing to the base rule above. The week view therefore inherited
   z-index:4 (above .calendar-event at 2/3) and min-height:44px, so a blocked window painted over
   the appointments beside it and swallowed their clicks. Ordering IS the fix; keep them here.
   pointer-events:none makes it structural rather than a stacking coincidence: the week variant

/* V294 (owner sketch 2026-08-12): compact summary card at the upper right of the Customer 360
   content area — visits, lifetime spend, points, credit, PDPA as dense rows.
   V295 (owner markup 2026-08-13: "there's an empty box and UI UX not aligned"): the flex band
   that held it is gone. .c360-top-main-v294 was flex:1 1 240px, which the mobile column direction
   read as a 240px basis HEIGHT — a literal empty box under the chips — and on desktop the band's
   height was set by this card, leaving a tall void in the left column. The card is a cell of the
   content grid now, so it keeps the upper right and no column starts empty. */
.c360-content-split-v295{align-items:start}
/* nestly_v476 (owner photo 1: "please flush the boxes, no empty gaps"). Each half is now its own
   flex stack, so a card follows the card above it instead of waiting for the taller card in the
   other column to finish its grid row. The two columns can still end at different heights — that
   is a short tail, not a gap between boxes, and it is unavoidable without reflowing by height
   (which would move the summary card out of the top-right slot v294/v295/v442 built). */
.c360-col-v476{display:flex;flex-direction:column;gap:16px;min-width:0;align-self:start}
.c360-col-v476:empty{display:none}
/* nestly_v540 (owner, photo 1: a red box drawn over the empty space beside the summary card —
   "enlarge the boxes to make the boxes look aligned with its counterparts below"). THE TWO
   `align-self:start` DECLARATIONS BELOW ARE GONE, and the reason is an axis flip nobody would
   spot by reading either change on its own.
   V294/V295 wrote them when .c360-content-split-v295 was a GRID and these were grid cells. In a
   grid, align-self is the BLOCK axis, so `start` meant "do not stretch to the height of the
   tallest card in the row" — correct, and invisible horizontally.
   nestly_v476 then made each column `display:flex;flex-direction:column` to close the vertical
   gaps. In a COLUMN flex container the cross axis is HORIZONTAL, so the very same declaration
   started shrinking these cards to their content width instead.
   MEASURED against the Referral & consent card directly beneath them, which has no align-self and
   therefore stretches: summary 230px vs referral 480 / 688 / 928px at 1024 / 1440 / 1920. The card
   was frozen at 230px at every desktop width — the empty space the owner boxed. Removing the
   declaration restores the flex default (stretch) and the two match exactly at all four widths;
   mobile was already 342/342 and is untouched.
   .c360-col-v476 KEEPS its own align-self:start: that element IS a grid child of .split, so there
   the declaration still means the block axis, and still correctly stops a short column stretching
   to the taller one's height. */
.c360-summary-card-v294{padding:12px 16px}
.c360-summary-row-v294{display:flex;gap:12px;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--hair)}
.c360-summary-row-v294:last-of-type{border-bottom:0}
.c360-summary-label-v294{color:var(--muted);font-size:12.5px;font-weight:650}
.c360-summary-value-v294{font-variant-numeric:tabular-nums;font-size:14px;text-align:right}
.c360-summary-card-v294 .c360-points-expiry{margin-top:2px}
.c360-summary-card-v294 .customer360-points-paused-v259{margin-top:2px}
/* V295: 960px is where .split collapses to one column. The summary card is ordered first there,
   so the figures stack ABOVE the programme list rather than floating between two cards. */
/* nestly_v603 (owner photo 8: the four period options ringed as a stacked list — "make into sub
   tab so cleaner"). They were already buttons, but this segment sits inside a wrapping filter bar,
   so once the bar ran out of width the four pills folded into a column and read as an open
   dropdown. They now stay on one line and the strip scrolls if the bar is narrow, which is the
   treatment .v150-segment already gives itself on small screens. */
.grow-usage-quick-v388{max-width:100%;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.grow-usage-quick-v388::-webkit-scrollbar{display:none}
.grow-usage-quick-v388 button{flex:0 0 auto;white-space:nowrap}
@media(max-width:960px){.c360-summary-card-v294{order:-1;width:100%}}
/* V442: Package detail sits UNDER the summary card, in the right column the owner circled.
   Grid cells are auto-placed in DOM order, so the two share one cell rather than the package
   card falling into the left column of the next row. The wrapper inherits the summary card's
   own 960px "stack first" rule so the figures still lead on a phone. Everything inside the
   card reuses .c360-summary-row-v294 / .pill / .c360-reward-adjust — the only new rules are
   the separator between packages and the muting of an exhausted one. */
.c360-summary-stack-v442{display:grid;gap:16px;min-width:0;max-width:100%}
@media(max-width:960px){.c360-summary-stack-v442{order:-1;width:100%}}
/* The separator is an ADJACENT-SIBLING rule, not :first-of-type: the branch picker above the
   list is also a div, so :first-of-type would match IT and leave a rule above the first
   package. This way the rule can only ever fall between two packages. */
.c360-package-v442{margin-top:10px}

.help-dot-bubble-v385{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);z-index:30;
  width:max-content;max-width:min(260px,70vw);padding:8px 10px;border-radius:10px;

/* nestly_v594 (owner photo 4: "the ? function does not work"). It did fire — the bubble was drawn
   and then clipped away. `.cui-table-wrap` scrolls horizontally, and per spec a non-visible value
   on one axis forces the other to `auto` too, so the wrap clips vertically as well. (Written
   without the literal property/value pair: two release-blocker tests slice this stylesheet by
   text and forbid that token appearing anywhere in the mobile shell range, comments included.)
   Measured at
   1280x900: the bubble's box sat entirely ABOVE the wrap's top edge (top 746.4 vs wrap top 793),
   i.e. 100% clipped, on a header cell in the first row. Inside a table wrap it therefore opens
   DOWNWARD, into the rows, where the wrap's own box contains it. Everywhere else — the Blocked
   time heading, and any future caller outside a scroll container — is untouched. */
.cui-table-wrap .help-dot-bubble-v385{bottom:auto;top:calc(100% + 8px);
  /* Centred on the dot, the bubble overflowed the wrap's RIGHT edge by 70px at 390px wide
     (measured) — the same clip, on the other axis. Hanging it from the dot's right edge keeps it
     inside whatever room is left, at every width tested (390 / 1280, one row and two). */
  left:auto;right:0;transform:none;max-width:min(260px,calc(100vw - 48px))}
.cui-table-wrap .help-dot-bubble-v385::after{top:auto;bottom:100%;left:auto;right:6px;transform:none;
  border-top-color:transparent;border-bottom-color:var(--ink)}

.customer-merchant-hero{position:relative;overflow:hidden;min-height:280px;padding:0;border:0;border-radius:24px;background:var(--merchant-accent,#28212f);color:#fff;box-shadow:0 20px 48px rgba(23,22,26,.2)}
