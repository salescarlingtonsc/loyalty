/* nestly_v421 (owner, photo 1: "picture not max out … want uploaded photo full to picture" and
   "why here have big empty space", with the follow-up "your previous fix only fix the empty space
   for 1 photo — it needs to be for all photos moving forward").
   The offer card's frame was fixed in two places and the artwork had to fit whatever was left:
   a 16:9 media box (bars beside a portrait poster) and a copy block with a fixed height (a blank
   strip under short copy). Which of the two an owner saw depended on the shape of the photo they
   uploaded — so a fix aimed at one card never held for the next.
   Here the copy hugs its own content and the media takes every remaining pixel of the card, whose
   min-height still sets the row's shared size. The picture is still CONTAINed — never cropped,
   V173/V371, reaffirmed by the owner 2026-08-19 — and what fills the margin around it is the same
   picture, scaled up and blurred behind it (--offer-art, set by customerHomeOfferMarkupV167), so
   the frame reads as full-bleed artwork rather than as empty space. */
.customer-home-offer-media{aspect-ratio:auto;flex:1 1 0%;min-height:88px}
.customer-home-offer-media>img{position:relative;z-index:1;object-fit:contain}
/* nestly_v487 (owner, photo A: the bars either side of a portrait poster ringed - "solve ugly
   photo alignment"). The poster is still CONTAINed, never cropped - that is a standing owner
   ruling (V173/V371, reaffirmed 2026-08-19) and this does not touch it. What was ugly is what
   filled the margin: v421 blurred the artwork and pushed saturate(1.12) THROUGH it, so a colourful
   promo turned the frame into a saturated rainbow smear that fought the poster it was meant to sit
   behind. It is desaturated and dimmed now, so it reads as a soft neutral mount rather than as a
   second, louder picture; a flat scrim on top evens out whatever the artwork happens to be. */
.customer-home-offer-media.has-art-v421::before{content:"";position:absolute;inset:-14%;z-index:0;background-image:var(--offer-art);background-size:cover;background-position:center;filter:blur(26px) saturate(.42) brightness(.88)}
.customer-home-offer-media.has-art-v421::after{content:"";position:absolute;inset:0;z-index:0;background:rgba(23,22,26,.18);pointer-events:none}
/* And the alignment itself: the poster used to run edge to edge into that smear. A small inset
   plus its own corner radius and shadow makes it read as a picture deliberately mounted in a
   frame, which is what stops the two layers looking like a mistake. */
/* nestly_v495 (owner, photo 3 vs photo 4: "in customer view the photo should be to scale, photo 4
   is beautifully scaled. I need the limited offer in home page to be bigger and able to scale the
   image to be clear and readable").
   Photo 4 is the BUSINESS page's offer card, where the image runs the full card width at its own
   natural aspect ratio and IS the top of the card. Photo 3 is the Home card, where the artwork was
   contained inside a height-rationed media box on a 320px tile, mounted on a blur — legible as a
   thumbnail, not as a poster. Three changes close the gap:
     1. the card grows: min(88vw,368px) against the old min(78vw,320px) — one card fills most of a
        phone with the next peeking, which is photo 4's rhythm. The 380px small-phone override
        below is beaten by these later rules on purpose.
     2. the image sizes the box: width 100%, height auto, so the poster renders at its own aspect
        ratio edge to edge exactly as the business page draws it, capped at 480px so an extreme
        portrait cannot swallow the feed — only past that cap does the v421 contain+mount kick in.
     3. the v487 mount inset is dropped here: a full-bleed poster needs no frame. The blur backdrop
        stays for the capped case, where it is the letterbox fill.
     4. nestly_v517 (owner, photo 4: the poster ringed with "too big", and "customer cannot
        see the next photo — just reveal a bit or do a swiping function, to guide customers
        that there are more to view"). 88vw left ~12% of the viewport for the next card, which
        at a tablet width is a sliver too thin to read as a card at all, so the rail looked
        like a single poster. 74vw leaves a quarter of the next one showing — the peek IS the
        swipe affordance, and it is why the track already carries scroll-snap. The 480px image
        cap comes down to 360px with it, so a tall poster cannot reclaim the height the
        narrower card just saved. */
.customer-home-offer{flex-basis:min(74vw,300px)!important;height:auto!important;min-height:0!important}
.customer-home-offer-media{aspect-ratio:auto;min-height:0}
.customer-home-offer-media>img{position:relative;z-index:1;width:100%;height:auto;max-height:360px;object-fit:contain}
.customer-home-offer-media.has-art-v421{padding:0}
.customer-home-offer-media.has-art-v421>img{border-radius:0;box-shadow:none}
.customer-home-offer-copy{min-height:0!important;height:auto!important;flex:0 0 auto}

/* nestly_v421 (owner, photo 2: the offer's title and its View more button ringed where the screen
   edge cuts through them — "default should align the words, not being cut").
   Two faults, both in the swipe track on a business's own page.
   (1) The track bleeds to the screen edge (margin-inline:-16px) and puts the page back with
   padding — but it never told the scroll snapping about that padding, so scroll-snap-align:start
   parked each card against the SCROLLPORT edge, 16px into the bleed and off the side of the
   screen, with the first characters of every line cut off. scroll-padding-inline restates the
   padding for the snap, which is exactly what the home shelf's own track already does.
   (2) The card's artwork inherited aspect-ratio:16/9 from the base media rule, while v392 sizes
   the picture itself by a 46vh cap — so a portrait poster was laid out 388px tall inside a 177px
   frame and spilled 105px past both ends of it (measured at 390 and at 1280), painting over the
   card's top edge and over the copy underneath. The frame follows the picture here, which is what
   v392 described in the first place. */
.customer-business-profile-v346 .customer-reward-offer-track-v339{scroll-padding-inline:16px}
.customer-reward-offer-page-v339 .customer-promotion-card-media{aspect-ratio:1/1;height:auto;max-height:46vh;min-height:0}
.customer-reward-offer-page-v339 .customer-promotion-card-media>img{max-width:100%;max-height:100%;width:auto;height:auto;position:relative;z-index:1}
.customer-reward-offer-page-v339 .customer-promotion-card-media.has-art-v421::before{content:"";position:absolute;inset:-14%;z-index:0;background-image:var(--offer-art);background-size:cover;background-position:center;filter:blur(20px) saturate(1.12) brightness(.9)}

/* V441 (owner screenshot of Customer Interface -> Business Profile: the customer bottom dock
   floating loose in the middle of the panel, well to the LEFT of the phone frame it belongs in.
   Measured on build 1039401 at 1180x724 — phone screen at x 754..1113, y 229..736; the dock at
   x 591..949, y 793..865. Out of the frame on BOTH axes, with the red scan FAB escaping with it.)

   WHY IT HAPPENS. The Live preview renders the REAL customer wallet markup inline inside a phone
   frame — deliberately, because the site sends `frame-ancestors 'none'` and an iframe of ourselves
   can never render (see the V326 note beside customerInterfaceLivePreviewMarkupV326 in app.js).
   "Real markup" includes the customer surface's viewport-anchored furniture, and that furniture is
   anchored to the BROWSER viewport, which knows nothing about a phone frame:
     - `.customer-primary-nav` is position:fixed with left:50%, transform:translateX(-50%) and a
       100vw-relative width. V326 overrode only `position` (to sticky) and `bottom`, leaving the
       50%/-50% pair to shove it 179px left of wherever it sat — the 163px the owner ringed.
     - `.customer-surface{min-height:100dvh}` (below) also applied inside the preview, so the
       preview's scrollport was 100dvh tall inside a 507px screen: `position:sticky;bottom:0` was
       sticking to the bottom of a box that itself hung 217px below the frame.

   THE SCOPING RULE — stated once, applied by containing block rather than per element:
   INSIDE A PREVIEW FRAME, THE PHONE SCREEN IS THE VIEWPORT. `.customer-preview-screen-v243` is
   made the containing block for fixed-position descendants (contain:layout paint) as well as for
   absolute ones (position:relative), and it clips them. So ANY customer element that computes to
   position:fixed — this dock today; a toast, a sheet, a FAB or an offer banner tomorrow — is
   re-based onto the frame and cannot reach the browser window, with no new rule per element. The
   dock is then explicitly re-based to the bottom of that screen and every viewport-relative offset
   it still carries (inset, width, transform, margin) is neutralised, because a containing block
   alone would re-base left:50%/translateX(-50%) onto the frame rather than cancel it.

   WHY THE REAL WALLET IS UNTOUCHED. Every selector below is prefixed with
   `.customer-preview-screen-v243` or `.ci-live-preview-inner-v326`. Neither class exists on the
   customer surface: renderCustomerWallet mounts `wallet-shell customer-shell customer-surface`
   with no preview class, and both classes appear in app.js only inside the two preview cards
   (customerInterfacePreviewSideCardHtmlV325 and customerInterfacePreviewCardHtmlV243) — which is
   also why one rule fixes BOTH preview instances. Nothing here adds a declaration that a customer
   can match. tests/browser/verify-v441-preview-dock-scope.mjs asserts both halves by measurement:
   every fixed/sticky descendant inside the frame is inside the frame, and a non-preview customer
   render still has position:fixed dock anchored to the viewport.

   GRACEFUL DEGRADATION. `contain` is the fixed-position half of the containing block and wants
   Safari 15.4+. Where it is not understood that one declaration is dropped and position:relative
   still stands, so the dock — which the third rule makes ABSOLUTE, not fixed — is framed correctly
   anyway; only the automatic containment of some future fixed element would be lost. */
.customer-preview-screen-v243{position:relative;display:flex;flex-direction:column;contain:layout paint}
/* The frame's scrollport is the wallet shell, so it must be exactly as tall as the screen. Left to
   itself it inherits min-height:100dvh from .customer-surface and overflows the frame instead. */
.customer-preview-screen-v243>.ci-live-preview-inner-v326{flex:1 1 0%;height:auto;min-height:0;max-height:100%;overscroll-behavior:contain}
/* The dock: pinned to the bottom of the phone screen, inset like the real one is inset from the
   real viewport. `top:auto` matters — the base rule at ~line 2563 sets top:10px for sticky. */
.customer-preview-screen-v243 .ci-live-preview-inner-v326 .customer-primary-nav{position:absolute;top:auto;right:12px;bottom:12px;left:12px;width:auto;min-width:0;max-width:none;height:auto;margin:0;transform:none;z-index:9}
/* V468-A (owner photo 20: an arrow drawn from every Daily report figure, "It needs to be
   clickable to view what is inside"). The four figures are buttons now. They borrow
   .dashboard-metric wholesale so the affordance reads exactly like the Dashboard's; only the
   per-tile tint is restated, because the Dashboard keys that off its own data attribute. */
.daily-metric-v468[data-daily-metric-v468="revenue"]{background:color-mix(in srgb,var(--brand-red) 5%,#fff);border-left-color:var(--coral)}
.daily-metric-v468[data-daily-metric-v468="visits"]{background:color-mix(in srgb,var(--success) 5%,#fff);border-left-color:var(--green)}
.daily-metric-v468[data-daily-metric-v468="customers"]{background:color-mix(in srgb,var(--warn) 7%,#fff);border-left-color:var(--amber)}
.daily-metric-v468[data-daily-metric-v468="giftcards"]{background:var(--shell);border-left-color:var(--muted)}

/* V468-B (owner photo, Record sale): "Change branch or teammate" was a 12.5px muted text link
   under a separate read-only line — too easy to miss at a busy counter. This turns the same
   <details>/<summary> disclosure (ids, candidate rules and onchange handlers untouched — see
   tillCustomerHeadV373/bindTillControlsV373 in app.js) into a visible chip that both shows the
   current branch/teammate and opens the picker in one tap. Rules below share specificity with
   the base .till-who-v373 rules two blocks up but come later in source order, so they win. */
.till-who-v468{border-top:none;margin-top:12px;padding-top:0}
.till-who-v468>summary{list-style:none;min-height:48px;padding:11px 14px;display:flex;align-items:center;gap:9px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--brand-red-soft);color:var(--brand-red-on-soft);
  font-size:14.5px;font-weight:750}
.till-who-v468>summary::-webkit-details-marker{display:none}
.till-who-v468>summary::marker{content:''}
.till-who-summary-text-v468{flex:1;min-width:0;overflow-wrap:anywhere}
.till-who-sep-v468{opacity:.65;margin:0 2px}
.till-who-summary-change-v468{font-weight:750;text-decoration:underline;white-space:nowrap;flex-shrink:0}
.till-who-v468[open]>summary{border-radius:var(--r-sm) var(--r-sm) 0 0;margin-bottom:2px}

/* V468-B (owner photo, Record sale items step): "I need to be able to deduct the quantity or
   remove entirely in this page." Adds a compact −/count/+/× row on an already-selected tile,
   reusing the SAME qty/remove handlers the Confirm step's cart lines use (data-qty/data-remove —
   see bindTillControlsV373 in app.js). It sits as a sibling of the tile button, not nested inside
   it, so the tile stays a plain <button> (no interactive-in-interactive HTML) and its own tap
   target is untouched. */
.till-choice-tile-wrap-v468{position:relative}
.till-choice-qtyctl-v468{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:4px}
.till-choice-qtyctl-v468 button{min-width:40px;min-height:40px;padding:0;font-size:17px;font-weight:750;line-height:1;border-radius:var(--r-sm)}
.till-choice-qtyctl-v468 output{min-width:22px;text-align:center;font-weight:750;font-size:15px}
.till-choice-qtyctl-v468 .till-choice-qtyctl-remove-v468{color:var(--brand-red)}
/* V468-G (owner: "click to read" and "can hide" drawn on the marketing paragraph). The consent
   detail is a real <details>, not display:none — the customer must still be able to read what
   they are agreeing to, so the text stays in the accessibility tree and one tap away. Only the
   nine-line paragraph stops being the tallest thing on the sign-up form. */
/* nestly_v663 (owner photo A). The date of birth is three controls that must read as one field:
   the surface's own input metrics, real ink rather than the browser's grey dd/mm/yyyy, and a
   year that is one tap away. Day and month take the space they need; the year takes the rest,
   because that is the value people hunt for. */
.cui-label-v663{display:block;margin-top:14px;font-weight:600;color:var(--ink)}
.dob-picker-v663{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.3fr);gap:8px;margin-top:6px}
.dob-picker-v663>select{margin:0;color:var(--ink);font-weight:600}
.dob-picker-v663>select:invalid,.dob-picker-v663>select option[value=""]{color:var(--ink2)}
/* The consent explainer is the phrase itself, so it must look like a link and sit on the same
   line as the words around it — not like a button dropped into a sentence. */
.signup-consent-link-v663{display:inline;padding:0;margin:0;border:0;background:none;font:inherit;
  color:var(--coral);text-decoration:underline;cursor:pointer}
.signup-consent-detail-v468{margin:6px 0 0 30px}
.signup-consent-detail-v468>summary{cursor:pointer;color:var(--coral);font-size:13px;font-weight:600;
  list-style:none;padding:4px 0;min-height:32px;display:flex;align-items:center}
.signup-consent-detail-v468>summary::-webkit-details-marker{display:none}
.signup-consent-detail-v468>summary::after{content:'\203A';margin-left:6px;transform:rotate(90deg);
  display:inline-block;transition:transform .15s ease}
.signup-consent-detail-v468[open]>summary::after{transform:rotate(-90deg)}
.signup-consent-detail-v468>p{margin-top:4px}
@media (prefers-reduced-motion:reduce){.signup-consent-detail-v468>summary::after{transition:none}}
/* V468-C360 (owner photo 19: the activity list bracketed, "maximum 5 transactions and will be
   next page"). A centred pager rather than a full-width bar — it sits under a table that already
   scrolls horizontally on a phone, and a stretched control there reads as part of the table. */
.c360-act-pager-v468{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.c360-act-pager-v468:empty{display:none}
.c360-act-pager-v468 button[disabled]{opacity:.45;cursor:default}
/* V468-D — Appointments: booking requests drawn on the calendar, and whole-day blocks.
   The tile itself keeps its V330 identity (dashed red + diagonal stripes, against a confirmed
   event's solid staff colour) and now says "Pending" in words as well, because colour is never
   allowed to be the only signal. This wrapper exists for one reason: the owner asked for Confirm
   and Reject ON the block, and a button cannot legally be nested inside a button — so the tile
   and its two decisions become siblings inside one absolutely-positioned box. The 44px floor and
   40px controls keep both reachable on a 15-minute request; a pending tile is already outside the
   lane maths and free to overlap a neighbour, so the few borrowed pixels claim nothing false. */
.day-pending-wrap-v468{position:absolute;left:5px;right:5px;z-index:5;display:flex;min-height:44px;flex-direction:column;gap:3px}
.day-pending-wrap-v468:hover,.day-pending-wrap-v468:focus-within{z-index:9}
.day-pending-wrap-v468>.day-timeline-pending-v330{position:relative;top:auto;right:auto;bottom:auto;left:auto;min-height:38px;flex:1 1 auto}
.day-pending-actions-v468{display:flex;flex:0 0 auto;gap:4px}
.day-pending-actions-v468>.btn{min-width:0;min-height:40px;padding:0 6px;flex:1 1 0;font-size:11.5px}
/* V468-D — Block time. The Start/End pair lives in a .split, whose display:grid outranks the UA
   stylesheet's [hidden]{display:none} on specificity, so ticking All day would have hidden nothing
   at all — the same trap .pill[hidden] above already documents. */
#blockTimeHoursV468[hidden]{display:none!important}
/* A week cell is a seventh of the grid: the tile is the whole control there and opens the modal,
   which carries the same two decisions. */
.week-pending-v468{padding:3px 5px;font-size:10px}
.week-pending-v468 span,.week-pending-v468 small{font-size:10px}
/* Below 900px both grids are hidden and .calendar-agenda IS the calendar. The default agenda row
   is a two-column grid, which would drop a third child onto its own line; a pending row carries
   three, so it lays out as a wrapping flex line instead. */
.calendar-agenda-pending-v468{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.calendar-agenda-pending-v468>.calendar-agenda-item{flex:1 1 200px}
.calendar-agenda-pending-v468>.btn{min-height:44px}

/* V468-C1 (owner photo 1, customer business page → Gallery). Three marks: the heading is
   "Gallery" not the firm's own name, only two photos with a `See all ›` on the heading row, and
   the social links move out of a bare pill row into a captioned "Follow us here" block.
   The overflow cells are rendered and hidden so openCustomerGalleryAllV468 can read them back out
   of the DOM; `hidden` alone is not enough here because .customer-business-gallery-cell-v418
   declares its own display. */
.customer-business-gallery-cell-v418[hidden]{display:none!important}
.customer-gallery-seeall-v468{display:inline-flex;align-items:center;gap:2px;flex:0 0 auto;
  min-height:32px;padding:0 2px;border:0;background:none;color:var(--peekaa-red,#C24135);
  font-size:14px;font-weight:750;line-height:1;cursor:pointer}
.customer-gallery-seeall-v468:hover,.customer-gallery-seeall-v468:focus-visible{text-decoration:underline}
.customer-business-gallery-all-v468{margin-top:12px;max-height:64vh;overflow-y:auto}
/* The links block: a titled box of labelled rows, one per platform the firm has configured. The
   v418 pill shape is deliberately replaced rather than extended — a row that names the platform
   and points right is what the owner drew, and it reads the same with one link or with six. */
.customer-business-links-v418{display:block;margin-top:12px;padding:4px 12px;
  border:1px solid var(--peekaa-border,#E4DED7);border-radius:14px;
  background:var(--peekaa-card,#fff)}
.customer-business-links-head-v468{margin:10px 0 2px;font-size:12px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase;color:var(--peekaa-text-secondary,var(--muted))}
/* nestly_v561: a photo-less section's H2 wears the caption's clothes (owner: Cubbly's
   "FOLLOW US HERE ❤️" is the correct version). The !importants are not enthusiasm — the shared
   group-head h2 rules (v346/v343 line, and the wallet-sections override) set font-family and
   font-size with !important, so matching weight is the only way this class can win. The emoji is
   untouched by text-transform and renders as drawn. */
h2.customer-business-links-head-v561,
.wallet-sections h2.customer-business-links-head-v561,
.customer-business-shortcut-content-v348 h2.customer-business-links-head-v561{
  font-family:inherit!important;font-size:12px!important;
  line-height:1.3!important;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--peekaa-text-secondary,var(--muted))}
.customer-business-link-v418{display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;min-height:46px;padding:0;border:0;border-radius:0;background:none;
  color:var(--peekaa-text,#17161A);font-size:15px;font-weight:650;text-decoration:none}
.customer-business-link-v418+.customer-business-link-v418{border-top:1px solid var(--peekaa-border,#E4DED7)}
.customer-business-link-label-v468{min-width:0;overflow-wrap:anywhere}
.customer-business-link-go-v468{flex:0 0 auto;display:inline-flex;color:var(--peekaa-red,#C24135)}
.customer-business-link-v418:hover,.customer-business-link-v418:focus-visible{
  border-color:var(--peekaa-border,#E4DED7);color:var(--peekaa-red,#C24135)}

/* V468-C2 (owner photo 2, Rewards → Your rewards → History). The Claimed pill was the first row
   of the copy column, pushing the reward name and its date to the bottom of a 64px thumbnail and
   leaving the card's whole top-right blank; the owner redrew the pill in that corner and wrote
   "shift up" beside the name and date. The copy column becomes a row — text first, pills in their
   own right-hand box — so the name starts at the top and a long one wraps beside the pill instead
   of under it. Layout only. */
.customer-rewards-carousel-v337 .customer-reward-card-claimed-v422 .customer-reward-claimed-copy-v468{
  grid-area:copy;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;min-width:0}
.customer-reward-claimed-text-v468{flex:1 1 auto;min-width:0}
.customer-rewards-carousel-v337 .customer-reward-card-claimed-v422 .customer-reward-card-head-v339{
  flex:0 0 auto;justify-content:flex-end;max-width:46%;margin:0}

/* V468-C3 (owner photo 6, Home → Limited offers): "name shift down". nestly_v395 pinned the
   avatar+name row to the avatar's box at top:-30px so the coin overlaps the artwork — but the
   NAME rides in the same 46px row, so on every card its text sat on the photo and was unreadable
   against it (MEASURED at 430px on 8c2ff5a: media 1942..2116, row 2086..2132 — 30 of the row's
   46 pixels were over the picture). The coin keeps a deliberate overlap; the row drops far enough
   that the text clears the artwork's edge, and the copy's top padding follows it so the title is
   not pushed into it. Card height is unchanged. */
.customer-home-offer-business{top:-13px!important}
.customer-home-offer-copy{padding-top:32px}

/* V468-C4 (owner photo 7, the red reward hero). Two of the four marks are markup (see
   customerHeroRewardPagesV395); these are the other two. The gift photo is a grid COLUMN, so a
   reward without one leaves no hole — the body is simply one column, exactly as before. */
.customer-hero-reward-body-v468{position:relative;z-index:1;display:grid;
  grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.customer-hero-has-photo-v468 .customer-hero-reward-body-v468{grid-template-columns:minmax(0,1fr) 92px}
.customer-hero-reward-copy-v468{min-width:0}
/* nestly_v487 (owner photo 3). The points hero's gift column. It reuses the reward hero's own
   grid (customer-hero-reward-body-v468) rather than minting a second two-column layout, so the
   picture lands on exactly the same edge and top as the one on the reward and stamp cards - which
   is the alignment v483 was spent establishing. */
/* The two-column rule lives on the SECTION for the reward hero (.customer-hero-has-photo-v468),
   which this body is not inside. :has() keeps the decision with the markup that actually decides
   it — the column exists exactly when the tile was drawn — instead of threading a second class
   down from a caller that does not know. Without :has() support this degrades to one column with
   the tile under the balance: plainer, never broken. */
.customer-hero-points-body-v487:has(.customer-hero-gift-art-v487){grid-template-columns:minmax(0,1fr) 92px}
@media(max-width:340px){
  .customer-hero-points-body-v487:has(.customer-hero-gift-art-v487){grid-template-columns:minmax(0,1fr) 72px}
}
.customer-hero-gift-art-v487{display:block}
.customer-hero-gift-fallback-v487{display:grid;place-items:center;width:92px;aspect-ratio:1;
  border-radius:16px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.5);
  box-shadow:0 10px 20px rgba(83,26,21,.22);color:#fff}
@media(max-width:340px){
  .customer-hero-gift-fallback-v487{width:72px}
}
.customer-hero-reward-photo-v468{display:block;width:92px;aspect-ratio:1;object-fit:cover;
  border-radius:16px;background:rgba(255,255,255,.16);
  border:2px solid rgba(255,255,255,.5);box-shadow:0 10px 20px rgba(83,26,21,.22)}
@media(max-width:340px){
  .customer-hero-has-photo-v468 .customer-hero-reward-body-v468{grid-template-columns:minmax(0,1fr) 72px}
  .customer-hero-reward-photo-v468{width:72px}
}

/* V468-E1 (owner photo 16: the Activity screen). The section is unchanged on the PROFILE, where
   Activity is one collapsed group among five; these rules apply only while it is standing on its
   own shortcut page, which is what data-customer-activity-feed-v468 marks. Three things:
   the two history disclosures lose their summaries (JS forces them open there, so a summary
   would be a control that does nothing); the three-row "Recent activity" preview is dropped
   because the full list is right underneath it and printing both shows every recent event twice;
   and the type steps down, which is the owner's own instruction — "the font can be smaller, as
   it's just for admin purpose". Per-row line-item <details> keep their summary and stay closed. */
.customer-business-shortcut-page-v348[data-customer-activity-feed-v468] .wallet-history-disclosure>summary{display:none}
.customer-business-shortcut-page-v348[data-customer-activity-feed-v468] #walletTransactions>.wallet-history{display:none}
.customer-business-shortcut-page-v348[data-customer-activity-feed-v468] #walletTransactions h2,
.customer-business-shortcut-page-v348[data-customer-activity-feed-v468] #walletActivity h2{font-size:15px}
.customer-business-shortcut-page-v348[data-customer-activity-feed-v468] #walletTransactions b,
.customer-business-shortcut-page-v348[data-customer-activity-feed-v468] #walletActivity b{font-size:13px;line-height:1.35}
.customer-business-shortcut-page-v348[data-customer-activity-feed-v468] #walletTransactions .small,
.customer-business-shortcut-page-v348[data-customer-activity-feed-v468] #walletActivity .small{font-size:11.5px;line-height:1.4}
.customer-business-shortcut-page-v348[data-customer-activity-feed-v468] #walletTransactions .wallet-line,
.customer-business-shortcut-page-v348[data-customer-activity-feed-v468] #walletActivity .wallet-line{padding-top:9px;padding-bottom:9px}
.customer-business-shortcut-page-v348[data-customer-activity-feed-v468] .wallet-history-disclosure{padding-top:6px;padding-bottom:6px}
.customer-business-shortcut-page-v348[data-customer-activity-feed-v468] .wallet-history-disclosure-body{margin-top:0}

/* V468-E2(b): the celebration. Fixed, above the content and OUT of the tap path —
   pointer-events:none on the host means it can never intercept a press on whatever is beneath
   it, which is the "must not block or cover the primary content" rule. It sits under the safe
   area at the top so it does not land on the nav bar at the bottom of the customer surface. */
.customer-celebration-host-v468{position:fixed;left:50%;transform:translateX(-50%);
  /* Below the header band, MEASURED at 390px: the business page's back chevron and name occupy
     roughly y 20–60 and the Activity page's "‹ Back / Activity" row the same, so 70px clears both
     controls rather than sitting on the one the customer needs to leave the screen. */
  top:calc(70px + env(safe-area-inset-top,0px));z-index:80;width:min(420px,calc(100vw - 24px));
  display:grid;justify-items:center;pointer-events:none}
.customer-celebration-v468{display:flex;align-items:center;gap:12px;max-width:100%;
  padding:12px 18px 12px 14px;border-radius:999px;
  background:var(--card,#fff);color:var(--ink,#161616);
  border:1px solid var(--line,#e6e6e6);box-shadow:0 14px 34px rgba(20,20,20,.22);
  animation:customerCelebrationInV468 .34s cubic-bezier(.2,.9,.3,1.4) both}
.customer-celebration-icon-v468{display:grid;place-items:center;flex:0 0 auto;
  width:40px;height:40px;border-radius:50%;background:#fde68a;color:#7c2d12}
.customer-celebration-copy-v468{display:grid;min-width:0}
.customer-celebration-copy-v468 b{font-size:17px;line-height:1.2}
.customer-celebration-copy-v468 small{font-size:12px;opacity:.72;margin-top:2px}
@keyframes customerCelebrationInV468{from{opacity:0;transform:translateY(-14px) scale(.94)}
  to{opacity:1;transform:none}}
/* Reduced motion still gets the message — it just does not move. Belt and braces: the JS also
   checks the query and drops the animation class, so a browser that ignores one still honours
   the other. */
.customer-celebration-still-v468{animation:none}
@media(prefers-reduced-motion:reduce){.customer-celebration-v468{animation:none}}
/* The banner is appended to <body>, outside .customer-surface, so — exactly like the offer and
   company sheets above — it has to join the dark token scope by name or it would paint a white
   pill on a black wallet. */
html[data-customer-theme="dark"] .customer-celebration-host-v468{
  --card:#191C22;--ink:#F7F4EF;--line:#343841}
html[data-customer-theme="dark"] .customer-celebration-icon-v468{background:#4A3410;color:#FDE68A}

/* V468-E4: the "?" affordance. Same 26px circle on a reward card and on a granted gift, sitting
   beside the status pill in the card head, with a 44px hit area behind it for a thumb. */
.customer-reward-help-v468{flex:0 0 auto;display:grid;place-items:center;width:26px;height:26px;
  padding:0;border-radius:50%;border:1px solid var(--line,#e6e6e6);
  background:var(--card,#fff);color:var(--muted,#666);
  font:600 14px/1 inherit;cursor:pointer;position:relative}
.customer-reward-help-v468::after{content:"";position:absolute;inset:-9px}
/* nestly_v486 (owner photo A: the sheet must show "the gift / expiry and details all in one").
   The gift's own picture, at the head of its rules sheet. Sized off the sheet rather than fixed
   so it stays inside a narrow phone, and capped in height so a tall portrait photo cannot push
   the rules themselves below the fold - the rules are what the sheet is FOR. */
.customer-reward-rules-photo-v486{display:block;width:100%;max-width:220px;max-height:180px;
  margin:12px 0 4px;object-fit:cover;border-radius:14px;background:var(--peekaa-red-soft,#FBEBE8)}
.customer-reward-help-v468:hover,.customer-reward-help-v468:focus-visible{color:var(--ink,#161616);border-color:var(--ink,#161616)}
/* nestly_v471: the same "?" on the RED hero card. v468 styled it for a white reward card — a
   white disc with a grey hairline — which on the red gradient reads as a hole punched in the card.
   It borrows the tier pill's own treatment beside it instead, so the two controls in that row look
   like one family. Only colour changes: the 26px circle and its 44px hit area are untouched. */
.customer-business-summary-top-v347 .customer-reward-help-v468{
  background:rgba(120,21,16,.24);border-color:rgba(255,255,255,.55);color:#fff}
.customer-business-summary-top-v347 .customer-reward-help-v468:hover,
.customer-business-summary-top-v347 .customer-reward-help-v468:focus-visible{
  color:#fff;border-color:#fff;background:rgba(120,21,16,.4)}
/* nestly_v471 (owner: "they should see the expiry of each gift … redeem before that to enjoy the
   gift!"). One line, two grounds: muted on the white reward card, white on the red hero. The hero
   rule needs the extra weight because .customer-shell .card.customer-business-summary-v346 p
   already claims colour and size for every paragraph inside that card. */
.customer-reward-ends-v471{margin-top:5px;font-size:12.5px;line-height:1.35;
  color:var(--peekaa-text-secondary)}
.customer-shell .card.customer-business-summary-v346 .customer-reward-ends-v471{
  margin-top:6px;font-size:12.5px;font-weight:650;color:#fff;opacity:.94}
.customer-reward-rules-v468{display:grid;gap:12px;margin-top:14px}
.customer-reward-rules-v468 dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  opacity:.6}
.customer-reward-rules-v468 dd{margin:3px 0 0;font-size:14px;line-height:1.45}
/* nestly_v496 (owner, photo 2: the milestone bullets rewritten by hand as "5 (stamp) get ABC"
   rows — "improve the UI UX"). Each rung is a row: a stamp-shaped slot badge, then the gift it
   buys. The badge borrows the stamp-ring family's look so the ladder and the grid above it read
   as one system. */
.customer-stamp-ladder-v496{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.customer-stamp-rung-v496{display:flex;align-items:center;gap:9px;min-width:0}
.customer-stamp-rung-slot-v496{flex:0 0 auto;display:grid;place-items:center;width:30px;height:30px;
  border-radius:50%;border:2px solid var(--peekaa-red,#B3261E);color:var(--peekaa-red,#B3261E);
  background:var(--peekaa-red-soft,#FBEBE8);font-size:13px;font-weight:800;line-height:1}
.customer-stamp-rung-gift-v496{min-width:0;font-size:14px;line-height:1.35;
  overflow-wrap:anywhere}
.customer-stamp-rung-gift-v496 b{font-weight:700}
.customer-stamp-rung-v496[data-stamp-quest-rung-claimed-v323="yes"] .customer-stamp-rung-slot-v496{
  background:var(--peekaa-red,#B3261E);color:#fff}
.customer-stamp-rung-state-v496{flex:0 0 auto;margin-left:auto;text-align:right}
/* nestly_v496 (owner, photo 2: "it should show quantity = 2 - and able to redeem twice"). The
   stack badge beside "Ready to claim" — same pill family, weighted so x2 reads as a count, not
   a size tag. */
.customer-reward-quantity-v496{font-weight:800;letter-spacing:.02em}

/* ==================== nestly_v580 — the two filter bars the owner re-ringed ==================
   Photo 1, Sales & refunds: "fix this alignment !!!" — From and To sit taller than Customer
   search, so their labels ride up and the three do not line up.
   Photo 2, Customer intelligence: "alignment fix!" — Run report drawn ON TOP of the To box.

   These are the same family v577 measured, and each needed something v577 did not do.

   (a) The OVERLAP on Customer intelligence is v577's width defect in a bar that rule never named.
       `.range>label>input` already sets width:100%, but with no min-width:0 the UA's intrinsic
       date width still wins, the input overflows the label it lives in, and the next flex item —
       Run report — is drawn over it. Same fix as v577, applied to the shape it missed: the label
       and its control must BOTH be allowed to shrink.

   (b) The ALIGNMENT on Sales & refunds is not fixable by pinning heights, and that is why V225,
       v571 and v577 all failed at it in turn: they each set height:var(--control-h) on every
       control, which measures correctly in Chromium (verified: identical label tops, input tops
       and 44px heights) and still comes out wrong on iPad Safari, where a date input's internal
       layout can exceed a height it has been given.

       So alignment stops depending on every control agreeing about its own height. The row is a
       grid with two explicit tracks — labels in one, controls in the other — and each cell opts
       into them with subgrid. Every label then shares one baseline and every control shares
       another BY CONSTRUCTION, whatever any individual control decides it is worth. Safari has
       supported subgrid since 16; where it is missing the previous height pin is still in force,
       so this degrades to exactly today's behaviour rather than to something worse. */
/* ===================== nestly_v583 — customer surfaces, owner batch ==========================

   Photo 4 (Company details) and photo 7 (offer detail): "change this box colour to Peekaa light
   pink, applies to all business profile". Both screens use the SAME box — .customer-offer-detail-
   meta — so one rule covers the address/phone block, the other-branch blocks and the offer's
   validity block, and they cannot drift apart. --peekaa-red-faint is the token this design system
   already reserves for large tinted surfaces, so this is the brand's pink and not a new colour. */
.customer-offer-detail-meta{background:var(--peekaa-red-faint,#FDEEEB);border-color:transparent}

/* Photo 5: the business logo and name at the top of the offer sheet, opposite the close button. */
.customer-offer-detail-head-v583{align-items:center;gap:10px}
.customer-offer-detail-brand-v583{display:flex;align-items:center;gap:9px;min-width:0}
.customer-offer-detail-brand-v583>b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.customer-offer-detail-brand-v583 .customer-company-logo{
  width:34px;height:34px;border-radius:11px;flex:0 0 auto}

/* Photo 9: the Profile gear. Sized and shaped like the other round icon controls on the customer
   surface (the bell, the back button) so it reads as one of them. */
.customer-profile-head-v583{display:flex;align-items:flex-start;gap:12px}
.customer-profile-gear-v583{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  width:44px;height:44px;border-radius:50%;border:1px solid var(--hair);background:var(--card,#fff);
  color:var(--ink2);line-height:0;transition:color .14s var(--ease),border-color .14s var(--ease),background .14s var(--ease)}
.customer-profile-gear-v583:hover,
.customer-profile-gear-v583[aria-expanded="true"]{color:var(--peekaa-red,var(--coral));
  border-color:var(--peekaa-red,var(--coral));background:var(--peekaa-red-faint,var(--tint))}
#customerProfileSettingsV583[hidden]{display:none}

/* Photo 11: "want glued together become a list" — the booking rows were separate cards with gaps.
   One card now, rows divided by hairlines, like the Messages list. The row's own grid is
   unchanged, so v581's alignment and the v580 format still hold; only the container changed. */
.customer-booking-rows-v580{gap:0;background:var(--card,#fff);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
.customer-booking-row-v580{border-radius:0;box-shadow:none;background:transparent;
  border-bottom:1px solid var(--hair)}
.customer-booking-row-v580:last-child{border-bottom:0}

/* nestly_v583 (owner, photo 1 — the Device notifications card struck out for the THIRD time,
   with the ruling "remove from messages, because it is already inside the !").

   v571 declared the park as an attribute and v579 put that attribute in the markup, and the card
   still came back: visibility was being decided by JavaScript in two places (this page parks it,
   customer-push.js repaints it from push state), and a race between them is not something an
   attribute alone can settle.

   So the park stops being a hint and becomes a fact. A parked node is display:none from CSS, which
   no reconcile, repaint or re-render can undo — the only thing that unparks it is the settings
   modal REMOVING the attribute when it borrows the card, which is the one intended path. The card
   itself is untouched and still fully working inside the gear, which is where the owner says it
   already lives, and it keeps the live v296 push binding that owns #customerPushMessagesControl. */
[data-push-parked-v571]{display:none!important}

/* Photo 3: the pending-booking count on the header Appointment button. The badge markup is the
   rail's own (.nav-badge), so it cannot drift in style or in value; only the slot is new. The
   rail's badge uses margin-left:auto to sit at the row's end — wrong inside a button, where it
   must sit against the label — so that one property is reset here. */
.global-act-badge-v580{display:inline-flex;align-items:center;margin-left:6px}
.global-act-badge-v580:empty{display:none}
.global-act-badge-v580 .nav-badge{margin-left:0;min-width:20px;height:20px;font-size:10.5px}

/* Photo 5, My Rewards: "shorten the red bar" — the pink "N rewards ready" pill runs the full
   width of the card's copy column instead of hugging its words.

   It already declares display:inline-flex, which would hug. But its parent
   .customer-programme-card-copy is display:grid, and a grid item is BLOCKIFIED — inline-flex
   computes to flex — so it stretches the track like any other block. justify-self is what an
   inline-flex would have given for free; width:fit-content covers the flex-parent case too, and
   max-width keeps a long status ellipsising inside the card rather than pushing it wider. */
.customer-programme-card-status-v346.is-ready-v392{justify-self:start;align-self:start;
  width:fit-content;max-width:100%}

/* Photo 4, Limited offers: "i don't want blurred background". V421 filled the letterbox around a
   non-matching aspect with a blurred, darkened copy of the artwork. The owner wants the plain
   card ground instead. The MEDIA BOX and object-fit:contain stay exactly as they are — this only
   removes the two decorative pseudo-elements, so the whole picture is still shown uncropped
   (V173/V421's rule) on a clean background. */
.customer-home-offer-media.has-art-v421::before,
.customer-home-offer-media.has-art-v421::after{content:none}
.customer-home-offer-media.has-art-v421{background:var(--card,#fff)}

.sales-filter-row>label>input,
.range>label>input,.range>label>select{min-width:0;max-width:100%}
.range>label{min-width:0;flex:0 1 auto}
.range>label>input[type=date]{width:150px}
/* nestly_v582 (owner: photo 1 "alignment is still awkward — refer to photo 2"). v581 made the
   labels line up, but the bar still read as two stacked four-column grids with a wide button
   parked in the second row's first cell — nothing like the Customer intelligence bar the owner
   pointed at, which is one short inline run of compact fields.

   So the panel becomes ONE grid instead of two rows of four. `display:contents` on each
   .sales-filter-row lifts its cells into the panel, so all six fields and both buttons sit in a
   single flow that wraps by content width rather than being forced into a rigid 4-up. Columns are
   max-content, so a select is as wide as its longest option and no wider — the compactness the
   owner is asking for.

   The subgrid alignment from v581 is KEPT and is what makes this safe: two explicit row tracks
   with every cell spanning both, so labels share one line and controls share another whatever any
   date box does with its own height on Safari. Getting compact by switching to a flex row would
   have thrown that away and reopened the bug the owner reported three times. */
/* nestly_v584 (owner photo 10: three arrows between the fields, "move to left"). The 150px floor
   was wider than a select's own content, so every dropdown carried up to 46px of empty track to
   its right and the six fields were spread across the card. The floor now only has to clear a
   date box's own width; each track is its content, and the row packs left. */
/* nestly_v658 (owner photo 6: "fix alignment, boxes are overlapping"). MEASURED, not guessed:
   a Chrome harness at 1440px put From/To 6px into each other and To/Customer search 25px.
   THE CAUSE. This was `repeat(auto-fit, minmax(120px, max-content))` — a grid whose column count
   is worked out from the 120px MINIMUM. At this width it laid out more tracks than the content
   needs, each squeezed toward that 120px floor, while the controls inside them keep fixed widths
   (a date box is 150px, the search 170px). A 150px control in a 120px track does not shrink; it
   spills over the next track, which is precisely the overlap the owner has now reported twice
   (v593 fixed the result SENTENCE riding up into the fields; this is the fields themselves).
   THE FIX. The bar is a wrapping flex row. Each cell is sized by its own content instead of by a
   shared track, so a control can never be wider than the box it sits in and overlap is not
   expressible; when the window is too narrow the cells wrap to the next line rather than
   colliding. `align-items:flex-end` bottom-aligns every cell, so the controls sit on one line and
   each label sits directly above its own control — which is what the v581 subgrid was protecting
   and what a plain flex row was previously rejected for losing.
   The per-control widths below are kept: they are what makes the bar compact (v584), and they are
   now a cell's width rather than something fighting a track for room. */
.sales-filter-panel{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:flex-start;
  gap:10px 12px}
.sales-filter-row,.sales-filter-row.secondary{display:contents}
.sales-filter-panel>.sales-filter-row>div{display:flex;flex-direction:column;justify-content:flex-end;
  row-gap:6px;min-width:0;flex:0 0 auto}
.sales-filter-panel>.sales-filter-row>div>label{margin:0;white-space:nowrap}
.sales-filter-panel>.sales-filter-row>.btn{align-self:flex-end;white-space:nowrap;flex:0 0 auto}
/* The result sentence is a statement about every filter above it, so it takes a line of its own
   below the controls (nestly_v593's ruling, expressed in flex). */
.sales-filter-panel>.row{flex:1 0 100%;align-self:flex-start}
.sales-filter-panel input[type=date]{width:150px}
.sales-filter-panel input[type=search]{width:170px}
.sales-filter-panel select{width:auto;min-width:130px}
@media(max-width:720px){
  .sales-filter-panel>.sales-filter-row>div{flex:1 0 100%}
  .sales-filter-panel>.sales-filter-row>.btn{flex:1 0 100%}
  .sales-filter-panel input[type=date],.sales-filter-panel input[type=search],
  .sales-filter-panel select{width:100%}
}
}

/* ============================ nestly_v577 — customer display titles ==========================
   Owner, photo 22: "Nice to see you again.", "40 rewards ready", "Limited offers" and "View all ›"
   each ringed, with one note — "those title font can change to cuter font like this" — and an
   arrow to the peekaa wordmark at the top of the screen.

   The greeting h1 and the section headings are NOT ringed but are changed with them on purpose:
   they are the same run of display type, and leaving "Good afternoon, Steven" in the UI stack
   while the subtitle directly under it turned round would read as a mistake rather than a choice.

   --peekaa-display always ENDS in the existing --sf stack, so if the Google Fonts request is
   blocked, slow, or offline, every one of these falls back to exactly the face it renders today.
   `!important` is present only where the rule it has to beat already used it (the ≤430px block
   pins .customer-home-greeting-v343 h1 with !important), never as a default. */
:root{--peekaa-display:'Baloo 2',-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',system-ui,'Segoe UI',sans-serif}
/* nestly_v579 (owner: "the other fonts are still not changed to nunito? basically other than the
   main header - the rest is Nunito"). v577 read the earlier note as "the ringed titles" and put
   Baloo 2 on the headings AND their neighbours. The rule is simpler than that: the main header is
   the brand face, everything else on the customer surface is Nunito.

   Done by REDEFINING --sf on the customer shell rather than by editing rules. Twenty rules across
   this stylesheet already say `font-family:var(--sf)` — the greeting, section heads, card titles,
   programme names, offer copy — and every one of them resolves through this variable, so one
   override converts the whole surface and cannot miss a rule or drift when a new one is added.
   It is scoped to .customer-surface, so the workspace keeps the system font it has today.

   Both faces still END in the original --sf stack, so a blocked or slow Google Fonts request
   falls back to exactly what renders now rather than to a serif. */
:root{--peekaa-body:'Nunito',-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,'Segoe UI',sans-serif}
/* The selector matches `.customer-shell.customer-surface` on purpose: that rule sets the system
   stack DIRECTLY (not through --sf) at two-class specificity, so a single-class rule here set the
   variable correctly and still lost the actual font-family — every element that merely inherits,
   rather than naming var(--sf), stayed on the system face. Verified in-browser both ways. */
.customer-surface,
.customer-shell.customer-surface,
.wallet-shell.customer-surface{--sf:var(--peekaa-body);font-family:var(--peekaa-body)}
/* The main header — and only the main header — keeps the brand face. */
.customer-home-greeting-v343 h1,
.customer-my-rewards-title h1,
.customer-page-head h1{font-family:var(--peekaa-display)!important;letter-spacing:-.005em}
/* The two emoji the owner asked for beside the headings (photo 17: "add this" against ✨ on
   Limited offers and 👀 on Your Peekaa). Sized off the heading so they scale with it, and
   aria-hidden in the markup so a screen reader reads the heading, not "sparkles". */
.customer-home-head-emoji-v577{font-size:.85em;line-height:1;vertical-align:baseline}

/* ===================== nestly_v577 — customer surfaces, owner batch ========================= */

/* Photo 19 — the My Peekaa QR sheet: "box smaller", with "MY PEEKAA QR" ringed and marked
   "bigger". The sheet is narrowed and its padding tightened; the kicker, which is also the
   dialog's accessible name (v571), is promoted from an eyebrow to a real heading. The close X and
   "Scan a business QR instead" were ringed too, but with no instruction against them — read as
   pointing, so they keep their present size and position. */
.customer-scan-modal .modal-card{width:min(360px,calc(100vw - 40px));padding:20px 20px 24px}
.customer-scan-modal #customerScanSheetKicker{font-size:15px;font-weight:800;letter-spacing:.10em;color:var(--ink)}

/* Photo 21 — the company search moves onto the Bookings header row, beside the date chip. */
.customer-booking-head-v577{flex-wrap:wrap;row-gap:10px;align-items:center}
.customer-booking-search-v577{display:flex;align-items:center;gap:8px;flex:1 1 200px;min-width:0;max-width:320px;
  margin:0;padding:0 12px;border:1px solid var(--control-border);border-radius:999px;background:var(--card,#fff)}
.customer-booking-search-v577 input{flex:1 1 auto;min-width:0;border:0;background:transparent;padding:10px 0;font-size:14px}
.customer-booking-search-v577 input:focus{outline:none}
.customer-booking-search-v577:focus-within{border-color:var(--coral);box-shadow:0 0 0 3px var(--tint)}
/* nestly_v594 (owner photo 5: "the search button is overlapped"). Two boxes were drawn, one inside
   the other. The global control reset is `input:not([type="checkbox"]):not([type="radio"])`, which
   scores (0,2,1) — HIGHER than `.customer-booking-search input` and `.customer-booking-search-v577
   input` at (0,1,1) — so every `border:0;background:none;padding:0` those two rules asked for lost
   the cascade and the field kept its own 1px border, white fill and 11px/13px padding inside the
   pill. Measured before the fix at 390px: input border `1px solid rgb(129,123,136)`, background
   `rgb(255,255,255)`, padding `11px 13px`.
   The selectors below add `[type="search"]` to reach (0,2,1) and sit later in the sheet, so they
   win on order rather than on `!important`. Both sibling pills are included: they share this
   markup and had the same defect, and fixing one would have left the pair inconsistent. */
.customer-booking-search input[type="search"],
.customer-booking-search-v577 input[type="search"],
.customer-my-rewards-search input[type="search"]{
  border:0;background:transparent;box-shadow:none;padding:0;min-height:44px}

/* nestly_v580 (owner, photo 6) supersedes v577's History-only row: ONE row for all three booking
   tabs. The calendar date tile is gone ("don't need this calendar logo") and the date is plain
   text at the row's end, above the action. */
/* nestly_v594 (owner photo 6: red bars drawn ON the gaps — "i dont want gaps inbetween the
   bookings - i need them to be gel together"). This declaration is the reason they came back: the
   photo-11 rule ~1200 lines above already made the list one card with `gap:0` and hairline
   dividers, and this later block — same specificity, so it wins on order — reset the gap to 10px
   while restating the row's own grid. The row grid is what this block is for; the container gap
   was collateral. Measured before the fix: computed row-gap 10px, actual space between rows 10px.
   Now 0, so the hairline is the only thing between two bookings. */
.customer-booking-rows-v580{display:grid;gap:0}
.customer-booking-row-v580{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;
  align-items:center;padding:14px 16px}
.customer-booking-row-logo-v580{flex:0 0 auto;line-height:0}
.customer-booking-row-logo-v580 img,.customer-booking-row-logo-v580 .customer-booking-logo{
  width:44px;height:44px;border-radius:12px;object-fit:cover}
.customer-booking-row-copy-v580{min-width:0;display:grid;gap:2px}
.customer-booking-row-copy-v580>b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.customer-booking-row-detail-v580{margin:0;font-size:13.5px;color:var(--ink2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.customer-booking-row-address-v580{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.customer-booking-row-end-v580{display:grid;justify-items:end;gap:7px;flex:0 0 auto}
/* nestly_v613 made the withdraw control an X. nestly_v627 (owner photo 4: "for the X please make
   it a perfect circle") makes it actually round: `width` alone was not enough, because `.btn.sm`
   is two classes to this rule's one and its min-height:44px won — the control was 32 wide and 44
   tall, an oval, the same defect the Rewards Programme back button had. Both dimensions are
   pinned now, min-height included, so the circle cannot be stretched by a more specific rule. */
.customer-booking-withdraw-v613{width:36px;min-width:36px;max-width:36px;height:36px;min-height:36px;
  max-height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;
  border-radius:50%;line-height:0;flex:0 0 auto}
/* nestly_v627 (owner photo 4: an arrow moving the Pending pill down under the service line). It
   sits in the copy column now, so it aligns with the business name and the service above it
   instead of with the date and the actions on the right. */
.customer-booking-row-status-v627{margin:8px 0 0;display:flex}
/* nestly_v613. The row opens its own details ("can click to see details"), so it must look and
   behave like a control. The buttons inside it keep their own cursor and their own click. */
.customer-booking-row-detailed-v613{cursor:pointer}
.customer-booking-row-detailed-v613:focus-visible{outline:2px solid var(--peekaa-red,var(--coral));outline-offset:2px}
.customer-booking-row-detailed-v613 button,.customer-booking-row-detailed-v613 a{cursor:pointer}
/* nestly_v613. The two ways to start a sale without typing a number, drawn by the owner as one
   row at the foot of the keypad. A branch that offers only one of them gets a single full-width
   button rather than a half-width one stranded beside a gap. */
.till-entry-starts-v613{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.till-entry-starts-v613:has(>:only-child){grid-template-columns:1fr}
.till-entry-starts-v613>.btn{width:100%;min-width:0}
/* nestly_v613. The service editor's branch picker — the owner's "can add which branch have
   only". Laid out as wrapping choices rather than a multi-select, because a shop with three
   branches should see all three at once. */
.svc-branch-picker-v613{margin-top:14px}
.svc-branch-picker-v613 [role="group"]{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:6px}
.svc-branch-choice-v613{display:inline-flex;align-items:center;gap:7px;min-height:34px;color:var(--ink);cursor:pointer}
.svc-branch-choice-v613 input{width:auto;min-height:0}
.customer-booking-detail-list-v613{display:grid;gap:10px;margin:12px 0 0}
.customer-booking-detail-list-v613 dt{margin:0}
.customer-booking-detail-list-v613 dd{margin:2px 0 0;font-weight:600;color:var(--ink)}

/* ===================== nestly_v577 — the boot screen (owner, photo 14) =====================
   "background color different", against the logo tile.

   v571b read this as a page-vs-poster mismatch and set the shell to #F4EEE0, which is genuinely

   the video's first frame decodes. The VIDEO is what the owner is actually looking at, and its
   flat beige is neither #F4EEE0 nor stable: sampled on the decoded frames it runs #F6EFE2 at t=0,
   #F9F2E2 at t=1, #F9F0E1 from t=1.5 — ordinary compression noise across a large flat field. So
   there is no single background value that can match it, and the previous approach could not have
   worked whatever number was chosen.

   page, so no straight edge exists to disagree with anything. closest-side makes the mask radius
   the frame's half-width (270px of the 540px source); the artwork's ink measures out to a radius
   of 229px, so holding full opacity to 88% (238px) clears the logo with room to spare and fades
   over the empty margin beyond it. */
.boot-mark-v577{display:block;width:min(210px,56vw);height:auto;margin:2px auto 10px;
  -webkit-mask-image:radial-gradient(circle closest-side,#000 0 88%,transparent 100%);

  /* The mask removes the EDGE; this removes the remaining lightness difference inside it. The
     video's flat field decodes around #F9F0E1 against the page's #F4EEE0, and 0.985 brings it to
     within 1-2 values per channel (244,238,224 wanted; 245,236,222 produced) — below the
     threshold anything can be seen at. It is a scale, not a match to one sampled frame, so the
     frame-to-frame drift shrinks with it instead of being locked to a single guess. Near-black
     logo ink is unaffected at this factor. */

/* ===================== nestly_v584 — the filter bars, fixed structurally ====================

   contents have different intrinsic heights, so any control taller than its neighbour (a date box
   on iPad Safari is) pushes its own label UP while the short cell's label stays DOWN — and the low
   label is then drawn beside, or across, the tall box next to it. Chasing each control's height is
   chasing the symptom; the labels only ever lined up by accident.

       being wider than its cell is clipped INSIDE the cell and can never paint over the next
       label. A clipped date is legible; a date printed on top of a label is not.

  function icon(name,{size=20,label='',className=''}={}){
    const path=paths[name]||paths.info;
    const a11y=label?`role="img" aria-label="${escapeHtml(label)}"`:'aria-hidden="true" focusable="false"';
    return `<svg class="cui-icon ${className}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" ${a11y}><path d="${path}"></path></svg>`;
  }

  function escapeHtml(value){
    return String(value??'').replace(/[&<>"']/g,char=>({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[char]));
  }

  function action({id='',label,iconName='',variant='primary',className='',attributes='',busy=false}={}){
    const classes=['btn',variant==='secondary'?'ghost':'',variant==='danger'?'danger':'',variant==='ghost'?'ghost':'',busy?'is-loading':'',className].filter(Boolean).join(' ');
    const busyAttrs=busy?' aria-busy="true" disabled':'';
    return `<button class="${classes}"${id?` id="${escapeHtml(id)}"`:''} type="button"${busyAttrs} ${attributes}>${busy?'<span class="cui-button-spinner" aria-hidden="true"></span>':(iconName?icon(iconName,{size:17}):'')}<span>${escapeHtml(label)}</span></button>`;
  }

  function status(text,tone='neutral'){
    return `<span class="pill ${tone}" role="status">${escapeHtml(text)}</span>`;
  }

  function permissionBanner({canWrite,moduleLabel='This area'}={}){
    if(canWrite)return '';
    return `<aside class="permission-banner" role="note">${icon('info',{size:19})}<div><b>Read-only access</b><p>${escapeHtml(moduleLabel)} is available to review. Ask an owner for write access to make changes.</p></div></aside>`;
  }

  function pageHeader({title,subtitle='',iconName='info',actions='',canWrite=true,moduleLabel='This area'}={}){
    return `<header class="cui-page-head"><div class="cui-page-title">${icon(iconName,{size:24})}<div><h1>${escapeHtml(title)}</h1>${subtitle?`<p>${escapeHtml(subtitle)}</p>`:''}</div></div>${actions?`<div class="cui-page-actions">${actions}</div>`:''}</header>${permissionBanner({canWrite,moduleLabel})}`;
  }

  function card({title='',description='',body='',className='',id=''}={}){
    return `<section class="card cui-card ${className}"${id?` id="${escapeHtml(id)}"`:''}>${title?`<div class="cui-card-head"><h2>${escapeHtml(title)}</h2>${description?`<p>${escapeHtml(description)}</p>`:''}</div>`:''}${body}</section>`;
  }

  function field({id,label,control='input',type='text',value='',placeholder='',options=[],required=false,hint='',attributes=''}={}){
    const labelHtml=`<label for="${escapeHtml(id)}">${escapeHtml(label)}${required?' <span aria-hidden="true">*</span><span class="sr-only"> (required)</span>':''}</label>`;
    let input;
    if(control==='select')input=`<select id="${escapeHtml(id)}" ${required?'required ':''}${attributes}>${options.map(option=>`<option value="${escapeHtml(option.value)}"${option.selected?' selected':''}>${escapeHtml(option.label)}</option>`).join('')}</select>`;
    else if(control==='textarea')input=`<textarea id="${escapeHtml(id)}" placeholder="${escapeHtml(placeholder)}" ${required?'required ':''}${attributes}>${escapeHtml(value)}</textarea>`;
    else input=`<input id="${escapeHtml(id)}" type="${escapeHtml(type)}" value="${escapeHtml(value)}" placeholder="${escapeHtml(placeholder)}" ${required?'required ':''}${attributes}>`;
    return `<div class="cui-field">${labelHtml}${input}${hint?`<p class="cui-field-hint" id="${escapeHtml(id)}-hint">${escapeHtml(hint)}</p>`:''}</div>`;
  }

  function emptyState({iconName='empty',title='Nothing here yet',body='',actionHtml='',tone='neutral'}={}){
    return `<div class="empty cui-empty tone-${escapeHtml(tone)}">${icon(iconName,{size:32})}<h2>${escapeHtml(title)}</h2>${body?`<p>${escapeHtml(body)}</p>`:''}${actionHtml?`<div class="cui-empty-action">${actionHtml}</div>`:''}</div>`;

  function skeletonCard({lines=3,className=''}={}){

    return `<div class="cui-table-wrap cui-table-skeleton" role="status" aria-busy="true" aria-label="Loading rows"><table class="cui-table" data-responsive="false"><tbody>${Array.from({length:rows}).map(()=>`<tr>${Array.from({length:columns}).map((_,index)=>`<td>${skeletonLine(index===0?'72%':index===columns-1?'48%':'88%')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  function chartSkeleton({title='Loading chart'}={}){
    return `<div class="card cui-chart-skeleton" role="status" aria-busy="true" aria-label="${escapeHtml(title)}"><div class="cui-chart-skeleton-head">${skeletonLine('42%')}${skeletonLine('68%','short')}</div><div class="cui-chart-placeholder"><span></span><span></span><span></span><span></span><span></span></div></div>`;

  }

  function loadingState({title='Loading',iconName='info',body='Loading the latest information…',variant='route'}={}){
    const skeleton=variant==='table'?tableSkeleton():variant==='chart'?chartSkeleton({title}):variant==='form'?formSkeleton():skeletonGrid({cards:variant==='compact'?2:4,lines:3});
    return `<section class="cui-route-state cui-fade-in" aria-busy="true" aria-labelledby="route-loading-title">${pageHeader({title,subtitle:body,iconName})}<div role="status" class="sr-only" id="route-loading-title">Loading ${escapeHtml(title)}</div>${skeleton}</section>`;
  }

  function errorState({title='Unable to load this page',message='Try again.',retryId='routeRetry'}={}){
    return `<section class="cui-route-state" aria-labelledby="route-error-title">${pageHeader({title,subtitle:'The latest information could not be loaded.',iconName:'info'})}<div class="card"><div class="err" role="alert"><h2 id="route-error-title">Something went wrong</h2><p>${escapeHtml(message)}</p></div><div style="margin-top:16px">${action({id:retryId,label:'Try again',iconName:'retention'})}</div></div></section>`;
  }

  function table({caption,headers,rows,className=''}={}){
    /* V298: a caller that passes no caption used to get `<caption></caption>` and
       `aria-label=""` — an empty element AND a table with no accessible name, the worst of both.
       Emit no caption at all in that case and let enhanceTables derive one from the surrounding
       card heading (it always leaves a non-empty name behind), and never let the scroll region's
       label collapse to nothing. */
    const captionTextV298=String(caption??'').trim();
    const regionLabelV298=captionTextV298||'Data table';
    return `<div class="cui-table-wrap" role="region" aria-label="${escapeHtml(regionLabelV298)}" tabindex="0"><table class="cui-table ${className}" data-responsive="true">${captionTextV298?`<caption>${escapeHtml(captionTextV298)}</caption>`:''}<thead><tr>${headers.map(header=>`<th scope="col">${escapeHtml(header)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map((cell,index)=>`<td data-label="${escapeHtml(headers[index]||'')}">${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }

  let generatedFieldId=0;
  function associateLabels(root){
    root.querySelectorAll('label:not([for])').forEach(label=>{
      let control=label.querySelector('input,select,textarea');
      if(!control){
        const next=label.nextElementSibling;
        control=next?.matches?.('input,select,textarea')?next:next?.querySelector?.('input,select,textarea');
      }
      if(!control)return;
      if(!control.id)control.id=`cui-field-${++generatedFieldId}`;
      label.htmlFor=control.id;
    });
  }

  function tableCaption(table){
    const card=table.closest('.card');
    /* V298: `b` is in this list because that is how a workspace card writes its title — but a
       `b` INSIDE a table is a cell, not a title. Staff performance was naming its table after the
       first staff member in it ("Owner Person"), which is both a useless accessible name and a
       repeat of text already in the grid. Skip anything that lives in a table and fall through to
       the page heading, which is what the caller meant all along. */
    const heading=[...(card?.querySelectorAll('h2,h3,.cui-card-head,b')||[])]
      .find(node=>!node.closest('table')&&node.textContent.trim());
    const page=table.closest('main')?.querySelector('h1');
    return (heading?.textContent||page?.textContent||'Data table').trim();
  }

  /* V298 (owner report 2026-08-13, from a live Business Insights screenshot: "Revenue by type"
     printed as the card heading and AGAIN as a smaller grey line right beneath it — same for
     "Reversal reconciliation", "Loyalty flow…" and "Liabilities…", and the same across the rest
     of the workspace). Mechanism: a workspace card is written as
     `<div class="card"><b>Revenue by type</b><table>…`, and enhanceTables below then synthesised
     a <caption> whose text tableCaption() had just COPIED off that very <b>. The duplicate was
     structural, not a typo at any one call site.

     A <caption> is the native accessible name of a table, so deleting it would trade a cosmetic
     bug for a real accessibility regression (screen-reader users would meet an unnamed grid).
     The name is therefore kept and hidden with the document's existing .sr-only utility: the
     title is visible exactly once (the heading) and announced exactly once (the caption).

     Hand-written captions are left visible unless they repeat a heading verbatim, because those
     carry information the heading does not — platform console prints "{count} archived" and
     "First five source rows" in a caption, and hiding those would delete facts from the page. */
  function captionRepeatsHeadingV298(table,text){
    const name=text.trim().toLowerCase();
    if(!name)return false;
    const scope=table.closest('.card,.platform-detail-section,section');
    if(!scope)return false;
    /* `b`/`strong` are in the list because that is how the workspace cards write their titles;
       anything inside a table is a cell, not a heading, so it can never be the visible title. */
    return [...scope.querySelectorAll('h1,h2,h3,h4,.cui-card-head,b,strong')]
      .some(node=>!node.closest('table')&&node.textContent.trim().toLowerCase()===name);
  }

  /* V298: the one place that decides whether a table's name is also shown. A caption we
     synthesised is a copy of an already-visible heading by construction, so it is always hidden;
     an authored one is hidden only when it repeats that heading word for word. Either way the
     table is left with a non-empty accessible name. .sr-only is only ever added, never removed,
     so this is idempotent under the MutationObservers that drive both callers. */
  function nameTableOnceV298(table,caption,derived){
    if(derived||!caption.textContent.trim())caption.textContent=tableCaption(table);
    if(derived||captionRepeatsHeadingV298(table,caption.textContent))caption.classList.add('sr-only');
  }

  /* The workspace runs the full enhancer (mountMain); the platform console does not — it writes
     its own finished markup and would otherwise keep the doubled titles the owner reported, on
     "Loss reasons", "Contacts", "Payment history", "Campaign history", "Explore demand",
     "Partner register", "Suppression instructions" and "Stripe price catalogue". This observer is
     the caption rule ALONE: it never touches classes, data-label, thead or the wrapper, so it
     cannot restyle a console table that was never built for the responsive card layout. */
  function dedupeTableCaptionsV298(root){
    root.querySelectorAll('caption').forEach(caption=>{
      const table=caption.parentElement;
      if(table?.tagName==='TABLE')nameTableOnceV298(table,caption,false);
    });
  }

  function observeTableCaptionsV298(root){
    dedupeTableCaptionsV298(root);
    const observer=new MutationObserver(()=>dedupeTableCaptionsV298(root));
    observer.observe(root,{childList:true,subtree:true});
    return observer;
  }

  function enhanceTables(root){
    root.querySelectorAll('table').forEach(table=>{
      table.classList.add('cui-table');
      const isComplex=!!table.querySelector('[colspan],[rowspan]');
      table.dataset.responsive=isComplex?'false':'true';
      let caption=table.querySelector(':scope > caption');
      const derivedCaptionV298=!caption;
      if(!caption){caption=document.createElement('caption');table.prepend(caption)}
      nameTableOnceV298(table,caption,derivedCaptionV298);
      let head=table.querySelector(':scope > thead');
      const firstRow=table.querySelector('tr');
      if(!head&&firstRow?.querySelector('th')){
        head=document.createElement('thead');head.append(firstRow);table.insertBefore(head,table.querySelector('tbody'));

/* nestly_v474 (owner: "why it shows 15 stamps in record sale but customer view shows 5 out of 10

   pot 15, ten already consumed by a completed card, so five on a ten-slot card.

function stampCardStandingV474(card,balance,unitNoun){

   heading — because dropping a server-approved reward on the floor would be a second, client-side
   eligibility rule, which is exactly what v145 forbids. */
function groupRedeemableRewardsV432(rewards){
  const labels={stamp_card:'Stamp card',points:'Points'};
  const order=['stamp_card','points'];
  const groups=new Map();
  for(const reward of (Array.isArray(rewards)?rewards:[])){
    if(!reward)continue;
    const key=Object.prototype.hasOwnProperty.call(labels,reward.source)?reward.source:'other';
    if(!groups.has(key))groups.set(key,{source:key,label:labels[key]||'Rewards',rewards:[]});

  function drawStep1(){
