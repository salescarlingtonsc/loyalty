/* ============================================================================
   Frenly design system v2 — "mockup layout, iOS polish" (owner ruling 2026-07-18)
   Principles: 8pt grid · SF-grade type with tight optical tracking · hairline
   borders instead of heavy strokes · layered low-opacity shadows (never one big
   blur) · frosted glass on floating surfaces · springy motion on interaction.
   The wordmark is an image asset, not type — headings run on the system
   (SF on Apple) stack, which is what makes it read as a native app rather than a
   generic web dashboard.
   ============================================================================ */
:root{
  --bg:#F4F2EE; --card:#FFFFFF; --ink:#17161A; --ink2:#3D3B44; --muted:#6B6673;
  --line:#EAE6DF; --control-border:#817B88; --hair:rgba(23,22,26,.06);
  /* ===== BRAND RED — SINGLE SOURCE OF TRUTH (owner ruling 2026-08-18) =====================
     Peekaa red is #C24135. It was previously two colours: the business app used #C24135 and
     the customer app used #F06A4F, with 79 customer rules on one and 45 on the other, so the
     two apps did not read as the same product. Every red below now derives from --brand-red.
     TO CHANGE THE BRAND RED: edit --brand-red and the four --brand-red-* steps ONLY. Nothing
     else in this file hardcodes a brand red. --coral and --peekaa-red are kept as aliases so
     no rule had to be rewritten; both now resolve to the same colour. */
  --brand-red:#C24135;           /* the brand red */
  --brand-red-dark:#9D352C;      /* pressed / hover / gradient end */
  --brand-red-soft:#F7DCD7;      /* selected chip + active nav background */
  --brand-red-faint:#FDEEEB;     /* large tinted surfaces */
  /* Dark surfaces need a lighter accent to stay legible; these are the SAME hue lifted, not a
     second brand. Change these two together with --brand-red above. */
  --brand-red-on-dark:#E4776B;   /* accent text/icons on a dark ground */
  --brand-red-on-dark-2:#F0A199; /* hover step on a dark ground */
  /* ===== LAYOUT BREAKPOINTS (owner ruling 2026-08-18) ==================================
     The workspace shell is governed by TWO thresholds, and only these two:
       <= 768px   compact layout — mobile page padding, stacked page headers, responsive
                  tables, single-column dashboard. iPad portrait (768) sits INSIDE this.
       <= 960px   no room for a persistent sidebar — rail hidden, mobile dock shown.
                  iPad portrait and 11in Pro portrait (834) get the dock; iPad landscape
                  (1024) keeps the rail.
     Before this, four thresholds (760 / 767 / 768 / 960) governed the same decision, which
     left 761-767px and exactly 768px in hybrid states nobody designed: mobile padding with
     a desktop-centred header. Component-local breakpoints (small-phone tweaks, short
     viewports, individual carousels) are deliberately left alone — they are per-component
     decisions, not shell layout. Do not introduce a third shell threshold. */
  --coral:var(--brand-red); --coral-hover:var(--brand-red-dark); --amber:#A75514; --green:#1F6B48; --red:var(--brand-red-dark);
  --grad:linear-gradient(135deg,var(--brand-red),var(--brand-red-dark));
  --peekaa-red:var(--brand-red);--peekaa-red-dark:var(--brand-red-dark);--peekaa-red-soft:var(--brand-red-soft);--peekaa-red-faint:var(--brand-red-faint);
  --peekaa-bg:#F8F4F1;--peekaa-card:#FFFDFC;--peekaa-white:#FFFFFF;
  --peekaa-text:#251F1B;--peekaa-text-secondary:#7C746E;--peekaa-text-muted:#A39DA5;
  --peekaa-border:#ECE3DE;--peekaa-divider:#F0EBE7;
  --peekaa-success:#4F8A72;--peekaa-success-bg:#E7F3ED;
  --peekaa-gold:#D8B15A;--peekaa-gold-bg:#FFF3D6;
  /* V299: the one categorical palette for DOM proportion bars (reports, playbooks). */
  --chart-1:#C24135; --chart-2:#1F6B48; --chart-3:#1F5199; --chart-4:#8A5A12; --chart-5:#7A2E9D; --chart-6:#6B6673;
  --tint:#FFF0EC;            /* coral wash for selected/active surfaces */
  /* iOS uses generous, continuous corner radii */
  --r:18px; --r-sm:12px; --r-lg:24px;
  /* Depth = several cheap shadows stacked, not one expensive one */
  --shadow:0 1px 2px rgba(23,22,26,.04),0 4px 12px rgba(23,22,26,.045);
  --shadow-lg:0 2px 6px rgba(23,22,26,.05),0 18px 44px rgba(23,22,26,.10);
  --spring:cubic-bezier(.34,1.4,.64,1);
  --ease:cubic-bezier(.2,.8,.2,1);

  --motion-ui:220ms;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px;
  --control-h:44px;
  --sf:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Inter',system-ui,'Segoe UI',sans-serif;

/* universal importer modal */

@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:640px;max-width:100%;
  max-height:88vh;overflow-y:auto;padding:26px;animation:pop .22s var(--spring);transform-origin:center}
/* V350 (owner mockup, photo 3): welcome offer modal — icon hero, an icon+label toggle row instead
   of a bare checkbox, card-style radio options with a selected highlight, and a tinted info box.
   V362 (owner, photo 4: "compact, premium SaaS form, not large accessibility-style controls").
   Every control here was oversized: a 22px checkbox rendering as a giant blue square, option cards
   with huge padding, tall inputs, and section gaps ~30% larger than the rest of the admin UI. The
   sizes below are the owner's own numbers. The selected state deliberately changes only colour —
   never size — so a row cannot change height when it is picked. */
.welcome-offer-modal-v350 .modal-card{position:relative;padding:22px}
.welcome-offer-modal-v350 .welcome-offer-close-v350{position:absolute;top:18px;right:18px}
.welcome-offer-modal-v350 h2#welcomeOfferTitleV215{font-size:1.45rem!important}
.welcome-offer-modal-v350 label{font-size:14px}
.welcome-offer-modal-v350 input:not([type="checkbox"]):not([type="radio"]),
.welcome-offer-modal-v350 select{min-height:48px;border-radius:12px;padding:10px 12px;font-size:15px}
.welcome-offer-modal-v350 .welcome-offer-hero-v350{width:46px;height:46px;min-width:46px;flex:none;border-radius:14px;background:#FFF0ED;color:var(--coral);display:flex;align-items:center;justify-content:center;margin-top:2px}
/* Problem 5 — a compact setting row, not a bordered selection box. */
.welcome-offer-modal-v350 .welcome-offer-togglerow-v350{display:flex;align-items:center;gap:10px;min-height:58px;padding:10px 14px;border:1px solid var(--control-border);border-radius:12px;background:#FBFAF8;cursor:pointer}
.welcome-offer-modal-v350 .welcome-offer-togglerow-v350>b{flex:1;min-width:0;font-size:15px}
.welcome-offer-modal-v350 .welcome-offer-togglerow-icon-v350{width:28px;height:28px;min-width:28px;border-radius:9px;background:#FFF0ED;color:var(--coral);display:flex;align-items:center;justify-content:center}
/* Problem 1 — a normal compact checkbox. accent-color keeps the native tick inside the box. */
.welcome-offer-modal-v350 .welcome-offer-togglerow-v350 input[type="checkbox"]{margin-left:auto;flex:none;
  width:20px;height:20px;min-width:20px;max-width:20px;min-height:20px;max-height:20px;
  appearance:auto;-webkit-appearance:checkbox;accent-color:var(--coral);cursor:pointer}
/* Problem 2 — compact selectable rows; colour-only selected state. */
.welcome-offer-modal-v350 .welcome-offer-optioncard-v350{display:flex;align-items:center;gap:12px;
  min-height:76px;padding:16px 18px;border:1px solid var(--control-border);border-radius:12px;margin-top:8px;cursor:pointer}
.welcome-offer-modal-v350 .welcome-offer-optioncard-v350>span{flex:1;min-width:0}
.welcome-offer-modal-v350 .welcome-offer-optioncard-v350 b{font-size:15px;font-weight:650}
.welcome-offer-modal-v350 .welcome-offer-optioncard-v350 p{font-size:13.5px;overflow-wrap:anywhere}
.welcome-offer-modal-v350 .welcome-offer-optioncard-v350 input[type="radio"]{flex:none;margin:0;
  width:20px;height:20px;min-width:20px;max-width:20px;min-height:20px;max-height:20px;
  appearance:auto;-webkit-appearance:radio;accent-color:var(--coral);cursor:pointer}
.welcome-offer-modal-v350 .welcome-offer-optioncard-v350.selected{border-color:var(--coral);background:#FFF6F4}
/* Problem 4 — consistent, tighter section rhythm. */
.welcome-offer-modal-v350 fieldset{margin-top:18px!important}
.welcome-offer-modal-v350 legend.small{margin-bottom:2px}
.welcome-offer-modal-v350 .welcome-offer-infobox-v350{display:flex;align-items:flex-start;gap:8px;margin-top:16px;padding:10px 12px;border-radius:12px;background:#FBF3E7;color:var(--ink);font-size:13px}
.welcome-offer-modal-v350 .welcome-offer-infobox-v350>span:first-child{color:var(--amber);flex-shrink:0;margin-top:1px}
/* V366 — the Birthday gift modal (owner markup, photo 1: oversized checkbox, a double-outlined
   dropdown, oversized radios, and timing options spread too far apart). Every one of those is the
   same root cause: the modal reused the welcome-offer MARKUP but not its class, so its controls
   fell through to the global `input,select,textarea{width:100%;min-height:var(--control-h)}` rule
   and a checkbox became a 44px square. This is the welcome-offer treatment, scoped to its own
   class and tightened to the sizes the owner asked for. */
.birthday-gift-modal-v366 .welcome-offer-togglerow-v350{display:flex;align-items:center;gap:10px;min-height:52px;padding:9px 14px;border:1px solid var(--control-border);border-radius:12px;background:#FBFAF8;cursor:pointer}
.birthday-gift-modal-v366 .welcome-offer-togglerow-v350>b{flex:1;min-width:0;font-size:15px}
.birthday-gift-modal-v366 .welcome-offer-togglerow-icon-v350{width:28px;height:28px;min-width:28px;border-radius:9px;background:#FFF0ED;color:var(--coral);display:flex;align-items:center;justify-content:center}
/* Issue 1 — a standard compact checkbox, fixed box so the row cannot grow when it is ticked. */
.birthday-gift-modal-v366 .welcome-offer-togglerow-v350 input[type="checkbox"]{margin-left:auto;flex:none;
  width:22px;height:22px;min-width:22px;max-width:22px;min-height:22px;max-height:22px;
  appearance:auto;-webkit-appearance:checkbox;accent-color:var(--coral);cursor:pointer}
/* Issue 2 — one border, not two. The global focus ring is 3.5px and read as a second outline
   around the select; inside this modal focus is a thin coral border with a soft 2px halo. */
.birthday-gift-modal-v366 select,.birthday-gift-modal-v366 input[type="text"],
.birthday-gift-modal-v366 input:not([type]),.birthday-gift-modal-v366 textarea{box-shadow:none}
.birthday-gift-modal-v366 select:focus,.birthday-gift-modal-v366 input:focus,
.birthday-gift-modal-v366 textarea:focus{border-color:var(--coral);box-shadow:0 0 0 2px rgba(194,65,53,.12)}
/* Issues 3 and 4 — compact selectable rows (~30% tighter) with a normal-sized radio. */
.birthday-gift-modal-v366 .welcome-offer-optioncard-v350{display:flex;align-items:center;gap:10px;
  min-height:auto;padding:11px 14px;border:1px solid var(--control-border);border-radius:12px;margin-top:6px;cursor:pointer}
.birthday-gift-modal-v366 .welcome-offer-optioncard-v350>span{flex:1;min-width:0}
.birthday-gift-modal-v366 .welcome-offer-optioncard-v350 b{font-size:15px;font-weight:650;display:block}
.birthday-gift-modal-v366 .welcome-offer-optioncard-v350 p{font-size:13.5px;margin-top:1px!important;overflow-wrap:anywhere}
.birthday-gift-modal-v366 .welcome-offer-optioncard-v350 input[type="radio"]{flex:none;margin:0;
  width:19px;height:19px;min-width:19px;max-width:19px;min-height:19px;max-height:19px;
  appearance:auto;-webkit-appearance:radio;accent-color:var(--coral);cursor:pointer}
.birthday-gift-modal-v366 .welcome-offer-optioncard-v350.selected{border-color:var(--coral);background:#FFF6F4}
.birthday-gift-modal-v366 fieldset{margin-top:16px!important}
.birthday-gift-modal-v366 legend.small{margin-bottom:2px}
.birthday-gift-modal-v366 .birthday-days-v366 input{width:96px;min-width:96px}
/* V382 (owner: "when i select birthday month why am i still able to edit the days?"). The days
   row also carries .row, whose display:flex outranks [hidden]'s UA display:none — so hiding it
   from JS did nothing and the fields stayed editable in month mode. Same fix as
   .grow-programme-row[hidden] and .appointment-list-filters[hidden] above. */
.birthday-days-v366[hidden]{display:none!important}
/* V382: with the gift switched off, nothing below the switch is editable. */
.birthday-gift-modal-v366 [data-birthday-config-v382][aria-disabled="true"]{opacity:.55}

/* Program Studio (PS-1A authoring surface) — theme-aware via existing tokens only */
.studio-row{padding:12px 0;border-bottom:1px solid var(--line)}

.studio-advanced summary{cursor:pointer;font-weight:600;color:var(--coral);min-height:44px;display:flex;align-items:center}

/* ===== V373 — one Record sale flow (owner: "too crowded and no tabs to consolidate it") =====

   exactly where anyone taps. Measured in the browser: at one ordinary scroll position the block's
   title was 68px underneath the header, and that region belongs to the header, which does

   earlier fixes of mine missed it.

/* V200 (owner: "not able to click in the specific appointments"). These three rules used to live
   ~760 lines EARLIER in this sheet. `.week-blocked-window` and `.day-blocked-window` are both

/* v190 (owner: "change the background to same as business background (beige) instead of
   black; light/dark can be adjusted in the profile module"). The customer surface used to flip
   to dark purely because the DEVICE was in dark mode, so one person saw a beige workspace and a

function activityAmountCentsV267(h){

  if(h.kind==='redemption')return h.credit_cents?Number(h.credit_cents):null;

  async function blockedTimeRows(scope){

  async function scheduledCapacityHours(scope){
    if(!scope.branchId)return {known:false,reason:'Select one branch to compare bookings with that branch’s scheduled team hours.'};
    const [assignments,activeStaff,hours,offDays,branchHours,branchBreaks,blockedTimes]=await Promise.all([
      fetchAllRows(()=>sb.from('staff_branches').select('staff_id').eq('business_id',S.biz.id).eq('branch_id',scope.branchId).order('staff_id')),
      fetchAllRows(()=>sb.from('staff').select('id').eq('business_id',S.biz.id).eq('active',true).order('id')),
      fetchAllRows(()=>sb.from('staff_hours').select('staff_id,weekday,starts_at,ends_at').eq('business_id',S.biz.id).order('staff_id').order('weekday').order('starts_at')),
      fetchAllRows(()=>sb.from('staff_off_days').select('staff_id,starts_on,ends_on').eq('business_id',S.biz.id).lte('starts_on',scope.to).gte('ends_on',scope.from).order('staff_id').order('starts_on').order('ends_on')),
      fetchAllRows(()=>sb.from('branch_hours').select('weekday,opens_at,closes_at').eq('business_id',S.biz.id).eq('branch_id',scope.branchId).order('weekday')),
      fetchAllRows(()=>sb.from('branch_breaks').select('weekday,starts_at,ends_at').eq('business_id',S.biz.id).eq('branch_id',scope.branchId).order('weekday').order('starts_at')),
      blockedTimeRows(scope)
    ]);
    const activeIds=new Set((activeStaff||[]).map(row=>row.id));
    const assigned=new Set((assignments||[]).map(row=>row.staff_id).filter(id=>activeIds.has(id)));
    const schedules=(hours||[]).filter(row=>assigned.has(row.staff_id));
    if(!assigned.size||!schedules.length||!(branchHours||[]).length)return {known:false,reason:'Scheduled capacity needs both branch opening hours and team working hours.'};
    const days=[];
    for(let day=scope.from;day<=scope.to;day=shiftSgDateInput(day,1))days.push(day);
    let minutes=0;
    for(const day of days){
      const weekday=sgCalendarWeekday(day);
      const branchSchedule=(branchHours||[]).find(row=>Number(row.weekday)===weekday);
      if(!branchSchedule)continue;
      const branchStart=timeMinutes(branchSchedule.opens_at),branchEnd=timeMinutes(branchSchedule.closes_at);
      if(!Number.isFinite(branchStart)||!Number.isFinite(branchEnd)||branchEnd<=branchStart)continue;
      const dayBreaks=(branchBreaks||[]).filter(row=>Number(row.weekday)===weekday)
        .map(row=>({start:timeMinutes(row.starts_at),end:timeMinutes(row.ends_at)}))
        .filter(interval=>Number.isFinite(interval.start)&&Number.isFinite(interval.end)&&interval.end>interval.start);
      for(const schedule of schedules){
        const away=(offDays||[]).some(off=>off.staff_id===schedule.staff_id&&off.starts_on<=day&&off.ends_on>=day);
        if(!away&&Number(schedule.weekday)===weekday){
          const start=Math.max(branchStart,timeMinutes(schedule.starts_at));
          const end=Math.min(branchEnd,timeMinutes(schedule.ends_at));
          if(end<=start)continue;
          const staffBlocks=(blockedTimes||[])
            .filter(block=>block.staff_id===schedule.staff_id)
            .map(block=>sgDayInstantOverlapMinutes(day,block.starts_at,block.ends_at))
            .filter(Boolean);
          const clipped=[...dayBreaks,...staffBlocks]
            .map(interval=>({start:Math.max(start,interval.start),end:Math.min(end,interval.end)}))
            .filter(interval=>interval.end>interval.start);
          minutes+=Math.max(0,(end-start)-mergedIntervalMinutes(clipped));
        }
      }
    }
    return {known:true,hours:minutes/60};
  }
