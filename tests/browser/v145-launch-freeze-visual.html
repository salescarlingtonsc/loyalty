/* Phone-first staff navigation. The high-frequency jobs stay thumb-reachable while the
   complete, permission-filtered workspace navigation remains available behind More. */
.staff-mobile-dock{display:none}
.staff-mobile-more{position:relative;min-width:0}
.staff-mobile-more>summary{list-style:none}
.staff-mobile-more>summary::-webkit-details-marker{display:none}
.staff-mobile-drawer{position:absolute;right:0;bottom:calc(100% + 10px);width:min(330px,calc(100vw - 24px));
  max-height:min(68dvh,560px);overflow:auto;padding:10px;background:rgba(255,255,255,.97);
  border:1px solid var(--hair);border-radius:18px;box-shadow:var(--shadow-lg);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px)}
.staff-mobile-drawer .nav{display:block}
.staff-mobile-drawer .navhead{margin-top:6px}
.staff-mobile-drawer .navbody a{padding-left:22px}
.staff-mobile-action{min-width:0;min-height:52px;padding:5px 2px;border-radius:12px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:650}
.staff-mobile-action svg{width:20px;height:20px}
.staff-mobile-action.act{color:var(--coral);background:var(--tint)}
.staff-mobile-action:active{transform:scale(.96)}
/* settings — tabbed sections so each save has a clear, small scope instead of one long page */
.settings-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.settings-tab{min-height:44px;padding:10px 15px;border:0;border-bottom:2px solid transparent;background:transparent;
  color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;border-radius:10px 10px 0 0;white-space:nowrap;
  transition:color .14s,background .14s,border-color .14s}
.settings-tab:hover{color:var(--ink2);background:#F2EFEA}
.settings-tab[aria-selected="true"]{color:var(--coral);border-bottom-color:var(--coral)}
.settings-panel[hidden]{display:none}
.settings-save-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.settings-save-row .btn{flex:0 0 auto}
.workspace-logo-editor{display:grid;grid-template-columns:92px minmax(0,1fr);gap:16px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
.workspace-logo-preview{width:92px;height:92px;border-radius:24px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;overflow:hidden;font-size:30px;font-weight:800;color:var(--red)}
.workspace-logo-preview img{width:100%;height:100%;object-fit:cover;display:block}
.workspace-logo-fields{min-width:0}
.settings-scope{color:var(--muted);font-size:12px;line-height:1.4;flex:1 1 160px;min-width:0}
.switchrow{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 4px;font-size:12.5px;color:var(--ink2)}
.tglsw{position:relative;width:44px;height:44px;border-radius:100px;background:transparent;cursor:pointer}
.tglsw::before{content:'';position:absolute;left:4px;top:11px;width:36px;height:21px;border-radius:100px;background:var(--line);
  transition:background .18s var(--ease);flex-shrink:0}
.tglsw.on::before{background:var(--green)}
.tglsw::after{content:'';position:absolute;top:13px;left:6px;width:17px;height:17px;border-radius:100px;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s var(--spring)}
.tglsw.on::after{transform:translateX(15px)}
/* universal importer modal */
.modal{position:fixed;inset:0;z-index:210;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(23,22,26,.4);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:fade .18s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:640px;max-width:100%;
  max-height:88vh;overflow-y:auto;padding:26px;animation:pop .22s var(--spring);transform-origin:center}
.seg{display:inline-flex;gap:4px;background:#F1EEE9;border-radius:100px;padding:3px}
.seg button{background:transparent;border-radius:100px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.act{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.imp-prev{border:1px solid var(--hair);border-radius:var(--r-sm);overflow:hidden;margin-top:14px}
.imp-prev table{font-size:12px}.imp-prev th,.imp-prev td{padding:7px 10px}
.imp-note{background:var(--tint);color:#8a4a2e;border-radius:var(--r-sm);padding:9px 12px;font-size:12px;margin-top:12px}
.reward-list{display:grid;gap:10px;margin-top:12px}
.reward-item{border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 14px;background:#fff}
.reward-item .meta{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.reward-editor{margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}
.reward-editor .field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.reward-editor .field-grid .full{grid-column:1/-1}
.reward-editor details{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.reward-editor summary{cursor:pointer;font-weight:650;color:var(--ink2);list-style:none}
.reward-editor summary::-webkit-details-marker{display:none}
.reward-editor summary::after{content:'+';float:right;color:var(--muted);font-size:18px;line-height:1}
.reward-editor details[open] summary::after{content:'−'}
.eligibility-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px}
.eligibility-group{background:#FBFAF8;border:1px solid var(--hair);border-radius:var(--r-sm);padding:10px}
.eligibility-group label{display:flex;align-items:center;gap:7px;margin:7px 0 0;color:var(--ink2);font-size:13px;font-weight:500;cursor:pointer}
.eligibility-group input[type=checkbox]{width:auto;margin:0}
.reward-editor .help{margin-top:5px;line-height:1.45}
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.reward-context{width:auto;min-width:110px;max-width:160px;margin:0;padding:7px 28px 7px 9px;font-size:12px}
@media(max-width:700px){.field-grid,.reward-editor .field-grid,.eligibility-grid{grid-template-columns:1fr}}
/* --- Grow recommender: give-back meter + suggestion panels (see app/grow-recommender.js) --- */
.gb-meter{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;background:#FBFAF8}
.gb-meter-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.gb-meter-figure{font-size:1.45rem;font-weight:700;letter-spacing:-.02em;line-height:1}
.gb-meter-bar{margin-top:10px;height:9px;border-radius:100px;background:#EFEAE3;overflow:hidden}
.gb-meter-fill{display:block;height:100%;border-radius:100px;transition:width .22s var(--ease),background-color .22s var(--ease)}
.gb-meter.is-good .gb-meter-figure{color:var(--green)} .gb-meter.is-good .gb-meter-fill{background:var(--green)}
.gb-meter.is-watch .gb-meter-figure{color:var(--amber)} .gb-meter.is-watch .gb-meter-fill{background:var(--amber)}
.gb-meter.is-high .gb-meter-figure{color:var(--red)} .gb-meter.is-high .gb-meter-fill{background:var(--red)}
.gb-meter.is-blank .gb-meter-figure{color:var(--muted)} .gb-meter.is-blank .gb-meter-fill{background:var(--muted)}
.gb-meter p{margin-top:8px;line-height:1.5}
.gb-scale{display:flex;justify-content:space-between;margin-top:6px;font-size:11.5px;color:var(--muted)}
.rec-panel{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.rec-figures{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.rec-figure{border:1px solid var(--hair);border-radius:var(--r-sm);background:#FBFAF8;padding:11px 12px}
.rec-figure b{display:block;font-size:1.2rem;letter-spacing:-.02em}
.rec-figure span{display:block;margin-top:3px;font-size:11.5px;color:var(--muted)}
.rec-why{margin-top:12px;padding-left:18px;line-height:1.6;font-size:12.5px;color:var(--ink2)}
.rec-why li{margin-top:5px}
input[type=range]{min-height:auto;padding:0;border:none;background:none;accent-color:var(--coral);width:100%}
input[type=range]:focus{box-shadow:none}
@media(max-width:700px){.rec-figures{grid-template-columns:1fr}}
.main{padding:26px max(34px,env(safe-area-inset-right))
  calc(46px + env(safe-area-inset-bottom)) max(34px,env(safe-area-inset-left));
  max-width:1240px;width:100%}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:1.85rem;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:14px}
.kpi{transition:transform .24s var(--spring),box-shadow .24s var(--ease)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
/* Tabular figures stop KPI numbers from jittering as they update */
.kpi .v{font-family:var(--sf);font-size:1.75rem;font-weight:680;margin-top:3px;
  letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
/* Waitlist conversion queue — big pictogram rows, one primary action each */
.wl-add-grid{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:4px}
.wl-add-grid .wl-fld{display:flex;flex-direction:column;gap:4px;flex:1 1 150px;min-width:0}
.wl-add-grid .wl-fld label{font-size:12px;color:var(--muted);font-weight:600}
.wl-add-grid input,.wl-add-grid select{margin:0}
.wl-list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.wl-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff}
.wl-row.contacted{background:#FBFAF8}
.wl-rank{flex:0 0 auto;width:38px;height:38px;border-radius:100px;display:flex;align-items:center;justify-content:center;background:var(--tint);color:var(--coral);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.wl-main{flex:1 1 auto;min-width:0}
.wl-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:1.02rem}
.wl-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:3px}
.wl-meta .sep{opacity:.45}
.wl-wait{font-weight:600}
.wl-wait.urgent{color:var(--red)}
.wl-notes{margin-top:3px}
.wl-actions{flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.wl-x{padding:8px 12px}
@media(max-width:640px){.wl-row{flex-wrap:wrap}.wl-actions{width:100%;justify-content:flex-start}.wl-actions>.btn{flex:1 1 auto}}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.charts .card{min-height:280px}
.chart-frame{position:relative;block-size:240px;min-block-size:0;margin-top:12px;overflow:hidden}
.chart-frame canvas{position:absolute;inset:0;display:block;width:100% !important;height:100% !important;max-height:100%}
.expiry-days-field[hidden]{display:none}
.range{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.range input{width:auto}
/* segmented control, iOS-style */
.qbtn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;background:#fff;border:1px solid var(--control-border);border-radius:100px;padding:9px 14px;font-size:12.5px;
  font-weight:600;color:var(--muted);box-shadow:var(--shadow);
  transition:transform .18s var(--spring),color .14s,background .14s}
.qbtn:hover{color:var(--ink)}
.qbtn:active{transform:scale(.94)}
.qbtn.act{background:var(--ink);color:#fff;border-color:var(--ink)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;min-width:0;max-width:100%}
.split>*{min-width:0;max-width:100%}
#slist{min-width:0;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:10px;align-items:center}
.settings-page,.settings-page .split,.settings-page .card{min-width:0;max-width:100%}
.settings-page .row>*{min-width:0}
.settings-page input[type="file"]{max-width:100%}
.reports-grid{grid-template-columns:repeat(2,minmax(0,1fr));width:100%;min-width:0;max-width:100%}
.reports-grid>.card{min-width:0;max-width:100%}.reports-grid table{table-layout:fixed}.reports-grid td{overflow-wrap:anywhere}
.portal-link-row{margin-top:4px;min-width:0;max-width:100%}
.portal-link{display:flex;align-items:center;width:100%;min-width:0;max-width:100%;min-height:44px;padding:8px 0;
  color:#A64020;font-weight:700;line-height:1.4;text-decoration:underline;text-underline-offset:3px;
  overflow-wrap:anywhere;word-break:break-word;white-space:normal}
.settings-choice{display:flex;align-items:flex-start;gap:10px;min-height:44px;padding:6px 0;margin:6px 0;cursor:pointer;font-size:14px;color:var(--ink);font-weight:500}
.settings-choice>input{flex:0 0 auto;width:24px;min-height:24px;margin-top:4px}
.checkout-catalogue-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.checkout-catalogue-list{display:grid;gap:8px;margin-top:14px}
.checkout-catalogue-item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;
  min-height:64px;padding:10px 12px;border:1px solid var(--hair);border-radius:var(--r-sm);background:#fff}
.checkout-catalogue-item p{margin:3px 0 0}.checkout-catalogue-item .btn{min-height:44px;min-width:92px}
.checkout-catalogue-filter{display:grid;grid-template-columns:minmax(0,280px);margin-top:14px}
.retention-taxonomy-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;min-width:0;padding:8px 0;border-bottom:1px solid var(--line)}
.retention-taxonomy-copy{display:flex;align-items:center;flex:1 1 180px;flex-wrap:wrap;gap:8px;min-width:0}.retention-taxonomy-copy>span:first-child{min-width:0;overflow-wrap:anywhere}
.retention-taxonomy-actions{display:flex;align-items:center;flex:0 1 auto;flex-wrap:wrap;gap:8px;min-width:0}
/* Grow overview: one journey first, engine-specific editors only on demand. */
.grow-overview{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:920px;margin:0 auto}
.grow-hero{display:grid;grid-template-columns:minmax(0,1fr);justify-items:start;gap:14px;padding:20px;
  border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(135deg,#fff 0%,var(--tint) 100%);box-shadow:var(--shadow)}
.grow-hero-copy{max-width:620px}.grow-hero-copy h1{font-size:clamp(1.8rem,4vw,2.35rem);margin:0}
.grow-hero-copy p{max-width:58ch;margin-top:6px;line-height:1.5}
.grow-primary{min-height:48px;white-space:normal}
.grow-secondary{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:0 18px;box-shadow:var(--shadow)}
.grow-secondary>summary{display:flex;align-items:center;min-height:56px;cursor:pointer;font-weight:700;color:var(--ink)}
.grow-secondary-body{display:grid;gap:18px;padding:0 0 18px}.grow-secondary-intro{padding:2px 2px 0}
.reward-auto-dialog{display:grid;grid-template-rows:auto minmax(0,1fr) auto;width:min(560px,100%);max-width:560px;max-height:min(92dvh,720px);overflow:hidden}
.reward-auto-head{display:flex;align-items:flex-start;gap:14px}.reward-auto-head>div{min-width:0;flex:1}
.reward-auto-content{min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 2px}
.reward-auto-step{margin-top:18px}.reward-auto-step h3{font-size:18px;margin-top:4px}
.reward-auto-choice{display:flex;align-items:flex-start;gap:12px;min-height:64px;padding:13px;margin-top:14px;border:1px solid var(--coral);border-radius:14px;background:var(--tint)}
.reward-auto-choice input{flex:0 0 auto;width:22px;min-height:22px;margin-top:2px}.reward-auto-choice label{margin:0;color:var(--ink);font-size:14px}.reward-auto-choice p{margin-top:4px}
.reward-auto-summary{display:grid;gap:9px;margin-top:14px}.reward-auto-summary>div{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--hair)}
.reward-auto-summary dt{color:var(--muted)}.reward-auto-summary dd{font-weight:700;text-align:right;overflow-wrap:anywhere}
.reward-auto-actions{position:sticky;bottom:0;z-index:1;display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--hair);background:#fff}.reward-auto-actions .btn{min-height:44px}
.reward-auto-status{min-height:22px;margin-top:12px}.reward-auto-safety{padding:12px;border-radius:12px;background:#E7F6EE;color:#1f6c46;line-height:1.5}
.grow-flow{display:grid;grid-template-columns:1fr;gap:8px;list-style:none;padding:0;margin:0}
.grow-flow-step{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;column-gap:12px;min-width:0;min-height:76px;padding:12px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;box-shadow:var(--shadow)}
.grow-flow-step:not(:last-child)::after{display:none}
.grow-flow-icon{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:var(--tint);color:var(--coral)}
.grow-flow-step h2{font-size:16px;margin:0 0 3px}.grow-flow-step p{font-size:12.5px;line-height:1.45;color:var(--muted);margin:0}
.grow-flow-step h2,.grow-flow-step>p{grid-column:2}.grow-flow-icon{grid-row:1/3}.grow-flow-foot{grid-column:3;grid-row:1/3;display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}.grow-flow-foot .btn{min-height:44px}
.reward-milestone-track{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;list-style:none;margin:14px 0 0;padding:0}
.grow-programme-list{display:grid;grid-template-columns:1fr;gap:0;margin-top:14px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.grow-programme-row{appearance:none;display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-width:0;min-height:72px;padding:12px 14px;border:0;border-bottom:1px solid var(--hair);background:#fff;color:var(--ink);font:inherit;text-align:left;text-decoration:none}
.grow-programme-row:last-child{border-bottom:0}.grow-programme-row>div{min-width:0}.grow-programme-row b,.grow-programme-row p{overflow-wrap:anywhere}.grow-programme-row p{margin:3px 0 0;line-height:1.4}
.grow-programme-row .rewards-overview-edit-label{min-height:24px;margin-top:3px}
button.grow-programme-row,a.grow-programme-row{cursor:pointer;transition:background .16s ease,box-shadow .16s ease}
button.grow-programme-row:hover,a.grow-programme-row:hover{background:var(--tint)}
button.grow-programme-row:focus-visible,a.grow-programme-row:focus-visible{position:relative;z-index:1;outline:3px solid rgba(201,67,51,.25);outline-offset:-3px}
.grow-programme-icon{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--coral);font-weight:750}
.grow-programme-meta{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}.grow-programme-action{min-height:44px;display:inline-flex;align-items:center;color:var(--coral);font-size:12px;font-weight:750;white-space:nowrap}
.grow-programme-access{font-size:11px;color:var(--muted);white-space:nowrap}
.rewards-overview-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
.rewards-overview-card{appearance:none;width:100%;min-height:92px;display:flex;gap:11px;align-items:flex-start;padding:14px;
  border:1px solid var(--line);border-radius:14px;background:#FBFAF8;color:var(--ink);font:inherit;text-align:left;min-width:0}
button.rewards-overview-card{cursor:pointer;transition:border-color .16s ease,box-shadow .16s ease,transform .16s ease}
button.rewards-overview-card:hover{border-color:var(--coral);box-shadow:0 7px 18px rgba(201,67,51,.1);transform:translateY(-1px)}
button.rewards-overview-card:focus-visible{outline:3px solid rgba(201,67,51,.25);outline-offset:2px;border-color:var(--coral)}
.rewards-overview-card>div{min-width:0;flex:1}.rewards-overview-card b,.rewards-overview-card p{overflow-wrap:anywhere}
.rewards-overview-edit-label{display:inline-flex;align-items:center;min-height:44px;margin-top:7px;color:var(--coral);font-size:12px;font-weight:700}
.reward-milestone-track li,.birthday-reward-overview{display:flex;gap:11px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:14px;background:#FBFAF8}
.reward-milestone-number{display:grid;place-items:center;flex:0 0 32px;height:32px;border-radius:50%;background:var(--tint);color:var(--coral);font-weight:700}
.birthday-reward-overview{margin-top:10px}.profitability-product-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px}

function lifecycleAnswerProjection(payload){

function expenseAmountProjection(expense,baseCurrency='SGD'){
  const sourceCurrency=String(expense?.currency||'').trim().toUpperCase();
  const normalizedBase=String(baseCurrency||'SGD').trim().toUpperCase();
  const amountCents=Number(expense?.amount_cents);
  const rateValue=expense?.fx_rate_to_base;
  const rate=rateValue===null||rateValue===undefined?NaN:Number(rateValue);
  const validCurrency=/^[A-Z]{3}$/.test(sourceCurrency)&&/^[A-Z]{3}$/.test(normalizedBase);
  const valid=validCurrency&&Number.isSafeInteger(amountCents)&&Number.isFinite(rate)&&rate>0;
  if(!valid)return {valid:false,originalLabel:null,baseLabel:null,baseCents:null,showBase:false};
  const baseCents=Math.round(amountCents*rate);
  if(!Number.isSafeInteger(baseCents))return {valid:false,originalLabel:null,baseLabel:null,baseCents:null,showBase:false};
  const format=(currency,cents)=>`${currency} ${(cents/100).toFixed(2)}`;
  return {
    valid:true,
    originalLabel:format(sourceCurrency,amountCents),
    baseLabel:format(normalizedBase,baseCents),
    baseCents,
    showBase:sourceCurrency!==normalizedBase||Math.abs(rate-1)>1e-12
  };
}
function staffPerformanceAggregation(rows,staffRows){
  const names=Object.fromEntries((Array.isArray(staffRows)?staffRows:[])
    .map(staff=>[staff.id,staff.full_name||'Team member']));
  const byStaff={};
  Object.keys(names).forEach(id=>{byStaff[id]={ledgerRecords:0,revenueRecords:0,revenue:0,commission:0}});
  (Array.isArray(rows)?rows:[]).forEach(row=>{
    const key=row.staff_id||'__unattributed';
    if(!byStaff[key])byStaff[key]={ledgerRecords:0,revenueRecords:0,revenue:0,commission:0};
    const amount=Number(row.amount_cents||0),commission=Number(row.commission_cents||0);
    byStaff[key].ledgerRecords+=1;
    byStaff[key].commission+=commission;
    if(row.counts_as_revenue===true){
      byStaff[key].revenueRecords+=1;
      byStaff[key].revenue+=amount;
    }
  });
  const keys=Object.keys(byStaff).sort((a,b)=>{
    if(a==='__unattributed')return 1;
    if(b==='__unattributed')return -1;
    return (names[a]||'').localeCompare(names[b]||'');
  });
  const totals=keys.reduce((total,key)=>({
    ledgerRecords:total.ledgerRecords+byStaff[key].ledgerRecords,
    revenueRecords:total.revenueRecords+byStaff[key].revenueRecords,
    revenue:total.revenue+byStaff[key].revenue,
    commission:total.commission+byStaff[key].commission
  }),{ledgerRecords:0,revenueRecords:0,revenue:0,commission:0});
  return {names,byStaff,keys,totals};
}

async function fetchAllRows(makeQuery,pageSize=DATA_API_PAGE_SIZE){
  const rows=[];
  let from=0,total=null;
  for(;;){
    const {data,error,count}=await makeQuery().range(from,from+pageSize-1);
    if(error) throw error;
    if(Number.isInteger(count)) total=count;
    rows.push(...(data||[]));
    if(!data||!data.length||(total!==null&&rows.length>=total)||(total===null&&data.length<pageSize)) return rows;
    from=rows.length;
  }
}

  const wholeBusinessLabels=S.myRole==='owner'||S.myRole==='manager';
  const profileKpis=[

    loyaltyFactsAvailable?`<div class="card kpi"><div class="l">${wholeBusinessLabels?'Points':'Business-wide points'}</div><div class="v">${pts}</div>${pointsExpiryMarkup}</div>`:'',

  ].filter(Boolean).join('');
  const referralMarkup=canReadReferrals?`<p class="muted small" style="margin:8px 0 4px">Personal referral code — friends quote it when they join:</p>

  const retentionMarkup=canReadRetention?`<div class="card"><b>Retention reward history</b>
    ${(rg&&rg.length)?rg.map(g=>{const campaign=campaignEntitlementDisplayV99(g);return `<div class="row" style="margin-top:10px;align-items:flex-start"><span class="inline-status">${CUI.icon('loyalty',{size:17})}<span>${esc(g.program_name||'Program')}</span></span><span class="spacer"></span>
      ${campaign.pending
        ?`<span class="muted small" style="text-align:right"><b data-workspace-i18n>${esc(campaign.title)}</b> · <span data-workspace-i18n>Merchant fulfilment pending</span><br><span data-workspace-i18n>No wallet value was posted.</span> · ${esc(g.granted_at.slice(0,10))}</span>`
        :`<span class="muted small">${esc(g.display_label||'Reward')} · ${g.display_amount_cents!=null?money(g.display_amount_cents):g.display_discount_percent!=null?g.display_discount_percent+'% off':esc(g.display_item||'free item')} · ${g.granted_at.slice(0,10)}</span>`}</div>`}).join('')
      :'<p class="muted small" style="margin-top:6px">No retention reward history yet.</p>'}
    </div>`:'';
  const activitySources=[canReadSales&&'sales and visits',canReadAppointments&&'appointments',canReadLoyalty&&'reward redemptions',canReadRetention&&'retention rewards',canReadMemberships&&'memberships',canReadPackages&&'packages'].filter(Boolean);
  const activityScopeCopy=wholeBusinessLabels
    ?`${activitySources.join(', ')} available to this role — newest first.`
    :'Sales and appointments cover assigned branches; loyalty and reward records are business-wide when available — newest first.';
  const activityMarkup=activitySources.length?`<div class="card" style="margin-top:16px"><b>Activity history</b><p class="muted small" style="margin:4px 0 8px">${esc(activityScopeCopy)}</p>
    <div id="histBody">${renderHistPage(history,histShown)}</div>
    ${history.length>histShown?`<div style="text-align:center;margin-top:10px"><button class="btn ghost sm" id="histMore">Show earlier</button></div>`:''}
    </div>`:'';
  const profileScopeLabel=isProfileAdmin
    ?'complete business-wide access'
    :'access across every branch assigned to this staff account';
  const profileScopeNotice=unavailableProfileFacets.length?`<div class="card" role="status" style="margin-top:14px"><b>Some profile figures are unavailable</b><p class="muted small" style="margin-top:6px">${esc(unavailableProfileFacets.map(module=>MODULES[module]?.[1]||module).join(', '))} cannot be shown because ${esc(profileScopeLoadError?'the assigned-branch list could not be loaded':profileScopeLabel+' could not be confirmed')}. Peekaa does not replace missing data with zero.</p><button class="btn ghost sm" id="c360ScopeRetry" style="margin-top:10px">Reload profile</button></div>`:'';
  const staffProfileScopeNote=!isProfileAdmin&&profileScopeBranchIds.length?`<div class="card" role="note" style="margin-top:14px"><b>Staff view scope</b><p class="muted small" style="margin-top:6px">Sales, visits and appointments cover every branch assigned to this staff account. Points, rewards and spendable credit are business-wide customer balances. Peekaa does not mix hidden branch sales into the visible totals.</p></div>`:'';
  const correctionScopeNotice=reversalActionsUnavailable?`<div class="card" role="status" style="margin-top:14px"><b>Correction actions are temporarily unavailable</b><p class="muted small" style="margin-top:6px">Verified customer history and totals remain visible. Reverse controls are withheld until their separate safety check can be reloaded.</p><button class="btn ghost sm" id="c360CorrectionsRetry" style="margin-top:10px">Reload profile</button></div>`:'';
  routeMain.innerHTML=`${CUI.pageHeader({title:c.full_name,subtitle:detailSubtitle,iconName:'customers',actions:headerActions,canWrite:canWriteClients||canWriteLoyalty,moduleLabel:'Customer profile'})}
    ${badgesHtml}
    ${staffProfileScopeNote}
    ${profileScopeNotice}
    ${correctionScopeNotice}

    ${profileKpis?`<div class="kpis">${profileKpis}</div>`:''}
    <div class="split" style="margin-top:16px">
      ${canReadLoyalty?`<section class="card c360-rewards-card" id="c360-loyalty">
        <header class="c360-rewards-head">${CUI.icon('loyalty',{size:21})}<div><b>Rewards</b><span>${wholeBusinessLabels?'Balance, earning and next unlock':'Business-wide balance, earning and next unlock'}</span></div></header>

        ${canWriteClients?`<button class="btn ghost sm" id="consentBtn">${c.marketing_consent?CUI.icon('check',{size:17})+' Consented — withdraw':'Record consent'}</button>`:'<span class="pill off">Read only</span>'}

    ${S.myRole==='owner'&&(cfDefs||[]).length?`<div class="card" style="margin-top:16px"><b>Business-specific details</b><p class="muted small" style="margin:5px 0 10px">Only the owner can view and edit these fields.</p>

  routeMain.querySelector('.cui-page-title h1')?.setAttribute('data-merchant-content','');
  /* Next-best-action + header quick actions. Every handler routes to an existing surface — no new
     write path is introduced here. */

  if($('c360BirthdayRetry'))$('c360BirthdayRetry').onclick=()=>clientDetail(id);
  if($('c360LoyaltyRetry'))$('c360LoyaltyRetry').onclick=()=>clientDetail(id);
  if($('c360ScopeRetry'))$('c360ScopeRetry').onclick=()=>clientDetail(id);
  if($('c360CorrectionsRetry'))$('c360CorrectionsRetry').onclick=()=>clientDetail(id);
  if($('c360NewAppt'))$('c360NewAppt').onclick=goNewAppt;
  const moreBtn=$('c360MoreBtn'),moreMenu=$('c360MoreMenu');
  if(moreBtn&&moreMenu){

       repeated clientDetail re-renders never accumulate document-level listeners. */
    const onOutside=(e)=>{if(!moreMenu.contains(e.target)&&e.target!==moreBtn)closeMenu()};
    function closeMenu(){moreMenu.hidden=true;moreBtn.setAttribute('aria-expanded','false');document.removeEventListener('click',onOutside)}
    moreBtn.onclick=(e)=>{
      e.stopPropagation();
      const open=moreMenu.hidden;
      if(open){moreMenu.hidden=false;moreBtn.setAttribute('aria-expanded','true');moreMenu.querySelector('button')?.focus();setTimeout(()=>document.addEventListener('click',onOutside),0)}
      else closeMenu();
    };

  document.querySelectorAll('.cfvSave').forEach(b=>b.onclick=async()=>{

    const payload={business_id:S.biz.id,client_id:id,field_definition_id:b.dataset.id,
      text_value:null,number_value:null,date_value:null,boolean_value:null,select_value:null};
    if(type==='text')payload.text_value=raw.trim();
    else if(type==='number')payload.number_value=Number(raw);
    else if(type==='date')payload.date_value=raw;
    else if(type==='boolean')payload.boolean_value=raw==='true';
    else payload.select_value=raw;
    const {error}=await sb.from('client_field_values').upsert(payload,{onConflict:'business_id,client_id,field_definition_id'});

  document.querySelectorAll('.cfvClear').forEach(b=>b.onclick=async()=>{
    const {error}=await sb.from('client_field_values').delete().eq('business_id',S.biz.id).eq('client_id',id).eq('field_definition_id',b.dataset.id);
    if(error)return fail(error);toast('Customer detail cleared');clientDetail(id);
  });
  const birthdayRedeem=$('birthdayRedeem');

    if(!birthdayBenefitsEnabled)return;
    const branchId=$('birthdayRedeemBranch')?.value;

    if(!birthdayRedemptionIdem)birthdayRedemptionIdem=crypto.randomUUID();
    birthdayRedeem.disabled=true;
    const {error:redeemError}=await sb.rpc('redeem_customer_birthday_benefit',{p_business_id:S.biz.id,p_client_id:id,p_branch_id:branchId,p_idempotency_key:birthdayRedemptionIdem});
    if(!isClientDetailCurrent()||!birthdayRedeem.isConnected)return;
    if(redeemError){birthdayRedeem.disabled=false;const status=$('birthdayRedeemStatus');if(status)status.textContent='Birthday benefit could not be redeemed. Please verify its status and try again.';return;}
    toast('Birthday benefit redeemed');birthdayRedemptionIdem=crypto.randomUUID();clientDetail(id);
  };
  const birthdayReverse=$('birthdayReverse');
  if(birthdayReverse)birthdayReverse.onclick=async()=>{
    if(!birthdayBenefitsEnabled)return;
    const reason=$('birthdayReverseReason')?.value.trim()||'';
    if(reason.length<3){const status=$('birthdayReverseStatus');if(status)status.textContent='Enter a reason of at least 3 characters.';return;}
    if(!birthdayReversalIdem)birthdayReversalIdem=crypto.randomUUID();
    birthdayReverse.disabled=true;
    const {error:reverseError}=await sb.rpc('reverse_customer_birthday_benefit_for_client',{p_business_id:S.biz.id,p_client_id:id,p_reason:reason,p_idempotency_key:birthdayReversalIdem});
    if(!isClientDetailCurrent()||!birthdayReverse.isConnected)return;
    if(reverseError){birthdayReverse.disabled=false;const status=$('birthdayReverseStatus');if(status)status.textContent='Birthday redemption could not be reversed. Review the current status and retry.';return;}
    toast('Birthday redemption reversed');birthdayReversalIdem=crypto.randomUUID();clientDetail(id);
  };
  const aj=$('adjGo');
  if(aj) aj.onclick=async()=>{
    const v=parseInt($('adjV').value||'0');
    if(!v) return toast('Enter +/- points');
    const {data,error}=await sb.rpc('adjust_points',{p_business:S.biz.id,p_client:id,
      p_points:v,p_reason:$('adjR').value||null});
    if(error) return fail(error);
    toast(workspaceTemplateTextV97('adjustedBalance',{balance:data}));clientDetail(id);
  };
  const copyRefButton=$('copyRef');
  if(copyRefButton)copyRefButton.onclick=async()=>copyTextToClipboard(c.referral_code||'',{button:copyRefButton,success:'Code copied'});
  const consentIdempotencyKey=crypto.randomUUID();
  if($('consentBtn'))$('consentBtn').onclick=async()=>{
    const consentButton=$('consentBtn');
    const to=!c.marketing_consent;
    consentButton.disabled=true;
    const {error}=await sb.rpc('staff_set_marketing_consent',{p_business:S.biz.id,p_client:id,
      p_idempotency_key:consentIdempotencyKey,p_marketing_consent:to,p_source:'admin client page'});
    if(!isClientDetailCurrent())return;
    if(error){consentButton.disabled=false;return fail(error)}
    toast(to?'Consent recorded':'Consent withdrawn — recorded');clientDetail(id);
  };
  const histMore=$('histMore');
  if(histMore) histMore.onclick=()=>{
    histShown+=50;

/* Renders the first n entries of the unified Customer 360 timeline. Each entry keeps its own
   shape (sales carry reversal provenance; appointments split past/upcoming; grants, membership
   and package rows add their own facets) — these come from different tables, not a union query.
   Rendered as a pictogram-first list (low-literacy-first, CLAUDE.md) while preserving the reversal
   buttons' data-reverse-kind/data-reverse-id hooks so bindReversalButtons keeps working. */
function renderHistPage(history,n){
  const rows=history.slice(0,n);
  if(!rows.length) return '<div class="empty small" style="margin-top:6px">No activity is recorded in the sources available to this role yet.</div>';

      fetchAllRows(()=>sb.from('staff_branches').select('staff_id').eq('business_id',S.biz.id).eq('branch_id',scope.branchId).order('staff_id')),

    if(!assigned.size||!schedules.length||!(branchHours||[]).length)return {known:false,reason:'Scheduled capacity needs both branch opening hours and team working hours.'};

    for(let day=scope.from;day<=scope.to;day=shiftSgDateInput(day,1))days.push(day);
    let minutes=0;
    for(const day of days){
      const weekday=sgCalendarWeekday(day);
      const branchSchedule=(branchHours||[]).find(row=>Number(row.weekday)===weekday);
      if(!branchSchedule)continue;
      const branchStart=timeMinutes(branchSchedule.opens_at),branchEnd=timeMinutes(branchSchedule.closes_at);
      if(!Number.isFinite(branchStart)||!Number.isFinite(branchEnd)||branchEnd<=branchStart)continue;

        .map(row=>({start:timeMinutes(row.starts_at),end:timeMinutes(row.ends_at)}))
